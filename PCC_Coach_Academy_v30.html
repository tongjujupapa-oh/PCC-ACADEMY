지 묻는다.","그녀가 내린 구체적인 선택(손대지 않고 맡긴 것)을 명명해 주고, 그것이 그녀가 세웠던 전체 목표에 대해 무엇을 보여주는지 묻는다."],"b":"D","w":"B","be":"역량 8.08('고객의 진전과 성공을 인정한다') 및 PCC 마커 8.8에 따라 고객이 스스로 평가절하하려는 구체적 행동과 선택을 코치가 직접 포착해 인정해 주고 그 경험의 배움을 전체 코칭 목표와 통합하게 돕기 때문입니다.","we":"Worst(B)는 고객이 스스로 자기 성취를 깎아내리는 습관에 코치의 권위까지 얹어 '더 어려운 분기까지 진전으로 치지 마라'고 기준선을 높여버리는 적극적 해악입니다. A는 50분이나 남았는데도 세 번째 반복되는 성취 축소 패턴과 진전 인정을 미루어(postponing) 통합 기회를 놓쳤고, C는 코치의 판단('더 많은 공로를 인정받을 자격이 있다')을 전제로 깔고 묻는 유도 질문입니다.","c":["4.03","8.01","8.04","8.07","8.08"],"m":["8.3"],"k":[],"e":[]},{"id":196,"n":"SJT-52","cat":"sjt","ty":"bw","t":"Bartering Coaching for Copywriting","se":"Someone reaches out excited to work with you, and they're honest that money is tight. They offer to write copy for your website instead of paying your fee. Your calendar is already full of paying clients, and you've built your practice on one clear fee—no barter.","sk":"경제적 여유가 빠듯한 예비 고객이 코칭 비용 대신 당신의 웹사이트 카피라이팅을 해주겠다고 물물교환을 제안한다. 당신의 일정은 이미 유료 고객들로 꽉 차 있고 물물교환 없이 단일 요금제로 운영한다는 원칙을 세워왔다.","o":["Tell them your practice runs on a set fee, and point them to some low-cost resources for now.","Offer to refer them to other coaches whose pricing works differently.","Accept the barter and squeeze the sessions into the gaps in your week.","Hold the line and add that paying for coaching is itself a sign of commitment."],"ok":["당신의 코칭 운영은 정해진 요금제로 이루어진다고 안내하고, 당분간 활용할 수 있는 저비용 자원들을 알려준다.","가격 체계가 다르게 운영되는 다른 코치들을 소개해 주겠다고 제안한다.","물물교환을 수락하고 일주일 중 비는 틈새 시간에 세션을 끼워 넣는다.","원칙을 고수하면서, 코칭 비용을 지불하는 것 자체가 헌신(commitment)의 표시라는 말을 덧붙인다."],"b":"A","w":"C","be":"역량 1.01(진실성과 정직성), 3.03(비용 조건 합의), 윤리강령 핵심 가치(전문직업의식 및 인간성)에 따라 자신이 세운 일관된 운영 원칙을 정직하고 투명하게 지키면서도 상대를 위축시키지 않고 실질적으로 성장할 수 있는 저비용 대안 자원을 따뜻하게 안내했기 때문입니다.","we":"Worst(C)는 코치 자신의 편익(카피라이팅) 때문에 스스로 세운 운영 원칙을 깨고 이중 관계(이해상충)를 만드는 데다, 꽉 찬 일정 사이에 무리하게 세션을 끼워 넣어 기존 고객과 해당 고객 모두에게 최상의 웰빙과 집중력을 제공하지 못하는(역량 2.07 위배) 적극적 해악입니다. B는 윤리적이나 실질적 제안이 밋밋하고, D는 경계는 지켰으나 '돈을 내야 헌신하는 것'이라는 훈계조의 판단적 설교를 덧붙였습니다.","c":["1.01","1.03","1.04","2.07","3.03"],"m":[],"k":[],"e":[]},{"id":197,"n":"SJT-53","cat":"sjt","ty":"bw","t":"The Sponsor Wants a Readout","se":"You're coaching a mid-level manager through a six-session engagement the company is paying for. The agreement everyone signed is explicit: session content stays confidential, and only themes the client chooses get reported back. The day before session four, the sponsoring VP emails you—the one who controls the budget and could renew you for the whole leadership team: \"Quick call before tomorrow? Between us—we're deciding promotions, and your read on how engaged they are would help.\"","sk":"회사가 비용을 지불하는 코칭에서 예산을 쥐고 재계약 권한을 가진 스폰서 부사장(VP)이 4회기 전날 \"우리끼리 얘기인데 승진 심사를 앞두고 있으니 그 직원의 몰입도에 대한 코치님 의견을 들려달라\"고 비공식 통화를 요청한다.","o":["Reply that you can't discuss session content and decline, referencing nothing and offering no alternative.","Take the call and give the VP a candid read on the manager's engagement and their doubts off the record.","Tell the VP you'll raise the promotion question with the manager in session four and report back whatever they're willing to share.","Reply that the agreement keeps content confidential, and route any sharing through the manager's own choice of themes."],"ok":["세션 내용은 논의할 수 없다고 답하며 아무런 근거 언급이나 대안 제시 없이 거절한다.","전화를 받아 비공식(off the record)으로 관리자의 몰입도와 의구심에 대한 솔직한 의견을 VP에게 전해준다.","VP에게 4회기 세션에서 승진 문제를 관리자에게 꺼내보겠으며, 관리자가 공유하기를 원하는 내용을 회신해 주겠다고 말한다.","합의서에 따라 세션 내용은 비밀로 유지됨을 밝히고, 어떠한 공유든 관리자가 직접 선택한 주제를 통해서만 이루어질 수 있도록 안내한다."],"b":"D","w":"B","be":"재계약이라는 금전적 이해관계 앞에서도 사전에 서명한 합의서를 근거로 비밀보장을 철저히 수호(역량 1.05, 3.03)하면서, 스폰서와의 관계를 해치지 않고 합의된 공식 경로(고객이 직접 선택한 테마 공유)를 안내했기 때문입니다.","we":"Worst(B)는 '비공식(off the record)'이라는 명목으로 고객의 고민과 몰입도를 스폰서에게 누설하여 고객의 승진과 경력에 직접적 불이익을 초래하는 최악의 비밀보장 배신입니다. A는 비밀보장을 지켰으나 합의서 조항이나 대안 안내 없이 무뚝뚝하게 끊어냈고, C는 코치가 VP의 비밀 요청을 몰래 세션 아젠다로 슬쩍 끼워 넣는 '경계 침범'을 저질렀습니다.","c":["1.01","1.03","1.04","1.05","3.03"],"m":[],"k":[],"e":[]},{"id":198,"n":"SJT-54","cat":"sjt","ty":"bw","t":"The Client's Investment Offer","se":"You've coached this founder for eight months, and they credit you in part for a decision that just landed them a major funding round. At the end of today's session, they lean in warm: \"I want you in on this. I'm opening a small round to people I trust on terms nobody else gets—you understand the business better than my board does.\"","sk":"8개월간 코칭한 창업가가 대규모 투자 유치 성공의 공을 코치에게 돌리며, 아무도 받지 못하는 파격적인 조건으로 소규모 투자 라운드에 지분 투자를 하라고 제안한다.","o":["Thank them for the trust and decline, explaining that investing would create a conflict that compromises your ability to coach them.","Tell them you'll think it over and revisit after the engagement ends.","Accept a small stake on the favorable terms, figuring the amount's modest enough not to matter.","Deflect with a vague \"Let's keep things as they are\" and move into closing."],"ok":["신뢰해 준 것에 감사를 표하며 거절하고, 투자를 하게 되면 코치로서 순수하게 코칭할 수 있는 능력을 훼손하는 이해상충이 발생한다고 설명한다.","생각해 보겠다고 말하고 코칭 계약이 종료된 후에 다시 논의하자고 한다.","금액이 크지 않으니 문제 될 것 없다고 여기며 유리한 조건으로 소액 지분을 수락한다.","\"지금 이대로 유지합시다\"라고 모호하게 얼버무린 뒤 세션 마무리로 넘어간다."],"b":"A","w":"C","be":"고객의 호의와 신뢰를 따뜻하게 존중하면서도 '이해상충(Conflict of Interest)'이라는 명확한 윤리적 이유를 투명하게 설명하고 단호히 거절했기 때문입니다.","we":"Worst(C)는 '금액이 적으니 괜찮다'며 코칭 관계를 통해 얻은 내부 정보와 특혜 조건으로 개인적 금전 이익(지분 투자)을 취하는 심각한 이해상충(윤리강령 제4부 정면 위반)입니다. B('계약 종료 후 다시 논의하자')는 남은 회기 내내 이해상충의 불씨를 살려두어 중립성을 오염시키고, D는 경계는 지켰으나 이유를 투명하게 설명하지 않고 모호하게 회피한 차선책입니다.","c":["1.01","1.03","1.04","3.02","4.06"],"m":[],"k":[],"e":[]},{"id":199,"n":"SJT-55","cat":"sjt","ty":"bw","t":"Opening Without a Map","se":"Lena drops into the chair the second the session starts: the offsite is in three weeks and it's a disaster—the agenda's a mess, two of her leads aren't speaking, the CMO wants a number she can't hit. You have a strong read: the feud between her two leads has surfaced twice before, and it seems to sit underneath the other two problems. Nothing has been named yet as the focus for today.","sk":"레나가 세션 시작과 동시에 워크숍 일정 문제, 두 팀 리드 간의 불화, CMO의 무리한 목표 수치라는 세 가지 문제를 한꺼번에 쏟아낸다. 코치는 두 리드 간의 불화가 근본 원인이라는 강한 직감을 가지고 있다.","o":["Follow her energy into the agenda, since it's concrete and the deadline's closest.","Steer her toward the two leads who aren't speaking, since you've watched that tension drive her problems before.","Reflect that she's named three things, and ask which one—solved today—would matter most to her.","Let her keep talking and trust the real issue rises on its own."],"ok":["구체적이고 마감 기한이 가장 임박했으므로 그녀의 에너지를 따라 워크숍 일정표 문제로 들어간다.","이전에도 그 긴장이 문제들을 유발하는 것을 지켜보았으므로, 서로 말하지 않는 두 리드 문제 쪽으로 그녀를 이끈다.","그녀가 세 가지 사안을 언급했음을 반영해 주고, 오늘 그중 어느 하나가 해결된다면 그녀에게 가장 중요할지 묻는다.","그녀가 계속 말하게 두고 진짜 이슈가 저절로 떠오르기를 기다린다."],"b":"C","w":"B","be":"여러 주제가 혼재할 때 코치가 임의로 고르지 않고 세 가지를 깔끔하게 반영해 준 뒤 오늘 가장 중요하고 의미 있는 초점 선택권을 고객에게 돌려주기(PCC 마커 3.1, 5.3) 때문입니다.","we":"Worst(B)는 이전 회기의 관찰을 근거로 코치가 '이게 근본 원인이야'라고 단정 짓고 두 리드 갈등 쪽으로 세션을 몰아가는 적극적 해악입니다. A는 고객의 급한 에너지를 따랐으나 여전히 고객에게 묻지 않고 코치가 주제를 대신 선택했고, D는 세션 합의와 초점 설정 없이 대화를 표류하게 두는 수동적 오답입니다.","c":["3.06","3.07","3.09","5.03","6.02"],"m":["3.1"],"k":[],"e":[]},{"id":200,"n":"SJT-56","cat":"sjt","ty":"bw","t":"The Long Silence","se":"You've just asked Rohan something he didn't expect: if the promotion weren't on the table, what would he actually want? He opens his mouth, then stops. He looks down, out the window. The silence stretches. His brow is working—you can see he's genuinely turning it over, not stuck reaching for words. Inside you, the pressure climbs: the urge to rescue him.","sk":"예상치 못한 질문을 받은 로한이 창밖을 보며 미간을 찡그린 채 진지하게 숙고하며 긴 침묵에 잠겼다. 코치 내면에서 그를 구해주고 싶은 압박감이 치솟는다.","o":["Hold the silence—stay relaxed and attentive, and let him keep working until he's ready.","Wait a few seconds, then check in lightly: \"Take your time—no rush.\"","Offer an example and a couple of possibilities to get him started.","Rephrase the question into something more concrete, in case the framing was the holdup."],"ok":["침묵을 유지한다—편안하고 주의를 기울인 상태를 유지하며 그가 준비될 때까지 계속 사유하게 둔다.","몇 초 기다린 뒤 가볍게 말을 건넨다: \"천천히 하세요—서두를 필요 없어요.\"","그가 시작할 수 있도록 예시 하나와 몇 가지 가능성을 제시해 준다.","질문의 틀이 걸림돌이었을 경우에 대비해 질문을 더 구체적인 말로 다시 표현해 준다."],"b":"A","w":"C","be":"고객이 치열하게 내적 작업을 수행하는 황금 같은 침묵의 공간을 코치 자신의 불편함 때문에 깨뜨리지 않고 온전히 지켜주었기(역량 5.07, PCC 마커 5.5) 때문입니다.","we":"Worst(C)는 침묵의 어색함을 견디지 못하고 코치의 예시와 선택지를 던져주어 고객 스스로 길어 올리려던 내적 해답을 코치의 아이디어로 오염시키고 의존성을 학습시키는 적극적 해악입니다. B('서두르지 마세요')는 배려에서 나온 말이지만 깊이 사유 중인 흐름을 끊는 미세한 침범이고, D는 강력한 질문을 임의로 축소·재진술해 깊이를 떨어뜨린 차선책입니다.","c":["5.01","5.04","5.07","7.04"],"m":["5.5"],"k":[],"e":[]},{"id":201,"n":"SJT-57","cat":"sjt","ty":"bw","t":"The Silent Client","se":"Marissa usually walks in crisp and prepared, and today she's looking at the floor, giving you three-word answers. A senior executive arrives subdued, says \"Things have been a lot lately,\" and lands on \"I feel stuck—I don't even know where to start.\" She offers no topic, no agenda.","sk":"평소 명쾌하던 고위 임원 마리사가 오늘은 바닥만 보며 세 단어짜리 대답만 내놓고 \"막혀 있는 느낌이에요—어디서부터 시작해야 할지도 모르겠어요\"라며 아무런 주제도 꺼내지 않는다.","o":["Reassure her that you'll figure it out together, and hand her a focus topic.","Reflect that she sounds stuck, and ask what might help her feel a little clearer.","Ask what's been overwhelming, and offer to pin down a starting point for her.","Ask her why she's finding it so hard to open up, and press for specifics."],"ok":["함께 해결할 수 있을 것이라며 안심시키고, 초점 주제를 하나 건네준다.","그녀가 막혀 있는(stuck) 것처럼 들린다고 반영해 주고, 조금 더 명료해지는 데 무엇이 도움이 될지 묻는다.","무엇이 그토록 압도적이었는지 묻고, 그녀를 대신해 시작점을 짚어주겠다고 제안한다.","왜 마음을 열기가 그렇게 어려운지 묻고, 구체적인 내용을 말하라고 압박한다."],"b":"B","w":"D","be":"고객이 처한 '막막함(stuckness)'의 상태를 판단 없이 그대로 비추어 주어 존중받고 있음을 느끼게 한 뒤, 방향과 속도의 주도권을 전적으로 고객에게 돌려주기 때문입니다.","we":"Worst(D)는 '왜(Why) 마음을 열기 어려운가?'라고 추궁하며 구체적 진술을 압박하여 고객을 심문받는 기분에 빠뜨려 마음의 문을 닫게 만드는 적극적 해악입니다. A는 따뜻하게 안심시키려 했으나 코치가 임의로 주제를 선택해 건네주었고, C는 압도감에 호기심을 보였으나 '시작점을 대신 짚어주겠다'며 해결사 역할을 자처한 차선책입니다.","c":["4.02","4.04","4.05","5.03","6.02"],"m":["4.2"],"k":[],"e":[]},{"id":202,"n":"SJT-58","cat":"sjt","ty":"bw","t":"Finding Common Ground","se":"Muhammad is stepping into a newly merged multicultural team, and he's honest that he doesn't yet know how coaching works. He describes the bind plainly: some of his people want a decisive, directive leader; others want consensus. You've run transitions like this many times—you can already picture the stakeholder maps and the communication drills.","sk":"새로 합병된 다문화 팀 리더로 부임한 무함마드는 코칭 방식을 잘 모른다며 지시적 리더십과 합의 중심 리더십 사이에서 외줄 타기를 하는 기분이라고 말한다. 코치는 이런 전환기를 수없이 다뤄보았기에 이해관계자 지도와 소통 훈련 프로그램이 머릿속에 그려진다.","o":["Partner with him to name what he most wants out of this engagement, and build the agreement from his answer.","Walk him through your standard cross-cultural sequence and get him to commit to phase one.","Tell him coaching gets clear once you start, and dive straight into the tightrope.","Reassure him you've run this exact transition, lay out your stakeholder plan, and frame the whole engagement around delivering it."],"ok":["이 코칭 전체 과정에서 그가 가장 얻고 싶은 것이 무엇인지 함께 명명하도록 파트너십을 맺고, 그의 대답으로부터 합의를 구축한다.","당신의 표준 다문화 리더십 시퀀스를 설명해 주고 1단계 실행을 약속받는다.","코칭은 시작해 보면 명확해진다고 말해 주고 곧바로 외줄 타기 고민 속으로 뛰어든다.","똑같은 전환기를 수없이 다뤄보았다고 안심시킨 뒤, 당신의 이해관계자 계획을 펼쳐 놓고 전체 코칭 계약을 그 계획을 실행하는 것으로 틀 짓는다."],"b":"A","w":"D","be":"역량 3.04('고객 및 이해 관계자와 함께 전체 코칭 계획 및 목표를 설정한다') 및 3.01에 따라 코치의 기성 커리큘럼이나 프레임워크를 먼저 설치하지 않고 고객 자신의 언어로부터 전체 코칭 목표와 계획을 공동 구축했기 때문입니다.","we":"Worst(D)는 '내가 이 전환기를 전문적으로 다뤄봤다'며 코치의 이해관계자 계획을 깔아놓고 전체 계약을 그 계획 완수로 규정하는 컨설팅 월권(적극적 해악)입니다. B 역시 표준 프로세스를 강요하나 1단계 동의를 구하는 절차를 거쳤고, C는 고민으로 바로 들어갔으나 코칭 프로세스 안내와 전체 목표 합의를 건너뛴 합의 누락 오답입니다.","c":["1.06","3.01","3.04","3.08"],"m":[],"k":[],"e":[]},{"id":203,"n":"SJT-59","cat":"sjt","ty":"bw","t":"커리어 코칭 중 동성 배우자와의 별거를 조심스레 고백한 고객 (영상 47)","se":"During a career coaching session, Wei hesitates and discloses that he recently separated from his same-sex husband, adding, 'I wasn't sure if I should bring that up here.' What is the best and worst coach response?","sk":"커리어 코칭 세션 도중, 웨이(Wei)가 잠시 망설이다가 최근 동성 배우자와 별거하게 되었다고 고백하며 \"여기에서 이런 이야기를 꺼내도 될지 모르겠네요\"라고 말한다. 최선(Best)과 최악(Worst)의 코치 반응은 무엇인가?","o":["Manage the session focus efficiently so career goals stay on track.","Spend the rest of the session processing the emotional grief of the separation.","Receive the disclosure warmly without missing a beat ('Thank you for trusting me with that'), and ask what feels most important to focus on right now.","Thank him for sharing, note that personal relationship issues are outside the scope of career coaching, and steer back to his career agenda."],"ok":["커리어 목표가 궤도를 이탈하지 않도록 세션 초점을 효율적으로 관리한다.","남은 세션 전체를 별거로 인한 정서적 슬픔을 심리 치료하듯 다루는 데 쓴다.","전혀 동요 없이 따뜻하게 수용하며(\"솔직하게 나누어 주셔서 감사합니다\"), 지금 이 순간 무엇에 초점을 맞추는 것이 가장 중요하게 느껴지는지 묻는다.","나누어 준 것에 감사하되, 개인적 관계 이슈는 커리어 코칭의 범위 밖(out of scope)이라고 안내하고 원래의 커리어 아젠다로 되돌린다."],"b":"C","w":"D","be":"고객의 정체성과 취약한 자기 개방을 전혀 흔들림 없이 따뜻하게 수용(역량 1.02, 4.01, PCC 마커 4.1)한 뒤, 지금 이 순간 무엇을 다룰지 선택권과 재합의 주도권(역량 5.03, 마커 5.3)을 고객에게 온전히 돌려주기 때문입니다.","we":"Worst(D)는 정중한 규율처럼 포장되어 있으나, 용기 내어 정체성과 삶의 중대한 변화를 고백한 고객에게 '코칭 범위 밖(out of scope)'이라며 차갑게 선을 긋고 거부함으로써 신뢰와 안전감을 무너뜨리는 배제적 반응입니다. B는 심리상담 영역으로 넘어갈 위험이 있고, A는 정서적 인정을 생략한 과업 중심 반응입니다.","c":["1.02","4.01","4.05","5.03"],"m":["4.1","4.3","5.3"],"k":["동성 배우자와 별거","여기에서 이런 이야기를 꺼내도 될지 모르겠네요","separated from his same-sex husband"],"e":["HUM","EQU"]},{"id":204,"n":"SJT-60","cat":"sjt","ty":"bw","t":"승진 후 탈락한 동료들과의 어색함을 고민하는 고객과 코치의 과거 실패 경험 (영상 48)","se":"Sophia was recently promoted and worries about awkwardness with peers Priya and Thomas who also applied. The coach personally had a painful promotion experience years ago and feels a strong urge to share what went wrong for them. What is the best and worst coach action?","sk":"최근 승진한 소피아(Sophia)가 함께 지원했던 동료 프리야, 토마스와의 어색한 관계를 걱정한다. 코치 역시 수년 전 승진 후 뼈아픈 실패를 겪은 적이 있어 자신의 경험담을 들려주고 싶은 강한 충동을 느낀다. 최선(Best)과 최악(Worst)의 코치 행동은 무엇인가?","o":["Set the coach's own experience aside and follow Sophia's curiosity about the awkwardness with Priya and Thomas.","Explore the generic pros and cons of peer-to-manager transitions.","Briefly share the coach's own painful promotion story so she feels less alone.","Tell her that the real issue behind the awkwardness is letting go of hands-on technical work, based on what the coach went through."],"ok":["코치 자신의 경험을 내려놓고, 프리야 및 토마스와의 어색함에 대한 소피아 자신의 탐색을 따라간다.","동료에서 관리자로 전환할 때의 일반적인 장단점을 탐색한다.","혼자가 아니라는 느낌을 주기 위해 코치 자신의 아픈 승진 경험담을 짧게 공유한다.","코치가 겪었던 경험에 비추어 볼 때 어색함 이면의 진짜 핵심 이슈는 실무 손을 떼는 것이라고 말해 준다."],"b":"A","w":"D","be":"역량 2.04(편향·경험 영향 인지), 5.04(프레즌스 유지를 위한 감정 관리), PCC 마커 6.1에 따라 코치 자신의 미해결 서사와 감정을 조용히 내려놓고, 오직 소피아의 고유한 맥락과 관계 탐색에만 집중하기 때문입니다.","we":"Worst(D)는 코치 자신의 과거 실패 경험과 해석을 고객의 실제 고민 위에 덮어씌워 '진짜 이슈는 이것'이라고 단정함으로써 고객의 고유한 세계를 왜곡하는 최악의 투사입니다. C 역시 코치의 이야기를 중심으로 끌어오는 자기중심적 개입이며, B는 고객 맞춤형(마커 6.1)이 아닌 일반론적 질문입니다.","c":["2.04","5.04","6.01"],"m":["5.2","6.1"],"k":["코치 역시 수년 전 승진 후 뼈아픈 실패","자신의 경험담을 들려주고 싶은 강한 충동","painful promotion experience"],"e":[]},{"id":205,"n":"SJT-61","cat":"sjt","ty":"bw","t":"팀원 갈등 해결 매뉴얼을 단계별로 알려달라는 매니저 (영상 49)","se":"Devon, an engineering manager, describes two senior engineers clashing over architecture and asks the coach, 'Can you walk me through a step-by-step mediation procedure?' without mentioning his own role in the dynamic. What is the best and worst coach response?","sk":"엔지니어링 매니저 데본(Devon)이 아키텍처 문제로 충돌하는 두 시니어 엔지니어 이야기를 꺼내며, 정작 역동 속 자신의 역할은 언급하지 않은 채 코치에게 \"단계별 갈등 중재 절차를 알려주실 수 있나요?\"라고 묻는다. 최선(Best)과 최악(Worst)의 코치 반응은 무엇인가?","o":["Walk him through a proven step-by-step conflict mediation procedure as requested.","Acknowledge his desire to resolve the clash, and ask how he sees his own role and presence in this team friction.","Ask whether he wants to focus on team harmony or the VP's delivery deadline first.","Brainstorm mediation options based on how he handled past technical disagreements."],"ok":["요청받은 대로 검증된 단계별 갈등 중재 절차를 차근차근 설명해 준다.","갈등을 해결하고자 하는 마음을 인정하고, 이 팀 마찰 속에서 자신의 역할과 존재 방식을 어떻게 바라보고 있는지 묻는다.","팀의 화합과 부사장의 납기 일정 중 무엇에 먼저 초점을 맞추고 싶은지 묻는다.","과거 기술적 의견 충돌을 다루었던 방식을 바탕으로 중재 옵션들을 브레인스토밍한다."],"b":"B","w":"A","be":"해결 절차(What/How)에 대한 컨설팅 요청에 말려들지 않고, 시스템 내 리더 자신의 존재와 역할(The Who, PCC 마커 5.1, 7.1, 7.2)로 시선을 돌려 깊은 자기 성찰과 알아차림을 촉진하기 때문입니다.","we":"Worst(A)는 코칭과 컨설팅/교육의 경계(역량 1.06)를 무너뜨리고 단계별 매뉴얼을 강의·처방함으로써 리더 스스로의 성찰과 주체적 리더십 발휘 기회를 빼앗는 최악의 반응입니다. C와 D는 나쁘지 않은 실무 탐색이나 핵심인 리더 자신의 역할(Who) 성찰에 닿지 못한 차선책입니다.","c":["1.06","6.03","7.03"],"m":["5.1","7.1","7.2","7.8"],"k":["자신의 역할은 언급하지 않은 채","단계별 갈등 중재 절차","step-by-step mediation procedure"],"e":["1.1","3.7"]},{"id":101,"n":"LC-01","cat":"lcu","ty":"bw","t":"내담자가 더 큰 도전을 할 수 있음에도 현재의 안정적인 자리에 머무르...","se":"A client says they have decided to remain in a stable position even though they could take on a greater challenge. The coach feels personal disappointment and regret about the client's choice. What is the most and least appropriate coach behavior?","sk":"내담자가 더 큰 도전을 할 수 있음에도 현재의 안정적인 자리에 머무르기로 결정했다고 말합니다. 이를 듣는 코치는 내담자의 선택에 개인적인 실망감과 안타까움을 느낍니다. 이때 코치의 행동으로 가장 적절한 것과 가장 부적절한 것은 무엇입니까?","o":["Ask the client what is getting in their way.","Respect the client's decision while asking what that choice means for their long-term goals.","Set aside your personal disappointment and check what is happening for the client now.","Mention your disappointment that the client has decided to stay and ask whether they are simply playing it safe right now."],"ok":["내담자에게 무엇이 그를 가로막고 있는지 질문한다.","내담자의 결정을 존중하면서, 그 선택이 장기적인 목표에 어떤 의미가 있는지 묻는다.","자신의 개인적인 실망감을 내려놓고(set aside), 내담자에게 지금 어떤 일이 일어나고 있는지 확인한다.","그가 머무르기로 한 것에 대해 코치가 느끼는 실망감을 언급하며, 지금 안전하게만 가려고(playing it safe) 하는 것은 아닌지 묻는다."],"b":"C","w":"D","be":"코치 자신의 기대에서 비롯된 개인적 실망감과 판단을 즉각 메타인지로 알아차려 내면에서 내려놓고(역량 2.06, 5.04), 고객이 자신의 선택에 책임을 지는 주체임을 인정하며(역량 2.01) 현재 순간 고객에게 일어나는 경험(역량 5.03)으로 시선을 복귀시키는 모범적 태도이기 때문입니다.","we":"Worst (D): 코치 자신의 해결되지 않은 실망감을 고객에게 직접 투사하여 정서적 부담을 지울 뿐 아니라, 고객의 신중한 결정을 '안전하게만 가려 한다(playing it safe)'며 일방적으로 평가·심판(역량 4 & 7의 PCC 마커 위반)하여 심리적 안전감을 파괴하는 최악의 해악입니다.\n중간 오답 A와 B 비교: A는 '무엇이 가로막는가'라고 물음으로써 현재의 안정 선택에 결함이나 장애가 있다는 코치의 선입견(Bias)을 전제하고 있으며, B는 결정을 존중하려 했으나 지문에 언급되지 않은 '장기 목표'라는 코치의 프레임을 미리 설정해 묻는 차선책입니다.","c":["2.01","2.04","2.06","5.03","5.04"],"m":["5.1"],"k":[],"e":["HUM"]},{"id":102,"n":"LC-02","cat":"lcu","ty":"bw","t":"내담자가 겪고 있는 고통스러운 상황을 이야기하자, 코치는 자신의 과거...","se":"As a client describes a painful situation, the coach strongly identifies with it because of a similar past experience and notices an emotional reaction. What are the coach's most appropriate and least appropriate actions?","sk":"내담자가 겪고 있는 고통스러운 상황을 이야기하자, 코치는 자신의 과거 경험과 강하게 공명하며 개인적인 감정적 반응을 느낍니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Mention your personal reaction and then ask the client whether they would like to continue the session.","Become caught up in your own emotions and give advice by explaining findings from clinical work and research on similar cases.","Notice your emotional reaction, set it aside, and focus fully on the client's story.","End the session early because of your personal feelings and reschedule it."],"ok":["자신의 개인적인 반응을 언급한 뒤, 내담자에게 세션을 계속 진행하고 싶은지 묻는다.","자신의 감정에 휩쓸려, 유사한 사례에 관한 임상 연구(clinical work and research) 결과를 설명하며 조언한다.","자신의 감정적 반응을 알아차리고 이를 내려놓은 뒤(set it aside), 온전히 내담자의 이야기에 집중한다.","개인적 감정 때문에 세션을 조기 종료하고 일정을 다시 잡자고 한다."],"b":"C","w":"B","be":"자신의 과거 상처나 경험에서 올라온 역전이 감정 반응을 즉각 자각하고 스스로 조절하여 내려놓은 뒤(역량 2.06, 5.04), 세션 공간이 코치의 감정이 아닌 오직 내담자의 이야기로 채워지도록 온전한 프레즌스(역량 5.01)를 지켜냈기 때문입니다.","we":"Worst (B): 코치 자신의 감정에 휩쓸려 경청을 상실한 데 더해, 코칭의 경계를 넘어 무자격 심리치료사나 강사처럼 '임상 연구 결과'를 설명하고 조언(Lecturing/Consulting)함으로써 역량 1.06(지원 전문직과의 차별성 유지)과 윤리강령 Standard 3.7을 정면으로 위반한 최악의 행동입니다.\n중간 오답 A와 D 비교: A는 코치의 개인적 공명을 말로 꺼내어 내담자가 오히려 코치를 배려하게 만드는 주객전도('고백의 함정')를 일으키며, D는 현장 자기조절로 충분히 회복 가능한 상태에서 내담자를 방치한 채 세션을 일방 중단하는 회피적 대응입니다.","c":["1.06","2.06","5.01","5.04"],"m":[],"k":[],"e":["3.7"]},{"id":103,"n":"LC-03","cat":"lcu","ty":"bw","t":"내담자가 갈등 중인 상대방과 주고받은 개인 이메일 스레드를 코치에게...","se":"A client shows the coach a private email thread exchanged with someone they are in conflict with and asks the coach to read it and confirm whether the client's response was reasonable and justified. What are the coach's most appropriate and least appropriate actions?","sk":"내담자가 갈등 중인 상대방과 주고받은 개인 이메일 스레드를 코치에게 보여주며, 자신의 대응이 합리적이고 정당했는지 코치가 읽어보고 확인해 달라고 요청합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Read the email and confirm that the client's position is completely reasonable and justified.","Politely decline to read and judge the email; instead, explore what the client is experiencing and what would be most helpful in this situation.","Ask the client to copy and paste only the most important passages from the email for you to review.","Say that you will not take sides, but read the email and then add your opinion."],"ok":["이메일을 읽고 내담자의 입장이 완전히 합리적이고 정당하다고 확인해 준다.","이메일을 읽고 판정하는 것을 정중히 사양하고(decline), 대신 이 상황에서 내담자 본인이 경험하고 있는 바와 가장 도움이 될 방향을 탐색한다.","가장 핵심적인 이메일 구절만 복사해 붙여넣어 달라고 요청하여 검토한다.","어느 한쪽 편을 들지는 않겠다고 말하면서도 이메일을 읽어본 뒤 의견을 덧붙인다."],"b":"B","w":"A","be":"코치는 옳고 그름을 가리는 심판관이나 법률·소통 자문가가 아님을 명확히 하여 역할 경계를 수호하고(역량 1.06, 3.01), 외부의 정당성 확인을 구하는 내담자의 시선을 내면의 경험과 주체적 방향 탐색(역량 7.01, 7.03)으로 초대하는 모범적 파트너십이기 때문입니다.","we":"Worst (A): 이메일을 직접 읽고 '완전히 합리적이고 정당하다'고 시비를 판정·승인함으로써 코치를 평가자(Assessor/Judge)의 위치에 세우고 내담자의 자기 성찰 기회를 완전히 박탈한 최악의 역할 이탈입니다.\n중간 오답 C와 D 비교: C는 '핵심 구절만'이라는 조건을 달았지만 결국 자료 검토 및 판정 역할로 발을 들이는 타협이며, D는 말로만 중립을 선언하고 실제로는 이메일을 읽고 의견을 덧붙이는 모순적 월권입니다.","c":["1.06","3.01","3.02","7.01"],"m":[],"k":[],"e":["1.1","3.7","PRO"]},{"id":104,"n":"LC-04","cat":"lcu","ty":"bw","t":"내담자가 세운 계획을 계속 실행에 옮기지 못하면서 매번 그럴듯한 이유...","se":"A client repeatedly fails to put their plans into action and gives a plausible reason each time. What are the coach's most appropriate and least appropriate actions?","sk":"내담자가 세운 계획을 계속 실행에 옮기지 못하면서 매번 그럴듯한 이유를 대고 있습니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Ask what the client needs in order to follow through and complete the plan.","Point out the recurring situation and ask what the client would like to do differently.","Nonjudgmentally reflect the recurring pattern and partner with the client to explore how they see and want to examine it.","Ask what obstacles keep getting in the way of taking action."],"ok":["그가 계획을 끝까지 완수하려면(follow through) 무엇이 필요할지 묻는다.","반복되는 상황을 짚어주며 그가 무엇을 다르게 하고 싶은지 묻는다.","반복되고 있는 패턴을 판단 없이 있는 그대로 비춰주고, 이 패턴에 대해 내담자가 어떻게 바라보고 탐색하고 싶은지 파트너십으로 연다.","계속 실행을 가로막고 있는 장애물이 무엇인지 묻는다."],"b":"C","w":"A","be":"여러 세션에 걸쳐 반복되는 행동 패턴을 알아차리되(역량 6.06) 평가나 질책 없이 거울처럼 집착 없이 공유하고(역량 7.11, PCC 마커 7.5), 그 패턴을 어떻게 해석하고 무엇을 탐색할지 내담자에게 주도권을 돌려주는(역량 3.06, PCC 마커 5.3) 최상의 개입이기 때문입니다.","we":"Worst (A): 겉보기에는 개방형 질문('무엇이 필요할지')의 형태를 띠고 있으나, 내담자에게 그 계획이 여전히 유효하고 원하는 것인지 묻지도 않은 채 '끝까지 완수해야 한다'고 코치가 목표를 미리 단정(Presumption)하여 자율성을 침해한 최악의 유도 질문입니다.\n중간 오답 B와 D 비교: B는 패턴을 짚었으나 즉시 행동 수정('다르게 하고 싶은 것')으로 건너뛰어 패턴의 뿌리(Who) 성찰을 놓쳤고, D는 장애물 탐색(역량 8.05)에 해당하나 기존 계획을 유지한다는 전제가 깔려 있어 C보다 파트너십이 좁습니다.","c":["3.06","6.06","7.08","7.11"],"m":["5.3","7.5"],"k":[],"e":[]},{"id":105,"n":"LC-05","cat":"lcu","ty":"bw","t":"내담자가 지난 한 주 동안 겪은 사건들의 순서를 감정이나 비언어적 동...","se":"A client recounts the events of the past week in clear, analytical detail, showing no emotion or nonverbal signs of distress. What are the coach's most appropriate and least appropriate actions?","sk":"내담자가 지난 한 주 동안 겪은 사건들의 순서를 감정이나 비언어적 동요 없이 매우 명확하고 분석적인 세부 사항으로 건조하게(flatness) 나열합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Decide what topic the client really needs to address and ask a series of questions about it.","Reflect that you are hearing many details and ask what the client might be leaving out.","Acknowledge that it sounds like a hard week and ask how the client is feeling.","Reflect the flatness and analytical delivery you are observing and ask what is happening."],"ok":["내담자가 정말로 다루어야 할 주제를 정해주며 일련의 질문을 던진다.","많은 세부 사항이 들린다고 반영하면서, 그녀가 무엇을 빠뜨리고 있는지(leaving out) 묻는다.","힘든 한 주를 보낸 것 같다고 인정하며(sounds like a hard week) 기분이 어떤지 묻는다.","지금 관찰되는 건조함(flatness)과 분석적인 전달 방식을 있는 그대로 짚어주고 무슨 일이 일어나고 있는지 묻는다."],"b":"D","w":"A","be":"지문에 나타난 객관적 단서(감정 동요 없는 건조한 분석적 어조)에 코치의 추측을 보태지 않고 '본 것만 그대로' 반영하여 비언어·어조 단서를 탐색하고(역량 6.04, 6.05, PCC 마커 6.4), 그 이면의 의미를 내담자 스스로 열도록 초대했기 때문입니다.","we":"Worst (A): 내담자의 현재 표현 방식을 무시한 채 코치가 '정말로 다루어야 할 주제'를 독단적으로 지정하고(PCC 마커 3 위반) 일련의 연쇄 질문을 쏟아내어(PCC 마커 7.6 '한 번에 하나씩' 위반) 대화의 주도권을 완전히 강탈한 최악의 행동입니다.\n중간 오답 B와 C 비교: C는 지문에 전혀 언급되지 않은 감정('힘든 한 주였겠군요')을 코치가 넘겨짚어 투사한 전형적인 '가정 삽입' 오답이며, B는 반영 후 '무엇을 빠뜨리고 있는가'라고 물어 무언가 숨기고 있다는 미세한 추정을 담은 차선책입니다.","c":["6.04","6.05","7.11"],"m":["6.4","7.6"],"k":[],"e":[]},{"id":106,"n":"LC-06","cat":"lcu","ty":"bw","t":"세션이 시작되자 내담자가 구체적인 주제를 명시하지 않은 채 '지난번에...","se":"At the start of a session, a client says, without naming a specific topic, “I'd like to pick up where we left off last time.” What are the coach's most appropriate and least appropriate actions?","sk":"세션이 시작되자 내담자가 구체적인 주제를 명시하지 않은 채 '지난번에 이야기했던 그 지점에서 이어가고 싶다'고 말합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Offer a summary of the key points you remember from the previous session.","Begin the conversation by picking up the thread of the communication pattern from the previous session.","Review the notes from the previous session and suggest specific items to address today.","Let the client choose and define what they want to continue and what they want to gain from today's session."],"ok":["코치가 기억하는 지난 세션의 핵심 내용을 요약해 제시한다.","코치가 지난번 소통 패턴의 맥락(thread)을 이어받아 대화를 시작한다.","이전 세션 노트를 확인한 뒤 오늘 다룰 세부 항목을 제안한다.","오늘 세션에서 내담자가 무엇을 이어가고 싶고 무엇을 얻어가고 싶은지 내담자에게 선택과 정의를 맡긴다."],"b":"D","w":"B","be":"세션 합의 수립(역량 3.06, 3.07, PCC 마커 3.1, 3.4)에서 주제와 목표의 정의권은 100% 내담자에게 있으므로, 코치의 기억이나 노트 대신 내담자 자신의 현재 시선과 언어로 오늘의 초점을 명명하게 했기 때문입니다.","we":"Worst (B): 내담자가 구체적으로 말하지도 않은 '지난번 소통 패턴'을 코치가 임의로 끄집어내 대화의 맥락(thread)을 이어받음으로써 세션의 주제 선택권과 주도권을 코치가 가로챈(PCC 마커 3 '코치가 주제를 선택함' 위반) 최악의 행동입니다.\n중간 오답 A와 C 비교: A(코치 기억 기반 요약 제시)와 C(노트 확인 후 세부 항목 제안) 역시 대화의 출발점과 프레임을 코치의 기록 중심으로 설정하여 내담자 주도의 세션 목표 확인(PCC 마커 3.1)을 놓친 차선책입니다.","c":["3.06","3.07","5.03"],"m":["3.1","3.4"],"k":[],"e":[]},{"id":107,"n":"LC-07","cat":"lcu","ty":"bw","t":"함께 일하는 동료 코치의 배우자가 당신에게 1:1 코칭을 의뢰해 왔습...","se":"The spouse of a fellow coach you work with asks you for one-to-one coaching. You already know both the colleague and their spouse. What are the coach's most appropriate and least appropriate actions?","sk":"함께 일하는 동료 코치의 배우자가 당신에게 1:1 코칭을 의뢰해 왔습니다. 당신은 그 동료 및 배우자와 기존에 알고 지내는 사이입니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["At the start of the session, explain the dynamics of the dual relationship, help the client make an informed decision, and then proceed with coaching.","Because there may be a conflict of interest, first ask a fellow coach for permission before proceeding.","Agree to coach and specify strict confidentiality and clear professional boundaries in the agreement.","Politely decline the engagement because of concerns about objectivity and conflicts of interest, and offer to refer the client to another coach who does not know their spouse."],"ok":["세션을 시작하며 이중 관계의 역동을 설명해 주고, 내담자가 정보에 입각한 결정을 내리도록 한 뒤 코칭을 진행한다.","이해상충의 소지가 있으므로 동료 코치에게 먼저 허락을 구한 뒤 진행한다.","코칭에 동의하면서 엄격한 비밀보장과 명확한 직업적 경계를 합의서에 명시한다.","객관성과 이해상충 우려로 의뢰를 정중히 거절하고, 배우자를 알지 못하는 다른 동료 코치에게 연결(refer)해 주겠다고 제안한다."],"b":"D","w":"A","be":"동료 코치 및 그 배우자와 이미 사적·직업적 친분을 공유하고 있어 객관성과 중립성 훼손, 비밀보장 오염이라는 피할 수 있는 이해상충(Conflict of Interest)이 명백하므로, 윤리강령 Standard 3.3에 따라 수임을 정중히 거절하고 이해관계 없는 제3의 코치에게 연계(Referral)하는 것이 최선입니다.","we":"Worst (A): '단순 고지(Disclosure)는 이해상충 회피와 같지 않다'는 원칙을 위반하여, 말로 설명만 해준 뒤 이해상충이 얽힌 이중 관계 코칭을 그대로 강행함으로써 향후 비밀보장 및 관계 파탄 위험을 초래하는 최악의 선택입니다.\n중간 오답 B와 C 비교: B는 제3자인 동료 코치에게 허락을 구하는 과정에서 예비 내담자의 코칭 의뢰 사실을 사전 동의 없이 노출(Standard 2.1 비밀보장 위반)하며, C는 서면 조항만으로 인간관계의 구조적 이해상충을 통제할 수 있다고 오판한 미흡한 대처입니다.","c":["1.01","1.04","1.05"],"m":[],"k":[],"e":["3.1","3.3"]},{"id":108,"n":"LC-08","cat":"lcu","ty":"bw","t":"한 코치가 오랫동안 코칭을 진행해 오면서 내담자들로부터 지속적으로 긍...","se":"A coach has been coaching for a long time and consistently receives positive feedback from clients, with no apparent problems. However, the coach has not engaged in coaching supervision or self-reflection for an extended period. What are the most and least appropriate actions?","sk":"한 코치가 오랫동안 코칭을 진행해 오면서 내담자들로부터 지속적으로 긍정적인 피드백을 받고 있고, 겉으로 보기에 아무런 문제도 발생하지 않았습니다. 그러나 오랜 기간 코칭 수퍼비전이나 자기 성찰 활동을 하지 않았습니다. 이때 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Resume supervision, mentor coaching, or systematic self-reflection to review your coaching competence and blind spots.","Decide that no additional supervision or reflection is needed because client feedback is positive and there are no apparent problems.","Join a peer-coaching and mutual-feedback group to review your coaching habits.","Ask a trusted client for feedback on your coaching approach."],"ok":["코칭 역량과 맹점을 점검하기 위해 수퍼비전이나 멘토 코칭, 체계적인 자기 성찰을 재개한다.","내담자 피드백이 좋고 아무 문제가 없으므로 별도의 수퍼비전이나 성찰 활동은 필요 없다고 판단해 그대로 유지한다.","동료 코치와 상호 피드백 그룹에 참여해 자신의 코칭 습관을 점검한다.","신뢰하는 내담자에게 자신의 코칭 방식에 대한 피드백을 요청한다."],"b":"A","w":"B","be":"내담자의 주관적 만족도와 긍정적 피드백은 코치에게 무의식적 맹점(Blind spots)이나 편향이 없다는 증거가 될 수 없으므로, 역량 2 정의 및 2.03(성찰훈련 지속), 2.08(슈퍼바이저·멘토코치 협력)에 따라 전문적인 코칭 슈퍼비전과 체계적 성찰을 재개해야 합니다.","we":"Worst (B): '겉으로 문제가 없고 피드백이 좋으니 배움과 성찰이 불필요하다'고 단정하여 역량 2(코칭 마인드셋 구현)와 윤리강령 Part 2 Professionalism(평생 전문 학습 헌신)을 정면으로 포기한 최악의 안일함입니다.\n중간 오답 C와 D 비교: C(동료 피드백 그룹)는 유익한 보조 수단이나 공인 슈퍼바이저·멘토코치의 전문적 역량 점검보다 구조화가 약하며, D는 코칭 서비스 수혜자인 내담자에게 코치 역량 검증 책임을 전가하는 부적절한 방법입니다.","c":["2.02","2.03","2.08"],"m":[],"k":[],"e":[]},{"id":109,"n":"LC-09","cat":"lcu","ty":"bw","t":"내담자가 현재 직무 유지 여부를 고민하던 중 갑자기 '이 생각을 하면...","se":"A client who is considering whether to stay in their current role or leave suddenly says, “When I think about this, my chest tightens.” What are the coach's most appropriate and least appropriate actions?","sk":"내담자가 현재 직무 유지 여부를 고민하던 중 갑자기 '이 생각을 하면 가슴이 꽉 조이고 답답해져요(my chest tightens)'라고 말합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Suggest that the client create a pros-and-cons list for their current role.","Notice the tightness in the client's chest and other physical sensations they have just described, and invite them to explore what they are feeling in them.","Encourage the client to listen to their body's signals and leave the role immediately.","Ask when the tightness began and analyze the client's past career."],"ok":["내담자에게 현재 직무의 장단점 목록(pros and cons list)을 작성해 보자고 제안한다.","지금 방금 표현한 가슴의 답답함과 신체적 감각을 알아차리고, 그 안에서 무엇이 느껴지는지 탐색하도록 초대한다.","몸의 신호에 귀를 기울여 지금 당장 그 직무를 그만두라고(leave the role) 격려한다.","그 답답함이 언제부터 시작되었는지 과거 경력을 분석해 보자고 묻는다."],"b":"B","w":"A","be":"내담자가 언어로 표현한 강렬한 신체 감각(Somatic cue)을 놓치지 않고 즉시 수용하여(역량 5.03, 6.04), 지금 이 순간(Here and now) 그 신체 감각이 담고 있는 내면의 메시지를 탐색하도록 초대하는(역량 7.05, PCC 마커 6.4) 교과서적인 개입이기 때문입니다.","we":"Worst (A): 내담자가 온몸으로 호소한 결정적인 신체·정서적 고통 신호를 100% 묵살(Dismiss)하고 차가운 인지적 분석 도구('장단점 목록 작성')로 도망침으로써 PCC 마커 5 & 6 위반('고객의 감정과 신체 표현을 묵살함')을 범한 최악의 현존 상실입니다.\n중간 오답 C와 D 비교: C는 신체 신호를 포착했으나 '당장 그만두라'며 코치가 인생의 중대한 결정을 대신 지시(Consulting/Directing)하는 월권을 범했고, D는 '지금 여기'의 생생한 감각을 과거 원인 분석으로 돌리는 아쉬운 전환입니다.","c":["5.01","5.03","6.04","7.05"],"m":["5.1","6.4"],"k":[],"e":[]},{"id":110,"n":"LC-10","cat":"lcu","ty":"bw","t":"내담자가 팀 프로젝트에 대해 이야기하면서 평소와 달리 어딘가 지치고...","se":"While talking about a team project, a client seems unusually tired and low in energy. What are the coach's most appropriate and least appropriate actions?","sk":"내담자가 팀 프로젝트에 대해 이야기하면서 평소와 달리 어딘가 지치고 힘이 빠진 듯한(sort of off) 모습을 보입니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Acknowledge the client's current state and ask an open question to explore what is happening now.","Review the project's progress and ask whether the schedule needs to be adjusted.","Say that carrying the team's emotions is probably the hardest part to sustain and address that issue.","Suggest taking a short break and then discussing an action plan for the next steps."],"ok":["내담자의 상태를 있는 그대로 인정하고(acknowledge), 지금 어떤 일이 일어나고 있는지 탐색하도록 열린 질문을 던진다.","프로젝트 진행 상황을 점검하며 일정 조정이 필요한지 묻는다.","팀의 감정을 혼자 떠안고 가는 것(carrying the team's emotion)이 가장 유지하기 힘든 부분일 것이라고 말하며 그 점을 다룬다.","잠시 휴식을 취한 뒤 다음 단계의 실행 계획을 논의하자고 제안한다."],"b":"A","w":"C","be":"평소와 다른 에너지 저하(Energy shift)를 포착하여 판단이나 해석 없이 그대로 인정하고(역량 6.04), 순수한 호기심(역량 5.02)을 담아 열린 질문으로 내담자 스스로 내면 상태를 탐색하게 했기 때문입니다.","we":"Worst (C): 겉보기에는 감정을 다루는 것처럼 보이지만, 내담자에게 묻지도 않고 '팀의 감정을 혼자 떠안는 게 제일 힘들 것'이라고 코치가 원인을 임의 단정(Assuming/Interpreting)하여 PCC 마커 6 위반('고객에게 정의나 의미를 묻지 않고 가정함')을 범한 최악의 함정입니다.\n중간 오답 B와 D 비교: B(일정 조정 점검)와 D(휴식 후 다음 실행 계획 논의) 모두 눈앞에 드러난 에너지 저하 신호를 다루지 않고 성급히 과업(What/How) 해결로 넘어가려는 미흡한 반응입니다.","c":["5.02","6.04","7.05"],"m":["6.3","6.4"],"k":[],"e":[]},{"id":111,"n":"LC-11","cat":"lcu","ty":"bw","t":"내담자가 업무 압박감으로 인해 심리적으로 위축되고 혼란스러워하는 기색...","se":"A client appears psychologically overwhelmed and confused because of pressure at work. What are the coach's most appropriate and least appropriate actions?","sk":"내담자가 업무 압박감으로 인해 심리적으로 위축되고 혼란스러워하는 기색을 보입니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Remind the client of their strengths and suggest focusing on what's next.","Create a priority list first to organize the situation objectively.","Explore the emotional and energy shifts happening for the client right now and what they most need in this moment.","Share examples and solutions you have observed in similar situations and offer advice."],"ok":["내담자의 강점을 일깨워 주면서 앞으로 나아갈 다음 단계(what's next)에 집중하자고 제안한다.","상황을 객관적으로 정리하기 위해 우선순위 목록을 작성해 보자고 한다.","지금 이 순간(right now) 내담자에게 일어나고 있는 감정·에너지 변화와 현재 가장 필요한 것이 무엇인지 탐색한다.","코치가 비슷한 상황에서 관찰했던 사례와 해결 방식을 공유하며 조언한다."],"b":"C","w":"D","be":"혼란과 압박에 빠진 내담자를 서둘러 미래 행동으로 밀어붙이지 않고, 지금 이 순간(Right now) 내담자 안에서 일어나는 감정·에너지 변화와 진정한 욕구를 먼저 탐색함으로써(역량 5.03, 6.04, 7.03) 내면의 중심을 회복하게 돕기 때문입니다.","we":"Worst (D): '비슷한 상황에서 내가 관찰한 사례와 해결책'을 꺼내어 조언함으로써 내담자의 주체적 사고를 가로막고 코칭을 컨설팅·멘토링(역량 1.06 및 PCC 마커 1 위반)으로 전락시킨 최악의 개입입니다.\n중간 오답 A와 B 비교: A는 강점을 일깨우려는 따뜻한 의도이지만 현재의 혼란을 충분히 만나기 전에 미래 실행('what's next')으로 건너뛰는 성급한 구원자 태도이며, B는 정서적 위축을 외면한 채 인지적 목록 작성을 제안한 차선책입니다.","c":["5.03","6.04","7.03","7.05"],"m":["5.1","6.3"],"k":[],"e":[]},{"id":112,"n":"LC-12","cat":"lcu","ty":"bw","t":"말이 많은 내담자가 핵심에서 벗어나 장황하게 이야기를 이어가자, 코치...","se":"A talkative client goes off topic and continues at length, so the coach briefly interrupts and redirects their attention. What should the coach do next, and what would be least appropriate?","sk":"말이 많은 내담자가 핵심에서 벗어나 장황하게 이야기를 이어가자, 코치가 대화를 잠시 멈추고 주의를 환기했습니다. 직후 코치가 취해야 할 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Congratulate yourself internally on your coaching skill in effectively interrupting and refocusing the conversation.","Apologize for interrupting and then accept and follow the client's response.","Summarize the key points of the preceding conversation yourself and immediately return to the original topic.","Acknowledge that the conversation briefly went off track and hand the floor back to the client to continue in their own words."],"ok":["대화를 효과적으로 끊고 중심을 잡은 자신의 코칭 실력을 속으로 자화자찬한다(internally congratulates oneself).","대화를 끊은 것에 대해 사과한 뒤 내담자의 반응을 수용하고 따라간다.","방금 전 대화의 핵심을 코치가 정리해 준 뒤 원래 주제로 바로 넘어간다.","대화가 잠시 벗어났음을 인정하고, 내담자 자신의 언어로 주도권을 가지고 이야기를 풀어갈 수 있도록 공을 돌려준다."],"b":"D","w":"A","be":"PCC 마커 6.6('명확한 코칭 목적을 가지고 흐름을 환기한 뒤') 직후, 그 개입의 의도를 투명하게 공유하고 내담자 자신의 언어로 대화를 이어가도록 운전대를 즉시 반환하는(역량 3.09, 5.01) 완전한 파트너십이기 때문입니다.","we":"Worst (A): 비록 겉으로 드러나지 않은 속마음이라 하더라도 코치가 자신의 기술적 개입에 도취해 자화자찬('Me, me, me')에 빠지는 순간, 내담자에 대한 온전한 집중과 에고리스(Egoless) 프레즌스(역량 2.10, 5.01)를 완전히 상실한 최악의 상태입니다.\n중간 오답 B와 C 비교: B는 정당한 코칭 개입에 대해 불필요하게 사과하며 코치 스스로 위축되는 반응이고, C는 코치가 일방적으로 핵심을 재단하고 원래 주제로 끌고 가는 지시적(PCC 마커 3 & 5 위반) 태도입니다.","c":["2.10","3.09","5.01"],"m":["5.3","6.6"],"k":[],"e":[]},{"id":113,"n":"LC-13","cat":"lcu","ty":"bw","t":"내담자가 여러 인간관계 갈등을 이야기하면서, 반복적으로 자신의 어머니...","se":"While describing several relationship conflicts, a client repeatedly refers to and reenacts patterns in their relationship with their mother. What are the coach's most appropriate and least appropriate actions?","sk":"내담자가 여러 인간관계 갈등을 이야기하면서, 반복적으로 자신의 어머니와의 관계 패턴을 계속 언급하고 재현합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Non-attachedly reflect the recurring pattern emerging in the conversation and ask how the client sees it.","Recommend that the client see a therapist because issues with their mother are deep psychological issues outside the scope of coaching.","Move past the mention of the client's mother and steer the conversation back to an action plan at work.","Lead the conversation with a series of open questions to dig into the pattern's origins and prove the hypothesis you have already formed."],"ok":["대화 속에서 반복적으로 드러나는 패턴을 집착 없이 그대로 비춰주고(reflect the pattern), 내담자가 이를 어떻게 바라보는지 묻는다.","어머니와의 관계 문제는 코칭 범위를 벗어난 깊은 심리적 이슈이므로 심리치료사(therapist)를 만나보라고 권유한다.","어머니에 대한 언급을 넘기고 현재 직장에서의 행동 계획에 집중하자고 유도한다.","코치가 이미 세운 가설을 입증하기 위해 그 패턴의 근원을 파헤치는 일련의 개방형 질문(series of open questions)을 던져 대화를 이끌어간다."],"b":"A","w":"D","be":"여러 관계에서 반복되는 행동·감정의 추세와 패턴을 알아차리고(역량 6.06), 코치의 해석이나 결론 없이 집착 없이 거울처럼 비추어 주며(역량 7.11, PCC 마커 7.5) 내담자 스스로 그 의미를 탐색하게 했기 때문입니다.","we":"Worst (D): '개방형 질문'이라는 외피를 둘렀지만 실제로는 코치가 미리 세운 가설(Pre-held conclusion)을 입증하기 위해 탐정처럼 근원을 파헤치는 연쇄 질문으로 대화를 조종함으로써 PCC 마커 7 위반('코치의 관점으로 고객을 유도함' 및 '한 번에 하나씩 질문 위반')을 범한 최악의 함정입니다.\n중간 오답 B와 C 비교: B는 급성 임상 트라우마나 기능 손상이 없는데도 가족 관계 언급만으로 성급히 심리치료사에게 떠넘기는 과잉 해석(Overreach)이고, C는 반복되는 중요한 패턴 신호를 묵살(Dismiss)하고 행동 계획으로 회피하는 반응입니다.","c":["6.06","7.08","7.11"],"m":["7.5","7.6"],"k":[],"e":[]},{"id":114,"n":"LC-14","cat":"lcu","ty":"bw","t":"신규 잠재 내담자와의 사전 미팅(discovery session)에서...","se":"During a discovery session with a prospective client, the person says, “I heard that my acquaintance Sarah was coached by you, and I want specific solutions just like Sarah received.” What are the coach's most appropriate and least appropriate actions?","sk":"신규 잠재 내담자와의 사전 미팅(discovery session)에서, 상대방이 '제 지인인 Sarah도 당신에게 코칭을 받았다고 들었는데, 저도 Sarah처럼 구체적인 해결책을 얻고 싶어요'라고 말합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Say that you cannot confirm whether Sarah was your client, and correct the other person's mischaracterization of coaching.","Explain that you can help achieve goals in a way similar to how you worked with Sarah.","Acknowledge that Sarah was your client and share the positive coaching experience you had with her.","Neither confirm nor comment on your relationship with Sarah; thank the prospect and explore what they themselves are looking for in coaching, aligning on the nature of coaching together."],"ok":["Sarah와의 코칭 여부는 확인해 줄 수 없다고 말하면서, 상대방이 코칭에 대해 잘못 이해하고 있는 부분을 바로잡아(corrects the mischaracterization) 설명한다.","Sarah와 작업했던 방식과 유사하게 목표 달성을 도울 수 있다고 안내한다.","Sarah가 자신의 내담자였음을 인정하고, 그녀와 진행했던 긍정적인 코칭 경험을 공유한다.","Sarah와의 관계에 대해 일절 확인하거나 언급하지 않고 감사를 표한 뒤, 이 잠재 내담자 본인이 코칭에서 무엇을 찾고 있는지 탐색하며 코칭의 본질을 함께 조율한다."],"b":"D","w":"C","be":"기존 내담자의 존재 여부 자체에 대한 절대적 비밀보장(역량 1.05, 윤리강령 Standard 2.1)을 완벽히 지키면서도, 상대방을 가르치거나 교정하려 들지 않고 존중하는 언어로(역량 1.03) 잠재 내담자의 기대를 먼저 탐색해 코칭의 본질(역량 3.01)을 합의했기 때문입니다.","we":"Worst (C): 사전 서면 동의 없이 제3자에게 기존 내담자(Sarah)의 코칭 수강 사실과 경험까지 직접 시인·공유하여 역량 1.05 및 윤리강령 Standard 2.1(최고 수준의 비밀보장 유지)을 정면으로 위반한 최악의 윤리적 과실입니다.\n중간 오답 A와 B 비교: A는 비밀보장은 지켰으나 잠재 내담자의 말을 '오해라고 바로잡는다(correcting)'는 방어적·수직적 태도로 존중(역량 1.03)을 해쳤고, B는 간접적으로 코칭 관계를 시인하면서 해결책 제공이라는 컨설팅 기대에 영합했습니다.","c":["1.01","1.03","1.05","3.01"],"m":[],"k":[],"e":["1.1","2.1"]},{"id":115,"n":"U01","cat":"lcu","ty":"bw","t":"직장 업무와 병환 중인 가족 간병을 병행하는 고객이 매번 세션에 몇...","se":"A client is balancing work responsibilities with caring for an ill family member and arrives several minutes late and distracted to every session. The coach privately judges that the client should prioritize coaching if they truly want to grow, compares them with more exemplary clients, and feels irritated. What should the coach do?","sk":"직장 업무와 병환 중인 가족 간병을 병행하는 고객이 매번 세션에 몇 분씩 늦고 산만한 상태로 들어옵니다. 코치는 마음속으로 '성장을 원한다면 코칭을 더 우선순위에 둬야지'라는 판단과 함께 모범적인 다른 고객들과 비교하며 짜증을 느낍니다. 코치는 무엇을 해야 합니까?","o":["Notice your internal judgment, release assumptions and bias about the client's commitment, and return with curiosity to what the client truly needs in this session.","Calmly explain that strict punctuality and commitment are essential in coaching and demand an improvement in the client's attitude.","Continue the session as usual but decide to invest less energy because the client is not fully committed.","Suggest pausing coaching until the client's life becomes less busy."],"ok":["코치 내면의 판단을 알아차리고, 헌신도에 대한 편향과 가정을 내려놓으며, 이번 세션에서 고객에게 진정 필요한 것이 무엇인지 호기심으로 복귀한다.","차분한 어조로 코칭에는 엄격한 시간 엄수와 헌신이 필수적임을 설명하고 태도 개선을 요구한다.","세션은 평소처럼 진행하되, 고객이 완전히 헌신하지 않으므로 코치 역시 에너지를 덜 쏟기로 마음먹는다.","삶이 덜 분주해질 때까지 코칭을 잠시 중단하자고 제안한다."],"b":"A","w":"C","be":"역량 2.04(편향·상황 영향 인지)와 2.06(감정 관리), 그리고 윤리강령 핵심가치 Equity(형평성)에 따라 코치 자신이 만든 '성실한 고객'이라는 주관적 기준과 비교 편향을 자각해 내려놓고, 삶의 무거운 맥락을 짊어진 고객을 호기심으로 대하기 때문입니다.","we":"Worst (C): 겉으로는 코칭을 진행하는 척하면서 속으로는 고객을 '헌신 부족'으로 낙인찍고 코치의 주의력과 에너지를 고의로 철회하는(역량 5.01 프레즌스 포기) 수동공격적 직무유기입니다.\n중간 오답 B와 D 비교: B는 간병이라는 극심한 현실 맥락(역량 4.01)을 외면한 채 훈계하듯 태도 개선을 요구하는 상급자적 태도이며, D는 고객에게 무엇이 필요한지 묻지도 않고 코치가 일방적으로 코칭 중단을 권고하는 회피적 반응입니다.","c":["1.02","2.04","2.06","2.09","4.01"],"m":[],"k":[],"e":[]},{"id":116,"n":"U02","cat":"lcu","ty":"bw","t":"이직을 고민하는 고객의 사연을 듣던 코치는 과거 자신이 선택했다가 처...","se":"As a client discusses whether to change jobs, the coach realizes the situation closely resembles a past job change that ended badly for the coach. The coach feels physical tension and a strong urge to prevent the client from making the same mistake. What should the coach do?","sk":"이직을 고민하는 고객의 사연을 듣던 코치는 과거 자신이 선택했다가 처절하게 실패했던 이직 경험과 정확히 겹침을 깨닫습니다. 코치는 신체적 긴장과 함께 고객이 잘못된 선택을 하지 못하도록 막고 싶은 강한 충동을 느낍니다. 코치는 무엇을 해야 합니까?","o":["Recognize that this topic strongly triggers your own wounds, decide to seek supervision or mentor coaching, and coach while maintaining heightened awareness of your bias.","Simply remind yourself internally not to give advice and continue coaching without processing your reaction.","Briefly share your own failure story as a cautionary example to help the client make a wiser decision.","Because you see an obvious risk, strongly steer the client toward what you consider the safer choice."],"ok":["이 주제가 코치 자신의 상처를 강하게 자극하고 있음을 알아차리고, 슈퍼비전이나 멘토 코칭을 찾기로 결심하며 편향에 대한 고도의 자각을 유지한 채 코칭한다.","단순히 '조언하지 말자'고 머릿속으로 되뇌며 아무런 내적 처리 없이 코칭을 계속한다.","고객이 더 현명한 결정을 내리도록 코치의 실패 경험담을 반면교사로 짤막하게 들려준다.","코치가 보기에 명백한 위험이 존재하므로 고객을 훨씬 안전한 선택 쪽으로 강력하게 유도한다."],"b":"A","w":"D","be":"코치 자신의 과거 트라우마에서 비롯된 역전이(Countertransference)와 신체적 긴장을 즉각 자각하고, 역량 2 정의 및 2.08(슈퍼바이저·외부 자원 도움), 윤리강령 Standard 4.2(개인적 한계 인식 및 전문 지도 구함)에 따라 슈퍼비전을 결단하며 편향을 철저히 분리한 채 코칭하기 때문입니다.","we":"Worst (D): 코치 자신의 미해결 트라우마와 공포를 고객의 상황에 투사하여 고객을 안전한 선택지로 강제 유도(Steering)함으로써 고객의 선택 책임(역량 2.01)과 자율성을 완전히 침해한 최악의 해악입니다.\n중간 오답 B와 C 비교: B는 억압만 할 뿐 성찰적 처리와 외부 지원(슈퍼비전)을 생략해 무의식적 표출 위험을 남겼고, C는 코치 개인의 실패 경험담을 교훈으로 들려주며 멘토링/조언 모드로 미끄러진 차선책입니다.","c":["2.01","2.04","2.06","2.08"],"m":[],"k":[],"e":["4.2"]},{"id":117,"n":"U03","cat":"lcu","ty":"bw","t":"휴식 없이 3연속 세션을 진행 중인 코치가 정신적으로 지친 상태에서...","se":"A coach is conducting three back-to-back sessions without a break and meets a client who speaks very slowly and pauses for a long time. Worried about appearing ineffective, the coach feels anxious and wants to talk more and push the client toward action. What is the best course of action?","sk":"휴식 없이 3연속 세션을 진행 중인 코치가 정신적으로 지친 상태에서 매우 느리게 말하고 길게 뜸을 들이는 고객을 만났습니다. 무능해 보일까 봐 초조해진 코치는 말을 많이 하고 실행을 재촉하고 싶어집니다. 최선의 행동은?","o":["Pause internally, regulate your breathing, posture, and attention, then return to presence and curiosity.","Because it is difficult to remain present, rely on a standardized, structured diagnostic-tool process to keep the session productive.","Increase the pace and intensity of your questions to push the client to move quickly toward results.","End the session early and suggest rescheduling when the coach has regained energy."],"ok":["내부적으로 잠시 멈춤을 갖고 호흡, 자세, 주의력을 가다듬어 자신의 심신 상태를 스스로 조절한 뒤 프레즌스와 호기심으로 복귀한다.","프레즌스를 유지하기 힘들므로 세션을 생산적으로 유지하기 위해 정형화된 구조적 진단 도구 프로세스에 의존한다.","고객이 성과를 향해 빠르게 움직이도록 질문의 속도와 강도를 높여 고객을 몰아붙인다.","세션을 일찍 종료하고 코치가 에너지를 회복했을 때 다시 일정을 잡자고 제안한다."],"b":"A","w":"C","be":"역량 2.07(세션 진행 전 과정에서 정서적·신체적·정신적 웰빙 유지)과 5.04(프레즌스 유지를 위한 감정 관리)에 따라, 호흡과 자세로 실시간 자기조절을 수행하고 고객의 고유한 사고 속도와 스타일(역량 4.02)에 맞추어 프레즌스를 회복하기 때문입니다.","we":"Worst (C): 코치 자신의 피로와 무능해 보일까 두려운 조바심을 해소하기 위해 질문의 속도와 강도를 높여 고객을 몰아붙임으로써 PCC 마커 7.6('고객이 생각하고 성찰할 수 있는 속도로 질문한다')을 정면으로 파괴하는 폭력적 개입입니다.\n중간 오답 B와 D 비교: B는 정형화된 진단 도구 뒤에 숨어 살아있는 고객과의 현존을 회피하는 것이며, D는 현장에서 호흡으로 충분히 조절 가능한 일시적 피로를 이유로 세션을 일방 중단하는 무책임한 회피입니다.","c":["2.06","2.07","4.02","5.01","5.04"],"m":["7.6"],"k":[],"e":[]},{"id":118,"n":"U04","cat":"lcu","ty":"bw","t":"지난 세션에서 고객의 깊은 질문에 너무 성급하게 답변하여 기회를 날렸...","se":"A coach regrets having answered a client's deep question too quickly in the previous session. Before the next session, the coach feels anxious and prepares a detailed script of questions. The coach recognizes that this preparation is driven by anxiety. What should the coach do?","sk":"지난 세션에서 고객의 깊은 질문에 너무 성급하게 답변하여 기회를 날렸다고 자책하던 코치는 다음 세션을 앞두고 불안에 떨며 질문 스크립트를 빼곡히 준비합니다. 이러한 준비가 불안에서 비롯된 것임을 알아차린 코치는 무엇을 해야 합니까?","o":["Honestly acknowledge your anxiety and process it through reflective practice, then enter the session with openness rather than a rigid plan.","Carefully follow a prepared question script so that the client can make progress.","At the beginning of the next session, politely apologize to the client for not having guided the previous session better.","Ignore your discomfort and act as though nothing happened in order to defend your confidence."],"ok":["불안감을 솔직히 인정하고 성찰적 실천을 통해 이를 소화한 뒤, 경직된 계획이 아닌 '열린 마음(Openness)'으로 세션에 들어간다.","고객이 진전을 경험하도록 사전에 꼼꼼히 준비한 질문 스크립트를 충실히 실행한다.","다음 세션 시작 시 고객에게 '지난 세션에서 제가 더 잘 이끌지 못해 죄송했다'고 정중히 사과한다.","불편함을 무시하고 아무 일 없었던 것처럼 행동하여 자신감을 방어한다."],"b":"A","w":"C","be":"자신의 실수와 불안을 성찰적 실천(역량 2.03)으로 소화하고, 세션 준비 단계에서 정서적·정신적 웰빙을 회복하여(역량 2.07) 미리 짠 대본이 아닌 개방성과 유연성(역량 2.09, 5 정의)으로 고객을 만나기 때문입니다.","we":"Worst (C): 고객은 인지하지도 못한 지난 세션의 미흡함을 꺼내어 불쑥 사과하는 '고백의 함정(Confession Trap)'으로, 코치 자신의 죄책감을 덜어내기 위해 새로운 세션의 시작을 코치 중심의 감정으로 오염시키는 최악의 행동입니다.\n중간 오답 B와 D 비교: B는 꼼꼼히 짠 질문 스크립트대로 세션을 끌고 가 현재 순간 고객에게 새로이 일어나는 것(역량 5.03)을 놓치게 만들며, D는 불안을 성찰 없이 억압하여 방어적 태도를 고착시킵니다.","c":["2.03","2.07","2.09"],"m":["5.3"],"k":[],"e":[]},{"id":119,"n":"U05","cat":"lcu","ty":"bw","t":"고객이 리더십 포지션에 지원할지 망설이자 코치는 '지금 도전 안 하면...","se":"When a client hesitates to apply for a leadership position, the coach secretly hopes the client will apply, thinking, “You'll regret it if you don't try now.” The coach fears that the coaching will feel like a failure if the client does not apply. What should the coach do?","sk":"고객이 리더십 포지션에 지원할지 망설이자 코치는 '지금 도전 안 하면 후회할 텐데'라며 고객이 지원하길 은근히 바랍니다. 지원하지 않으면 코칭이 실패한 것처럼 느껴질까 봐 두려운 코치는 무엇을 해야 합니까?","o":["Notice your attachment and return to a neutral stance that fully trusts the client's own decision and timing.","Share your strongly held, honest opinion that the client must apply and that this is an important growth step.","Pretend to be neutral while skillfully steering the client toward deciding to apply.","Push the client to make an application decision before the end of today's session so they do not lose momentum."],"ok":["코치 내면의 집착(Attachment)을 알아차리고, 고객 자신의 결정과 타이밍을 온전히 신뢰하는 중립적인 태도로 복귀한다.","고객이 반드시 지원해야 하며 이것이 중요한 성장 단계라는 코치의 확신에 찬 솔직한 의견을 들려준다.","겉으로는 중립적인 척하면서 고객이 지원하는 방향으로 결론을 내리도록 정교하게 유도 질문(Steer)을 던진다.","추진력을 잃지 않도록 오늘 세션이 끝날 때까지 무조건 지원 여부를 결정짓도록 몰아붙인다."],"b":"A","w":"C","be":"특정 결과에 과도하게 몰두하지 않고 유연성과 개방성을 허용하는 '집착하지 않기(Without Attachment, 2025 용어집)'를 실천하며, 선택의 책임과 고유 타이밍이 전적으로 고객에게 있음을 인정하고 신뢰하기 때문입니다(역량 2.01, 2.06).","we":"Worst (C): B처럼 솔직하게 의견을 밝히는 것보다도, 겉으로는 중립적인 코치인 척하면서 정교한 유도 질문(Leading/Steering)으로 고객을 코치의 정답으로 몰아가는 '가짜 중립 조작'이 PCC 마커 7 위반('코치의 관점으로 유도함') 중 가장 기만적이고 악질적인 Worst입니다.\n중간 오답 B와 D 비교: B는 코치의 확신을 강요하는 조언이고, D는 고객의 내적 성숙 속도를 무시하고 오늘 안에 결정을 강제하는 조급한 통제입니다.","c":["2.01","2.06","2.10","7.11"],"m":[],"k":[],"e":[]},{"id":120,"n":"U06","cat":"lcu","ty":"bw","t":"동료와의 갈등을 이야기하던 고객이 눈물을 흘립니다. 코치는 과거 직장...","se":"A client cries while discussing a conflict with a colleague. The coach recalls a similar experience of unfair treatment at a former workplace and feels intense anger toward the colleague and an urge to speak for and direct the client. What should the coach do?","sk":"동료와의 갈등을 이야기하던 고객이 눈물을 흘립니다. 코치는 과거 직장에서 유사한 부당 대우를 당했던 개인적 경험이 떠오르며 가해 동료에 대한 맹렬한 분노와 함께 고객을 대변하고 지시하고 싶은 충동을 느낍니다. 코치는 무엇을 해야 합니까?","o":["Stay grounded, notice and acknowledge the emotional turbulence activated within you, and remain calmly and steadily present with the client.","Strongly agree with the client's feelings and show solidarity by taking the same side.","Urge the client to take immediate action and confront that colleague directly tomorrow.","Avoid the emotional topic and shift to work-related matters because the intensity might ruin the session."],"ok":["중심을 잡고(Grounding), 내면에서 활성화된 감정적 요동을 알아차리고 인정한 뒤 고객과 함께 차분하고 안정된 상태로 현존을 유지한다.","고객의 감정에 강력하게 동의를 표하며 코치 역시 같은 편에 서서 연대(Solidarity)하고 있음을 보여준다.","즉각적인 행동을 취하여 내일 당장 그 동료에게 정면으로 맞서 따지라고 고객을 부추긴다.","감정의 강도가 너무 세서 세션을 망칠 수 있으므로 감정적인 주제에서 벗어나 업무적 화제로 피한다."],"b":"A","w":"C","be":"2025 용어집의 '중심이 잡힌(Grounded)' 상태를 실현하여 코치 자신의 분노와 투사를 내면에서 다스리고(역량 2.06, 5.04), 고객의 강한 감정 상태 앞에서도 안정감과 자신감을 가지고 함께 현존하기 때문입니다(역량 5.05).","we":"Worst (C): 코치 자신의 해결되지 않은 분노를 고객에게 투사하여 준비되지 않은 고객을 위험한 직장 내 정면 충돌로 내모는 행동으로, 역량 1.06(역할 경계), 2.06(감정 조절), 윤리강령 Standard 5.3('Doing Good' 및 위해 방지)을 모두 위반한 최악의 해악입니다.\n중간 오답 B와 D 비교: B는 코치가 제3자 갈등의 한쪽 당사자 편에 서서 객관적 거울 역할을 잃어버리는 과잉 동일시이며, D는 강한 감정을 견디지 못하고 업무 화제로 도망치는 회피(역량 5.05 위반)입니다.","c":["2.06","5.04","5.05"],"m":[],"k":[],"e":[]},{"id":121,"n":"U07","cat":"lcu","ty":"bw","t":"코치는 과거 자신이 수년간 임원으로 일했던 동일한 업계의 고객을 코칭...","se":"A coach is coaching a client in the same industry where the coach previously served as an executive for several years. As soon as the client describes a difficulty, the coach is certain they know the problem and wants to offer solutions and advice. What should the coach do?","sk":"코치는 과거 자신이 수년간 임원으로 일했던 동일한 업계의 고객을 코칭하고 있습니다. 고객이 어려움을 설명하자마자 코치는 문제가 무엇인지 단박에 알았다고 확신하며 해결책을 구상하고 조언을 쏟아붓고 싶어집니다. 코치는 무엇을 해야 합니까?","o":["Set aside all your assumptions, return to pure curiosity, and firmly maintain a not-knowing stance despite your expertise.","Quickly offer several suggestions based on your own success to help the client make rapid progress.","Use leading questions to steer the client toward the conclusion you prefer.","Quickly move on to creating an action plan to demonstrate value and momentum."],"ok":["자신의 모든 가정(Assumptions)을 내려놓고 순수한 호기심으로 복귀하며, 전문성에도 불구하고 '알지 못함의 태도(Not-knowing stance)'를 굳건히 지킨다.","빠른 진전을 돕기 위해 코치의 성공 경험에 기반한 몇 가지 제안을 빠르게 건넨다.","코치가 선호하는 결론 쪽으로 고객이 도달할 수 있도록 교묘하게 유도 질문(Leading questions)을 던진다.","가치와 추진력을 증명하기 위해 신속하게 액션 플랜 수립으로 건너뛴다."],"b":"A","w":"C","be":"도메인 전문성이라는 '아는 것의 함정'을 내려놓고, 역량 2.09(개방성과 호기심), 5.02(호기심), 5.06(알지 못함의 영역에서 편안함)을 구현하여 고객 자신의 고유한 맥락과 지혜를 탐구하게 돕기 때문입니다.","we":"Worst (C): B처럼 솔직하게 제안을 건네는 것보다, 머릿속에 정답을 정해놓고 질문의 형식을 무기 삼아 고객을 코치의 결론으로 조종하는 유도 질문(Leading questions)이 PCC 마커 7 위반('코치의 관점으로 고객을 유도함')으로서 가장 기만적인 Worst입니다.\n중간 오답 B와 D 비교: B는 과거 임원 경험을 바탕으로 조언하는 멘토링/컨설팅 이탈이며, D는 충분한 알아차림(역량 7)도 없이 성급히 실행 계획으로 건너뛰는 조급한 반응입니다.","c":["1.06","2.04","2.09","5.02","5.06"],"m":["5.4"],"k":[],"e":[]},{"id":122,"n":"U08","cat":"lcu","ty":"bw","t":"코치가 질문을 던진 후 침묵이 평소보다 훨씬 길어지자 코치는 어색함과...","se":"After asking a question, the coach experiences a much longer silence than usual and feels awkward and anxious, wondering whether time is being wasted or another question is needed. The client appears thoughtful. What should the coach do?","sk":"코치가 질문을 던진 후 침묵이 평소보다 훨씬 길어지자 코치는 어색함과 불안감을 느끼며 '시간 낭비인가? 질문을 덧붙여야 하나?' 초조해집니다. 고객의 표정은 사색에 잠겨 있습니다. 코치는 무엇을 해야 합니까?","o":["Notice your own discomfort and anxiety, remain present, and fully allow the client time and space to think before speaking.","Immediately add another question to reduce the awkwardness.","Change the subject to something much easier for the client to answer so they do not feel pressured.","End the session early because the client seems stuck and time is being wasted."],"ok":["코치 내면의 불편함과 불안을 스스로 알아차리고, 현존을 유지하며 고객이 입을 열기 전에 충분히 생각할 시간과 공간을 온전히 허용한다.","어색한 분위기를 줄이기 위해 즉시 다른 질문을 덧붙여 던진다.","고객이 부담을 느끼지 않도록 대답하기 훨씬 쉬운 다른 주제로 화제를 돌린다.","고객이 막혀 있고 시간이 낭비되고 있는 것처럼 보이므로 세션을 조기 종료한다."],"b":"A","w":"D","be":"침묵의 불편함이 고객이 아닌 코치 자신의 불안에서 비롯됨을 알아차려 조절하고(역량 5.04), 깊이 사색 중인 고객에게 침묵·멈춤·성찰의 공간을 온전히 허용하는(역량 5.07, PCC 마커 5.5) 핵심 프레즌스 역량이기 때문입니다.","we":"Worst (D): 진지하게 내적 성찰을 수행 중인 고객을 '막혀 있다'고 오판하고 코치 자신의 긴장감을 견디지 못해 세션을 일방적으로 조기 종료해 버리는(역량 3.11 및 5.01 위반) 최악의 회피 행동입니다.\n중간 오답 B와 C 비교: B는 침묵을 견디지 못하고 질문을 덧붙여 사고 흐름을 방해하는(PCC 마커 5 위반 '침묵을 채움') 흔한 실수이고, C는 고객이 깊이 들어가려는 문턱에서 쉬운 화제로 도망치는 회피입니다.","c":["5.01","5.04","5.07"],"m":["5.5"],"k":[],"e":[]},{"id":123,"n":"U09","cat":"lcu","ty":"bw","t":"익명의 고객 설문에서 '코치님은 아는 건 많은데 제가 온전히 경청받는...","se":"In an anonymous client survey, a coach receives the feedback, “You know a lot, but I didn't feel fully listened to.” The coach feels defensive and ashamed and wants to dismiss the comment, yet wonders whether there may be a real blind spot in their listening. What should the coach do?","sk":"익명의 고객 설문에서 '코치님은 아는 건 많은데 제가 온전히 경청받는 느낌은 들지 않았어요'라는 피드백을 받은 코치는 방어심과 수치심이 치밀며 무시하고 싶어집니다. 그러면서도 내 경청에 진짜 맹점이 있는지 마음이 쓰입니다. 코치는 무엇을 해야 합니까?","o":["Reflect on the feedback with an open mind, identify learning, and seek mentor coaching or supervision if needed to integrate growth.","Conclude that the feedback is merely subjective, ignore it, and focus only on satisfied clients.","Track down the client who gave the feedback, explain the good intentions behind your coaching, and defend yourself.","Eliminate the feedback survey system entirely so you will not be hurt in the future."],"ok":["열린 마음으로 피드백을 성찰하고 배움의 지점을 찾아내며, 성장을 통합하기 위해 필요하다면 멘토 코칭이나 슈퍼비전의 지원을 구한다.","피드백은 주관적일 뿐이라고 결론짓고 무시하며 만족하는 고객들에게만 집중한다.","해당 고객을 수소문해 찾아내서 당시 어떤 좋은 의도로 코칭했는지 설명하고 변호한다.","앞으로 상처받지 않도록 피드백 설문 조사 시스템 자체를 아예 폐지해 버린다."],"b":"A","w":"D","be":"방어심과 수치심을 조절하고 비판적 피드백을 성찰훈련(역량 2.03)과 멘토 코칭·슈퍼비전(역량 2 정의, 2.08)의 성장 재료로 삼으며, 인간으로서의 불완전함을 수용하고 배우는 윤리강령 핵심가치 Humanity(인류애)를 실천하기 때문입니다.","we":"Worst (D): 코치의 자존심 보호를 위해 고객의 목소리를 듣는 피드백 창구 자체를 영구 폐쇄함으로써 지속적 학습과 개발 의무(역량 2.02) 및 고객 존중을 완전히 차단한 최악의 닫힌 태도입니다.\n중간 오답 B와 C 비교: B는 방어적 합리화로 맹점 교정 기회를 버리는 태도이며, C는 익명성을 침해하면서까지 고객을 찾아가 자기 변명을 늘어놓아 심리적 안전감을 위협하는 부적절한 행동입니다.","c":["2.02","2.03","2.06","2.08"],"m":[],"k":[],"e":[]},{"id":124,"n":"U10","cat":"lcu","ty":"bw","t":"코치가 세션 노트를 자동 생성하기 위해 모든 세션에서 AI 기반 음성...","se":"A coach uses an AI-based transcription tool in every session to automatically generate session notes. The coach has never mentioned this to clients in advance, and clients have not asked about it. What should the coach do?","sk":"코치가 세션 노트를 자동 생성하기 위해 모든 세션에서 AI 기반 음성 전사 도구를 활용하고 있습니다. 고객에게 사전에 언급한 적이 없으며 고객도 묻지 않았습니다. 코치는 무엇을 해야 합니까?","o":["Continue using the tool as long as transcripts are encrypted in secure cloud storage and not shared with third parties.","Proactively disclose the use of the AI transcription tool and explain data access and storage so the client can give fully informed consent.","Stop using the tool altogether immediately because it was not disclosed at the beginning of the agreement.","Wait until the client asks how the session notes are produced before mentioning it."],"ok":["전사 기록이 안전한 클라우드에 암호화 보관되고 제3자에게 공유되지 않는 한 계속 사용한다.","AI 전사 도구 사용 사실을 고객에게 선제적으로 공개하고, 데이터 접근권과 저장 방식을 설명하여 완전히 인지하고 동의하도록 한다.","계약 시작 시 미리 공개하지 않았으므로 즉각 해당 도구의 사용을 전면 중단한다.","고객이 세션 노트가 어떻게 만들어지는지 먼저 물어볼 때까지 기다렸다가 그때 언급한다."],"b":"B","w":"D","be":"2025 개정 역량 2.02(AI 등 기술 사용에 대한 인식 유지), 1.01(진실성과 정직성), 1.05(비밀 유지) 및 2026 개정 윤리강령 Standard 2.5(AI 및 디지털 기술 시스템 활용 시 윤리·법적 의무 이행)에 따라 기술 사용과 데이터 처리 방식을 선제적으로 투명하게 공개하고 고객의 사전 동의를 구해야 하기 때문입니다.","we":"Worst (D): 기술 활용의 투명성 고지 의무는 전적으로 코치에게 있음에도, 존재조차 모르는 고객이 먼저 물어볼 때까지 숨기겠다는 의도적 은폐 태도로 진실성과 비밀보장을 정면으로 배신한 최악의 비윤리적 선택입니다.\n중간 오답 A와 C 비교: A는 아무리 보안이 뛰어나도 고객의 '사전 인지와 명시적 동의'를 대체할 수 없다는 윤리 원칙을 간과했고, C는 고객과 상의하여 동의를 구할 수 있음에도 일방적으로 도구를 폐기하는 소통 부재 대응입니다.","c":["1.01","1.05","2.02"],"m":[],"k":[],"e":["2.5"]},{"id":125,"n":"U11","cat":"lcu","ty":"bw","t":"고객이 수 회차 동안 동일한 리더십 목표를 다루고 있으나 세션이 거듭...","se":"A client has worked on the same leadership goal for several sessions, but their engagement and attention have noticeably declined. The coach suspects that the original goal may no longer be relevant to the client. What should the coach do?","sk":"고객이 수 회차 동안 동일한 리더십 목표를 다루고 있으나 세션이 거듭될수록 눈에 띄게 몰입도가 떨어지고 산만해집니다. 코치는 원래 세웠던 목표가 고객에게 더 이상 유효하지 않다고 의심합니다. 코치는 무엇을 해야 합니까?","o":["Strongly encourage the client to recommit to the original goal because it was agreed upon during the initial contracting.","Suggest an alternative new goal that you believe will be more motivating for the client.","Revisit the coaching agreement with the client and check whether the current goal still aligns with what they truly want.","Wait until the client raises the issue themselves because the coaching process must be entirely client-led."],"ok":["초기 계약 시 합의된 목표이므로 원래 목표에 다시 전념하도록 고객을 강하게 독려한다.","고객에게 더 큰 동기부여가 될 것으로 코치가 판단하는 새로운 대안 목표를 제안한다.","고객과 함께 코칭 합의를 재방문(Revisit the coaching agreement)하여 현재 목표가 진정 원하는 바와 여전히 일치하는지 점검한다.","코칭 프로세스는 철저히 고객 주도적이어야 하므로 고객 스스로 이 문제를 제기할 때까지 기다린다."],"b":"C","w":"D","be":"역량 3.12('필요 시 코칭 합의를 재검토하여 코칭 접근이 고객의 니즈에 부합하는지 확인한다')와 6.06(행동·에너지 추세 식별)에 따라, 관찰된 몰입 저하를 바탕으로 고객과 함께 살아있는 합의를 재점검하기 때문입니다.","we":"Worst (D): 코치가 명백한 몰입 저하와 목표 이탈 신호를 감지하고도 '고객 주도'라는 핑계 뒤에 숨어 아무런 관찰 공유나 합의 점검 없이 수동적으로 방치(Passive avoidance)하는 직무유기입니다.\n중간 오답 A와 B 비교: A는 고객의 변화된 니즈를 무시하고 과거 계약만 강요하는 경직된 태도이고, B는 고객 스스로 새 목표를 찾도록 묻지 않고 코치가 대안 목표를 대신 제안하는 주도권 침해입니다.","c":["3.04","3.10","3.12","6.06"],"m":[],"k":[],"e":[]},{"id":126,"n":"U12","cat":"lcu","ty":"mc4","t":"ICF의 철학과 정의에 따를 때, 코칭을 컨설팅, 멘토링, 심리치료...","se":"According to ICF philosophy and definition, what is the most decisive characteristic that fundamentally distinguishes coaching from all other helping professions, such as consulting, mentoring, psychotherapy, and training?","sk":"ICF의 철학과 정의에 따를 때, 코칭을 컨설팅, 멘토링, 심리치료, 트레이닝 등 다른 모든 조력 전문직과 근본적으로 구별 짓는 가장 결정적인 고유한 특성은 무엇입니까?","o":["Prescribe proven theoretical frameworks and evidence-based tools to guide the client in a structured way.","View the client as naturally creative, resourceful, and whole.","Exclude personal-life matters and focus exclusively on work-related career goals.","Maintain strict neutrality and never share any personal observation or insight with the client."],"ok":["고객을 구조적으로 안내하기 위해 검증된 이론 프레임워크와 증거 기반 도구를 처방한다.","고객을 본래부터 '자연스럽게 창의적이고, 자원이 풍부하며, 온전한 존재(Naturally creative, resourceful and whole)'로 바라본다.","개인적인 삶의 영역은 배제하고 오직 직무적 커리어 목표에만 배타적으로 집중한다.","엄격한 중립적 태도를 유지하며 고객에게 어떠한 개인적 관찰이나 통찰도 공유하지 않는다."],"b":"B","w":null,"be":"ICF 코칭의 제1 철학이자 역량 2.01(고객이 자신의 선택에 책임이 있음을 인정)의 토대는 고객을 고쳐야 할 결핍된 환자가 아니라 본래부터 '창의적이고 자원이 풍부하며 온전한 존재'로 존중하고 사고를 자극하는 파트너십이기 때문입니다.","we":"Worst 및 오답 비교 소거: D는 역량 7.11('관찰, 지식 및 느낌을 집착 없이 공유한다')을 정반대로 왜곡하여 코치를 아무런 기여도 하지 않는 침묵 로봇으로 만든 최악의 오개념입니다. C는 코칭이 개인적·직업적 잠재력을 모두 다룬다는 ICF 공식 정의와 배치되며, A는 전문가 프레임워크 처방에 집중하는 컨설팅·트레이닝의 특징입니다.","c":["1.06","2.01","3.01","7.11"],"m":[],"k":[],"e":["PRO"]},{"id":127,"n":"U13","cat":"lcu","ty":"mc4","t":"ICF 핵심 역량에 따를 때, 코칭 합의(The Coaching Ag...","se":"According to the ICF Core Competencies, what is the primary purpose of establishing the Coaching Agreement?","sk":"ICF 핵심 역량에 따를 때, 코칭 합의(The Coaching Agreement)를 수립하는 가장 본질적인 1차적 목적(Primary purpose)은 무엇입니까?","o":["To establish a shared understanding between the coach and client about the nature of the relationship, the process, and what each person will contribute.","To protect the coach legally by defining professional boundaries before coaching begins.","To subordinate the client's personal goals to organizational business goals set by the sponsor or employer.","To document goals so the coach can track progress and measure outcomes at the end of the engagement."],"ok":["코치와 고객 사이에 관계의 성격, 프로세스, 그리고 각자가 무엇을 기여할지에 대한 '공유된 이해(Shared understanding)'를 확립하기 위함이다.","코칭이 시작되기 전에 전문 영역의 경계를 규정함으로써 코치를 법적으로 보호(Legal protection)하기 위함이다.","고객의 개인 목표를 스폰서나 고용주가 정한 조직의 비즈니스 목표에 종속시키기 위함이다.","종료 시점에 코치가 진척 상황을 추적하고 성과를 측정할 수 있도록 목표를 문서화하기 위함이다."],"b":"A","w":null,"be":"2025 핵심역량 3번 공식 정의('고객 및 이해 관계자와 협력하여 코칭관계, 프로세스, 계획 및 목표에 대한 명확한 합의를 한다')에서 밝히듯, 합의의 본질적 목적은 쌍방 간의 '공유된 이해(Shared understanding)'와 공동구축 토대를 세우는 것이기 때문입니다.","we":"Worst 및 오답 비교 소거: B는 코칭 합의의 숭고한 파트너십 목적을 '코치 자신의 법적 면책과 방어'라는 자기 보호 수단으로 격하시킨 최악의 왜곡입니다. D는 행정적 성과 추적에만 치우친 부분 설명이고, C는 개인 목표를 조직 목표에 일방 종속시키는 비파트너십적 해석입니다.","c":["3.01","3.02"],"m":[],"k":[],"e":[]},{"id":128,"n":"U14","cat":"lcu","ty":"bw","t":"고객이 눈에 띄게 지치고 격앙된 모습으로 들어와 말합니다: '제 평생...","se":"A client arrives looking visibly exhausted and upset and says, “This has been the worst week of my life. I don't even know why I'm sitting here today.” What is the most effective coach response?","sk":"고객이 눈에 띄게 지치고 격앙된 모습으로 들어와 말합니다: '제 평생 최악의 한 주였어요. 오늘 제가 여기 왜 앉아있는지도 모르겠습니다.' 가장 효과적인 코치의 반응은 무엇입니까?","o":["Suggest rescheduling the session for a time when the client is in a better psychological state for meaningful coaching.","Remind the client of the goals set at the beginning of coaching and ask which one they want to focus on today.","Encourage the client to set aside the difficult events for now so the session time can be used productively.","Acknowledge the client's state as shared and invite them to talk more about the weight they have brought into today's session."],"ok":["의미 있는 코칭을 할 수 있는 더 나은 심리 상태가 되었을 때로 세션 일정을 다시 잡자고 제안한다.","코칭 초기에 설정했던 목표들을 상기시키며 그중 오늘 어떤 목표에 집중하고 싶은지 묻는다.","세션 시간을 생산적으로 활용할 수 있도록 힘들었던 일들은 잠시 옆으로 치워두자고 독려한다.","고객이 공유해 준 상태를 있는 그대로 인정하고, 오늘 세션 안으로 고객이 짊어지고 들어온 그 무게에 대해 더 이야기하도록 초대한다."],"b":"D","w":"C","be":"고객의 감정·우려 표현을 있는 그대로 인정하고 지원하며(역량 4.04, 4.05), 강한 감정 상태에서도 자신감 있게 함께 머물러(역량 5.05) 지금 여기(Here and now) 고객이 들고 들어온 전인적 현실(The Who, PCC 마커 5.1)을 수용하기 때문입니다.","we":"Worst (C): '생산적이어야 한다'는 코치의 기준을 들이밀며 고객이 겪고 있는 실제 고통과 무게를 '옆으로 치워두라'고 요구하여 고객의 존재와 감정을 묵살·부정하는(PCC 마커 4 & 5 위반) 폭력적 개입입니다.\n중간 오답 A와 B 비교: A는 강한 감정 앞에서의 회피적 일정 연기이고, B는 공감과 인정 없이 초기 목표로 화제를 돌려 현재의 정서 상태를 외면하는 차가운 대응입니다.","c":["4.04","4.05","5.01","5.05"],"m":["4.2","4.3","5.1"],"k":[],"e":[]},{"id":129,"n":"U15","cat":"lcu","ty":"bw","t":"고객이 열심히 말하고 있는 중간에, 코치는 자신이 머릿속으로 고객의...","se":"While a client is speaking, the coach suddenly realizes that they have been mentally getting ahead of the client and designing an action plan. What should the coach do?","sk":"고객이 열심히 말하고 있는 중간에, 코치는 자신이 머릿속으로 고객의 액션 플랜을 미리 구상하며 앞서 나가고 있었음을 문득 깨달았습니다. 코치는 무엇을 해야 합니까?","o":["Continue listening while weaving the ideas you have been developing mentally into questions at an appropriate time.","Notice your attention drifting, immediately let go of your planned approach, and return your full attention to what the client is saying now.","Wait until the client finishes speaking and then share the action plan you have developed as a proposed framework.","Honestly tell the client that you briefly lost focus and ask them to repeat what they just said."],"ok":["고객의 말을 계속 들으면서 머릿속으로 구상한 아이디어들을 적절한 타이밍에 질문으로 녹여낸다.","내적인 주의력 이탈을 알아차리고, 머릿속으로 짰던 계획을 즉시 내려놓은 뒤 지금 이 순간 고객이 말하는 것에 온전한 주의를 되돌린다.","고객이 말을 마칠 때까지 기다렸다가 코치가 구상한 액션 플랜을 제안용 프레임워크로 공유한다.","고객에게 자신이 잠시 집중을 잃었음을 솔직히 인정하고 방금 한 말을 다시 반복해 달라고 요청한다."],"b":"B","w":"D","be":"현재 순간 자신의 내면 상태를 지속적으로 알아차려(역량 5.03) 코치의 해결사 충동과 앞서가는 생각을 조용히 내려놓고, 온전한 주의력과 경청을 눈앞의 고객에게 즉각 복귀시키는(역량 5.01, 6 정의) 성숙한 프레즌스 실천이기 때문입니다.","we":"Worst (D): 고객은 전혀 눈치채지 못했는데 코치 자신의 양심적 죄책감을 덜어내기 위해 몰입해 있던 고객의 발화를 중단시키고(PCC 마커 6.6 위반) '다시 반복해 달라'고 요구하여 세션 흐름을 깨뜨리는 대표적 '고백의 함정(Confession Trap)'입니다.\n중간 오답 A와 C 비교: A는 코치가 미리 짠 아이디어를 질문에 숨겨 유도하려 하며, C는 고객 스스로 설계해야 할 실행 계획을 코치가 대신 짜서 건네주는 컨설팅 습관(PCC 마커 8 위반)입니다.","c":["5.01","5.03","5.04"],"m":["6.6"],"k":[],"e":[]},{"id":130,"n":"U16","cat":"lcu","ty":"mc4","t":"ICF 핵심 역량에 따를 때, 코치가 '적극적으로 경청한다(Liste...","se":"According to the ICF Core Competencies, which statement most accurately describes what it means for a coach to listen actively?","sk":"ICF 핵심 역량에 따를 때, 코치가 '적극적으로 경청한다(Listens actively)'는 것의 의미를 가장 정확하게 설명한 것은 무엇입니까?","o":["Wait patiently without interrupting until the client finishes, while mentally preparing the next question.","Listen carefully to the client's words and take detailed notes so that no important information is missed.","Listen beyond the client's words, attending to what is said and unsaid and noticing tone, energy, emotions, and patterns.","Listen with the intention of identifying the core problem so it can be solved effectively."],"ok":["말을 가로막지 않고 끝까지 인내심 있게 들은 후 다음 질문을 머릿속으로 구성하기 위해 기다린다.","중요한 내용을 놓치지 않기 위해 고객의 단어를 주의 깊게 듣고 상세한 메모를 작성한다.","고객의 단어 너머를 듣고, 말해진 것과 말해지지 않은 것에 주의를 기울이며, 어조, 에너지, 감정, 패턴을 알아차린다.","문제를 효과적으로 해결할 수 있도록 근본적인 문제(Core problem)를 찾아내려는 의도를 가지고 경청한다."],"b":"C","w":null,"be":"2025 핵심역량 6번 공식 정의('고객의 시스템 맥락에서 전달하는 것을 충분히 이해하고, 고객의 자기표현을 돕기 위하여 고객이 말한 것과 말하지 않은 것에 초점을 맞춘다') 및 6.04~6.06(감정·에너지·어조·신체 언어·패턴 통합 파악)과 완벽히 일치하기 때문입니다.","we":"Worst 및 오답 비교 소거: D는 코치를 '문제를 진단하고 해결해 주는 컨설턴트/의사(질병 모델)'로 규정하는 최악의 역할 왜곡입니다. B는 기록 행위에 치중한 피상적 경청이고, A는 듣는 동안 머릿속으로 다음 질문을 짜면서 현재 순간의 현존을 놓치는 전형적인 비프레즌스 상태입니다.","c":["6.03","6.04","6.05","6.06"],"m":[],"k":[],"e":[]},{"id":131,"n":"U17","cat":"lcu","ty":"bw","t":"강력한 질문을 받은 후 거의 1분 동안 침묵하던 고객이 갑자기 눈을...","se":"After a powerful question, a client remains silent for almost a minute, then suddenly opens their eyes and says, “Wow... I've never thought about it that way before.” The coach feels an immediate urge to ask another question. What should the coach do?","sk":"강력한 질문을 받은 후 거의 1분 동안 침묵하던 고객이 갑자기 눈을 뜨며 말합니다: '와... 저는 지금까지 단 한 번도 그런 식으로 생각해 본 적이 없었어요.' 코치는 즉각 다음 질문을 던지고 싶은 충동을 느낍니다. 코치는 무엇을 해야 합니까?","o":["Ask a follow-up question immediately while the insight is alive and the client is open, and move to the next step.","Paraphrase the insight to confirm that you have understood it accurately before exploring further.","Trust that the insight is still unfolding internally and remain silent until the client is ready.","Acknowledge the client's realization and invite them to stay with it and share what is emerging internally now."],"ok":["통찰의 추진력이 살아있고 고객이 열려 있는 지금 즉시 후속 질문을 던져 다음 단계로 나아간다.","더 깊이 탐색하기 전에 코치가 통찰을 정확히 이해했는지 확인하기 위해 말을 패러프레이징해 준다.","통찰이 아직 내면에서 계속 펼쳐지고 있음을 믿고 고객이 준비될 때까지 침묵 속에 그대로 머문다.","고객이 방금 말한 깨달음을 인정하고, 그 깨달음과 함께 머물면서 지금 내면에서 무엇이 올라오고 있는지 공유하도록 초대한다."],"b":"D","w":"A","be":"고객이 침묵을 깨고 꺼낸 소중한 통찰을 따뜻하게 인정하고(역량 4.03), 성급히 다음 단계로 달리지 않은 채 지금 이 순간 내면에서 피어나는 경험과 자각을 더 깊이 공유하도록 초대하기 때문입니다(역량 7.05, PCC 마커 4.1).","we":"Worst (A): 통찰이 막 도착해 내면화되기도 전에 코치의 조급한 추진력 충동 때문에 즉시 다음 단계 질문으로 질주함으로써 깊은 자각의 소화와 통합을 가로막는(PCC 마커 5 위반 및 7.05 상실) 최악의 반응입니다.\n중간 오답 B와 C 비교: B는 고객의 고유한 깨달음을 코치의 말로 바꾸어 흐름을 끊는 개입이며, C는 고객이 이미 입을 열어 말을 건넸음에도 응답하지 않고 침묵만 고수해 반응성(역량 5.01)이 떨어지는 차선책입니다.","c":["4.03","5.01","5.07","7.05"],"m":["4.1"],"k":[],"e":[]},{"id":132,"n":"U18","cat":"lcu","ty":"bw","t":"세션 중간에 임원 고객이 긴급 문자를 받더니 다급히 말합니다: '정말...","se":"Midway through a session, an executive client receives an urgent text and says, “I'm really sorry, something urgent has come up. Could we just wrap up quickly in the remaining ten minutes?” The coach had prepared to use a powerful reframing tool today. What should the coach do?","sk":"세션 중간에 임원 고객이 긴급 문자를 받더니 다급히 말합니다: '정말 죄송해요, 급한 일이 터져서 남은 10분 동안 대충 마무리할 수 있을까요?' 코치는 오늘 강력한 리프레이밍 도구를 적용하려고 만반의 준비를 해둔 상태였습니다. 코치는 무엇을 해야 합니까?","o":["Proceed quickly with the prepared reframing tool because ten minutes is enough time and it could greatly benefit the client.","Fully acknowledge the client's request, ask how the remaining ten minutes would be most useful, and follow the client's decision.","Suggest rescheduling the work for a separate session on another day so it is not rushed or compromised.","Acknowledge the situation, mention the excellent reframing exercise you prepared for today, and ask whether the client still wants to proceed."],"ok":["10분이면 충분한 시간이므로 고객에게 큰 유익이 될 준비된 리프레이밍 도구를 신속하게 진행한다.","고객의 요청을 온전히 인정하고, 남은 10분을 어떻게 보내는 것이 가장 유용할지 고객에게 묻고 그 결정을 따른다.","작업이 서둘러 진행되어 훼손되지 않도록 남은 시간은 다른 날 별도 세션으로 재조정하자고 제안한다.","상황을 인정하되 오늘 준비했던 훌륭한 리프레이밍 연습이 있음을 알리고 그래도 진행할지 묻는다."],"b":"B","w":"A","be":"코치가 준비해 온 계획이나 도구에 대한 집착을 완전히 내려놓고(역량 2 정의 유연성), 고객의 현실적 요청과 욕구를 인정하며 남은 시간과 초점 관리의 선택권을 고객에게 돌려주기 때문입니다(역량 3.09, 7.07, PCC 마커 5.3).","we":"Worst (A): 긴급 상황이 발생한 고객의 의사와 시간 요청을 무시하고, 코치 자신이 준비해 온 리프레이밍 도구를 억지로 밀어붙여 PCC 마커 3 & 5 위반('코치 자신의 아젠다를 강행함')을 범한 최악의 자기중심적 행동입니다.\n중간 오답 C와 D 비교: C는 고객이 원한 '10분 마무리' 대신 별도 일정 재조정을 제안해 현재 니즈를 놓쳤고, D는 '훌륭한 연습을 준비했다'고 언급함으로써 고객에게 은근한 심리적 부담을 주는 아쉬운 표현입니다.","c":["3.09","4.05","7.07"],"m":["5.3"],"k":[],"e":[]},{"id":133,"n":"U19","cat":"lcu","ty":"bw","t":"사내 임원 코치가 조직 개편으로 압박을 겪는 시니어 매니저를 코칭하고...","se":"An internal executive coach is coaching a senior manager under pressure from an organizational restructuring. The manager says, “You came from the corporate strategy team that designed my department. Tell me exactly how to structure my team to fit the organization design.” How should the coach respond?","sk":"사내 임원 코치가 조직 개편으로 압박을 겪는 시니어 매니저를 코칭하고 있습니다. 매니저가 묻습니다: '코치님은 제 부서를 설계했던 전사 전략팀 출신이시잖아요. 조직 설계에 맞추려면 팀을 어떻게 구성해야 할지 명확한 답을 알려주세요.' 코치의 대응은?","o":["Clearly explain the internal strategic context, ask how the manager wants to apply that information, and return to coaching.","Clarify the distinction between roles, explain that directing strategy is outside the coaching role, and ask how the manager wants to explore organizational restructuring options.","Flatly refuse to answer, saying that coaching sessions are strictly confidential and focus only on personal leadership style.","Propose a separate consulting contract, distinct from the existing coaching agreement, to advise on the manager's department structure."],"ok":["내부 전략 맥락을 명확히 설명해 준 뒤 매니저가 그 정보를 어떻게 적용하고 싶은지 물으며 코칭으로 복귀한다.","역할의 구분을 명확히 밝히고, 전략 방향 지시는 코칭 역할 밖임을 설명한 후 매니저가 자신의 조직 개편 옵션을 어떻게 탐색하길 원하는지 묻는다.","코칭 세션은 엄격히 비밀보장되고 개인 리더십 스타일에만 집중되므로 대답할 수 없다고 단칼에 거절한다.","매니저의 부서 구조에 대해 자문해 줄 수 있도록 기존 코칭 계약과 별개의 컨설팅 계약을 체결하자고 제안한다."],"b":"B","w":"D","be":"코칭과 컨설팅(전략 자문)의 역할 경계를 명확히 구분하고(역량 1.06, 3.01, 3.02), 과거 경력이라는 '전문가 충동'을 내려놓은 채 매니저 스스로 자신의 조직 개편 옵션을 탐색하도록 파트너십으로 초대했기 때문입니다.","we":"Worst (D): 코칭 신뢰 관계를 사적 영업 기회로 악용하여 별도의 컨설팅 계약을 제안함으로써 이해상충(윤리강령 Standard 3.1, 3.7)과 역할 혼동을 야기한 최악의 비윤리적 행동입니다.\n중간 오답 A와 C 비교: A는 배경 정보를 브리핑하며 슬그머니 컨설팅 역할로 발을 들이는 미끄러짐이고, C는 역할 경계는 지켰으나 '단칼에 거절'하며 존중하는 언어와 탐색 초대(역량 1.03)를 생략한 경직된 대응입니다.","c":["1.03","1.06","3.01","3.02"],"m":[],"k":[],"e":["3.1","3.7"]},{"id":134,"n":"U20","cat":"lcu","ty":"bw","t":"고객이 '상사와 명확한 경계를 세워야 한다는 건 저도 알아요. 하지만...","se":"A client says, “I know I need to set clear boundaries with my manager, but I just can't,” and their tone of voice suddenly drops. What should the coach do?","sk":"고객이 '상사와 명확한 경계를 세워야 한다는 건 저도 알아요. 하지만 전 도저히 못 하겠어요(I just can't).'라고 말하며 목소리 톤이 급격히 가라앉습니다. 코치는 무엇을 해야 합니까?","o":["Suggest three scripts for boundary-setting conversations that the client can use at the next meeting.","Ask the client to rate their current confidence in setting boundaries on a scale of one to ten.","Warmly reassure the client that setting boundaries becomes easier with time and practice.","Mirror the change in the client's tone and ask what saying 'I can't' means to them in this moment."],"ok":["다음 회의에서 바로 써먹을 수 있는 세 가지 경계 설정 대화 스크립트를 제안한다.","경계 설정에 대한 현재의 자신감 수준을 1점에서 10점 척도로 매겨보라고 묻는다.","경계 설정은 시간이 지나고 연습하면 점점 쉬워진다고 따뜻하게 안심시킨다.","톤의 변화를 거울처럼 비춰주고, 지금 이 순간 고객에게 '못 하겠다(Can't)'는 말이 무엇을 의미하는지 묻는다."],"b":"D","w":"A","be":"급격히 가라앉은 목소리 톤의 변화(역량 6.04)를 반영하면서 동시에 고객이 사용한 핵심 제한 단어('Can't')의 고유한 내적 의미를 탐색(역량 6.02, PCC 마커 6.2)하여 표면의 기술 부족 이면에 있는 핵심 신념·두려움을 비추어 주기 때문입니다.","we":"Worst (A): 고객의 깊은 정서적 무력감과 두려움(The Who)을 탐색하지 않은 채 코치가 '대화 스크립트 3가지'를 처방하여 코칭을 스킬 트레이닝(역량 1.06 및 PCC 마커 8 위반)으로 전락시킨 최악의 개입입니다.\n중간 오답 B와 C 비교: B는 척도 질문으로 상태는 측정하나 정서적 가라앉음과 'Can't'의 깊은 의미를 건너뛰었고, C는 상투적 위로('연습하면 쉬워진다')로 현재 감정을 축소(Minimizing)한 반응입니다.","c":["6.02","6.04","6.05","7.03"],"m":["6.2","6.4"],"k":[],"e":[]},{"id":135,"n":"U21","cat":"lcu","ty":"mc4","t":"코치가 고객과 강력한 라포(Rapport)를 형성하여 고객이 매우 편...","se":"A coach has developed strong rapport with a client, who feels comfortable and speaks openly. From the ICF Core Competencies perspective, which competency does this state alone best reflect, and what is it easily confused with?","sk":"코치가 고객과 강력한 라포(Rapport)를 형성하여 고객이 매우 편안하고 개방적으로 이야기를 나눕니다. ICF 핵심 역량 관점에서 볼 때, '이 상태 하나만'으로는 어떤 역량을 가장 잘 반영하며 무엇과 혼동하기 쉽습니까?","o":["This relates to Competency 5 (Maintains Presence) and is often confused with staying calm under pressure.","This relates to Competency 6 (Listens Actively) and is often confused with silently waiting until the client finishes speaking.","This relates to Competency 2 (Embodies a Coaching Mindset) and is often confused with being sociable and friendly.","This relates to Competency 4 (Cultivates Trust and Safety) and is often mistaken for rapport-building alone."],"ok":["역량 5(프레즌스 유지)에 해당하며 압박감 속에서 차분함을 유지하는 것과 혼동된다.","역량 6(적극적 경청)에 해당하며 고객의 말이 끝날 때까지 침묵하며 기다리는 것과 혼동된다.","역량 2(코칭 마인드셋 체화)에 해당하며 사교적이고 친절한 성격을 갖는 것과 혼동된다.","역량 4(신뢰와 안전감 조성)에 해당하며, 흔히 '라포 형성' 그 자체와 동일한 것으로 오해하기 쉽다."],"b":"D","w":null,"be":"편안하고 친밀한 대화 분위기(라포)는 역량 4(신뢰와 안전감 조성)의 자연스러운 출발점이자 부산물이지만, 진정한 역량 4는 단순한 친목적 라포를 넘어 고객이 취약성과 두려움까지 안전하게 탐색할 수 있는 상호 존중의 컨테이너를 구축하는 것임을 정확히 짚었기 때문입니다.","we":"Worst 및 오답 비교 소거: C는 역량 2(개방적이고 호기심 많은 전문적 코칭 마인드셋)를 단순히 '사교적이고 친절한 성격'으로 축소·왜곡한 최악의 개념 오류입니다. A는 역량 5의 일부 요소, B는 역량 6의 수동적 측면을 단편적으로 연결한 오답입니다.","c":["4.01","4.06"],"m":["4.1"],"k":[],"e":[]},{"id":136,"n":"U22","cat":"lcu","ty":"bw","t":"오랜 고객이 코치에게 비즈니스 컨설턴트 역할도 함께 맡아달라며 정기...","se":"A long-term client asks the coach to also serve as a business consultant and offers to pay an additional fee for strategic advice during regular coaching sessions. The coach has extensive expertise in the industry. What should the coach do first?","sk":"오랜 고객이 코치에게 비즈니스 컨설턴트 역할도 함께 맡아달라며 정기 세션 중에 전략적 자문을 제공해 주면 추가 비용을 지불하겠다고 제안합니다. 코치는 해당 업계의 풍부한 전문 지식을 보유하고 있습니다. 가장 먼저 해야 할 일은?","o":["Accept the proposal because your expertise could add significant value and the client is willing to pay a fair fee.","Explicitly clarify the fundamental change in role and openly discuss what professional boundaries or formal contract changes this request would require.","Flatly decline the proposal and terminate the entire coaching relationship to eliminate any potential conflict of interest.","Naturally combine the two roles within the existing sessions because this is what the client wants and has requested."],"ok":["코치의 전문성이 큰 가치를 더할 수 있고 정당한 비용을 지불할 용의가 있으므로 제안을 수락한다.","역할의 본질적 변화를 명시적으로 밝히고, 이러한 요청이 어떤 전문적 경계 설정이나 공식 계약 변경을 필요로 하는지 고객과 솔직하게 논의한다.","이해 상충을 원천 차단하기 위해 제안을 단칼에 거절하고 코칭 관계 전체를 전면 종료한다.","고객이 원하고 요청한 것이므로 기존 세션 안에서 자연스럽게 두 역할을 융합하여 진행한다."],"b":"B","w":"D","be":"역량 1.06(코칭과 컨설팅의 차별성 유지), 3.02(관계에서 제공되는 것과 제공되지 않는 것 합의), 그리고 윤리강령 Standard 3.1 및 3.7(다중 역할·다중 합의의 함의 논의 및 역할 전환 시 명확 고지)에 따라 역할 경계와 계약 분리를 투명하게 논의하기 때문입니다.","we":"Worst (D): 사전 경계 합의나 계약 분리 없이 동일한 세션 안에서 코칭과 컨설팅 역할을 임의로 뒤섞어 진행함으로써 윤리강령 Standard 3.7 및 역량 1.06을 정면으로 훼손한 최악의 역할 혼재입니다.\n중간 오답 A와 C 비교: A는 금전적 제안에 이끌려 역할 경계 논의 없이 수락한 부주의한 결정이고, C는 별도 계약 분리 등 합법적 조율이 가능함에도 기존 코칭 관계까지 파기하는 과잉 해석(Overreach)입니다.","c":["1.01","1.06","3.02","3.12"],"m":[],"k":[],"e":["3.1","3.7"]},{"id":137,"n":"U23","cat":"lcu","ty":"bw","t":"세션 종료가 가까워졌을 때 고객이 말합니다: '코치님이 제 상황을 저...","se":"Near the end of a session, a client says, “You know my situation better than I do, and I trust your judgment completely. Just tell me exactly what I should focus on this week.” What should the coach do?","sk":"세션 종료가 가까워졌을 때 고객이 말합니다: '코치님이 제 상황을 저보다 더 잘 아시고 전 코치님의 판단을 전적으로 신뢰하거든요. 이번 주에 제가 구체적으로 무엇에 집중해야 할지 그냥 코치님이 딱 정해주세요.' 코치는 무엇을 해야 합니까?","o":["Ask what is making it difficult for the client to decide this for themselves right now.","Recommend the single most effective action because the client explicitly asked for advice and trusts your expertise.","Firmly refuse, saying that coaching cannot provide answers, and send the client away to reflect on what they learned today.","Suggest discussing the question together first thing in the next session because time is short."],"ok":["지금 이 순간 고객 스스로 그것을 결정하는 것을 어렵게 만드는 요인이 무엇인지 질문한다.","고객이 명시적으로 조언을 요청했고 전문성을 신뢰하고 있으므로 가장 효과적인 행동 한 가지를 추천해 준다.","코칭에서는 답을 줄 수 없다고 단호히 거절하고 오늘 세션에서 배운 점을 다시 성찰하라고 돌려보낸다.","시간이 촉박하므로 다음 세션이 시작될 때 이 질문을 가장 먼저 함께 다시 논의하자고 제안한다."],"b":"A","w":"B","be":"고객의 찬사와 의존적 요청에 흔들리지 않고 선택의 책임이 고객에게 있음을 지키며(역량 2.01, 8.03), 지금 이 순간 스스로 결정하는 것을 가로막는 내적 요인과 장애물을 탐색하게 돕기 때문입니다(역량 7.08, 8.05).","we":"Worst (B): 고객이 전문성을 칭찬하며 요청했다는 이유를 빌미로 코치가 직접 실행 과제를 추천·지정함으로써 PCC 마커 8 위반('고객 스스로 행동을 설계하게 하는 대신 코치가 처방한 행동을 지시함')을 범한 최악의 개입입니다.\n중간 오답 C와 D 비교: C는 경계는 지켰으나 '단호히 거절하고 돌려보낸다'는 방어적 태도로 존중과 탐색 기회를 놓쳤고, D는 지금 여기에서 다룰 중요한 의존성 신호를 다음 세션으로 미루는(Postponing) 회피입니다.","c":["2.01","7.08","8.03","8.05"],"m":[],"k":[],"e":[]},{"id":138,"n":"U24","cat":"lcu","ty":"bw","t":"고객이 세션에 도착하여 지난 한 주 동안 일어난 사건들의 순서를 매우...","se":"A client arrives and calmly describes the sequence of events from the past week in clear, analytical detail. However, their tone is very monotone and flat, and their body language also appears restrained. What should the coach do?","sk":"고객이 세션에 도착하여 지난 한 주 동안 일어난 사건들의 순서를 매우 명확하고 분석적인 세부 사항으로 담담하게 설명합니다. 그러나 목소리 톤은 매우 단조롭고 평면적(Flatness)이며 신체에서도 억제된 모습이 감지됩니다. 코치는 무엇을 해야 합니까?","o":["Ask a structured series of questions to analyze the events of the past week more deeply.","Reflect that you are hearing many details and ask whether anything is being left out of the story.","Acknowledge that it sounds like a really difficult week and ask how the client is feeling now.","Reflect the flat tone of voice you observed while the client described the events and ask what the client thinks about that flatness."],"ok":["지난 한 주의 사건들을 더 깊이 분석하기 위해 구조화된 일련의 질문을 던진다.","많은 세부 사항들이 들린다는 점을 반영하고 혹시 지금 이야기에서 빠뜨리고 있는 것이 무엇인지 묻는다.","정말 힘든 한 주였던 것 같다고 인정해 주고 지금 기분이 어떤지 묻는다.","방금 사건들을 설명하는 방식에서 관찰된 단조로운 목소리 톤(Flatness)을 있는 그대로 비춰주고, 그 단조로움에 대해 고객 스스로 어떻게 생각하는지 질문한다."],"b":"D","w":"A","be":"말의 내용(7%)이 아닌 목소리 톤의 단조로움과 신체적 억제라는 비언어적 신호를 통합적으로 포착하되(역량 6.04, 6.05), 코치의 해석 없이 관찰 사실만 거울처럼 비추어(역량 7.11) 고객 스스로 그 의미를 탐구하게 했기 때문입니다.","we":"Worst (A): 명백한 비언어적·정서적 억제 신호를 완전히 무시한 채 사건의 디테일을 캐묻는 구조화된 연쇄 질문을 던짐으로써 PCC 마커 6 위반('비언어적 정보를 활용하지 않음')과 PCC 마커 7.6('한 번에 하나씩 질문' 위반)을 동시에 범한 최악의 기계적 취조입니다.\n중간 오답 B와 C 비교: C는 지문에 없는 '힘든 한 주'라는 감정을 코치가 추측해 삽입한 오답이며, B는 '빠뜨리고 있는 것'을 캐물어 코치의 의심을 투사한 차선책입니다.","c":["6.04","6.05","7.11"],"m":["6.4","7.5"],"k":[],"e":[]},{"id":139,"n":"U25","cat":"lcu","ty":"bw","t":"긴밀히 협업하는 직장 동료가 찾아와 자신의 남편이 커리어 전환으로 힘...","se":"A close colleague at work asks the coach to provide one-to-one coaching to the colleague's husband, who is struggling with a career transition. The husband also wants to work with the coach. What is the appropriate ethical response?","sk":"긴밀히 협업하는 직장 동료가 찾아와 자신의 남편이 커리어 전환으로 힘들어하고 있다며 코치에게 남편을 1:1로 코칭해 달라고 정식 부탁했습니다. 남편 역시 코치와 일하길 원합니다. 올바른 윤리적 대응은 무엇입니까?","o":["Clearly explain the dynamics of the multiple relationships to both the colleague and the spouse in advance, and proceed with the contract.","Avoid the situation with vague excuses and no explanation because the relationship with the colleague could become awkward.","Accept the coaching engagement and specify strict confidentiality boundaries in the contract to prevent personal feelings from becoming involved.","Politely explain the potential conflict of interest, decline the engagement, and refer the spouse to a third-party coach who does not know them."],"ok":["동료와 남편 모두에게 다중 관계 역동을 사전에 명확히 설명하고 계약을 진행한다.","동료와의 관계가 껄끄러워질 수 있으므로 아무런 설명 없이 모호하게 둘러대며 회피한다.","사적 감정이 개입되지 않도록 계약서에 엄격한 비밀보장 경계를 명시하고 코칭을 수락한다.","잠재적 이해 상충을 정중히 설명하며 수임을 거절(Decline)하고, 남편을 모르는 제3의 코치에게 의뢰(Refer)한다."],"b":"D","w":"A","be":"긴밀한 직장 동료의 배우자를 코칭할 경우 동료로부터 들은 사전 정보와 관계 역학으로 인해 중립성 훼손 및 비밀보장 갈등이 필연적이므로, 윤리강령 Standard 3.1 및 3.3에 따라 이해상충을 투명하게 설명해 정중히 거절하고 이해관계가 없는 제3의 코치에게 의뢰하는 것이 최선입니다.","we":"Worst (A): 단순 고지(Disclosure)만으로는 구조적 이해상충과 비밀보장 위험이 해소되지 않음에도 계약을 강행하여 향후 부부 문제나 직장 갈등 시 양쪽 신뢰를 모두 파괴할 위험을 자초한 최악의 결정입니다.\n중간 오답 B와 C 비교: B는 거절은 했으나 진실성과 투명성(역량 1.01) 없이 모호하게 회피한 태도이고, C는 계약서 문구만으로 심리적·관계적 이해상충을 통제할 수 있다고 착각한 안일한 대응입니다.","c":["1.01","1.03","1.04"],"m":[],"k":[],"e":["3.1","3.3"]},{"id":140,"n":"U26","cat":"lcu","ty":"mc4","t":"코치는 최근 1년 동안 수많은 고객들을 코칭해 오며 매 세션마다 매우...","se":"A coach realizes that, although many clients have given very positive feedback over the past year and no problems
