  } else {
    const qg = (S.gq || '').trim().toLowerCase();
    const filteredG = qg ? G.filter(item =>
      item.k.toLowerCase().includes(qg) ||
      item.ko.toLowerCase().includes(qg) ||
      item.en.toLowerCase().includes(qg)
    ) : G;
    h += `<div class="card">
      <div class="sec-title"><span>2025 ICF 핵심역량 용어집</span><span class="tag">${filteredG.length} / ${G.length}개</span></div>
      <p class="mu" style="margin:0 0 8px">2025 개정 ICF 핵심역량 부록 공식 용어 정의입니다.</p>
      <input type="search" id="glossSearch" value="${esc(S.gq || '')}" placeholder="영문 또는 한글 용어 검색 (예: Autonomy, 직관, 집착...)" style="width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px;margin-bottom:8px">
      ${filteredG.map(item => `<div class="sub">
        <div style="font-weight:800;color:#c45100;margin-bottom:2px">${esc(item.k)}</div>
        ${txBlock(item.ko, item.en)}
      </div>`).join('') || '<p class="mu">검색어와 일치하는 용어가 없습니다.</p>'}
    </div>`;
  }
  return h;
}

const STRAT = [{"i":"①","t":"학습 루틴과 피드백","s":[{"h":"핵심 기준을 먼저 세우기","l":[["학습 기준","문항을 풀기 전에 해당 상황에서 고객의 자율성, 파트너십, 안전, 윤리적 책임 중 무엇이 핵심인지 먼저 확인합니다."],["행동 근거","선지의 표현이 좋아 보이는지보다 코치가 실제로 어떤 행동을 했는지, 고객에게 어떤 영향을 줄 수 있는지 살펴봅니다."],["마커 연결","정답을 고른 뒤 관련 핵심역량과 PCC 마커를 연결하고, 그 기준이 이 사례에 어떻게 드러났는지 한 문장으로 설명합니다."]]},{"h":"문항 풀이 후 성찰","l":[["선택 근거","정답을 맞혔더라도 왜 다른 선택지가 덜 적절한지 설명합니다."],["오답 기록","놓친 단서, 성급한 가정, 코치 중심적 개입 등 오답의 원인을 분류합니다."],["재학습","같은 기준이 다른 상황에서 어떻게 적용되는지 유사 문항을 찾아 비교합니다."]]},{"h":"개인 학습 루틴","l":[["짧은 반복","한 번에 많은 문항을 처리하기보다 집중 가능한 단위로 나누어 풀이와 복습을 반복합니다."],["언어 내면화","핵심역량과 윤리 원칙을 자신의 말로 요약하고, 실제 코칭 장면의 행동 예시를 덧붙입니다."],["성찰 기록","매 학습 후 새롭게 알게 된 점과 실제 세션에서 실천할 행동 한 가지를 기록합니다."]]}]},{"i":"②","t":"집중·복습 전략","s":[{"h":"문항을 깊이 읽는 방법","l":[["상황 파악","고객이 말한 사실, 감정, 관계 맥락, 요청을 구분해 읽습니다."],["핵심 단서","고객의 반복 표현, 감정 변화, 에너지 변화, 말과 비언어적 신호의 차이를 살핍니다."],["의도 확인","질문이 고객의 목표·가치·인식·실행 중 무엇을 다루려는지 확인합니다."]]},{"h":"판단을 점검하는 복습","l":[["근거 대조","선택한 행동이 어떤 역량 또는 윤리 기준과 연결되는지 원문 기준에 비추어 확인합니다."],["반례 찾기","내가 고른 행동이 고객의 선택권을 좁히거나 코치의 가정을 강요하지는 않는지 점검합니다."],["설명하기","정답과 오답의 차이를 동료 코치에게 설명하듯 자신의 언어로 정리합니다."]]},{"h":"집중력과 회복","l":["학습 시간과 휴식 시간을 스스로 정하고, 집중력이 떨어지기 전에 짧은 휴식을 둡니다.","방해 요인을 줄이고 한 번에 한 가지 학습 과제에 집중합니다.","학습이 끝난 뒤에는 핵심 기준을 간단히 회고하고 다음 학습 목표를 정합니다."]}]},{"i":"③","t":"문제 풀이 공식 (ACCAT · TRAPS · 소거법)","s":[{"h":"읽기 원칙","l":["지문의 감정 단어, 목소리 톤 변화, 에너지 저하는 버리는 정보가 아닙니다. Best 선지는 반드시 이 단서를 직접 다루고 반영합니다.","선지의 동사를 대조합니다: Acknowledge(인정하다), Share(집착 없이 공유하다), Ask(묻다)가 어떻게 쓰였는지 봅니다."]},{"h":"Best 선지의 5대 특징 — ACCAT","l":[["A · Asking","질문하기. 가르치거나 지시하기(Telling)의 반대입니다."],["C · Client-centered & Client-directed","고객 중심·고객 주도. 아젠다, 속도, 실행 설계의 주권을 고객에게 둡니다."],["C · Curiosity","순수한 호기심. 코치의 결론으로 유도(Leading)하지 않고 고객의 세계를 탐구합니다."],["A · Awareness of judgments & biases","판단과 편향을 자각하고 코치의 과거 경험과 선입견을 내려놓습니다."],["T · Transparency","투명성. 관찰, 직감, 이해상충을 집착 없이(Without attachment) 공유합니다."]]},{"h":"Worst 선지의 징후 — TRAPS","l":["코치 중심적 사고 · 지시/가르침(Tell/Teach) · 유도 질문 · 투명성 결여 · 무의식적 편향 투사.",["Miss · Dismiss · Minimize","고객의 감정, 취약성, 비언어적 신호, 문화적 정체성을 놓치거나(Miss), 묵살하거나(Dismiss), 축소(Minimize)하고 기존 계획이나 코치의 해답으로 밀고 나가는(Pushing on) 행동은 상황과 맥락을 고려할 때 매우 부적절한 선택일 수 있습니다."]]},{"h":"소거 알고리즘 (4단계)","l":[["1. 단서 포착","감정 단어, 톤, 에너지 저하를 먼저 찾습니다."],["2. Worst 먼저 소거","① 윤리강령 위반(비밀 누설, 이해상충, 치료 미연계) ② 직접적 조언·해결책 제시(Fixing) ③ 고객의 감정을 무시하고 코치의 일정·워크시트를 강행하는 선지."],["3. Best 고르기","직접 조언·제안·유도 질문 제거 → 닫힌 질문(Yes/No)과 방어를 부르는 Why 질문 제거 → 코치가 고객보다 더 열심히 일하거나 말을 많이 하는 선지 제거 → 고객이 가장 많은 내적 작업(Heavy lifting)을 하게 하는 짧고 개방적인 질문, 비판단적 관찰 공유, 지지적 침묵을 선택."],["4. 재검토","첫 직관을 존중합니다. 근거 없이 바꾸지 않습니다."]]},{"h":"2:2 분할 소거","l":["한 번에 1등을 찾지 말고 먼저 [효과적인 선지 2개 vs 비효과적인 선지 2개]로 나눕니다.","효과적인 2개 중 2025 핵심역량과 PCC 마커에 가장 직결된 Best of Best를 고르고, 비효과적인 2개 중 고객의 자율성을 빼앗거나 적극적 해악(Active Harm)을 끼치는 Worst of Worst를 확정합니다."]},{"h":"미묘한 함정 대처","l":["출제자는 Best를 일부러 완벽하지 않은 문장(약간 투박한 질문 등)으로 만들어 흔들기도 합니다. 이때도 “지시하거나 가르치는 선지”보다 “서툴더라도 고객에게 묻고 인정하는 선지”가 우위입니다."]},{"h":"3대 오답 함정 (3 Pitfalls)","l":[["Overreach (과잉 해석)","ICF 기준보다 더 엄격한 개인적·도덕적 잣대를 들이대어 조율 가능한 상황까지 무조건 거절하는 오류."],["Underreach (과소 대응)","특정 인물에 대한 과도한 감정이입으로 비밀보장·경계 원칙을 느슨하게 적용하는 오류."],["타 전문직 렌즈 혼입","현업의 컨설턴트·트레이너·심리상담사 습관으로 해결책이나 진단을 내리는 오류."]]}]},{"i":"④","t":"역량별 정답 선택 규칙","s":[{"h":"기초 세우기: 윤리(역량 1) · 마인드셋(역량 2)","l":[["선택 기준","ICF 4대 핵심 가치(전문직업의식, 협동, 인간성, 형평)와 고객의 안전·자율성을 최우선으로 보호하는 선지가 정답입니다."],["직관 vs 가정","직관은 느낌이나 관찰을 집착 없이 건네고 고객이 수용·거절할 자유를 주는 것, 가정은 코치의 생각을 진실로 단정하고 유도하는 것입니다."],{"chips":[["gc","1.05","역량 1.05"],["gc","1.06","역량 1.06"],["gc","1.07","역량 1.07"],["gc","2.05","역량 2.05"]]}]},{"h":"관계의 공동구축: 합의(역량 3) · 신뢰와 안전감(역량 4)","l":[["거시적 합의","전체 코칭 계약(범위, 일정, 비용, 역할, 비밀보장). 고객이 코칭의 본질을 오해하면 전체 합의를 다시 검토합니다."],["미시적 합의 (세션 합의)","매 세션 시작 시 ① 오늘 달성하려는 구체적 목표 → ② 종료 시점의 성공 척도 → ③ 이 목표가 고객에게 중요한 이유와 의미 → ④ 달성을 위해 오늘 다뤄야 할 핵심 요소를 고객과 함께 정의합니다."],["실시간 재합의 (Recontracting)","세션 도중 합의한 주제와 다른 방향으로 흐르면, 코치가 임의로 끌고 가거나 무작정 따라가지 말고 변화를 알아차려 언급한 뒤 남은 시간의 초점을 고객이 선택하게 합니다."],["저항 다루기","고객이 질문에 불편함이나 저항을 보이면 방어·변명하지 말고, 호기심으로 그 불편함을 함께 탐색하며 고객의 속도와 경계를 즉각 존중합니다."],{"chips":[["gc","3.06","역량 3.06"],["gc","3.10","역량 3.10"],["gc","3.11","역량 3.11"],["gc","3.12","역량 3.12"]]}]},{"h":"프레즌스(역량 5) · 적극적 경청(역량 6)","l":[["알지 못함 · 감정 관리","답을 찾으려 조급해하지 말고 불확실성 속에 편안히 머뭅니다. 코치 자신의 잡념이 떠오르면 자책하거나 티 내지 않고 조용히 알아차린 뒤 즉시 고객에게 주의를 돌립니다."],["침묵","강력한 질문 뒤 고객이 침묵할 때 불안해서 질문을 풀어 설명하거나 다른 질문으로 깨는 것은 대표적 감점 요인입니다."],["말하지 않은 것 경청","말의 내용과 톤·속도·에너지가 불일치하면 판단 없이 부드럽게 반영합니다. 고객의 고유한 단어와 은유(예: 끝없는 산을 오르는 느낌)는 코치의 전문 용어로 바꾸지 않고 그대로 씁니다."],["Who 경청","외부 상황과 해결책(What)보다 고객의 정체성, 신념, 가치, 내면 경험(Who)에 초점을 맞춘 선지가 항상 더 높은 점수를 받습니다."],{"chips":[["gc","5.03","역량 5.03"],["gc","5.06","역량 5.06"],["gc","5.07","역량 5.07"],["gc","6.02","역량 6.02"],["gc","6.05","역량 6.05"]]}]},{"h":"알아차림 불러일으키기(역량 7) · 성장 촉진(역량 8)","l":[["Why 회피","“왜 그렇게 했나요?”는 맥락에 따라 방어적으로 들릴 수 있습니다. 질문의 의도와 고객의 반응을 살피고, 필요하면 “무엇”이나 “어떻게” 질문으로 바꿉니다. “무엇(What)”이나 “어떻게(How)”로 시작하는 짧고 명확한 단일 개방형 질문을 고릅니다."],["직접 소통 공식","관찰·직관 공유(집착 없이) + 고객의 탐색을 초대하는 질문이 한 세트여야 합니다. 관찰만 던지고 단정하면 오답입니다."],["실행 설계와 책무","코치가 숙제를 내주거나 행동을 지시하지 않습니다. 고객이 직접 실행 계획을 설계하고, 예상 장애물을 점검하고, 자신만의 책무 점검 방식(코치에게 원하는 지원 포함)을 정하게 초대합니다."],["실행을 못 했을 때","추궁하지 말고 호기심으로 그 경험에서 얻은 배움을 탐색합니다."],{"chips":[["gc","7.03","역량 7.03"],["gc","7.11","역량 7.11"],["gc","8.02","역량 8.02"],["gc","8.03","역량 8.03"]]}]}]},{"i":"⑤","t":"5대 오답 함정 (TRAPS 해부)","s":[{"h":"함정 1. 친절한 해결사 → 주의가 필요한 선택","l":["시간이 4분밖에 안 남았을 때 통찰을 대신 요약하고 행동 과제 3가지를 지정하는 선지(영상 9), 막막해하는 초보 창업가에게 런칭 계획서를 짜 주는 선지(영상 10), 갈등 중재 절차를 단계별로 가르치는 선지(영상 49).",["왜 오답인가","현업에서는 유능하고 친절해 보이지만 PCC 마커 8 위배입니다. 고객 스스로 행동을 설계하게 하는 대신 코치가 처방한 행동을 지시해 고객의 주체성을 박탈하는 적극적 해악입니다."]]},{"h":"함정 2. 따뜻한 위로·정상화 → 주의가 필요한 선택","l":["고객이 눈물을 흘리거나(영상 30), 가면 증후군 수치심을 고백하거나(영상 18), 리더십 불안을 토로할 때 “많은 리더들이 다 그래요 / 완벽주의자일 뿐이에요 / 곧 나아질 거예요”라고 달래는 선지.",["왜 오답인가","따뜻한 공감처럼 보이지만 고객의 고유한 고통과 알아차림의 문을 닫는 묵살(Dismissing)입니다. PCC 마커 4·6 위배."]]},{"h":"함정 3. 실무 도구·논리(What/Logistics) 우회 → 중간 오답","l":["고객이 두려움의 문턱이나 가치 갈등에 있는데 장단점 비교표 작성(영상 12), 타임 블로킹 제안(영상 14), 업무 추적기 도입(영상 11)처럼 실무 방법론을 내놓는 선지.",["왜 밀리는가","직접적 해악은 없지만 고객의 정체성·가치·두려움(The Who, PCC 마커 5.1, 7.1, 7.2)을 탐색하는 Best 선지에 항상 밀립니다."]]},{"h":"함정 4. 코치의 직감·경험 투사 → Worst","l":["직감이나 관찰은 허락을 구한 뒤 집착 없이 한 번만 공유하고(역량 7.11, PCC 마커 7.5), 고객이 아니라고 하면 즉시 미련 없이 거둬들입니다(영상 38).","세 가지 증거를 들이밀며 코치가 옳음을 입증하려 하거나, 코치 자신의 과거 실패 경험으로 고객의 문제를 재단(영상 25, 48)하면 최악의 오답입니다."]},{"h":"함정 5. 비밀보장·이해상충 회색지대 → 윤리강령 정면 위반","l":["재계약 권한을 쥔 스폰서의 비공식(off the record) 평가 요청(영상 41), 고객의 소액 지분 투자 제안(영상 42), 기존 고객 동의 없이 켜 둔 AI 회의 녹음 어시스턴트(영상 35).",["대응 원칙","예외 없이 투명한 공개, 즉각 중단, 서면 동의 원칙을 선택합니다."],{"chips":[["ge","2.1","윤리 2.1"],["ge","2.3","윤리 2.3"],["ge","2.5","윤리 2.5"],["ge","3.1","윤리 3.1"],["ge","3.2","윤리 3.2"]]}]}]},{"i":"⑥","t":"윤리 딜레마 전략","s":[{"h":"비밀보장과 삼자 계약 (고객 vs 스폰서)","l":[["유일한 예외","법적 의무가 있거나 자해·타해의 명백한 위험이 있을 때뿐입니다."],["스폰서의 보고 요구","비용을 내는 스폰서(HR/회사)가 코칭 세부 내용 보고를 요구해도 고객의 명시적 서면 동의 없이는 공유할 수 없습니다. 코칭 시작 전에 삼자 간 합의(진행 방식과 보고 범위)를 명확히 해 둡니다."],["대응 태도","스폰서의 불안에는 공감하되 원칙은 흔들리지 않고, 고객이 직접 소통하도록 다리를 놓아 줍니다(“부드러운 단호함”)."],{"chips":[["ge","1.1","윤리 1.1"],["ge","2.1","윤리 2.1"],["ge","2.2","윤리 2.2"],["ge","2.3","윤리 2.3"]]}]},{"h":"이해상충과 이중관계","l":["직속 부하직원, 절친한 친구, 가족 코칭, 금전적·직업적 이해가 얽힌 경우 객관성을 유지할 수 있다고 장담하며 진행하는 것은 오답입니다.","즉시 투명하게 공개(Disclose)하고, 필요하면 코칭을 중단하거나 다른 전문가로 연계합니다.",{"chips":[["ge","3.1","윤리 3.1"],["ge","3.2","윤리 3.2"],["ge","3.3","윤리 3.3"],["ge","3.6","윤리 3.6"],["ge","3.7","윤리 3.7"],["ge","3.8","윤리 3.8"]]}]},{"h":"심리치료 연계 기준","l":["고객이 심각한 우울, 공황발작, 일상 기능 상실 등을 겪을 때 코치가 진단하거나 과거 트라우마를 치료하려 해서는 안 됩니다.","관찰한 바를 부드럽게 공유하고 전문 정신건강 전문가에게 연계(Refer)하며, 코칭을 일시 중단하거나 종료하는 것이 윤리적 정답입니다.",{"chips":[["ge","4.2","윤리 4.2"],["ge","4.3","윤리 4.3"]]}]},{"h":"불확실할 때","l":["윤리적 딜레마가 확실하지 않으면 코칭 슈퍼바이저, 멘토 코치, 윤리위원회에 자문을 구하는 선지가 매우 안전하고 성숙한 정답입니다."]},{"h":"윤리 의사결정 5단계","l":[["1. 신호 감지","내 안의 불편함이나 도덕적 긴장감은 어디서 오는가?"],["2. 이해관계자 식별","고객, 스폰서, 조직, 코치 자신 사이에 충돌하는 이익은 무엇인가?"],["3. 윤리강령 대조","어떤 조항(비밀보장, 이해상충, 전문직 경계 등)에 저촉되는가?"],["4. 슈퍼비전·자문","멘토 코치나 슈퍼바이저에게 객관적으로 검증받았는가?"],["5. 투명한 소통·조치","고객과 스폰서에게 경계를 명확히 설명하고 서면으로 재합의했는가?"]]}]}];

  store(PROG_KEY, {});

function executeItemReset(rawQid) {
  const numId = Number(rawQid);
  const strId = String(rawQid);
  clearPickState();
  if (S.type === 'exam' && S.examDone) {
    S.examDone = false;
    // Other exam items retain their scored marker; only the selected item is reset below.
  }
  delete prog[numId];
  delete prog[strId];
  delete ans[numId];
  delete ans[strId];
  store(PROG_KEY, prog);
  S.itemResetModal = null;
  S.step = 'best';
  const targetQ = Q.find(x => x.id === numId);
  $('#main').innerHTML = '';
  render();
  showToast(`${targetQ ? targetQ.n : ''} 문항이 초기화되었습니다.`);
}

function act(a, k) {
  const L = getList();

  const navActions = new Set([

    'next', 'prev', 'gc', 'ge', 'fc', 'fe', 'goq', 'resume', 'ethVer'
  ]);
  if (navActions.has(a)) {
    pushNavHistory();
  }

  if (a === 'goBack') {
    handleBackNavigation();
    return;
  } else if (a === 'askExit') {
    S.exitModal = true;
  } else if (a === 'cancelExit') {
    S.exitModal = false;
  } else if (a === 'confirmExit') {
    closeAppSafely();
    return;
  } else if (a === 'askReset') {
    S.resetModal = true;
  } else if (a === 'cancelReset') {
    S.resetModal = false;
  } else if (a === 'confirmReset') {
    executeGlobalReset();
    return;
  } else if (a === 'askItemReset') {
    S.itemResetModal = Number(k);

    S.itemResetModal = null;
  } else if (a === 'confirmItemReset') {
    executeItemReset(k);
    return;
  } else if (a === 'reopenApp') {
    S.exited = false;
    S.t = 'home';
  } else if (a === 'tab') {
    S.t = k; if (k === 'q' && S.type === 'all' && !S.fc && !S.fe) S.type = 'bw'; S.sh = false; S.open = ''; S.stratOpen = -1; window.scrollTo(0, 0);
  } else if (a === 'stOpen') {
    pushNavHistory(); S.stratOpen = Number(k); window.scrollTo(0, 0);
  } else if (a === 'stSec' || a === 'stSecGo') {
    S.stratSec = Number(k);
  } else if (a === 'stSecClose') {
    S.stratSec = -1;
  } else if (a === 'stNav') {
    S.stratOpen = Number(k); S.stratSec = -1; window.scrollTo(0, 0);
  } else if (a === 'numberOpen') {
    S.numOpen = true; S.numInput = '';
  } else if (a === 'numberClose') {
    S.numOpen = false; S.numInput = '';
  } else if (a === 'jumpNumber') {
    const target = L.findIndex(item => item.id === Number(k));
    if (target >= 0) S.i = target;
    S.numOpen = false; S.numInput = ''; S.step = 'best'; window.scrollTo(0, 0);
  } else if (a === 'jumpNumberInput') {
    const raw = String(S.numInput || '').trim().toUpperCase();
    let target = -1;
    if (S.type === 'exam') {
      const n = Number(raw);
      if (Number.isInteger(n) && n >= 1 && n <= L.length) target = n - 1;
    } else {
      const match = raw.match(/^(BW|BEST\/WORST|MC4|4지선다)?[- ]?(\d+)$/);
      if (match) {
        const requestedType = match[1] ? (match[1] === 'MC4' || match[1] === '4지선다' ? 'mc4' : 'bw') : (S.type === 'mc4' ? 'mc4' : 'bw');
        const n = Number(match[2]);
        const found = L.find(item => item.ty === requestedType && formatQuestionNumber(item) === n);
        if (found) target = L.findIndex(item => item.id === found.id);
      }
    }
    if (target >= 0) { S.i = target; S.numOpen = false; S.numInput = ''; S.step = 'best'; window.scrollTo(0, 0); }
    else { showToast('해당 형식의 번호를 찾을 수 없습니다.'); }
  } else if (a === 'type') {
    S.type = k; S.i = 0; S.step = 'best'; S.examDone = false; S.examSet = [];
  } else if (a === 'startExam') {
    S.t = 'q'; startExam(k || undefined); window.scrollTo(0, 0);
  } else if (a === 'jumpExam') {
    S.i = Number(k); window.scrollTo(0, 0);
  } else if (a === 'submitExam') {
    S.examDone = true;
    L.forEach(item => {
      const o = ans[item.id];
      const bw = item.ty === 'bw';
      o.d = 1;
      o.ok = bw ? (o.b === item.b && o.w === item.w) : (o.p === item.b);
      if (!o.scored) {
        const p = prog[item.id] || { n: 0, c: 0 };
        p.n++; if (o.ok) p.c++; p.last = !!o.ok;
        prog[item.id] = p;
        o.scored = true;
      } else if (prog[item.id]) {
        prog[item.id].last = !!o.ok;
      }
    });
    store(PROG_KEY, prog);
    window.scrollTo(0, 0);
  } else if (a === 'en') {
    S.en = !S.en;
  } else if (a === 'ceTab') {
    S.ceTab = k; S.open = '';
  } else if (a === 'ethVer') {
    S.ethVer = k === '2020' ? '2020' : '2025';
    E = S.ethVer === '2020' ? E20 : E25;
    S.open = ''; 
  } else if (a === 'cl') {
    S.cl = k;
  } else if (a === 'clr') {
    S.fc = ''; S.fe = ''; S.type = 'bw'; S.i = 0;
  } else if (a === 'step') {
    S.step = k;
  } else if (a === 'opt' && q) {
    const locked = S.type === 'exam' ? S.examDone : !!(ans[q.id] || {}).d;
    if (!locked) {
      const o = ans[q.id] || (ans[q.id] = {});
      if (q.ty === 'bw') {
        if (S.step === 'best') {
          o.b = k;
          if (o.w === k) o.w = null;
          S.step = 'worst';
        } else {
          if (o.b === k) return;
          o.w = k;
        }
      } else {
        o.p = k;
      }
    }
  } else if (a === 'check' && q) {
    const o = ans[q.id];
    const bw = q.ty === 'bw';
    o.d = 1;
    o.ok = bw ? (o.b === q.b && o.w === q.w) : (o.p === q.b);
    const p = prog[q.id] || { n: 0, c: 0 };
    p.n++; if (o.ok) p.c++; p.last = !!o.ok;
    prog[q.id] = p;
    store(PROG_KEY, prog);
  } else if (a === 'next') {
    S.i = (S.i + 1) % L.length; S.step = 'best'; window.scrollTo(0, 0);
  } else if (a === 'prev') {
    S.i = (S.i - 1 + L.length) % L.length; S.step = 'best'; window.scrollTo(0, 0);
  } else if (a === 'bm') {
    const numId = Number(k);
    if (bookmarks[numId]) delete bookmarks[numId];
    else bookmarks[numId] = true;
    store(BM_KEY, bookmarks);
  } else if (a === 'sheet') {
    S.sh = true;
    try { window.history.pushState({ pccGuard: true, sheet: true }, '', window.location.href); } catch (e) {}
  } else if (a === 'close') {
    S.sh = false;
  } else if (a === 'gc') {
    S.sh = false; S.t = 'ce'; S.ceTab = 'c';
    S.open = k[0];
    S.go = 's' + k.replace('.', '_');
  } else if (a === 'ge') {
    S.sh = false; S.t = 'ce'; S.ceTab = 'e';
    if (String(k).startsWith('20-')) {
      S.ethVer = '2020'; E = E20; S.open = k;
    } else {
      S.ethVer = '2025'; E = E25;
      S.open = (k.length === 3 && /^\d/.test(k)) ? 'S' + k[0] : 'CV';
    }
    S.go = String(k).startsWith('20-') ? 'eg' + k : 'e' + k;
  } else if (a === 'fc') {
    S.t = 'q'; S.fc = k; S.fe = ''; S.type = 'bw'; S.i = 0; S.step = 'best'; window.scrollTo(0, 0);
  } else if (a === 'fe') {
    S.t = 'q'; S.fe = k; S.fc = ''; S.type = 'bw'; S.i = 0; S.step = 'best'; window.scrollTo(0, 0);
  } else if (a === 'goq' || a === 'resume') {
    S.t = 'q'; S.type = 'all'; S.fc = ''; S.fe = '';
    S.i = Math.max(0, Q.findIndex(x => x.id == k));
    if (a === 'goq') delete ans[Number(k)];
    S.step = 'best';
    window.scrollTo(0, 0);
  }
  render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (t && t.classList.contains('sh') && e.target !== t) return;
  if (t && !t.disabled) {
    e.preventDefault();
    act(t.dataset.a, t.dataset.k);
  }
});


document.addEventListener('input', e => {
  if (e.target && e.target.id === 'numJumpInput') { S.numInput = e.target.value; return; }
  if (e.target && e.target.id === 'glossSearch') {
    const pos = e.target.selectionStart;
    S.gq = e.target.value;
    render();
    const el = $('#glossSearch');
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {} }
  } else if (e.target && e.target.id === 'vidSearch') {
    const pos = e.target.selectionStart;
    S.vq = e.target.value;
    render();
    const el = $('#vidSearch');
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {} }
  }
});

render();
</script>
