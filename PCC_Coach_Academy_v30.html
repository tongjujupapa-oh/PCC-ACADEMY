트너십으로 결정하기 때문입니다.","we":"Worst (A): 고객이 왜 그 주제를 찾는지, 무엇을 얻고 싶은지 한 마디도 탐색하지 않은 채 코치 개인이 선호하는 책을 처방하듯 건네주어 코칭을 일방향 자문(Consulting)으로 만든 오답입니다(D 역시 강사처럼 내용을 강의하는 역할 이탈임).\n중간 오답 B와 D 비교: B는 지식·자원 공유(역량 7.11, 8.05)까지 무조건 금지된 것으로 오해하여 딱딱하게 거절한 '과잉 해석(Overreach)'이며, D는 책 대신 코치가 직접 강의를 해주는 비코칭적 대응입니다.","c":["7.01","7.03","7.07","7.11","8.05"],"m":[],"k":[],"e":[]},{"id":40,"n":"Q40","cat":"bank","ty":"bw","t":"복잡한 가족 갈등 결정을 고민하는 고객의 이야기를 듣던 코치가 자신의...","se":"While listening to a client struggling with a complex family decision, the coach feels a strong urge to offer advice based on personal experience. What are the coach's most appropriate and least appropriate actions?","sk":"복잡한 가족 갈등 결정을 고민하는 고객의 이야기를 듣던 코치가 자신의 경험에 비추어 강력한 조언을 해주고 싶은 충동을 느낍니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Offer your advice immediately so the client can make a wise decision.","Notice the impulse, set it aside, and stay with what the client is exploring; if a perspective seems genuinely useful, offer it transparently and lightly, asking permission and inviting the client to take or leave it.","Ask leading questions designed to guide the client toward the coach's view.","Recommend a relevant self-help book instead of giving advice."],"ok":["고객이 현명한 결정을 내리도록 코치의 조언을 바로 제안한다.","조언하고 싶은 충동을 알아차려 내려놓고 고객의 탐색에 머물며, 진정으로 고객에게 유익할 때만 사전 허락을 구하고 집착 없이 투명하게 관점을 제시한다.","코치가 옳다고 생각하는 선택지로 고객이 스스로 도달하도록 교묘한 유도 질문들을 던진다.","조언 대신 관련 자기계발서를 추천한다."],"b":"B","w":"C","be":"코치의 조언 충동을 스스로 조절하여 고객의 사고 프로세스를 우선시하되(역량 2.06, 5.04), 관점을 공유할 때도 '사전 허락 → 집착 없이 공유(Without attachment) → 고객의 자유로운 반응 초대'라는 역량 7.11 및 PCC 마커 7.5 공식을 완벽히 실천하기 때문입니다.","we":"Worst (C): A처럼 솔직하게 조언을 건네는 것보다, 겉으로는 열린 질문을 하는 척하면서 코치의 결론으로 고객을 조종·유도하는(Leading/Steering) 행위가 PCC 마커 7 위반('코치의 관점으로 고객을 유도함') 중 가장 기만적인 Worst입니다.\n중간 오답 A와 D 비교: A는 직접 조언을 건네는 컨설팅 이탈이며, D는 내면 탐색 대신 외부 도서 추천으로 우회하는 처방적 반응입니다.","c":["2.05","5.04","7.11"],"m":["4.4","7.5"],"k":[],"e":[]},{"id":41,"n":"Q41","cat":"bank","ty":"bw","t":"오랜 기간 코칭을 함께해 온 고객이 감사의 마음을 담아 자신의 딸 결...","se":"A long-term client warmly invites the coach to their daughter's wedding as an expression of gratitude. What are the coach's most appropriate and least appropriate responses?","sk":"오랜 기간 코칭을 함께해 온 고객이 감사의 마음을 담아 자신의 딸 결혼식에 코치를 정중히 초대했습니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Warmly accept the wedding invitation because a deep sense of closeness and trust has developed over time.","Acknowledge the invitation, reflect with the client on how attending would affect the coaching relationship, and decline if accepting would impair the professional relationship—with care and gratitude.","Decline to attend the wedding but send a congratulatory gift of money.","Ask whether other current clients will attend before deciding."],"ok":["그동안 깊은 친밀감과 신뢰를 형성해 왔으므로 따뜻하게 결혼식 초대를 수락한다.","초대에 감사를 표하며 인정하고, 참석이 전문적 코칭 관계와 객관성에 미칠 영향을 고객과 함께 숙고한 뒤, 손상 우려가 있다면 배려와 감사를 담아 정중히 사양한다.","결혼식 참석은 거절하되 축의금만 보낸다.","다른 기존 고객들도 함께 참석하는지 물어보고 결정한다."],"b":"B","w":"A","be":"고객의 따뜻한 호의를 존중하는 언어로 인정하면서도(역량 1.03), 사적 행사 참석이라는 다중 관계(Multiple relationship)가 코칭의 객관성과 전문적 경계에 미칠 영향을 투명하게 성찰하고(역량 3.02, 윤리강령 Standard 3.1, 3.4) 관계의 무결성을 수호하기 때문입니다.","we":"Worst (A): 친밀함을 이유로 사적 가족 행사에 참석하여 전문적 코칭 관계와 사적 친목 관계의 경계를 무너뜨림으로써 향후 객관적 도전과 비밀보장을 위태롭게 하는 위험한 다중 관계 수락(Standard 3.1, 3.4 위반)입니다.\n중간 오답 C와 D 비교: C는 참석은 피했으나 고객과 함께 전문적 경계의 의미를 성찰하는 파트너십 대화 없이 금전적 선물(축의금)로 경계를 모호하게 만들었으며, D는 다른 고객의 신원 노출 위험(비밀보장 위반)까지 동반한 부적절한 질문입니다.","c":["1.01","1.03","1.04","3.02"],"m":[],"k":[],"e":["3.1","3.4"]},{"id":42,"n":"Q42","cat":"bank","ty":"bw","t":"예비 고객이 사전 상담에서 '코칭을 받으면 구체적인 비즈니스 매출이나...","se":"During an introductory meeting, a prospective client asks, “Can you guarantee specific business results, such as increased revenue or a promotion, if I hire you for coaching?” What are the coach's most appropriate and least appropriate responses?","sk":"예비 고객이 사전 상담에서 '코칭을 받으면 구체적인 비즈니스 매출이나 승진 성과를 보증(guarantee)해 주실 수 있나요?'라고 묻습니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Promise the outcomes if the client follows the coach's program.","Explain honestly what coaching can and cannot promise, partner on what success would look like, and how the client and coach will define and measure it together.","Guarantee a full refund of the coaching fee if the client does not achieve results.","Reassure the client by showing revenue-growth results from other clients you coached in the past."],"ok":["코치가 제시하는 프로그램과 과제를 완벽히 따른다는 조건하에 구체적 성과를 약속한다.","코칭이 약속할 수 있는 것과 불가능한 것을 정직하게 설명하고, 성공이 어떤 모습일지 그리고 고객과 코치가 그것을 함께 어떻게 정의하고 측정할지 파트너십으로 설정한다.","성과가 나지 않으면 코칭 비용을 전액 환불해 주겠다고 보증한다.","과거에 코칭했던 다른 고객들의 매출 상승 성과표를 제시하며 안심시킨다."],"b":"B","w":"A","be":"역량 1.01(진실성과 정직성), 2.01(선택과 실행 책임이 고객에게 있음), 3.01(코칭 범위 명확 정의), 3.08(성공 척도 공동 정의) 및 윤리강령 Standard 5.2(제공 서비스 및 코칭 가치에 대한 진실한 진술)에 따라 결과 보장이 불가능함을 정직히 밝히고 성공 척도를 함께 설정하기 때문입니다.","we":"Worst (A): 실행 주체가 고객임에도 코치가 통제할 수 없는 구체적 비즈니스 결과를 약속·보증하는 것은 윤리강령 Standard 5.2(진실하고 정확한 진술 의무)를 정면으로 위반하는 허위·과장 마케팅입니다.\n중간 오답 C와 D 비교: C는 환불 조건으로 성과 보장의 환상을 심어주는 상업적 유인이며, D는 타 고객의 사례와 성과를 마케팅 도구로 들이밀어 비밀보장 및 과장 오해 소지를 낳는 부적절한 대응입니다.","c":["1.01","2.01","3.01","3.08"],"m":[],"k":[],"e":["1.1","5.2"]},{"id":43,"n":"Q43","cat":"bank","ty":"bw","t":"고객이 자리에 없는 직속 부하직원의 문제 행동, 추정되는 동기, 약점...","se":"A client spends the session complaining at length about an absent direct report, analyzing the employee's problematic behavior, presumed motives, and weaknesses. What are the coach's most appropriate and least appropriate actions?","sk":"고객이 자리에 없는 직속 부하직원의 문제 행동, 추정되는 동기, 약점들을 장황하게 불평하며 분석하는 데 세션 시간을 쓰고 있습니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Coach the client by analyzing plausible psychological motives for why the subordinate behaved that way.","Acknowledge the third party's relevance, then partner with the client to refocus on what the client can examine, choose, or do—since the client is the only person in the room.","Advise the client on specific disciplinary actions or conversation instructions to give the subordinate.","Listen throughout the entire session to the client's complaints about the third party until they feel relieved."],"ok":["그 부하직원이 왜 그런 행동을 했는지 그럴듯한 심리적 동기를 함께 분석하며 코칭한다.","부하직원의 관련성을 인정한 뒤, 지금 이 방에 있는 유일한 주체는 고객 자신이므로 고객 스스로 성찰하고 선택하거나 행동할 수 있는 영역으로 초점을 전환하도록 파트너십을 맺는다.","문제 해결을 위해 부하직원에게 내릴 구체적인 징계나 면담 지침을 조언한다.","고객이 속이 풀릴 때까지 제3자에 대한 불평을 세션 내내 끝까지 들어준다."],"b":"B","w":"A","be":"고객이 겪는 상황 맥락을 공감적으로 인정한 뒤(역량 4.05), 통제 불가능한 제3자 분석에서 벗어나 고객 자신의 가치·인식·선택(역량 3.09, 7.03, PCC 마커 5.2)으로 세션 초점을 건설적으로 전환하기 때문입니다.","we":"Worst (A): 세션에 참석하지도 않은 제3자(부하직원)의 심리와 약점을 추측·분석하는 비생산적인 '제3자 독심술'에 코치가 적극 동조함으로써 코칭의 초점 유지(역량 3.09)와 본질을 완전히 상실한 최악의 오답입니다.\n중간 오답 C와 D 비교: C는 인사·관리 조언을 제공하는 컨설팅 이탈이며, D는 초점 관리와 방향 전환 질문(PCC 마커 5.2) 없이 세션을 일방적 하소연으로 방치하는 수동적 직무유기입니다.","c":["3.09","4.05","7.03"],"m":["5.2"],"k":[],"e":[]},{"id":44,"n":"Q44","cat":"bank","ty":"bw","t":"이전 5회기 동안 사내 승진을 목표로 열심히 달려오던 고객이 오늘 세...","se":"After working hard toward an internal promotion over the previous five sessions, a client arrives today and suddenly announces, “I want to quit my job and travel the world for a year.” What are the coach's most appropriate and least appropriate responses?","sk":"이전 5회기 동안 사내 승진을 목표로 열심히 달려오던 고객이 오늘 세션에 도착해 갑자기 '회사를 그만두고 1년 동안 세계여행을 떠나고 싶어요'라고 선언합니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Push back so the client doesn't make a rash decision.","Stay open and curious about the shift, partner with the client on what is alive for them now, and explore the new direction without judgment about the change.","Persuade the client to take the trip only after achieving the previously agreed promotion goal.","First explain the contractual penalty provisions that apply to early termination."],"ok":["고객이 충동적이고 성급한 결정을 내리지 않도록 현실적인 위험을 지적하며 강력하게 만류한다.","급작스러운 심경 변화에 대해 판단 없는 개방성과 호기심을 유지하고, 지금 고객 내면에서 살아 숨 쉬는 것이 무엇인지 파트너십으로 탐색한다.","일단 기존에 합의한 승진 목표를 달성한 뒤에 여행을 가라고 설득한다.","중도 해지 시 적용되는 계약 위약금 규정을 먼저 안내한다."],"b":"B","w":"A","be":"과거 목표에 집착하지 않고 지금 이 순간 고객에게 새로이 떠오르는 욕구와 전환을 비판단적·호기심 어린 태도로 수용하며(역량 2.01, 2.09, 3.10, 5.02, 5.03) 그 이면의 진정한 가치와 의미를 탐색하기 때문입니다.","we":"Worst (A): 코치가 부모나 보호자처럼 고객의 새로운 열망을 '충동적이고 성급한 결정'으로 단정 지어 가로막음으로써 고객의 선택 책임(역량 2.01)과 자율성을 정면으로 부정하는 최악의 지배적 태도입니다.\n중간 오답 C와 D 비교: C는 고객의 의사가 분명히 바뀌었음에도 구 목표를 고수하라고 설득하는 경직된 태도(역량 3.10 위반)이며, D는 깊은 탐색 없이 행정적 위약금부터 꺼내어 심리적 안전감을 해치는 차가운 반응입니다.","c":["2.01","2.09","3.10","5.02","5.03"],"m":[],"k":[],"e":[]},{"id":45,"n":"Q45","cat":"bank","ty":"bw","t":"지난주 코치가 제안했던 저널링(성찰 일기 쓰기) 과제에 대해, 고객이...","se":"The client rejects a journaling assignment the coach suggested last week, saying, “I don't want to journal between sessions. That's not how I learn.” What are the coach's most appropriate and least appropriate responses?","sk":"지난주 코치가 제안했던 저널링(성찰 일기 쓰기) 과제에 대해, 고객이 오늘 '세션 사이에 저널링은 하고 싶지 않아요. 그건 제가 배우는 방식이 아니에요'라고 거절합니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Encourage the client to try journaling for two more weeks before deciding.","Acknowledge what works for the client, let go of the journaling suggestion, and partner with the client on what would actually support their learning between sessions.","Suggest a different writing format recommended by the coach, such as a gratitude journal, instead of journaling.","Interrogate the client about why they dislike journaling and explain its benefits."],"ok":["최종 결정을 내리기 전에 딱 2주만 더 저널링을 시도해 보라고 독려한다.","고객 고유의 학습 방식을 존중·인정하고 코치의 저널링 제안을 미련 없이 내려놓은 뒤, 세션 사이에 실제로 고객의 학습을 지원할 수 있는 새로운 방식을 고객과 파트너십으로 설계한다.","저널링 대신 코치가 추천하는 다른 글쓰기 양식(감사 일기)을 제시한다.","왜 저널링이 싫은지 원인을 추궁하며 장점을 설명한다."],"b":"B","w":"A","be":"자신의 제안을 거절당했을 때 방어하거나 집착하지 않고 즉시 내려놓으며(Without attachment, 역량 7.11, PCC 마커 4.4), 고객 고유의 스타일과 학습 방식을 존중하여(역량 4.02, 7.07) 자율적으로 실행 방식을 설계하게 돕기 때문입니다(역량 8.03, PCC 마커 8.5).","we":"Worst (A): 고객이 자신의 학습 방식이 아니라고 명확히 밝혔음에도 코치의 제안에 집착해 '2주만 더 해보라'고 강요·독려하는 것은 고객 스타일 존중(역량 4.02)과 자율성(역량 8.03)을 침해하는 최악의 경직성입니다.\n중간 오답 C와 D 비교: C는 고객 스스로 자기에게 맞는 방식을 찾도록 묻기도 전에 코치가 또 다른 글쓰기 도구를 처방하는 태도이며, D는 거절 의사를 수용하지 않고 설득하려 드는 방어적 반응입니다.","c":["4.02","7.07","7.11","8.03"],"m":["4.4","8.5"],"k":[],"e":[]},{"id":46,"n":"Q46","cat":"bank","ty":"bw","t":"코칭 고객이 아닌 일반 지인이 코치에게 '우리 공통 친구인 민수 씨가...","se":"An acquaintance who is not a coaching client asks, “I heard our mutual friend Minsu is being coached by you. How is he doing? What kind of person is he?” What are the coach's most appropriate and least appropriate actions?","sk":"코칭 고객이 아닌 일반 지인이 코치에게 '우리 공통 친구인 민수 씨가 코치님께 코칭받고 있다고 들었는데, 요즘 민수 씨 어떻게 지내요? 어떤 사람인 것 같아요?'라고 묻습니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Share general impressions without specifics.","Decline to discuss the client at all, citing professional confidentiality, and redirect the conversation.","Confirm the client is in coaching, but say nothing else.","Ask an acquaintance to pass along a message checking on the client's well-being."],"ok":["구체적인 고민 내용은 빼고 민수 씨에 대한 긍정적인 칭찬만 짧게 해준다.","직업적 비밀보장 원칙을 명시하며 고객 여부에 대한 논의를 일절 거절하고 대화 주제를 전환한다.","민수 씨가 현재 코칭을 받고 있다는 사실만 확인해 주고 다른 말은 하지 않는다.","지인에게 고객의 안부를 전해달라고 부탁한다."],"b":"B","w":"C","be":"비밀보장(역량 1.05, 윤리강령 Standard 2.1)은 세션 내부의 대화 내용뿐 아니라 특정인이 코칭을 받고 있다는 관계의 존재 사실(Existence of the coaching relationship) 자체까지 포함하므로 일체의 확인을 거절하고 화제를 돌리는 것이 유일한 윤리적 정답이기 때문입니다.","we":"Worst (C): '코칭을 받고 있다는 사실만 확인해 주는 것' 역시 고객의 사전 서면 동의 없이 코칭 관계의 존재를 제3자에게 누설하는 명백한 비밀보장 위반(Standard 2.1 정면 위반)입니다(A와 D 역시 관계를 기정사실화하는 비밀 누설임).\n중간 오답 A와 D 비교: A는 코칭 관계 시인에 더해 고객에 대한 주관적 평가까지 누설한 중대한 위반이며, D는 제3자를 통해 고객과의 관계를 간접 노출하는 부적절한 처사입니다.","c":["1.04","1.05"],"m":[],"k":[],"e":["2.1"]},{"id":47,"n":"Q47","cat":"bank","ty":"bw","t":"세션 중반쯤 코치는 몇 분 동안 자신이 고객보다 훨씬 길게 설명하고...","se":"Midway through a session, the coach suddenly realizes that they have been explaining and speaking for much longer than the client. What are the coach's most appropriate and least appropriate actions?","sk":"세션 중반쯤 코치는 몇 분 동안 자신이 고객보다 훨씬 길게 설명하고 발언하고 있었음을 문득 깨달았습니다. 이때 코치가 취해야 할 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Finish the explanation you have already started before asking a question.","Notice what you are doing, immediately self-correct without making excuses, return to listening and questioning, and check what would be most useful to the client now.","Apologize and stop talking entirely for the rest of the session.","Suggest that the client take notes so they do not miss the coach's explanation."],"ok":["이미 시작한 설명이므로 논지를 끝까지 마무리한 뒤 질문을 던진다.","스스로 자각하고 변명 없이 즉각 자기 교정(self-correct)하여 경청과 질문 모드로 복귀하며, 지금 고객에게 가장 유용한 바가 무엇인지 확인한다.","말을 너무 많이 한 것에 대해 장황하게 사과하고, 남은 세션 시간 동안 아예 입을 닫고 침묵한다.","코치의 설명을 놓치지 않도록 메모를 작성하라고 권한다."],"b":"B","w":"C","be":"PCC 마커 7.8('코치는 고객이 대화의 대부분을 말할 수 있도록 한다')과 PCC 마커 7.7('명확하고 간결한 언어를 사용한다')을 회복하기 위해, 자신의 과다 발화를 알아차린 즉시 조용히 자기 교정하여 경청과 고객 중심 탐색으로 복귀하기 때문입니다.","we":"Worst (C): 과도하고 장황한 사과로 대화의 초점을 코치 자신의 실수로 끌어온 데다, 남은 시간 내내 입을 닫아버림으로써 코칭 파트너십과 반응성(역량 5.01)을 완전히 포기하는 극단적 과잉 반응입니다.\n중간 오답 A와 D 비교: A는 비코칭적인 장광설을 인지하고도 멈추지 못하는 자기 조절 실패이고, D는 코치의 일방향 강의를 메모하라고까지 요구하는 트레이너식 오만입니다.","c":["5.01","5.03","7.07"],"m":["7.7","7.8"],"k":[],"e":[]},{"id":48,"n":"Q48","cat":"bank","ty":"bw","t":"고객이 깊은 감동을 받으며 '코치님은 정말 완벽하세요. 언제나 제 마...","se":"A client becomes deeply moved and excessively idealizes the coach, saying, “You're perfect. You're the only person who always understands me 100% accurately.” What are the coach's most appropriate and least appropriate responses?","sk":"고객이 깊은 감동을 받으며 '코치님은 정말 완벽하세요. 언제나 제 마음을 100% 정확히 이해해 주시는 유일한 분이에요'라며 코치를 과도하게 이상화하고 찬사를 보냅니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Accept the compliment pleasantly and move directly to the next agenda item.","Warmly acknowledge the client's words while gently checking what the client is experiencing in the relationship and maintaining healthy boundaries without overidentification or dependency.","Respond in kind: 'You are the client I cherish and like the most; you are my very best client.'","Overly downplay the compliment, saying that the coach has many shortcomings."],"ok":["기분 좋게 칭찬을 수용하고 바로 다음 아젠다로 넘어간다.","고객의 표현을 따뜻하게 인정하되, 이 관계에서 고객이 무엇을 경험하고 있는지 부드럽게 점검하며 어느 쪽도 과잉 동일시(overidentification)나 의존에 빠지지 않도록 건강한 경계를 지킨다.","'고객님이야말로 제가 가장 아끼고 좋아하는 최고의 고객이십니다'라고 화답하며 맞장구를 친다.","코치는 부족한 점이 많다며 과도하게 겸손을 떨며 부인한다."],"b":"B","w":"C","be":"고객의 긍정적 피드백을 존중하면서도(역량 4.05) 코치가 구원자나 완벽한 존재로 이상화되어 수평적 파트너십이 흐려지거나 정서적 의존이 생기지 않도록 자신의 영향력을 인식하고(역량 2.10, 5.03, 윤리강령 Standard 3.4, 3.6) 건강한 경계를 점검하기 때문입니다.","we":"Worst (C): '제가 가장 아끼고 좋아하는 최고의 고객'이라는 표현으로 전문적 코칭 관계의 객관성과 공정성을 무너뜨리고 사적 편애·정서적 유착(Standard 3.4, 3.6 친밀도 경계 위반)을 부추기는 최악의 경계 침범입니다.\n중간 오답 A와 D 비교: A는 관계 역동에서 나타난 이상화 신호를 놓치는 피상적 대응이고, D는 자기비하적 부인으로 대화의 초점을 코치 자신에게 묶어두는 미숙한 반응입니다.","c":["2.10","4.05","5.03"],"m":[],"k":[],"e":["3.4","3.6"]},{"id":49,"n":"Q49","cat":"bank","ty":"bw","t":"코칭 전체 과정이 마무리되는 시점에 고객이 '코칭이 끝나고 나면 우리...","se":"As the overall coaching engagement comes to an end, the client asks, “Could we be friends privately after the coaching ends?” What are the coach's most appropriate and least appropriate responses?","sk":"코칭 전체 과정이 마무리되는 시점에 고객이 '코칭이 끝나고 나면 우리가 사적인 친구로 지낼 수 있을까요?'라고 묻습니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Gladly agree to become friends because the contract has officially ended.","Acknowledge the depth of the relationship, name the professional commitments and considerations involved (including the possibility of returning to coaching later), and decide together with care.","Refuse curtly to maintain professional standards.","Continue coaching indefinitely so the question doesn't arise."],"ok":["계약이 공식 종료되었으니 흔쾌히 친구가 되자고 수락한다.","함께 쌓아온 관계의 깊이를 따뜻하게 인정하되, 향후 다시 코칭 관계로 돌아올 가능성과 비밀보장 등 전문직으로서의 책무와 고려 사항을 투명하게 짚어주고 배려를 담아 함께 상의해 결정한다.","전문적 기준을 지키기 위해 일체 설명 없이 즉시 연락처를 차단하고 거절한다.","그런 질문 자체가 나오지 않도록 코칭 세션을 무기한 계속 연장하자고 제안한다."],"b":"B","w":"D","be":"고객과 코칭 경험을 존중하는 방식으로 관계를 종료하며(역량 3.11), 형성된 신뢰의 깊이를 인정하되 다중 관계 전환이 향후 재코칭 가능성과 전문적 경계에 미치는 함의를 투명하게 설명하여(역량 1.01, 1.03, 윤리강령 Standard 3.1, 3.4) 존중 어린 합의에 이르기 때문입니다.","we":"Worst (D): 경계 문제를 회피하거나 사적 관계를 유지하기 위해 고객에게 불필요한 코칭 연장을 유도하는 행위는 고객의 자립과 자율성을 해치고 이해상충(Standard 3.1)을 일으키는 최악의 비윤리적 처사입니다.\n중간 오답 A와 C 비교: A는 향후 코칭 복귀 불가 등 전문직 경계 고려 없이 성급히 수락한 태도이고, C는 경계 유지는 맞으나 설명과 배려 없이 차갑게 끊어내어 존중하는 종료(역량 3.11)를 훼손했습니다.","c":["1.01","1.03","3.02","3.11"],"m":[],"k":[],"e":["3.1","3.4"]},{"id":50,"n":"Q50","cat":"bank","ty":"bw","t":"1:1 개인 코칭을 진행 중인 고객이 다음 세션에 자신의 배우자를 함...","se":"A client in a one-to-one coaching engagement asks to bring their spouse to the next session. What are the coach's most appropriate and least appropriate actions?","sk":"1:1 개인 코칭을 진행 중인 고객이 다음 세션에 자신의 배우자를 함께 동석시키고 싶다고 요청합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Accept and add the spouse to the next session.","Decline because coaching is one-on-one.","Explore with the client what they hope to get from including the spouse, name how that would change the coaching frame and confidentiality, and decide together—including the option of a one-time joint session with explicit purpose and recontracting.","Immediately refer the client to a couples counselor because the issue concerns marital problems."],"ok":["고객이 원하므로 흔쾌히 수락하고 다음 세션 명단에 배우자를 바로 추가한다.","코칭은 원칙적으로 1:1이므로 무조건 거절하고 개인 세션만 고수한다.","배우자를 동석시킴으로써 얻고자 하는 목적을 먼저 탐색하고, 제3자 포함이 코칭 프레임과 비밀보장 한계에 가져올 변화를 명확히 설명한 뒤, 명확한 목적과 재계약을 전제로 한 옵션을 함께 결정한다.","부부 문제가 있는 것이므로 즉시 부부 상담사에게 이관한다."],"b":"C","w":"A","be":"역량 3.03('비밀 보장, 다른 사람의 포함 등과 같은 코칭관계의 지침 및 특이사항에 대해 합의한다')과 3.12('코칭 합의 재검토'), 그리고 윤리강령 Standard 1.1 및 2.2에 따라 제3자 포함의 목적과 비밀보장·역할 프레임 변화를 사전에 명확히 재합의하기 때문입니다.","we":"Worst (A): 제3자 참여 시 기존 1:1 세션에서 나눈 비밀 정보의 보호 범위와 코칭 계약 대상이 근본적으로 달라짐에도 아무런 프레임 설명이나 재합의 없이 배우자를 무작정 세션에 들이는 최악의 합의·비밀보장 위반입니다.\n중간 오답 B와 D 비교: B는 ICF 코칭이 커플·그룹 코칭도 가능함을 간과한 경직된 거절이며, D는 동석 목적을 탐색하기도 전에 무조건 부부 심리치료로 넘기는 성급한 연계(Overreach)입니다.","c":["1.05","3.02","3.03","3.12"],"m":[],"k":[],"e":["1.1","2.2"]},{"id":51,"n":"Q51","ty":"bw","t":"세션 중반에 '코칭이 도움이 되지 않는 것 같아요'라는 고객의 피드백","se":"Mid-session, a client says, “I don’t think coaching is helping me.” What is the best coach response?","sk":"세션 중반에 고객이 \"코칭이 저에게 도움이 되고 있지 않은 것 같아요\"라고 말한다. 최선의 코치 반응은 무엇인가?","o":["Defend the value of coaching with examples from the engagement.","Thank the client for sharing, ask what would be most helpful given how they are experiencing the work, and partner on adjustments—including the option of ending the engagement without prejudice.","Reassure the client that they are making more progress than they realize.","Suggest a different coaching tool to try next session."],"ok":["코칭 과정의 사례들을 들며 코칭의 가치를 방어적으로 설명한다.","솔직하게 나누어 준 것에 감사하고, 현재 작업을 어떻게 경험하고 있는지를 바탕으로 무엇이 가장 도움이 될지 물으며, 편견 없이 계약을 종료하는 옵션을 포함해 조율하기 위해 파트너십을 맺는다.","고객이 스스로 깨닫는 것보다 더 많은 진전을 이루고 있다고 안심시킨다.","다음 세션에서 시도해 볼 다른 코칭 도구를 제안한다."],"b":"B","w":"A","be":"고객의 솔직한 우려와 인식을 방어 없이 존중·인정하고, 고객의 욕구에 맞추어 코칭 접근법을 유연하게 조정하며, 존중하는 방식으로 관계를 종료할 선택권까지 열어두는 완전한 파트너십이기 때문입니다.","we":"Worst(A)는 고객의 주관적 불만과 경험을 공감하기는커녕 사례를 나열하며 코치 자신과 코칭의 가치를 방어·변명(Defend)해 수평적 파트너십과 안전감을 무너뜨리는 에고 중심 반응입니다. C는 고객의 현재 느낌을 부정하고 코치 기준으로 '발전하고 있다'고 설득하는 태도이며, D는 고객이 왜 도움이 안 된다고 느끼는지 탐색하지 않은 채 성급히 도구 변경만 제안한 불완전한 대응입니다.","c":["3.11","3.12","4.05","7.07"],"m":["4.3","4.4"],"k":["세션 중반","코칭이 저에게 도움이 되고 있지 않은 것 같아요","I don’t think coaching is helping me"],"e":["1.1","1.2","4.3"],"cat":"bank"},{"id":52,"n":"Q52","ty":"bw","t":"5회기 연속 같은 표현으로 제자리걸음을 반복하는 고객","se":"A client describes the same issue in similar language for the fifth session in a row with little new ground covered. What is the best coach action?","sk":"고객이 다섯 번째 세션 연속으로 새로운 진전 없이 비슷한 언어로 동일한 이슈를 묘사하고 있다. 최선의 코치 행동은 무엇인가?","o":["Continue with the same approach; clients sometimes need time.","Offer the observation that the conversation seems to repeat in similar shape, invite the client’s reflection on what that says or what they might want different, and partner on what would make today’s session different.","Tell the client they are stuck and need to try harder.","Switch to a different topic to break the loop."],"ok":["고객에게 시간이 필요할 때가 있으므로 같은 접근 방식을 계속한다.","대화가 비슷한 형태로 반복되는 것 같다는 관찰을 공유하고, 그것이 무엇을 말하는지 또는 무엇을 다르게 원하는지 고객의 성찰을 초대한 뒤, 오늘 세션을 다르게 만들 요소가 무엇일지 파트너십을 맺는다.","고객에게 정체되어 있으니 더 열심히 노력해야 한다고 말한다.","반복의 고리를 끊기 위해 다른 주제로 전환한다."],"b":"B","w":"C","be":"여러 세션에 걸친 반복 패턴을 알아차리고 집착 없이 투명하게 관찰을 공유한 뒤, 고객 스스로 그 패턴의 의미와 오늘 세션의 새로운 방향을 선택하도록 초대하기 때문입니다.","we":"Worst(C)는 고객을 '정체되어 있다(stuck)'고 단정적으로 라벨링하고 '더 노력해야 한다'고 비난·훈계해 존중하는 언어와 안전감을 심각하게 훼손합니다. A는 반복되는 정체 패턴을 묵인하고 방치하는 수동적 태도이며, D는 고객과의 재합의 없이 코치가 임의로 주제를 바꾸어 버리는(PCC 마커 5.3 위배) 주도적 개입입니다.","c":["3.06","3.12","6.06","7.02","7.11"],"m":["5.3","7.5"],"k":["다섯 번째 세션 연속","새로운 진전 없이","비슷한 언어로 동일한 이슈","fifth session in a row","similar language"],"e":["4.3"],"cat":"bank"},{"id":53,"n":"Q53","ty":"bw","t":"코칭 중반에 승진한 고객이 '이제 코칭이 더 필요 없는 것 같아요'라고 할 때","se":"A client gets a major promotion mid-engagement and says, “I don’t really need coaching anymore.” What is the best coach response?","sk":"코칭 과정 도중 큰 승진을 한 고객이 \"이제 코칭이 정말로 더 필요하지 않은 것 같아요\"라고 말한다. 최선의 코치 반응은 무엇인가?","o":["Encourage continued coaching to support the transition.","Celebrate the client’s growth, partner on whether to pause, end, or repurpose the engagement, and honor whatever the client chooses.","Argue that successful people use coaches and they should keep going.","Agree to end immediately without further conversation."],"ok":["전환기를 지원하기 위해 코칭을 계속하도록 격려한다.","고객의 성장을 축하하고, 계약을 일시 중단할지, 종료할지, 또는 새로운 목적으로 재설정할지 파트너십을 맺어 논의하며, 고객이 무엇을 선택하든 존중한다.","성공한 사람들도 코치를 활용하므로 계속해야 한다고 주장한다.","추가 대화 없이 즉시 종료하는 데 동의한다."],"b":"B","w":"C","be":"고객의 성취와 성장을 진심으로 축하하고, 변화된 상황에 맞춰 계약을 재조정하거나 존중하는 방식으로 종료할지 고객의 자율적 선택권을 온전히 보장하기 때문입니다.","we":"Worst(C)는 코치의 상업적 유지를 위해 고객에게 '계속해야 한다'고 논쟁·설득(Argue)하여 자율성을 침해하고 윤리강령의 진실성을 해치는 최악의 반응입니다. A는 코칭 연장을 유도하는 코치 중심적 설득이며, D는 성장을 축하하고 코칭 경험을 존중하며 매듭짓는 종료 파트너십 절차를 생략한 성급한 종결입니다.","c":["2.01","3.11","3.12","8.08"],"m":["8.8","8.9"],"k":["코칭 과정 도중 큰 승진","이제 코칭이 정말로 더 필요하지 않은 것 같아요","major promotion mid-engagement","don’t really need coaching anymore"],"e":["1.1","1.2","4.3"],"cat":"bank"},{"id":54,"n":"Q54","ty":"bw","t":"매번 무리한 실행 계획을 남발하는 고객('다음 주에 책 3권 읽고 5명 만날게요')","se":"A client who frequently overcommits says, “Next week I will read three books and meet with five people about this.” What is the best coach action?","sk":"평소 과도하게 약속을 잡는(overcommits) 경향이 있는 고객이 \"다음 주에 이 주제와 관련해 책 세 권을 읽고 다섯 명을 만나겠습니다\"라고 말한다. 최선의 코치 행동은 무엇인가?","o":["Capture the action plan and confirm the commitments.","Reflect what you are observing—the volume and pattern—and invite the client to consider what would be most meaningful and realistic given prior experience.","Reduce the plan for the client and propose two activities instead.","Praise the client for ambition."],"ok":["실행 계획을 받아 적고 약속을 확인한다.","관찰하고 있는 바—실행량의 규모와 반복되는 패턴—를 반영해 주고, 이전 경험을 고려할 때 무엇이 가장 의미 있고 현실적일지 숙고하도록 고객을 초대한다.","고객을 대신해 계획을 줄여주고 대신 두 가지 활동을 제안한다.","고객의 야심 찬 태도를 칭찬한다."],"b":"B","w":"C","be":"과거부터 반복되어 온 과잉 약속 패턴을 비판단적으로 비추어 주면서, 고객 자신의 과거 경험을 바탕으로 실현 가능하고 의미 있는 실행을 스스로 조율하도록 돕기 때문입니다.","we":"Worst(C)는 고객의 실행 계획을 코치가 임의로 축소·수정하고 대안 활동을 대신 지정해 주어 고객의 자율적 설계권(역량 8.03, PCC 마커 8 위배)을 정면 침해하는 처방적 행동입니다. A는 실패 패턴을 알면서도 성찰 질문 없이 기록만 하는 기계적 대응이고, D는 비현실적 과잉 약속 패턴을 무비판적으로 칭찬해 좌절을 부추기는 안일한 반응입니다.","c":["6.06","7.01","7.11","8.03","8.05"],"m":["7.5","8.5","8.6"],"k":["평소 과도하게 약속을 잡는(overcommits) 경향","책 세 권을 읽고 다섯 명을 만나겠습니다","frequently overcommits"],"e":[],"cat":"bank"},{"id":55,"n":"Q55","ty":"bw","t":"'오늘 세션에서 큰 한 방(Big Win)을 얻고 싶어요'라는 고객의 기대","se":"A client says they want a “big win” from today’s session. What is the best coach response?","sk":"고객이 오늘 세션에서 \"큰 성과(big win)\"를 얻고 싶다고 말한다. 최선의 코치 반응은 무엇인가?","o":["Assure the client they will leave with a big win.","Acknowledge what “big win” means for the client, partner on what would constitute a meaningful outcome by the end of this hour, and stay flexible to what actually emerges.","Set the expectation that breakthroughs cannot be promised in any single session.","Begin with the most pressing item to maximize the chance of a win."],"ok":["큰 성과를 얻고 떠날 것이라고 고객을 안심시킨다.","고객에게 '큰 성과'가 무엇을 의미하는지 인정·탐색하고, 이 한 시간이 끝날 때 의미 있는 결과가 될 기준(성공 척도)에 대해 파트너십을 맺으며, 실제로 떠오르는 것에 유연하게 열려 있는다.","단 한 번의 세션에서 돌파구가 약속될 수 없다는 기대치를 설정한다.","성과 가능성을 극대화하기 위해 가장 시급한 항목부터 시작한다."],"b":"B","w":"A","be":"고객이 사용한 핵심 표현('big win')의 고유한 의미를 탐색하고, 세션 종료 시점의 구체적 성공 척도를 함께 정의하면서도 결과에 집착하지 않는 유연한 프레즌스를 유지하기 때문입니다.","we":"Worst(A)는 코치가 통제할 수 없는 특정 결과('big win')를 보장하겠다고 장담해 코칭의 본질과 윤리강령의 정직성 원칙(과장 금지)을 위배합니다. C는 의욕적으로 온 고객에게 '돌파구는 약속 못 한다'며 찬물을 끼얹는 비지지적 반응이고, D는 무엇이 'big win'인지 묻지도 않고 코치가 임의로 우선순위를 정해 시작하는 비파트너십적 행동입니다.","c":["3.06","3.08","5.03","6.02"],"m":["3.1","3.2","6.2"],"k":["오늘 세션","\"큰 성과(big win)\"","“big win”"],"e":["1.2","4.3","5.2"],"cat":"bank"},{"id":56,"n":"Q56","ty":"mc4","t":"어려운 결정을 앞둔 고객에게 가장 코칭답지 않은(Least coaching-aligned) 반응","se":"Which of these is the least coaching-aligned response to a client describing a tough decision?","sk":"어려운 결정을 묘사하는 고객에게 가장 코칭답지 않은(부합하지 않는) 반응은 어느 것인가?","o":["“What matters most to you here?”","“How will you know you’ve made the right choice?”","“If you ask me, the second option is the obvious one.”","“What are you noticing as you talk about this?”"],"ok":["\"여기서 당신에게 가장 중요한 것은 무엇인가요?\"","\"올바른 선택을 했다는 것을 어떻게 알 수 있을까요?\"","\"제게 물으신다면 두 번째 선택지가 명백해 보이네요.\"","\"이것에 대해 이야기하면서 무엇을 알아차리고 계신가요?\""],"b":"C","w":null,"be":"'If you ask me, ~ is the obvious one'은 고객이 요청하지도 않은 코치의 주관적 정답과 판단을 주입하여 고객의 자율적 의사결정권을 직접적으로 빼앗는 전형적인 컨설팅/조언 발화이기 때문입니다.","we":"나머지 선지 비교: A는 고객의 핵심 가치(Values, 역량 7.03)를 탐색하는 질문이고, B는 고객 고유의 내적 성공 척도(역량 3.08/8.02)를 명료화하는 질문이며, D는 현재 순간의 내면 경험과 알아차림(Here and now, 역량 7.05)을 초대하는 PCC/MCC 수준의 발문입니다.","c":["1.06","2.01","7.03","7.05"],"m":["7.1","7.2"],"k":["어려운 결정","가장 코칭답지 않은(부합하지 않는) 반응","least coaching-aligned","tough decision"],"e":["4.3"],"cat":"bank"},{"id":57,"n":"Q57","ty":"mc4","t":"현행 ICF 윤리강령의 4대 핵심 영역(Sections) 구성","se":"Which set best reflects ICF’s four sections of the Code of Ethics (2020)?","sk":"ICF 윤리강령의 4가지 윤리 기준 영역(Sections)을 가장 정확하게 반영한 조합은 무엇인가?","o":["Trust, Presence, Listening, Awareness","Coaching, Mentoring, Consulting, Therapy","Confidentiality, Boundaries, Competence, Education","Responsibility to Clients, Responsibility to Practice and Performance, Responsibility to Professionalism, Responsibility to Society"],"ok":["신뢰, 프레즌스, 경청, 알아차림","코칭, 멘토링, 컨설팅, 심리치료","비밀보장, 경계, 역량, 교육","고객에 대한 책임, 실천 및 수행에 대한 책임, 전문직업의식에 대한 책임, 사회에 대한 책임"],"b":"D","w":null,"be":"2020 ICF 윤리강령의 Ethical Standards는 네 가지 책임 영역으로 구성되었습니다: 고객에 대한 책임(Section I), 실천과 수행에 대한 책임(Section II), 전문직업의식에 대한 책임(Section III), 사회에 대한 책임(Section IV). 여기서 말하는 네 가지는 윤리 기준(Ethical Standards)의 분류이며, 2020 윤리강령 전체가 네 부분이라는 뜻은 아닙니다.","we":"Worst(B)는 전문직 간 역할 구분에 관한 내용으로 2020 윤리강령의 네 가지 책임 영역과 무관합니다. C는 윤리강령 안의 개별 주제 키워드, A는 ICF 핵심역량 명칭을 혼합한 선택지입니다. 2025 윤리강령에서는 윤리 기준이 다섯 개 주제로 재구성되었으므로 버전을 구분해 학습해야 합니다.","c":["1.04"],"m":[],"k":["ICF 윤리강령","4가지 윤리 기준 영역(Sections)","Code of Ethics"],"e":["20-I","20-II","20-III","20-IV"],"cat":"bank"},{"id":58,"n":"Q58","ty":"mc4","t":"영역별(Domain)로 조직된 8대 ICF 핵심역량 체계","se":"Which best describes the eight ICF Core Competencies organized by domain?","sk":"영역(Domain)별로 구성된 8가지 ICF 핵심역량을 가장 정확히 설명한 것은 무엇인가?","o":["Set Goal, Use Tool, Hold Accountable, Celebrate","Foundation (Ethical Practice, Coaching Mindset), Co-Creating the Relationship (Agreements, Trust and Safety), Communicating Effectively (Presence, Listens Actively, Evokes Awareness), Cultivating Learning and Growth (Facilitates Client Growth)","Listening, Asking, Telling, Closing","Strategy, Planning, Execution, Reflection"],"ok":["목표 설정, 도구 사용, 책무 부여, 축하","기초 세우기(윤리적 실천, 코칭 마인드셋), 관계의 공동구축(합의, 신뢰와 안정감), 효과적으로 의사소통하기(프레즌스, 적극적 경청, 알아차림 불러일으키기), 학습과 성장 북돋우기(고객의 성장 촉진)","듣기, 묻기, 말하기, 닫기","전략, 계획, 실행, 성찰"],"b":"B","w":null,"be":"2025 ICF 핵심역량 모델의 4대 영역(C. 기초세우기 → B. 관계의 공동구축 → D. 효과적으로 의사소통하기 → A. 학습과 성장 북돋우기)과 그 하위의 8대 핵심역량 배치를 정확히 일치시켰기 때문입니다.","we":"Worst(C)는 코칭에서 지양하는 'Telling(말하기/지시하기)'이 포함된 임의의 나열입니다. D는 일반 경영 프로젝트 관리 단계이며, A는 단편적인 코칭 스킬 요소들을 섞어 놓은 것입니다.","c":["1.04","3.01"],"m":[],"k":["영역(Domain)별로 구성","8가지 ICF 핵심역량","eight ICF Core Competencies"],"e":["1.1"],"cat":"bank"},{"id":59,"n":"Q59","ty":"bw","t":"'평소에는 이런 이야기를 잘 하지 않아요'라며 조심스럽게 속마음을 연 고객","se":"A client says, “I don’t usually share things like this.” What is the best coach response?","sk":"고객이 \"저는 평소에는 이런 이야기를 잘 나누지 않아요\"라고 말한다. 최선의 코치 반응은 무엇인가?","o":["Move on and treat it as a normal contribution.","Acknowledge the trust the client is showing, hold space for whatever comes next, and let the client choose pace and depth.","Encourage the client to share more since vulnerability is the path to growth.","Tell the client confidentiality applies so they can speak freely."],"ok":["평범한 발언인 것처럼 취급하고 넘어간다.","고객이 보여준 신뢰를 인정하고, 다음에 무엇이 오든 공간을 내어주며, 고객 스스로 속도와 깊이를 선택하게 한다.","취약성을 드러내는 것이 성장의 길이므로 더 많이 나누도록 격려한다.","자유롭게 말할 수 있도록 비밀보장이 적용된다고 알려준다."],"b":"B","w":"A","be":"고객의 용기와 신뢰 표현을 따뜻하게 인정하고 그 여운을 소화할 공간을 허용하며, 대화의 속도와 탐색 깊이에 대한 선택권을 철저히 고객에게 맡기기 때문입니다.","we":"Worst(A)는 고객이 용기 내어 보여준 취약성과 신뢰의 순간을 묵살(dismiss)하고 평범한 일처럼 지나쳐 신뢰 형성의 결정적 기회를 놓치는 태도입니다. C는 '성장의 길이니 더 말하라'며 심리적 속도를 무시하고 노출을 압박하는 유도이며, D는 정서적 인정과 공간 제공 대신 딱딱한 계약 규정(비밀보장)을 읊는 공감 부족 반응입니다.","c":["4.03","4.04","5.03","5.07"],"m":["4.1","4.3","5.3"],"k":["평소에는 이런 이야기를 잘 나누지 않아요","I don’t usually share things like this"],"e":["2.1"],"cat":"bank"},{"id":60,"n":"Q60","ty":"bw","t":"신체 감각을 언급하는 고객('그 생각을 하면 속이 꽉 매듭지어진 것처럼 뭉쳐요')","se":"A client describes a body sensation: “I get a knot in my stomach when I think about it.” What is the best coach action?","sk":"고객이 신체 감각을 묘사한다: \"그 생각을 하면 배 속에 매듭이 지어진 것처럼 꽉 뭉쳐요.\" 최선의 코치 행동은 무엇인가?","o":["Move past the body language and stay with the verbal content.","Acknowledge the somatic data, invite the client to stay with the sensation if they wish, and explore what it might be expressing.","Suggest the client see a doctor about the stomach pain.","Reframe the knot as “just nerves.”"],"ok":["신체 반응은 지나치고 언어적 내용에만 머문다.","신체적 감각 데이터(somatic data)를 인정하고, 고객이 원한다면 그 감각에 머물러 보도록 초대한 뒤, 그것이 무엇을 표현하고 있을지 탐색한다.","복통에 대해 의사를 만나보라고 제안한다.","그 뭉침을 \"단순한 긴장\"이라고 재구성(reframe)해 준다."],"b":"B","w":"A","be":"신체 감각(Somatic cue) 역시 고객의 전인적 소통의 핵심 데이터로 인정·탐색하되, 강요하지 않고 고객 스스로 그 감각의 메시지를 탐색하도록 초대하기 때문입니다.","we":"Worst(A)는 고객이 직접 보고한 중요한 신체·정서적 신호를 의도적으로 무시(missing/dismissing)하고 머리(인지적 언어)로만 대화를 끌고 가는 비전인적 태도입니다. C는 정서적 은유/신체 반응을 의학적 질병으로 오독한 과잉 대응이고, D는 고객이 스스로 의미를 발견하기도 전에 코치가 '단순 긴장'이라고 성급히 축소·해석(minimizing/interpreting)하는 태도입니다.","c":["5.01","6.04","7.05"],"m":["5.1","6.4"],"k":["신체 감각","배 속에 매듭이 지어진 것처럼 꽉 뭉쳐요","body sensation","knot in my stomach"],"e":[],"cat":"bank"},{"id":61,"n":"Q61","ty":"bw","t":"자기 제한적 내면 서사를 깨달은 고객('나는 충분하지 않다는 이야기를 스스로에게 해왔어요')","se":"A client says, “I realize I have been telling myself a story that I am not enough.” What is the best coach response?","sk":"고객이 \"제가 스스로에게 '나는 충분하지 않다'는 이야기를 계속 해왔다는 걸 깨달았어요\"라고 말한다. 최선의 코치 반응은 무엇인가?","o":["Reassure the client that they are enough.","Acknowledge the awareness, invite the client to explore where it lives, what it costs them, and what they want to be true now.","Suggest affirmations the client can repeat.","Move on quickly so the client doesn’t dwell."],"ok":["고객은 충분히 괜찮은 사람이라고 안심시킨다.","그 알아차림을 인정하고, 그 이야기가 어디에 자리 잡고 있는지, 고객에게 어떤 대가를 치르게 했는지, 그리고 지금 무엇이 사실이기를 원하는지 탐색하도록 초대한다.","고객이 반복할 수 있는 긍정 확언(affirmations) 문구들을 제안한다.","고객이 그 생각에 빠지지 않도록 빠르게 다음으로 넘어간다."],"b":"B","w":"D","be":"고객이 도달한 깊은 자기 인식을 인정하고, 그 제한적 신념이 삶에 미친 영향을 직면하게 한 뒤 새로운 정체성과 원하는 진실을 스스로 구축하도록 이끄는 MCC급 심화 질문이기 때문입니다.","we":"Worst(D)는 고객이 막 발견한 핵심적인 통찰(Breakthrough)을 불편하다는 이유로 묵살하고 서둘러 덮어버려 알아차림과 성장을 가로막는 최악의 행동입니다. A는 코치의 일방적 위로로 고객 스스로 내면의 힘을 찾는 과정을 생략해 버리며, C는 깊은 신념 탐색 없이 피상적인 행동 기법(확언 반복)을 처방하는 태도입니다.","c":["4.03","7.03","7.04","7.08"],"m":["4.1","7.1","7.2"],"k":["'나는 충분하지 않다'","이야기를 계속 해왔다는 걸 깨달았어요","telling myself a story","I am not enough"],"e":[],"cat":"bank"},{"id":62,"n":"Q62","ty":"bw","t":"세션 중반에 스마트폰을 세 번째 확인하는 고객","se":"Mid-session, a client looks at their phone for the third time. What is the best coach response?","sk":"세션 중반에 고객이 스마트폰을 세 번째 쳐다본다. 최선의 코치 반응은 무엇인가?","o":["Ignore it and continue.","Notice the pattern out loud without judgment, and check in with the client about what is happening; partner on what they need from this hour.","Tell the client to put the phone away.","End the session early."],"ok":["무시하고 계속 진행한다.","판단 없이 그 반복 행동을 소리 내어 관찰 공유하고, 무슨 일이 일어나고 있는지 고객에게 확인한 뒤, 이 한 시간에서 무엇이 필요한지 파트너십을 맺는다.","고객에게 휴대폰을 치우라고 말한다.","세션을 일찍 종료한다."],"b":"B","w":"C","be":"현재 순간에 반복되는 행동 단서를 비판단적·투명하게 비추어 주고, 지금 고객에게 일어난 상황과 진정한 필요를 확인하여 세션 초점을 재조율하기 때문입니다.","we":"Worst(C)는 성인 파트너인 고객에게 교사나 상사처럼 '휴대폰을 치우라'고 지시하여 수평적 파트너십과 존중을 파괴하는 최악의 대응입니다. A는 명백한 집중력 저하·이탈 신호를 묵살(ignoring)하는 태도이고, D는 사정을 묻지도 않고 세션을 끊어버리는 극단적 과잉 반응입니다.","c":["3.09","5.03","6.04","7.11"],"m":["6.4","7.5"],"k":["세션 중반","스마트폰을 세 번째 쳐다본다","looks at their phone for the third time"],"e":["1.2","4.3"],"cat":"bank"},{"id":63,"n":"Q63","ty":"bw","t":"작은 성취를 축하하고 싶어 하는 고객","se":"A client wants to celebrate a small achievement. What is the best coach response?","sk":"고객이 작은 성취를 축하하고 싶어 한다. 최선의 코치 반응은 무엇인가?","o":["Quickly acknowledge and move to the next topic.","Slow down with the client, partner with them in marking the achievement, and explore what it means and what it makes possible.","Tell the client small wins do not warrant much time.","Offer congratulations and immediately set the next goal."],"ok":["빠르게 인정하고 다음 주제로 넘어간다.","고객과 함께 속도를 늦추고, 그 성취를 기념하는 데 파트너십을 맺으며, 그것이 어떤 의미가 있고 무엇을 가능하게 만드는지 탐색한다.","작은 성과에는 많은 시간을 쓸 가치가 없다고 말한다.","축하를 건네고 즉시 다음 목표를 설정한다."],"b":"B","w":"C","be":"고객의 진전과 성공을 진심으로 인정하고 축하하며, 멈춤의 시간을 허용해 그 성취가 고객의 정체성과 다음 가능성에 미치는 의미를 통합하도록 돕기 때문입니다.","we":"Worst(C)는 고객이 소중히 여기는 성취를 '시간 쓸 가치가 없다'고 폄하·묵살해 존중과 공감, 성장 촉진 역량을 정면 위반하는 최악의 발언입니다. A와 D 모두 형식적인 인정만 하고 성급히 다음 과제/목표로 넘어감으로써 성취의 내면화와 자기효능감 확장(PCC 마커 8.8) 기회를 놓치는 '과업 중심(What)' 조급함입니다.","c":["4.03","5.07","7.06","8.01","8.08"],"m":["8.8"],"k":["작은 성취","축하하고 싶어 한다","celebrate a small achievement"],"e":[],"cat":"bank"},{"id":64,"n":"Q64","ty":"bw","t":"'다시 시작하기엔 나이가 너무 많은 것 같아요'라는 고객","se":"A client says, “I feel like I am too old to start over.” What is the best coach response?","sk":"고객이 \"다시 시작하기엔 제가 나이가 너무 많은 것 같아요\"라고 말한다. 최선의 코치 반응은 무엇인가?","o":["Reassure the client that “50 is the new 30.”","Reflect what the client said, acknowledge the feeling, and invite them to explore what “too old” means for them, where it comes from, and what they want to be true.","Provide examples of people who started over later in life.","Suggest the client read a book about second careers."],"ok":["\"50세는 새로운 30세\"라며 고객을 안심시킨다.","고객의 말을 반영하고 그 감정을 인정한 뒤, 그들에게 '너무 늙었다'는 것이 무엇을 의미하는지, 어디에서 비롯된 생각인지, 그리고 무엇이 사실이기를 원하는지 탐색하도록 초대한다.","인생 후반에 다시 시작한 사람들의 사례를 제공한다.","제2의 커리어에 관한 책을 읽어보라고 제안한다."],"b":"B","w":"A","be":"고객의 감정과 말을 먼저 공감·인정한 뒤, 고객이 사용한 'too old'라는 단어의 고유한 의미와 그 이면의 신념·근원을 탐색하여 스스로 관점을 확장하도록 돕기 때문입니다.","we":"Worst(A)는 '50은 새로운 30'이라는 상투적 유행어로 고객의 진지한 두려움과 감정을 가볍게 덮어버리는(minimizing) 최악의 반응입니다. C(타인 사례 제시)와 D(독서 제안) 모두 고객 자신의 내면 신념과 두려움을 먼저 탐색하지 않은 채 외부 정보로 설득·처방하려는 접근입니다.","c":["4.05","6.02","7.03","7.08"],"m":["6.2","7.1","7.2"],"k":["다시 시작하기엔","나이가 너무 많은 것 같아요","too old to start over"],"e":[],"cat":"bank"},{"id":65,"n":"Q65","ty":"mc4","t":"역량 8.08(구 8.5) 기준에서 가장 고객 중심적인 인정(Acknowledgement) 예시","se":"Which is the best example of a client-centered acknowledgement under Competency 8.5 (2025: 8.08)?","sk":"역량 8.08(고객의 진전과 성공 인정) 하에서 고객 중심적 인정(acknowledgement)의 가장 좋은 예시는 어느 것인가?","o":["“I am proud of you.”","“What you did took courage, given everything you described—what does it mean to you that you did it?”","“Most clients struggle with this—great work.”","“You should celebrate.”"],"ok":["\"당신이 자랑스럽습니다.\"","\"말씀하신 모든 상황을 고려할 때, 당신이 해낸 일에는 용기가 필요했습니다—그 일을 해낸 것이 당신 자신에게는 어떤 의미인가요?\"","\"대부분의 고객들이 이 부분에서 힘들어하는데, 정말 잘하셨어요.\"","\"축하하셔야 합니다.\""],"b":"B","w":null,"be":"코치의 주관적 평가나 상하 관계적 칭찬이 아니라, 고객이 기울인 노력과 성품('용기')을 구체적 맥락 안에서 객관적으로 인정하고 그 성취의 주체적 의미를 고객에게 돌려주기 때문입니다.","we":"Worst(A)는 'I am proud of you(내가 당신을 자랑스러워한다)'라는 표현으로 코치가 평가자·부모·상사의 위치에 서서 고객을 판단하는 수직적 금기 문구입니다. C는 타 고객들과 비교하며 평가하는 표현이고, D는 '~해야 한다(should)'며 축하마저 지시하는 투박한 반응입니다.","c":["4.03","8.01","8.08"],"m":["4.1","8.8"],"k":["역량 8.08","고객 중심적 인정(acknowledgement)","client-centered acknowledgement"],"e":[],"cat":"bank"},{"id":66,"n":"Q66","ty":"bw","t":"의사결정 앞에서 '완전히 마비된(paralyzed) 느낌이에요'라는 고객","se":"A client describes feeling “paralyzed” by a decision. What is the best coach response?","sk":"고객이 의사결정 앞에서 \"마비된(paralyzed)\" 느낌을 묘사한다. 최선의 코치 반응은 무엇인가?","o":["Pick the path forward for the client to break the paralysis.","Acknowledge what they are experiencing, slow the conversation, and invite the client to explore what “paralyzed” is like, what they sense underneath, and what would help them move.","Reframe paralysis as a sign that the client cares deeply.","Set a deadline by which the client must decide."],"ok":["마비를 깨뜨리기 위해 고객을 대신해 앞으로 나아갈 길을 골라준다.","고객이 경험하고 있는 것을 인정하고, 대화의 속도를 늦춘 뒤, '마비됨'이 어떤 느낌인지, 그 아래 무엇이 감지되는지, 그리고 움직이는 데 무엇이 도움이 될지 탐색하도록 초대한다.","마비를 고객이 깊이 신경 쓰고 있다는 신호로 재구성(reframe)해 준다.","고객이 반드시 결정해야 하는 마감 기한을 설정해 준다."],"b":"B","w":"A","be":"고객의 감정을 인정하고 대화의 속도를 늦추어 현존하며, 고객이 사용한 은유적 단어('paralyzed')의 내면과 이면의 감정·신념을 깊이 탐색한 뒤 스스로 움직일 힘을 찾도록 초대하기 때문입니다.","we":"Worst(A)는 고객 대신 결정의 길을 골라주어 자율성과 선택 책임을 완전히 박탈하는 최악의 비코칭 개입입니다. C는 고객의 탐색 없이 코치가 임의로 긍정적 해석을 덮어씌우는 성급한 리프레이밍이고, D는 코치가 일방적으로 마감 시한을 부과하는 통제적 행동입니다.","c":["4.05","5.01","6.02","6.03","7.05"],"m":["6.2","6.3","7.1"],"k":["의사결정 앞에서","\"마비된(paralyzed)\" 느낌","feeling “paralyzed”"],"e":[],"cat":"bank"},{"id":67,"n":"Q67","ty":"mc4","t":"코칭(Coaching)과 컨설팅(Consulting)의 가장 정확한 구분","se":"Which best distinguishes coaching from consulting?","sk":"코칭과 컨설팅을 가장 잘 구분 짓는 설명은 무엇인가?","o":["Consulting includes deliverables; coaching does not.","Consulting is short-term; coaching is long-term.","Consulting provides expert solutions to a defined problem; coaching partners with the client to develop their own thinking, choices, and capacity.","Consulting is for organizations; coaching is for individuals."],"ok":["컨설팅에는 산출물이 포함되고, 코칭에는 포함되지 않는다.","컨설팅은 단기적이고, 코칭은 장기적이다.","컨설팅은 정의된 문제에 대해 전문가의 해결책을 제공하는 반면, 코칭은 고객이 스스로의 사고, 선택, 역량을 개발하도록 파트너십을 맺는다.","컨설팅은 조직을 위한 것이고, 코칭은 개인을 위한 것이다."],"b":"C","w":null,"be":"컨설팅의 핵심 기능('외부 전문가의 진단과 솔루션 제공')과 코칭의 핵심 기능('고객 스스로 사고하고 선택하며 역량을 키우도록 돕는 수평적 파트너십')의 본질적 차이를 가장 명확히 대조했기 때문입니다.","we":"Worst(D)는 코칭 역시 개인뿐 아니라 팀·조직 전체를 대상으로 활발히 수행되므로 사실관계를 정반대로 왜곡한 최악의 선지입니다. B(장·단기)와 A(가시적 산출물 유무)는 계약 형태에 따라 달라질 수 있는 부수적 요소일 뿐 두 전문 영역을 구분하는 핵심 원리가 아닙니다.","c":["1.06","3.01"],"m":[],"k":["코칭과 컨설팅","가장 잘 구분 짓는","distinguishes coaching from consulting"],"e":["1.1","3.7"],"cat":"bank"},{"id":68,"n":"Q68","ty":"bw","t":"동료에게 피해를 줄 수 있는 비윤리적 목표를 설정하려는 고객","se":"A client wants to set a goal that the coach finds ethically uncomfortable (e.g., a strategy that may harm a colleague). What is the best coach action?","sk":"고객이 코치가 윤리적으로 불편함을 느끼는 목표(예: 동료에게 해를 끼칠 수 있는 전략)를 설정하고자 한다. 최선의 코치 행동은 무엇인가?","o":["Refuse and end the engagement.","Be transparent with the client about the coach’s concern, invite the client’s reflection on the impact and alignment with their values, and partner on the goal—including the option for the coach to step back from this topic.","Coach toward the goal as defined; the client decides their goals.","Threaten to report the client to HR."],"ok":["거절하고 코칭 계약을 종료한다.","코치의 우려에 대해 고객에게 투명하게 밝히고, 그 영향과 고객 자신의 가치관과의 일치 여부에 대한 성찰을 초대한 뒤, 코치가 이 주제에서 물러나는 옵션을 포함해 목표에 대해 파트너십을 맺는다.","정의된 목표를 향해 코칭한다; 목표는 고객이 결정하는 것이므로.","고객을 HR에 신고하겠다고 위협한다."],"b":"B","w":"D","be":"코치의 진실성과 윤리적 경계를 투명하게 공유하면서도, 고객을 비난하지 않고 그 행동이 미칠 영향과 고객 본인의 가치관을 성찰하도록 초대하며 코치가 수용할 수 있는 관계의 선을 명확히 합의하기 때문입니다.","we":"Worst(D)는 고객을 'HR에 신고하겠다'고 위협하여 비밀보장 의무와 존중하는 언어, 그리고 심리적 안전감을 완전히 파괴하는 최악의 비윤리적 행위입니다. A는 탐색과 투명한 대화 없이 곧바로 계약을 파기하는 극단적 대응이며, C는 '고객 주도'라는 명분 아래 타인에게 위해를 가하는 비윤리적 목표까지 무비판적으로 조력하는 윤리 방기입니다.","c":["1.01","1.04","3.02","4.06","7.03"],"m":["7.1"],"k":["윤리적으로 불편함을 느끼는 목표","동료에게 해를 끼칠 수 있는 전략","ethically uncomfortable","harm a colleague"],"e":["1.1","1.2","3.4","5.3"],"cat":"bank"},{"id":69,"n":"Q69","ty":"bw","t":"'저는 원래 리더 타입이 아니에요'라는 강한 자기 제한적 신념을 가진 고객","se":"A client describes a strong belief they hold about themselves: “I am just not a leader.” What is the best coach response?","sk":"고객이 자신에 대해 가지고 있는 강한 신념을 묘사한다: \"저는 그냥 리더가 아니에요.\" 최선의 코치 반응은 무엇인가?","o":["Disagree and offer evidence to the contrary.","Reflect the belief, invite the client to explore where it came from and what they make of it now, and stay with the inquiry rather than the rebuttal.","Run a strengths assessment and reinterpret the data for the client.","Tell the client that with coaching they can become a leader."],"ok":["동의하지 않으며 반대되는 증거들을 제시한다.","그 신념을 반영해 주고, 그것이 어디서 왔는지 그리고 지금 그것을 어떻게 해석하는지 탐색하도록 초대한 뒤, 반박(rebuttal)이 아니라 탐구(inquiry)에 머문다.","강점 진단을 실시하고 고객을 위해 데이터를 재해석해 준다.","코칭을 받으면 리더가 될 수 있다고 말해준다."],"b":"B","w":"A","be":"고객의 신념을 논쟁적으로 반박하거나 설득하려 들지 않고 그대로 비추어 준 뒤, 그 신념의 기원과 현재의 의미를 호기심 어린 탐구로 확장하기 때문입니다.","we":"Worst(A)는 고객의 주관적 인식에 대해 코치가 '아니다'라고 맞서 논쟁하며 반박 증거를 들이대어 저항과 방어만 키우는 최악의 비코칭 태도입니다. C는 '고객을 위해 데이터를 재해석해 준다'는 점에서 주체성을 빼앗는 컨설팅 방식이며, D는 코칭의 효과를 과장해 약속하며 피상적으로 안심시키는(reassure) 반응입니다.","c":["4.05","5.02","6.02","7.03","7.08"],"m":["4.3","7.1","7.2"],"k":["강한 신념","\"저는 그냥 리더가 아니에요.\"","strong belief","I am just not a leader"],"e":[],"cat":"bank"},{"id":70,"n":"Q70","ty":"bw","t":"조직 스폰서가 피코치의 승진 심사를 위한 평가 세션을 추가 요청할 때","se":"An organizational sponsor asks the coach to add an extra session to assess whether the coachee should be promoted. What is the best coach response?","sk":"조직 스폰서가 코치에게 피코치의 승진 여부를 평가(assess)하기 위한 추가 세션을 넣어달라고 요청한다. 최선의 코치 반응은 무엇인가?","o":["Add the session as requested since the sponsor is paying.","Decline to evaluate the coachee for promotion, explain how that role is incompatible with coaching’s confidential, non-evaluative nature, and offer alternatives that respect the engagement’s integrity.","Run the assessment, but do not tell the coachee.","Conduct the session jointly with the sponsor and coachee without prior agreement."],"ok":["스폰서가 비용을 지불하므로 요청받은 대로 세션을 추가한다.","승진을 위해 피코치를 평가하는 것을 거절하고, 그러한 역할이 비밀보장적이고 비평가적인 코칭의 본질과 어떻게 양립할 수 없는지 설명한 뒤, 코칭 계약의 진실성을 존중하는 대안들을 제시한다.","평가를 진행하되 피코치에게는 말하지 않는다.","사전 합의 없이 스폰서 및 피코치와 공동으로 세션을 진행한다."],"b":"B","w":"C","be":"코치는 인사 평가자(Assessor)가 될 수 없으며, 평가 역할과 코칭의 비밀보장·비판단적 안전 환경은 근본적으로 양립 불가능함을 명확히 설명하고 코칭의 무결성을 지키는 대안을 제시하기 때문입니다.","we":"Worst(C)는 피코치 몰래 비밀리에 승진 평가를 수행하여 비밀보장 위반, 정직성 훼손, 신뢰 파괴가 결합된 최악의 윤리강령 위반입니다. A는 비용 지불자의 압력에 굴복해 코칭의 비평가적 원칙을 파기하는 것이며, D는 사전 설명과 동의 없이 3자 평가 자리를 강행하는 합의 위반입니다.","c":["1.01","1.04","1.05","1.06","3.01","3.02"],"m":[],"k":["조직 스폰서","승진 여부를 평가(assess)","organizational sponsor","assess whether the coachee should be promoted"],"e":["1.1","2.1","2.2","3.2","3.7"],"cat":"bank"},{"id":71,"n":"Q71","ty":"bw","t":"심각한 이야기를 하면서 신경질적으로 웃는(nervous laugh) 고객","se":"A client laughs nervously while describing something serious. What is the best coach response?","sk":"고객이 심각한 내용을 묘사하면서 긴장된 웃음(nervous laugh)을 짓는다. 최선의 코치 반응은 무엇인가?","o":["Laugh along to keep the rapport.","Notice the contrast between content and tone, reflect it back gently, and invite the client to explore what the laugh might be holding.","Tell the client this is not a laughing matter.","Move on and address the topic later."],"ok":["라포를 유지하기 위해 함께 웃는다.","말의 내용과 어조(표정) 사이의 대조를 알아차리고 부드럽게 반영해 준 뒤, 그 웃음이 무엇을 담고 있을지 탐색하도록 고객을 초대한다.","이것은 웃을 일이 아니라고 고객에게 말한다.","넘어가고 나중에 그 주제를 다룬다."],"b":"B","w":"C","be":"말의 내용(Text)과 비언어적 신호(웃음/어조)의 불일치를 통합적으로 포착하되, 비판단적으로 부드럽게 거울처럼 비추어 주고 그 이면의 감정과 의미를 탐색하도록 초대하기 때문입니다.","we":"Worst(C)는 '이것은 웃을 일이 아니다'라고 고객의 방어적 정서 표현을 질책·판단하여 심리적 안전감을 단숨에 얼어붙게 만드는 최악의 반응입니다. A는 불일치 신호를 놓치고 겉치레 라포에 동조하는 피상적 반응이며, D는 지금 여기의 생생한 단서를 뒤로 미루는(postpone) 소극적 대응입니다.","c":["6.03","6.04","6.05"],"m":["6.4","7.5"],"k":["심각한 내용을 묘사","긴장된 웃음(nervous laugh)","laughs nervously","something serious"],"e":[],"cat":"bank"},{"id":72,"n":"Q72","ty":"bw","t":"지난 3회기 동안 질문 형식을 빌려 똑같은 조언을 건네고 있었음을 깨달은 코치","se":"A coach realizes they have been giving the same client similar advice across three sessions, framed as questions. What is the best corrective action?","sk":"코치는 지난 세 번의 세션에 걸쳐 질문의 형식을 빌려 같은 고객에게 유사한 조언을 건네고 있었다는 사실을 깨달았다. 최선의 교정 행동은 무엇인가?","o":["Continue since the questions seem to land.","Acknowledge the pattern to oneself (and possibly the client), shift to genuinely open inquiry, and reflect with a peer or supervisor on the dynamic.","Tell the client to be more independent.","End the engagement."],"ok":["질문이 잘 먹히는 것처럼 보이므로 계속한다.","자신에게(그리고 가능하다면 고객에게도) 그 패턴을 인정하고, 진정으로 열린 탐구로 전환하며, 동료 코치나 슈퍼바이저와 함께 그 역동에 대해 성찰한다.","고객에게 더 독립적이 되라고 말한다.","코칭 계약을 종료한다."],"b":"B","w":"C","be":"질문으로 포장된 유도·조언 습관을 메타인지로 성찰하고, 진정한 개방형 탐구로 즉시 전환하며 코칭 슈퍼바이저나 멘토 코치와 성찰적 대화를 나누는 프로페셔널한 자기 개발 행동이기 때문입니다.","we":"Worst(C)는 코치 자신의 조언·유도 습관으로 인해 발생한 의존 역동을 고객 탓으로 돌리며 '더 독립적이 되라'고 지시하는 책임 전가이자 비파트너십적 태도입니다. A는 비코칭적 유도 질문을 합리화하며 방치하는 것이고, D는 슈퍼비전과 성찰을 통해 충분히 개선할 수 있음에도 책임을 회피해 계약을 끊어버리는 극단적 대응입니다.","c":["2.03","2.08","2.10"],"m":["7.6"],"k":["지난 세 번의 세션에 걸쳐","질문의 형식을 빌려","유사한 조언을 건네고 있었다","similar advice across three sessions","framed as questions"],"e":["4.2"],"cat":"bank"},{"id":73,"n":"Q73","ty":"bw","t":"'자신이 틀렸을 때 인정할 줄 아는 리더가 되고 싶어요'라는 고객의 정체성 목표","se":"A client says, “I want to be the kind of leader who admits when they are wrong.” What is the best coach action?","sk":"고객이 \"저는 자신이 틀렸을 때 인정할 줄 아는 그런 리더가 되고 싶어요\"라고 말한다. 최선의 코치 행동은 무엇인가?","o":["Set a SMART goal around frequency of admissions.","Explore what that kind of leadership means to the client, what stands in their way, and what small step would feel meaningful to them.","Provide a list of ways leaders demonstrate humility.","Have the client read a book on humility."],"ok":["인정하는 횟수(빈도)를 중심으로 SMART 목표를 설정한다.","그러한 리더십이 고객에게 무엇을 의미하는지, 무엇이 그것을 가로막고 있는지, 그리고 어떤 작은 한 걸음이 고객에게 의미 있게 느껴질지 탐색한다.","리더들이 겸손을 보여주는 방법 목록을 제공한다.","고객에게 겸손에 관한 책을 읽게 한다."],"b":"B","w":"C","be":"성급히 행동 빈도(What)를 재단하지 않고, 그 리더십 정체성(Who)이 지닌 의미와 가치, 내적 장애물, 그리고 고객 스스로 선택하는 의미 있는 작은 실행을 유기적으로 연결하기 때문입니다.","we":"Worst(C)는 고객 자신의 내면 가치와 맥락을 탐색하지 않고 코치가 '겸손 행동 리스트'를 건네주는 강의/컨설팅 방식입니다(D 역시 독서 과제를 지시하는 처방적 행동). A는 잘못을 인정하는 횟수를 기계적으로 카운트하는 SMART 목표로 진정한 리더십 존재감(Who)과 내적 동기를 놓친 피상적 접근입니다.","c":["7.03","7.09","8.03","8.05"],"m":["5.1","7.1","7.2","8.5","8.6"],"k":["자신이 틀렸을 때 인정할 줄 아는","그런 리더가 되고 싶어요","kind of leader who admits when they are wrong"],"e":[],"cat":"bank"},{"id":74,"n":"Q74","ty":"bw","t":"코치가 완전히 이해하지 못하는 업계 전문용어(Jargon)를 사용하는 고객","se":"A client uses jargon from their industry that the coach does not fully understand. What is the best coach action?","sk":"고객이 코치가 완전히 이해하지 못하는 자신의 업계 전문용어(jargon)를 사용한다. 최선의 코치 행동은 무엇인가?","o":["Pretend to follow and continue.","Ask the client to explain the term in their own words—both for the coach’s understanding and to surface what the term means to the client.","Look it up after the session and address it next time.","Switch the topic to something more accessible."],"ok":["이해하는 척하고 계속 진행한다.","코치의 이해를 돕고 동시에 그 용어가 고객 자신에게 무엇을 의미하는지 끌어내기 위해, 고객 자신의 언어로 그 용어를 설명해 달라고 요청한다.","세션 후에 찾아보고 다음번에 다룬다.","더 이해하기 쉬운 다른 주제로 전환한다."],"b":"B","w":"A","be":"모르는 것을 솔직하게 드러내는 투명성과 취약성으로 신뢰를 쌓는 동시에, 고객이 사용하는 단어의 고유한 의미를 탐색함으로써 고객 자신의 명료성을 높이는 일석이조의 질문이기 때문입니다.","we":"Worst(A)는 이해하지 못하면서 아는 척(Pretend)해 코치의 진실성과 정직성을 해치고 엉뚱한 방향으로 코칭을 이끌 위험이 큰 최악의 태도입니다. C는 지금 이 순간의 정확한 경청과 명료화를 뒤로 미루는(postpone) 대응이며, D는 코치의 이해 부족 때문에 고객의 중요한 주제를 회피해 버리는 코치 중심적 행동입니다.","c":["1.01","4.06","5.02","6.02"],"m":["5.4","6.2"],"k":["완전히 이해하지 못하는","업계 전문용어(jargon)","jargon","does not fully understand"],"e":[],"cat":"bank"},{"id":75,"n":"Q75","ty":"mc4","t":"역량 7(알아차림을 불러일으키다)의 가장 정확한 정의","se":"Which best describes “Evokes Awareness” under Competency 7?","sk":"역량 7(알아차림을 불러일으키다)을 가장 잘 설명한 것은 무엇인가?","o":["Facilitating client insight and learning by using tools and techniques such as powerful questioning, silence, metaphor, and analogy.","Setting goals and holding the client accountable.","Telling the client what the coach has noticed about them.","Maintaining attention to the client’s emotions."],"ok":["강력한 질문, 침묵, 은유, 비유와 같은 도구와 기술을 사용하여 고객의 통찰과 학습을 촉진하는 것.","목표를 설정하고 고객에게 책무를 부여하는 것.","코치가 고객에 대해 알아차린 것을 고객에게 말해 주는 것.","고객의 감정에 주의를 유지하는 것."],"b":"A","w":null,"be":"2025 ICF 핵심역량 7번의 공식 정의('강력한 질문, 침묵, 은유 또는 비유와 같은 도구와 기술을 사용하여 고객의 통찰과 학습을 촉진한다')와 정확히 일치하기 때문입니다.","we":"Worst(C)는 단순히 코치가 알아차린 것을 일방적으로 말해 주는 것(Telling)으로 역량 7.11의 '집착 없는 공유 및 탐색 초대'와도 거리가 먼 일방향적 전달입니다. B는 역량 3(합의) 및 역량 8(성장 촉진)의 내용이며, D는 역량 5(프레즌스) 및 역량 6(적극적 경청)의 내용입니다.","c":["7.02","7.04"],"m":["7.6"],"k":["역량 7(알아차림을 불러일으키다)","“Evokes Awareness”","Competency 7"],"e":[],"cat":"bank"},{"id":76,"n":"Q76","ty":"bw","t":"침묵 속에서 '잘 모르겠어요(I don't know)'라고 답하는 고객","se":"A client is silent. When the coach asks what is happening, the client says, “I don’t know.” What is the best coach response?","sk":"고객이 침묵하고 있다. 코치가 무슨 일이 일어나고 있는지 묻자 고객이 \"잘 모르겠어요(I don't know)\"라고 말한다. 최선의 코치 반응은 무엇인가?","o":["Move to a different topic to find traction.","Stay with the not-knowing, reflect that “I don’t know” is also useful information, and invite the client to explore what is here in the silence without forcing an answer.","Offer two or three possible interpretations to choose from.","Tell the client to think about it and come back next session."],"ok":["진전을 찾기 위해 다른 주제로 넘어간다.","알지 못함(not-knowing)에 함께 머물며, \"잘 모르겠다\"는 것 또한 유용한 정보임을 반영해 주고, 답을 강요하지 않은 채 이 침묵 속에 무엇이 있는지 탐색하도록 초대한다.","선택할 수 있도록 두세 가지 가능한 해석을 제시한다.","생각해 보고 다음 세션에 다시 오라고 말한다."],"b":"B","w":"C","be":"코치가 알지 못함의 영역을 코칭할 때도 편안하게 임하며, 성찰을 위한 침묵의 공간을 허용하고 고객이 현재 순간 경험하고 있는 모호함을 강요 없이 탐색하도록 초대하기 때문입니다.","we":"Worst(C)는 고객이 아직 내면의 언어를 찾지 못한 순간에 코치가 두세 가지 해석 보기를 던져주어 고객의 고유한 사고 프로세스를 가로채고 코치의 관점을 주입하는 행위입니다. A는 코치의 조급함 때문에 중요한 내면 탐색의 문턱을 회피하고 화제를 바꾸는 행동이며, D는 지금 여기에서 함께 머물며 탐색할 기회를 다음 세션으로 떠넘기는(postponing) 소극적 대응입니다.","c":["5.06","5.07","7.05"],"m":["5.5"],"k":["침묵하고 있다","\"잘 모르겠어요(I don't know)\"","silent","“I don’t know.”"],"e":[],"cat":"bank"},{"id":77,"n":"Q77","ty":"bw","t":"격주 세션을 원하면서도 반복적으로 일정을 취소하는 고객","se":"A client wants to schedule sessions every two weeks, but has been cancelling repeatedly. What is the best coach action?","sk":"고객이 격주(2주마다)로 세션을 잡기를 원하지만, 반복적으로 일정을 취소해 왔다. 최선의 코치 행동은 무엇인가?","o":["Send a stern email about the importance of consistency.","Acknowledge the pattern and partner with the client to revisit the agreement, cadence fit, what is getting in the way, and what would actually support the client’s growth.","Switch to weekly sessions to force consistency.","Charge for missed sessions only and not address the pattern."],"ok":["일관성의 중요성에 대해 엄격한 이메일을 보낸다.","반복되는 패턴을 인정하고, 합의 사항, 세션 주기(cadence)의 적합성, 무엇이 방해가 되고 있는지, 그리고 실제로 고객의 성장을 지원할 방식이 무엇인지 재검토하기 위해 고객과 파트너십을 맺는다.","일관성을 강제하기 위해 매주 세션으로 전환한다.","불참한 세션에 대해 비용만 청구하고 그 패턴은 다루지 않는다."],"b":"B","w":"A","be":"여러 세션에 걸친 행동 패턴(잦은 취소)을 비판단적으로 짚어주고, 고객의 실제 삶과 니즈에 맞도록 일정·주기 등 코칭 합의를 함께 재검토하며 장애 요인을 탐색하기 때문입니다.","we":"Worst(A)는 '엄격한 이메일'로 훈계하듯 일관성을 압박해 존중하는 언어 사용과 심리적 안전감을 심각하게 훼손하는 수직적 태도입니다. C는 고객과의 합의 없이 코치가 일방적으로 주기를 변경해 강제하는 행동이며, D는 규정대로 비용만 받고 그 이면에 있는 중요한 패턴과 고객의 욕구를 묵살(dismissing)하는 행정적 대응입니다.","c":["3.03","3.12","6.06","8.05"],"m":["7.5"],"k":["격주(2주마다)로 세션을 잡기를 원하지만","반복적으로 일정을 취소해 왔다","cancelling repeatedly"],"e":["1.1","4.3"],"cat":"bank"},{"id":78,"n":"Q78","ty":"bw","t":"회사는 '겸손(Humility)'을 중시하지만 고객은 '겸손이 제 발목을 잡아요'라고 할 때","se":"A client’s company values humility, and the client says, “But humility holds me back.” What is the best coach action?","sk":"고객의 회사는 '겸손(humility)'을 핵심 가치로 여기는데, 고객은 \"하지만 겸손이 제 발목을 잡아요\"라고 말한다. 최선의 코치 행동은 무엇인가?","o":["Defend the company’s value and reframe humility as strength.","Suspend judgment about the company’s value, partner with the client to explore what humility means to them, where it serves and limits them, and what they want to be true.","Suggest the client speak to HR about misalignment.","Coach the client to be less humble for visibility’s sake."],"ok":["회사의 가치를 옹호하고 겸손을 강점으로 재구성해 준다.","회사의 가치에 대한 판단을 유보하고, 고객에게 '겸손'이 무엇을 의미하는지, 어디서 도움이 되고 어디서 한계로 작용하는지, 그리고 무엇이 사실이기를 원하는지 탐색하도록 고객과 파트너십을 맺는다.","가치 불일치에 대해 HR과 이야기해 보라고 제안한다.","가시성(존재감)을 높이기 위해 덜 겸손해지도록 코칭한다."],"b":"B","w":"D","be":"조직 시스템의 가치와 개인의 경험 사이의 긴장을 비판단적으로 수용하고, 고객이 사용한 '겸손'이라는 단어의 고유한 정의와 양면성을 깊이 탐색하도록 돕기 때문입니다.","we":"Worst(D)는 고객 자신의 가치관과 조직 맥락을 탐색하기도 전에 '존재감을 위해 덜 겸손해져라'며 코치가 특정 행동 방향을 정해 몰아가는 비윤리적·비코칭적 개입입니다. A는 회사 편을 들며 고객의 고충을 일방적 긍정으로 덮어버리는 태도이며, C는 내면 가치 탐색을 건너뛴 채 성급히 외부 행동(HR 면담)을 제안하는 처방적 반응입니다.","c":["4.01","6.01","6.02","7.03","7.04"],"m":["6.1","6.2"],"k":["회사는 '겸손(humility)'을 핵심 가치","\"하지만 겸손이 제 발목을 잡아요\"","company values humility","humility holds me back"],"e":["1.1","3.2","4.1"],"cat":"bank"},{"id":79,"n":"Q79","ty":"mc4","t":"역량 8 하에서 세션을 통합(Integrate)하는 가장 강력한 마무리 질문","se":"Which is the strongest closing question to integrate a session under Competency 8?","sk":"역량 8(고객의 성장을 촉진한다) 기준에서 세션을 통합하는 가장 강력한 마무리 질문은 무엇인가?","o":["“Are we done?”","“Did this session work for you?”","“When can we meet next?”","“What is most important to take from today’s conversation, and what—if anything—do you want to do with it?”"],"ok":["\"우리 다 끝났나요?\"","\"이번 세션이 당신에게 효과가 있었나요?\"","\"다음에 언제 만날 수 있을까요?\"","\"오늘 대화에서 가져갈 가장 중요한 것은 무엇이며, 그것으로 무엇을(만약 있다면) 하고 싶으신가요?\""],"b":"D","w":null,"be":"고객 스스로 세션의 핵심 학습과 통찰을 요약·통합하게 돕고, 동시에 실행 여부와 내용에 대한 자율성('what—if anything—do you want to do')까지 온전히 존중하는 완벽한 PCC/MCC 마무리 질문이기 때문입니다.","we":"Worst(A)는 배움의 통합과 존중하는 종료 파트너십이 전무한 무성의하고 사무적인 질문입니다. C는 행정적 일정 잡기에 불과하며, B는 '예/아니오'로 답하는 닫힌 질문이자 코칭 성과에 대한 표면적 만족도 확인에 그쳐 학습 통합을 이끌어내지 못합니다.","c":["8.01","8.03","8.06","8.09"],"m":["8.1","8.2","8.3","8.4","8.9"],"k":["역량 8(고객의 성장을 촉진한다)","세션을 통합하는 가장 강력한 마무리 질문","closing question to integrate a session"],"e":[],"cat":"bank"},{"id":80,"n":"Q80","ty":"bw","t":"세션 중반에 고객이 '코치님이라면 어떻게 하실 건가요?'라고 물을 때","se":"A client asks the coach in the middle of the session, “What would you do?” What is the best coach response?","sk":"세션 중반에 고객이 코치에게 \"코치님이라면 어떻게 하시겠어요?\"라고 묻는다. 최선의 코치 반응은 무엇인가?","o":["Share what the coach would do since the client asked.","Acknowledge the question, name how stepping into “what the coach would do” changes the dynamic, and invite the client back to their own knowing—offering the coach’s view only later, briefly and lightly, if it serves.","Refuse to answer and quote the coaching definition.","Provide three possible answers framed as “options leaders consider.”"],"ok":["고객이 물었으므로 코치라면 어떻게 할지 공유한다.","질문을 인정하고, '코치라면 어떻게 할까'로 들어가는 것이 코칭 역학을 어떻게 바꾸는지 짚어준 뒤, 고객 자신의 앎(knowing)으로 다시 초대한다—코치의 관점은 나중에 진정으로 도움이 될 경우에만 짧고 가볍게(집착 없이) 제시한다.","대답을 거절하고 코칭의 정의를 인용해 읊는다.","\"리더들이 고려하는 옵션들\"이라는 형태로 포장해 세 가지 가능한 답을 제시한다."],"b":"B","w":"A","be":"고객의 질문을 따뜻하게 인정하면서도 코칭 파트너십의 본질을 지켜 고객 자신의 내적 지혜를 먼저 탐색하게 하고, 관점 공유는 철저히 고객의 유익을 위해 집착 없이 보조적으로만 활용하기 때문입니다.","we":"Worst(A)는 고객이 물어봤다는 이유로 코치의 해답을 바로 건네주어 코치의 에고를 채우고 고객의 자율적 문제 해결 역량을 약화시키는 가장 흔한 함정입니다. C는 딱딱하게 정의를 읊으며 거절해 라포와 안전감을 해치는 경직된 반응이며, D는 옵션의 탈을 썼을 뿐 사실상 코치의 해답 3가지를 주입하는 교묘한 조언(컨설팅)입니다.","c":["2.01","3.01","4.05","7.11"],"m":["7.5"],"k":["세션 중반","\"코치님이라면 어떻게 하시겠어요?\"","“What would you do?”"],"e":["1.1"],"cat":"bank"},{"id":81,"n":"Q81","ty":"bw","t":"고객의 이혼 소송과 관련해 코칭 기록 제출 소환장(Subpoena)을 받은 경우","se":"Mid-engagement, the coach receives a subpoena requesting their notes from a client’s sessions in a divorce proceeding. What is the best coach action?","sk":"코칭 진행 도중 코치가 고객의 이혼 소송 절차에서 세션 노트를 제출하라는 법적 소환장(subpoena)을 받았다. 최선의 코치 행동은 무엇인가?","o":["Comply immediately and send the notes.","Refuse without exception to protect confidentiality.","Notify the client promptly, seek qualified legal counsel, and limit any disclosure to what is legally required after consultation.","Destroy the notes before the deadline."],"ok":["즉시 응하여 노트를 보낸다.","비밀보장을 보호하기 위해 예외 없이 거부한다.","고객에게 신속히 알리고, 자격을 갖춘 법률 자문을 구한 뒤, 자문 결과에 따라 법적으로 요구되는 최소한의 범위로만 공개를 제한한다.","마감 기한 전에 노트를 파기한다."],"b":"C","w":"D","be":"역량 1.05('이해 관계자 합의 및 관련 법률에 따라 고객 정보에 대해 비밀을 유지한다') 및 ICF 윤리강령의 비밀보장 예외 조항에 따라, 고객에게 즉시 투명하게 고지하고 법률 전문가의 자문을 거쳐 법적 의무 범위 내에서만 최소 공개하기 때문입니다.","we":"Worst(D)는 법적 소환장이 발부된 상태에서 기록을 인멸·파기해 명백한 실정법 위반(증거인멸)이자 윤리강령의 준법·정직성을 위배하는 범죄 행위입니다. A는 법적 유효성 검토나 고객 통지 없이 성급히 고객의 사적 기록 전체를 넘기는 비밀보장 소홀이고, B는 법적 강제 명령까지 무조건 거부하여 법적 제재를 자초하는 비현실적 대응입니다.","c":["1.01","1.04","1.05","2.08"],"m":[],"k":["세션 노트를 제출하라는 법적 소환장(subpoena)","이혼 소송 절차","subpoena requesting their notes"],"e":["2.1","2.3","2.4"],"cat":"bank"},{"id":82,"n":"Q82","ty":"mc4","t":"역량 5(프레즌스를 유지한다 / Maintains Presence)의 가장 정확한 정의","se":"Which best defines “Maintains Presence” under Competency 5?","sk":"역량 5(프레즌스를 유지한다)를 가장 잘 정의한 것은 무엇인가?","o":["Active engagement with the client’s words and content.","Being fully conscious and present with the client, employing a style that is open, flexible, grounded, and confident.","Asking probing questions that elicit emotion.","Holding firm to the agreed agenda."],"ok":["고객의 단어와 내용에 적극적으로 관여하는 것.","개방적이고 유연하며 중심이 잡힌 자신감 있는 스타일을 사용하여, 완전히 깨어 고객과 함께 존재하는 것.","감정을 이끌어내는 심층 질문을 하는 것.","합의된 아젠다를 굳건히 고수하는 것."],"b":"B","w":null,"be":"2025 ICF 핵심역량 5번의 공식 정의('개방적이고 유연하며 중심이 잡힌 자신감 있는 태도로 완전히 깨어서 고객과 함께 한다')와 정확히 일치하기 때문입니다.","we":"Worst(D)는 합의된 아젠다만 경직되게 고수해 고객의 변화에 맞춰 유연하게 춤추는 프레즌스(역량 5)의 반대 개념입니다. A는 역량 6(적극적 경청)에 가깝고, C는 역량 7(알아차림 불러일으키기)의 질문 기법에 해당합니다.","c":["5.01","5.03"],"m":["5.1","5.3"],"k":["역량 5(프레즌스를 유지한다)","“Maintains Presence”","Competency 5"],"e":[],"cat":"bank"},{"id":83,"n":"Q83","ty":"mc4","t":"정체성과 무관하게 공평한 대우를 강조하는 ICF 윤리강령 핵심 가치","se":"Which Code of Ethics Core Value emphasizes equitable treatment regardless of identity?","sk":"ICF 윤리강령의 핵심 가치 중 정체성과 무관하게 공평한 대우를 강조하는 가치는 무엇인가?","o":["Collaboration","Humanity","Professionalism","Equity"],"ok":["협동(Collaboration)","인간성(Humanity)","전문직업의식(Professionalism)","형평(Equity)"],"b":"D","w":null,"be":"ICF 윤리강령 핵심 가치 중 형평(Equity)은 '타인의 필요를 탐색하고 이해함으로써 항상 모두의 형평성을 위한 공정한 프로세스를 실천하기 위해 최선을 다한다'고 명시하고 있기 때문입니다.","we":"나머지 선지 비교: C(전문직업의식)는 책임감·존중·정직성·우수성을 포괄하는 품질 약속이고, A(협동)는 사회적 연결과 공동체 구축 헌신이며, B(인간성)는 타인에 대한 인도적·친절·공감적 태도를 의미합니다.","c":["1.02","1.04"],"m":[],"k":["정체성과 무관하게 공평한 대우","ICF 윤리강령의 핵심 가치","equitable treatment regardless of identity"],"e":["PRO","COL","HUM","EQU"],"cat":"bank"},{"id":84,"n":"Q84","ty":"bw","t":"법원 명령(Court-mandated)으로 코칭을 받으러 온 신규 고객","se":"A new client mentions they are court-mandated to do coaching. What is the best coach action?","sk":"신규 고객이 법원 명령(court-mandated)으로 코칭을 받게 되었다고 언급한다. 최선의 코치 행동은 무엇인가?","o":["Decline because the client is not freely choosing coaching.","Acknowledge the context, partner with the client on what they want from coaching given the mandate, and clarify confidentiality and reporting obligations to the court at the start.","Coach as usual without addressing the mandate.","Report the client’s progress to the court at every milestone."],"ok":["고객이 자유롭게 코칭을 선택한 것이 아니므로 거절한다.","그 맥락을 인정하고, 명령이 주어진 상황에서 고객이 코칭으로부터 무엇을 원하는지 파트너십을 맺으며, 시작 시점에 법원에 대한 비밀보장 범위와 보고 의무를 명확히 한다.","법원 명령은 다루지 않고 평소처럼 코칭한다.","매 마일스톤마다 법원에 고객의 진척 상황을 보고한다."],"b":"B","w":"D","be":"의무적(Mandated) 코칭 상황에서도 고객의 특수 맥락을 존중하고, 그 제약 안에서 고객이 스스로 얻고 싶은 주체적 목표를 합의하며 가장 민감한 비밀보장 한계 및 외부(법원) 보고 범위를 코칭 시작 전에 투명하게 합의하기 때문입니다.","we":"Worst(D)는 사전 합의나 고객 동의 없이 코치가 임의로 법원에 매번 진척 상황을 보고해 비밀보장 의무와 비평가적 중립성을 침해하는 최악의 행동입니다. A는 외부 계기로 왔더라도 자발적 목표를 세울 수 있는 가능성을 미리 차단하는 과잉 거절이고, C는 중대한 법적 보고 의무와 비밀보장 한계를 짚지 않고 넘어가는 합의 누락입니다.","c":["1.05","3.02","3.03","4.01"],"m":[],"k":["신규 고객","법원 명령(court-mandated)으로 코칭","court-mandated"],"e":["1.1","2.1","2.2","2.3"],"cat":"bank"},{"id":85,"n":"Q85","ty":"bw","t":"한 주간의 일을 길게 설명하는 고객 앞에서 요약을 시도하는 적절한 타이밍과 방법","se":"A client describes their week in detail, and the coach feels pulled to summarize. What is the best coach action?","sk":"고객이 자신의 한 주를 상세히 묘사하고 있고, 코치는 요약하고 싶은 충동을 느낀다. 최선의 코치 행동은 무엇인가?","o":["Summarize early to keep the session efficient.","Listen until the client pauses, then offer a tentative summary and ask whether anything was missed or matters most.","Take detailed notes and summarize at the end.","Wait silently until the client stops, then move on without summary."],"ok":["세션을 효율적으로 유지하기 위해 일찍 요약한다.","고객이 말을 멈출 때까지 경청한 뒤, 잠정적인 요약을 제시하고 놓친 것이 있는지 또는 가장 중요한 것이 무엇인지 묻는다.","상세히 필기하고 세션 마지막에 요약한다.","고객이 멈출 때까지 조용히 기다린 후 요약 없이 다음으로 넘어간다."],"b":"B","w":"A","be":"PCC 마커 6.6('명확한 목적이 있지 않은 한 고객이 말하기를 중단하지 않고 완료할 수 있도록 한다')과 6.7('간결하게 반영하거나 요약한다'), 그리고 4.4('코치의 기여에 응답하도록 초대한다')를 완벽히 결합했기 때문입니다.","we":"Worst(A)는 효율성을 이유로 고객이 자기 표현을 마치기도 전에 말을 가로막고(interrupting) 성급히 요약해 적극적 경청의 기본 원칙(PCC 마커 6.6)을 위반합니다. C는 필기에 매몰되어 현재 순간의 명료화를 놓치는 태도이고, D는 경청 후 반영·요약을 통해 초점을 명료화하는 과정을 생략한 소극적 대응입니다.","c":["4.05","6.02"],"m":["4.4","6.6","6.7"],"k":["상세히 묘사","요약하고 싶은 충동","describes their week in detail","pulled to summarize"],"e":[],"cat":"bank"},{"id":86,"n":"Q86","ty":"bw","t":"개인 코칭 고객의 소속 조직이 '팀 코칭'으로 계약을 확장하자고 요청할 때","se":"A client’s organization wants to expand the engagement to include team coaching. What is the best coach action?","sk":"고객의 소속 조직이 기존 코칭 계약을 확장하여 '팀 코칭'을 포함하고자 한다. 최선의 코치 행동은 무엇인가?","o":["Add team sessions to the existing one-on-one engagement.","Acknowledge the request, separate the contracts and confidentiality frameworks for individual versus team coaching, ensure the coachee consents, and confirm the coach’s competence in team coaching.","Decline because team coaching mixes roles.","Have the coachee facilitate team sessions and report back."],"ok":["기존의 일대일 계약에 팀 세션을 추가한다.","요청을 인정하고, 개인 코칭과 팀 코칭에 대한 계약서와 비밀보장 체계를 명확히 분리하며, 피코치(기존 고객)의 동의를 확보하고, 팀 코칭에 대한 코치 자신의 역량을 확인한다.","팀 코칭은 역할을 혼합시키므로 거절한다.","피코치가 직접 팀 세션을 진행하게 하고 결과를 보고받는다."],"b":"B","w":"A","be":"1:1 개인 코칭에서 나눈 비밀 정보가 팀 코칭에서 노출되거나 역할이 혼동되지 않도록 계약과 비밀보장 프레임을 엄격히 분리하고, 기존 고객의 자발적 동의를 구하며 팀 코칭 전문 역량을 검증하기 때문입니다.","we":"Worst(A)는 개인 코칭과 팀 코칭의 비밀보장 경계 및 역할 합의를 분리하지 않고 하나의 계약에 뒤섞어 버려 1:1 세션의 비밀보장 신뢰를 무너뜨리고 심각한 이해상충을 야기합니다. C는 구조를 분리하면 충분히 수행 가능함에도 무조건 거절하는 과잉 해석이고, D는 코칭 의뢰를 고객에게 떠넘기는 부적절한 처사입니다.","c":["1.04","1.05","2.02","3.02","3.03"],"m":[],"k":["기존 코칭 계약을 확장","'팀 코칭'을 포함","expand the engagement to include team coaching"],"e":["1.1","2.1","2.2","3.1","3.2","5.1"],"cat":"bank"},{"id":87,"n":"Q87","ty":"bw","t":"고객으로부터 받은 훌륭한 추천사(Testimonial)를 홍보용으로 게시할 때","se":"A coach receives a glowing testimonial from a client and wants to publish it. What is the best action under the ICF Code?","sk":"코치가 고객으로부터 극찬이 담긴 추천사(testimonial)를 받았고 이를 게시하고 싶다. ICF 윤리강령에 따른 최선의 행동은 무엇인가?","o":["Publish since the client wrote it.","Obtain the client’s written consent for use—including any identifying details and the channels in which it will appear—and respect any limits.","Anonymize and post.","Quote partial sentences without attribution."],"ok":["고객이 직접 썼으므로 게시한다.","신원 식별 정보 포함 여부와 게시될 채널을 명시하여 사용에 대한 고객의 서면 동의를 얻고, 고객이 정한 모든 제한 사항을 존중한다.","익명화하여 게시한다.","출처를 밝히지 않고 일부 문장만 인용한다."],"b":"B","w":"A","be":"ICF 윤리강령 및 역량 1.05에 따라 고객이 작성한 글이라 하더라도 외부 공개 시에는 구체적인 활용 채널과 신원 공개 범위에 대한 고객의 명시적 서면 동의(Written consent)를 사전에 받아야 하기 때문입니다.","we":"Worst(A)는 고객의 동의 없이 실명이나 내용이 담긴 추천사를 무단 게시하여 코칭 수강 사실과 개인정보를 외부에 노출하는 명백한 비밀보장 위반입니다. 익명화(C)하거나 부분 인용(D)하더라도 고객의 사전 동의 없이 작업 산출물을 마케팅에 활용하는 것은 윤리적 투명성과 동의 원칙에 미흡합니다.","c":["1.01","1.04","1.05"],"m":[],"k":["추천사(testimonial)","게시하고 싶다","glowing testimonial","wants to publish it"],"e":["2.1","2.4","5.2"],"cat":"bank"},{"id":88,"n":"Q88","ty":"bw","t":"심각한 질병 진단을 받았다고 털어놓는 고객","se":"A client begins to describe a serious illness diagnosis. What is the best coach response?","sk":"고객이 심각한 질병 진단을 받았다고 설명하기 시작한다. 최선의 코치 반응은 무엇인가?","o":["Quickly redirect to professional goals.","Slow down, attend to the client with care, hold space, and partner on what—if anything—the client wants to bring into the coaching at this time.","Offer medical information from the coach’s research.","End the session out of respect."],"ok":["업무 목표 쪽으로 빠르게 방향을 돌린다.","속도를 늦추고, 배려를 담아 고객에게 주의를 기울이며, 공간을 내어준 뒤, 지금 이 시점에 코칭에 가져오고 싶은 것이 있다면 무엇일지 파트너십을 맺는다.","코치가 조사한 의학 정보를 제공한다.","존중의 의미로 세션을 종료한다."],"b":"B","w":"A","be":"중대한 삶의 충격을 마주한 고객에게 인간적 공감과 배려로 현존하고 침묵과 멈춤의 공간을 내어준 뒤, 지금 고객이 코칭에서 다루고 싶은 바를 스스로 선택하도록 파트너십을 맺기 때문입니다.","we":"Worst(A)는 고객이 겪고 있는 중대한 삶의 위기와 감정을 철저히 묵살(dismiss)하고 기존의 직무 목표로 화제를 돌려버리는 비인간적 반응입니다. C는 코치가 의학 전문가인 양 정보를 제공하는 역할 경계 위반(역량 1.06)이며, D는 고객에게 어떻게 하고 싶은지 묻지도 않고 코치가 일방적으로 세션을 끊어버리는 비파트너십적 태도입니다.","c":["3.06","4.04","5.01","5.03","5.05","5.07"],"m":["5.1","5.3","5.5"],"k":["심각한 질병 진단","serious illness diagnosis"],"e":["HUM"],"cat":"bank"},{"id":89,"n":"Q89","ty":"bw","t":"입사 지원 시 코치에게 평판 조회인(Reference)이 되어 달라는 고객의 요청","se":"A client asks the coach to act as a reference for a job application. What is the best coach response?","sk":"고객이 입사 지원을 위해 코치에게 평판 조회인(reference) 역할을 해달라고 요청한다. 최선의 코치 반응은 무엇인가?","o":["Agree because the client is qualified.","Acknowledge the request, reflect with the client on how a reference from the coach versus an employer or peer might be received and what it would imply for the coaching relationship, and decide together with care.","Decline categorically as references blur roles.","Provide a generic reference letter for any client who asks."],"ok":["고객이 자격을 갖추었으므로 동의한다.","요청을 인정하고, 고용주나 동료가 아닌 코치의 평판 조회가 외부에서 어떻게 받아들여질지, 그리고 그것이 코칭 관계(비밀보장·비평가적 역할)에 어떤 의미를 미칠지 고객과 함께 성찰한 뒤 배려를 담아 함께 결정한다.","평판 조회는 역할을 모호하게 만드므로 단호하게 거절한다.","요청하는 모든 고객에게 일반적인 추천서를 제공해 준다."],"b":"B","w":"D","be":"코치가 외부 채용 기관에 고객을 평가·보증하는 순간 비밀보장(코칭 사실 노출)과 비평가적 파트너십에 미칠 파급 효과를 고객과 함께 투명하게 성찰하고 존중 어린 합의에 이르기 때문입니다.","we":"Worst(D)는 코칭의 비평가적 본질과 비밀보장 문제를 전혀 고려하지 않은 채 '요청하는 모든 고객에게 기계적으로 추천서를 써준다'는 최악의 역할 망각입니다(A 역시 평가자 역할 전환의 위험을 간과함). C는 역할 경계를 지키려는 취지는 맞으나 고객과 함께 그 영향을 성찰하는 파트너십 과정 없이 맹목적으로 잘라버리는 경직된 태도입니다.","c":["1.03","1.05","1.06","3.02"],"m":[],"k":["입사 지원","평판 조회인(reference) 역할","act as a reference","job application"],"e":["2.1","3.1","3.7"],"cat":"bank"},{"id":90,"n":"Q90","ty":"bw","t":"'제 본능은 맞서 싸우는 건데, 싸울 때마다 늘 번아웃이 와요'라는 내적 갈등","se":"A client says, “My instinct is to fight this, but fighting always burns me out.” What is the best coach action?","sk":"고객이 \"제 본능은 이것에 맞서 싸우는 것인데, 싸우는 것은 늘 저를 번아웃(소진)되게 만들어요\"라고 말한다. 최선의 코치 행동은 무엇인가?","o":["Suggest the client try not fighting this time.","Reflect the tension between instinct and pattern, invite the client to explore what each part wants for them, and partner on what they want to try given that awareness.","Provide a model on conflict styles.","Move to action: pick a different response and commit."],"ok":["이번에는 싸우지 말아 보라고 제안한다.","본능과 반복되는 패턴 사이의 긴장을 반영해 주고, 각 부분이 고객을 위해 무엇을 원하고 있는지 탐색하도록 초대한 뒤, 그 알아차림을 바탕으로 무엇을 시도해 보고 싶은지 파트너십을 맺는다.","갈등 유형에 관한 모델을 제공한다.","실행으로 넘어가 다른 반응을 하나 골라 약속하게 한다."],"b":"B","w":"A","be":"고객 내면의 양가적 갈등(싸우려는 보호 본능 vs 소진으로부터 지키려는 욕구)을 그대로 비추어 주고, 각 부분이 추구하는 깊은 욕구와 가치를 탐색하여 고객 스스로 새로운 선택을 내리도록 돕기 때문입니다.","we":"Worst(A)는 고객 내면의 깊은 갈등 구조를 탐색하지 않은 채 코치가 '이번엔 싸우지 마라'고 직접 행동 처방을 내리는 전형적인 조언/지시입니다. C는 이론 모델 강의(Training)로 흐르는 개입이며, D는 충분한 내면 탐색과 알아차림 없이 성급하게 행동 결정으로 건너뛰는 조급함입니다.","c":["6.02","7.03","7.08","7.09"],"m":["7.1","7.2"],"k":["제 본능은 이것에 맞서 싸우는 것인데","싸우는 것은 늘 저를 번아웃(소진)되게 만들어요","instinct is to fight","burns me out"],"e":[],"cat":"bank"},{"id":91,"n":"Q91","ty":"bw","t":"'오늘은 목표 이야기 말고 그냥 하소연(Vent)만 하고 싶어요'라는 고객","se":"A client says, “I don’t want to talk about my goal today—I just want to vent.” What is the best coach response?","sk":"고객이 \"오늘은 제 목표에 대해 이야기하고 싶지 않아요. 그냥 하소연(vent)만 하고 싶어요\"라고 말한다. 최선의 코치 반응은 무엇인가?","o":["Insist on the agreed goal because that is what was contracted.","Acknowledge what the client wants today, partner on what kind of session would serve them—including whether just venting for a portion of the time fits and how it connects to what matters to them—and contract for it.","Refuse and reschedule when the client is ready to coach.","Spend the entire session venting without contracting."],"ok":["이미 계약된 내용이므로 합의된 목표를 고수하라고 주장한다.","오늘 고객이 원하는 바를 인정하고, 일정 시간 동안 하소연하는 것이 적합한지 그리고 그것이 고객에게 중요한 가치와 어떻게 연결되는지를 포함해 어떤 형태의 세션이 도움이 될지 파트너십을 맺어 합의한다.","거절하고 고객이 코칭받을 준비가 되었을 때로 일정을 변경한다.","아무런 합의 없이 세션 전체를 하소연하는 데 쓴다."],"b":"B","w":"A","be":"고객의 현재 정서적 필요를 공감·인정하면서도, 코칭이 단순한 감정 배설로만 끝나지 않도록 시간 배분과 진정한 의미·초점을 함께 재합의하는 성숙한 파트너십이기 때문입니다.","we":"Worst(A)는 고객이 지금 가장 절실히 원하는 방향을 무시하고 과거의 목표만 고집하는 고객 중심성 상실 태도입니다. C는 고객의 욕구를 수용하지 못하고 세션을 거부하는 회피 반응이며, D는 세션 합의와 초점 유지 없이 방임하는 태도입니다.","c":["3.06","3.09","3.10","4.05"],"m":["3.1","3.3","5.3"],"k":["목표에 대해 이야기하고 싶지 않아요","그냥 하소연(vent)만 하고 싶어요","don’t want to talk about my goal today","just want to vent"],"e":[],"cat":"bank"},{"id":92,"n":"Q92","ty":"bw","t":"구직 중이라 경제적으로 어렵다며 한 달 무료 추가 코칭을 요청하는 고객","se":"Toward the end of an engagement, the client asks for an extra month of free coaching because they are between jobs. What is the best coach response?","sk":"코칭 과정이 끝나갈 무렵, 고객이 현재 구직 중이라면서 한 달간 무료로 추가 코칭을 해줄 수 있는지 묻는다. 최선의 코치 반응은 무엇인가?","o":["Agree to whatever the client requests to maintain the relationship.","Acknowledge the request, consider the impact on both parties, precedent, sustainability, client autonomy and dignity, and respond with transparency—offering an option that fits the coach’s practice and respects the client.","Refuse without discussion to maintain professional standards.","Offer free coaching, but increase the rate after the engagement."],"ok":["관계를 유지하기 위해 고객이 요청하는 것은 무엇이든 동의한다.","요청을 인정하고, 양측에 미치는 영향, 선례, 지속 가능성, 고객의 자율성과 존엄성을 고려한 뒤, 코치의 운영 원칙에 맞고 고객을 존중하는 대안을 제시하며 투명하게 응답한다.","전문적 기준을 유지하기 위해 논의 없이 거절한다.","무료 코칭을 제공하되 계약 종료 후 요금을 인상한다."],"b":"B","w":"D","be":"고객의 어려운 처지를 존중·인정하면서도, 코치 자신의 전문적 지속 가능성과 명확한 조건 합의, 고객의 존엄성과 주체성을 지키는 대안을 투명하고 정직하게 제시하기 때문입니다.","we":"Worst(D)는 겉으로는 무료인 척하면서 나중에 요금을 올려 받겠다는 기만적·조작적 거래로 정직성과 공정한 보수 합의를 정면 훼손합니다. A는 코치 자신의 경계와 지속 가능성을 희생하며 의존 관계를 조장할 수 있고, C는 고객의 사정을 공감적으로 인정하거나 대안을 모색하지 않고 차갑게 거절하는 비인간적 태도입니다.","c":["1.01","1.03","3.03","4.06"],"m":[],"k":["코칭 과정이 끝나갈 무렵","한 달간 무료로 추가 코칭","extra month of free coaching","between jobs"],"e":["1.1","4.1","5.2"],"cat":"bank"},{"id":93,"n":"Q93","ty":"mc4","t":"역량 1.05(비밀 유지)를 가장 잘 실천한 사례","se":"Which best illustrates Competency 1.05 (“Maintains confidentiality with client information per stakeholder agreements and pertinent laws”)?","sk":"역량 1.05(\"이해 관계자 합의 및 관련 법률에 따라 고객 정보에 대해 비밀을 유지한다\")를 가장 잘 보여주는 예시는 무엇인가?","o":["Posting anonymized client wins on social media.","Discussing the client with the client’s spouse.","Storing notes securely, only sharing client information per the agreed contract, and complying with applicable data protection laws.","Sharing client themes with a peer at a conference without names."],"ok":["소셜 미디어에 익명화된 고객의 성공 사례를 게시하는 것.","고객의 배우자와 고객에 대해 논의하는 것.","노트를 안전하게 보관하고, 합의된 계약에 따라서만 고객 정보를 공유하며, 관련 데이터 보호법을 준수하는 것.","학회에서 동료 코치에게 이름 없이 고객의 주제들을 공유하는 것."],"b":"C","w":null,"be":"기록의 물리적·디지털 보안 유지, 합의된 계약 범위 내 정보 공유, 그리고 개인정보 보호법 등 관련 법률 준수라는 역량 1.05 및 윤리강령의 데이터 보안 기준을 모두 정확히 충족했기 때문입니다.","we":"Worst(B)는 고객의 명시적 동의 없이 배우자(가족)에게 고객의 코칭 내용이나 상태를 발설하는 직접적 비밀보장 침해입니다. 이름을 뺐다(D)거나 익명화했다(A) 하더라도 고객의 사전 동의 없이 사석(학회)이나 불특정 다수(SNS)에게 고객 사례를 공유하는 것은 비밀보장 원칙과 윤리강령에 위배됩니다.","c":["1.04","1.05"],"m":[],"k":["역량 1.05","고객 정보에 대해 비밀을 유지한다","Competency 1.05","Maintains confidentiality"],"e":["2.1","2.2","2.4"],"cat":"bank"},{"id":94,"n":"Q94","ty":"bw","t":"이전 코치에게 상처받아 경계심을 품고 있는 신규 고객","se":"A client says they were treated harshly by a former coach and is wary. What is the best coach response?","sk":"고객이 이전 코치에게 가혹한 대우를 받은 적이 있어 경계심이 있다고 말한다. 최선의 코치 반응은 무엇인가?","o":["Apologize on behalf of the coaching profession.","Acknowledge what the client experienced, hold space, and partner on what would help build trust and safety in this engagement.","Ask the client for the former coach’s name.","Defend coaches as a group."],"ok":["코칭 업계를 대표해 사과한다.","고객이 경험한 바를 인정하고, 공간을 내어주며, 이번 코칭 관계에서 신뢰와 안전감을 쌓는 데 무엇이 도움이 될지 파트너십을 맺는다.","이전 코치의 이름을 묻는다.","코치 집단 전체를 옹호한다."],"b":"B","w":"D","be":"고객의 아픈 과거 경험과 경계심을 판단 없이 공감·인정하고, 지금 이 새로운 관계에서 심리적 안전감을 느끼기 위해 필요한 조건을 고객과 함께 공동 구축하기 때문입니다.","we":"Worst(D)는 상처받은 고객의 감정을 헤아리기는커녕 다른 코치들을 두둔하며 방어해 고객의 경험을 부정(invalidating)하고 신뢰를 원천 차단하는 최악의 반응입니다. A는 불필요하게 타인의 잘못을 대신 사과하며 초점을 분산시키는 태도이며, C는 고객의 안전감 회복과 무관하게 이전 코치의 신원을 캐묻는 부적절한 호기심입니다.","c":["3.02","4.04","4.05"],"m":["4.2","4.3"],"k":["이전 코치에게 가혹한 대우","경계심이 있다","treated harshly by a former coach","wary"],"e":["3.4","HUM"],"cat":"bank"},{"id":95,"n":"Q95","ty":"bw","t":"어려운 피드백 대화를 앞둔 고객과, 해당 분야 전문가인 코치","se":"A client describes a difficult feedback conversation they need to have. The coach has facilitated many such conversations professionally. What is the best coach action?","sk":"고객이 자신이 해야 할 어려운 피드백 대화에 대해 묘사한다. 코치는 직업적으로 그러한 대화를 수없이 촉진해 본 경험이 있다. 최선의 코치 행동은 무엇인가?","o":["Share a model the coach uses for feedback.","Set the coach’s expertise aside, partner with the client on what they want to convey, what they care about, and how they want to show up—supporting the client’s own design.","Roleplay the conversation with the client following the coach’s lead.","Provide a script the client can adapt."],"ok":["코치가 피드백에 사용하는 모델을 공유한다.","코치 자신의 전문 지식을 내려놓고, 고객이 무엇을 전달하고 싶은지, 무엇을 소중히 여기는지, 어떤 모습으로 임하고 싶은지 고객과 파트너십을 맺어 고객 스스로의 대화 설계를 지원한다.","코치의 리드를 따라 고객과 그 대화를 롤플레이한다.","고객이 수정해서 쓸 수 있는 대본(script)을 제공한다."],"b":"B","w":"D","be":"코치 자신의 과거 전문성과 에고를 내려놓고, 고객이 자신의 가치와 진정성에 기반해 스스로의 방식으로 대화를 설계하도록 임파워링하기 때문입니다.","we":"Worst(D)는 고객이 직접 할 말의 대본(script)까지 써주어 고객의 고유한 목소리와 자율성을 완전히 대체해 버리는 최악의 컨설팅/대리 행위입니다. A는 외부 모델 강의(Training)이며, C는 '코치의 리드를 따라' 롤플레이를 진행함으로써 주도권을 코치가 쥐는(PCC 마커 8.5 위배) 방식입니다.","c":["2.01","4.02","7.03","7.09","8.03"],"m":["8.5"],"k":["어려운 피드백 대화","직업적으로 그러한 대화를 수없이 촉진해 본 경험","difficult feedback conversation","facilitated many such conversations professionally"],"e":[],"cat":"bank"},{"id":96,"n":"Q96","ty":"bw","t":"'방금 깨달았어요, 제가 늘 누군가의 허락을 기다리고 있었네요!'라는 큰 통찰","se":"Halfway through a session, the client laughs and says, “I just realized I have been waiting for permission.” What is the best coach response?","sk":"세션 절반이 지났을 때 고객이 웃으며 \"방금 깨달았어요. 제가 계속 누군가의 허락을 기다리고 있었네요\"라고 말한다. 최선의 코치 반응은 무엇인가?","o":["Quickly move to action: “What will you do now that you have it?”","Slow down, acknowledge the awareness, and invite the client to explore what “permission” means here, where the waiting started, and what they want to do with this insight.","Provide the client with permission so they can move forward.","Reframe the insight as a small detail and continue."],"ok":["빠르게 실행으로 넘어간다: \"이제 허락을 얻었으니 무엇을 하실 건가요?\"","속도를 늦추고, 그 알아차림을 인정한 뒤, 여기서 '허락'이 무엇을 의미하는지, 그 기다림이 어디서 시작되었는지, 그리고 이 통찰로 무엇을 하고 싶은지 탐색하도록 초대한다.","앞으로 나아갈 수 있도록 코치가 고객에게 허락을 내어준다.","그 통찰을 사소한 세부 사항으로 재구성하고 계속 진행한다."],"b":"B","w":"C","be":"고객이 도달한 중대한 깨달음의 순간에 속도를 늦추어 멈춤과 음미의 공간을 주고, 그 통찰의 핵심 단어('permission')와 뿌리를 깊이 탐색한 뒤 실행과 연결하기 때문입니다.","we":"Worst(C)는 타인의 허락을 기다리던 고객에게 코치가 권위자가 되어 '내가 허락해 주겠다'고 말함으로써 고객의 의존성 패턴을 그대로 재현하고 자율성을 빼앗는 최악의 모순적 행동입니다. A는 통찰이 내면화되기도 전에 성급히 실행으로 몰아붙이는 조급한 반응이며, D는 고객의 소중한 돌파구를 사소한 것으로 축소(minimizing)하는 경청 실패입니다.","c":["4.03","5.07","6.02","7.08","8.01"],"m":["4.1","5.5","6.2","8.4"],"k":["방금 깨달았어요","누군가의 허락을 기다리고 있었네요","I just realized","waiting for permission"],"e":[],"cat":"bank"},{"id":97,"n":"Q97","ty":"bw","t":"세션 진행 중 고객에 대한 강한 부정적 감정이 올라옴을 깨달은 코치","se":"A coach realizes mid-engagement that they have stronger negative feelings about the client than they understood. What is the best coach action?","sk":"코치는 코칭 계약 진행 도중 자신이 고객에 대해 미처 알지 못했던 강한 부정적 감정을 품고 있음을 깨달았다. 최선의 코치 행동은 무엇인가?","o":["Push through and avoid letting the feelings show.","Bring the dynamic to coaching supervision or peer reflection, and consider with care whether to continue, refer, or change something in the engagement.","End the engagement immediately.","Tell the client about the feelings to clear the air."],"ok":["억지로 밀어붙이고 감정이 드러나지 않게 피한다.","그 관계 역동을 코칭 슈퍼비전이나 동료 성찰에 가져가 탐색하고, 계약을 계속할지, 연계할지, 아니면 계약에서 무언가를 바꿀지 신중하게 고려한다.","계약을 즉시 종료한다.","분위기를 풀기 위해 고객에게 그 감정을 털어놓는다."],"b":"B","w":"D","be":"역량 2 정의('필요 시 코칭 슈퍼바이저나 멘토코치와 협력한다') 및 성찰훈련(2.03), 편향 인지(2.04), 외부 자원 도움(2.08)에 따라, 역전이 감정을 안전한 전문적 공간(슈퍼비전)에서 성찰한 뒤 고객의 최선의 이익을 기준으로 거취를 결정하기 때문입니다.","we":"Worst(D)는 코치 자신의 해결되지 않은 부정적 감정을 고객에게 직접 쏟아내어 심리적 안전감과 존중을 파괴하고 고객에게 정서적 해악을 끼치는 최악의 행동입니다. A는 내면의 편향과 역전이를 방치한 채 억지로 진행하는 비성찰적 태도이며, C는 슈퍼비전 성찰이나 책임 있는 연계 절차 없이 충동적으로 관계를 끊어버리는 극단적 대응입니다.","c":["1.07","2.03","2.04","2.06","2.08"],"m":[],"k":["강한 부정적 감정","미처 알지 못했던","stronger negative feelings about the client"],"e":["3.3","4.2","4.3"],"cat":"bank"},{"id":98,"n":"Q98","ty":"bw","t":"'더 용감해지고 싶어요'라는 고객과 실행을 설계하는 역량 8의 개입","se":"A client says, “I want to be braver.” Which Competency 8 move best partners with the client to design action?","sk":"고객이 \"더 용감해지고 싶어요\"라고 말한다. 실행을 설계하기 위해 고객과 가장 잘 파트너십을 맺는 역량 8의 개입은 무엇인가?","o":["Assign three brave actions for the week.","Explore with the client what “brave” looks like in the contexts they care about, and partner with them to design one small, meaningful step they want to try.","Recommend a stretch goal that is significantly outside the client’s comfort zone.","Tell the client to “feel the fear and do it anyway.”"],"ok":["이번 주를 위한 세 가지 용감한 행동을 과제로 부여한다.","고객이 소중히 여기는 맥락에서 '용감함'이 어떤 모습인지 함께 탐색하고, 고객이 시도해 보고 싶은 작고 의미 있는 한 걸음을 설계하도록 파트너십을 맺는다.","고객의 안전지대를 크게 벗어나는 도전적 목표를 추천한다.","고객에게 \"두려움을 느끼더라도 어쨌든 해내라\"고 말한다."],"b":"B","w":"A","be":"추상적 가치('용감함')를 고객의 고유한 맥락 안에서 구체화하고, 고객의 자율성을 존중하여 스스로 의미 있고 실행 가능한 작은 한 걸음을 설계하도록 파트너십을 맺기 때문입니다.","we":"Worst(A)는 코치가 일방적으로 3가지 과제를 할당(Assign)하여 PCC 마커 8 위배('코치가 처방한 특정 행동을 수행하도록 지시함')에 정확히 해당하는 최악의 선택입니다. C는 코치가 임의로 무리한 목표를 추천하는 컨설팅 방식이며, D는 코칭 탐색 대신 동기부여 명언을 읊어주는 설교(Telling)입니다.","c":["6.02","7.09","8.02","8.03"],"m":["8.5"],"k":["\"더 용감해지고 싶어요\"","실행을 설계하기 위해","“I want to be braver.”","design action"],"e":[],"cat":"bank"},{"id":99,"n":"Q99","ty":"mc4","t":"코칭(Coaching)과 교육/훈련(Training)의 가장 정확한 구분","se":"Which best distinguishes coaching from training?","sk":"코칭과 교육/훈련(training)을 가장 잘 구분 짓는 설명은 무엇인가?","o":["Coaching partners with the client to develop their own thinking and capacity; training transfers a defined body of knowledge or skills from a curriculum to learners.","Coaching has tests; training does not.","Coaching is one-on-one; training is group.","Coaching is more expensive than training."],"ok":["코칭은 고객이 스스로의 사고와 역량을 개발하도록 파트너십을 맺는 반면, 교육/훈련은 정해진 커리큘럼으로부터 규정된 지식이나 기술 체계를 학습자에게 전달한다.","코칭에는 시험이 있고, 교육에는 없다.","코칭은 일대일이고, 교육은 그룹이다.","코칭이 교육보다 더 비싸다."],"b":"A","w":null,"be":"코칭의 핵심 프로세스('수평적 파트너십을 통한 고객 내면의 사고·역량 개발')와 교육/훈련의 핵심 프로세스('커리큘럼 기반의 정해진 지식·스킬 전수')라는 본질적 차이를 가장 정확히 정의했기 때문입니다.","we":"Worst(B)는 오히려 교육·훈련 과정에 평가 시험이 동반되는 경우가 많고 코칭 세션에는 시험이 없음에도 사실관계를 정반대로 서술한 최악의 오답입니다. C(인원 규모)와 D(비용 수준)는 본질적 구분 기준이 아닙니다.","c":["1.06","3.01"],"m":[],"k":["코칭과 교육/훈련(training)","가장 잘 구분 짓는","distinguishes coaching from training"],"e":["1.1","3.7"],"cat":"bank"},{"id":100,"n":"Q100","ty":"bw","t":"세션 종료 시 '감사합니다, 오늘 정말 제 이야기가 경청되었다고 느꼈어요'라는 고객","se":"A client ends a session by saying, “Thank you—I really felt heard today.” What is the best coach response?","sk":"고객이 세션을 마치며 \"감사합니다—오늘 정말 제 이야기가 온전히 경청되었다고 느꼈어요\"라고 말한다. 최선의 코치 반응은 무엇인가?","o":["Tell the client what made them so easy to hear.","Acknowledge the client’s experience, and invite a brief reflection on what felt different—without making the closing about the coach.","Promise the same in every future session.","Move quickly to scheduling the next session."],"ok":["고객의 이야기를 듣기 쉬웠던 이유를 고객에게 말해 준다.","고객의 경험을 인정하고, 마무리의 초점을 코치에게 돌리지 않으면서 무엇이 다르게 느껴졌는지 짧은 성찰을 초대한다.","앞으로의 모든 세션에서도 똑같을 것이라고 약속한다.","다음 세션 일정을 잡는 것으로 빠르게 넘어간다."],"b":"B","w":"A","be":"고객이 느낀 긍정적 경험을 따뜻하게 인정하되, 칭찬의 주인공을 코치로 만들지 않고(Egoless) 고객 자신이 경험한 변화와 학습을 내면화하도록 성찰로 초대하기 때문입니다.","we":"Worst(A)는 고객의 감사를 코치 자신의 평가적 칭찬('당신이 말하기 쉬워서 그랬다')으로 받아치며 대화의 초점을 코치의 평가 기준으로 돌려버리는 비코칭적 반응입니다. C는 미래의 모든 세션 경험을 과도하게 장담하는 비현실적 약속이며, D는 고객이 표현한 소중한 정서적 울림과 마무리의 의미를 성찰할 시간 없이 곧바로 행정 절차(일정 잡기)로 넘어가는 삭막한 종료입니다.","c":["4.05","8.01","8.06","8.09"],"m":["8.2","8.9"],"k":["세션을 마치며","오늘 정말 제 이야기가 온전히 경청되었다고 느꼈어요","ends a session","really felt heard today"],"e":[],"cat":"bank"},{"id":145,"n":"SJT-01","cat":"sjt","ty":"bw","t":"요약하기(Summarizing) vs 재진술하기(Paraphrasing)의 구분","se":"A coach wants to check her understanding partway through a session. What distinguishes summarizing from paraphrasing?","sk":"세션 중간에 자신의 이해를 점검하려는 코치에게, '요약하기(Summarizing)'와 '재진술하기(Paraphrasing)'를 구분 짓는 차이는 무엇인가?","o":["Summarizing uses the coach's words while paraphrasing keeps the client's exact words.","Summarizing draws together a stretch of what was said while paraphrasing restates one piece.","Summarizing belongs at the close of a session while paraphrasing belongs midway through.","Summarizing and paraphrasing both restate what the client said, but summarizing is us
