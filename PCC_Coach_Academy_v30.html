ually shorter."],"ok":["요약은 코치의 단어를 쓰고 재진술은 고객의 정확한 단어를 유지한다.","요약은 고객이 말한 긴 흐름(덩어리)을 하나로 묶어내는 것이고, 재진술은 한 부분을 다시 말하는 것이다.","요약은 세션 마무리에, 재진술은 세션 중간에 속한다.","요약과 재진술은 모두 고객이 말한 내용을 다시 표현하지만, 요약이 일반적으로 더 짧다는 점만 다르다."],"b":"B","w":"C","be":"요약(Summarizing)은 세션 중 고객이 길게 이야기한 여러 생각의 흐름(a stretch of what was said)을 간결하게 하나로 묶어주는 것이며, 재진술(Paraphrasing)은 고객의 특정 발언 한 부분(one piece)을 되짚어 확인하는 것입니다.","we":"Worst(C)는 요약과 재진술을 세션 시점(마무리 vs 중간)으로 기계적으로 나누는 트레이너/퍼실리테이터 관점의 오답입니다. A는 단어 주체를 반대로 서술했습니다(보통 요약 시 고객의 핵심 단어를 살리고 재진술 시 코치의 언어로 확인하기도 함).","c":["6.02"],"m":["6.7"],"k":[],"e":[]},{"id":146,"n":"SJT-02","cat":"sjt","ty":"bw","t":"병원 복도에서 접속한 고객의 면접 준비 세션","se":"Session 4 of 9 with a client working on a career transition. The client joins the video call from a hospital corridor and says her mother was admitted overnight: \"I nearly cancelled, but I have been looking forward to this all week long and I want 40 minutes of something that is my role.\" The client looks exhausted. The agreed topic for today was interview preparation. The coach notices a strong urge to tell her to go and be with her family.","sk":"경력 전환 코칭 9회기 중 4회기. 고객이 병원 복도에서 화상 통화에 접속해 어머니가 밤새 입원하셨다고 말한다. 고객은 \"취소하려 했지만 일주일 내내 이 시간을 기다렸고, 온전히 제 역할을 위한 40분을 갖고 싶어요\"라고 말하나 몹시 지쳐 보인다. 오늘 합의된 주제는 면접 준비다. 코치는 가족 곁으로 가라고 말해주고 싶은 강한 충동을 느낀다.","o":["Say what the coach is seeing and hearing in what she has just described, and then ask her what she wants this 40 minutes to be.","Explain that coaching is not appropriate while she is in the middle of a crisis, and pause the engagement until things have settled.","Suggest gently that she should be with her family right now and offer to reschedule the session at no charge.","Acknowledge briefly what she has told the coach, then move to the interview preparation as agreed, since that is what she said she wanted."],"ok":["코치가 보고 들은 것을 그대로 말해주고, 이 40분이 어떤 시간이 되기를 원하는지 묻는다.","위기 상황에서는 코칭이 부적절하다고 설명하고 상황이 정리될 때까지 코칭을 일시 중단한다.","지금 가족과 함께 있어야 한다고 부드럽게 제안하며 무료로 일정을 변경해주겠다고 한다.","고객의 말을 짧게 인정한 뒤, 그녀가 원한다고 말했으므로 합의된 면접 준비로 바로 넘어간다."],"b":"A","w":"B","be":"고객의 비언어적 신호(지쳐 보임)와 상황(병원 복도)에 대한 관찰을 비판단적으로 공유(역량 6.04)한 뒤, 이 40분을 어떻게 쓰고 싶은지 고객에게 선택권과 재합의 권한(역량 3.06)을 돌려주는 최선의 파트너십입니다.","we":"Worst(B)는 고객의 자율성을 완전히 박탈하고 코치가 일방적으로 '위기'라고 진단하여 코칭을 중단시키는 비파트너십적 행동입니다. 중간 오답 중 D는 그녀의 말을 존중해 기존 합의대로 진행하므로 꽤 효과적인 차선책이나 관찰 공유를 생략했고, C는 '부드럽게 제안'이라는 표현 덕분에 B보다는 덜 일방적이지만 코치의 가치관을 투사했습니다.","c":["3.06","4.04","4.05","6.04"],"m":["3.1"],"k":[],"e":[]},{"id":147,"n":"SJT-03","cat":"sjt","ty":"bw","t":"코칭 마인드셋에서 자기 인식과 직관 활용의 목적","se":"According to the Coaching Mindset competency, toward what end does a coach use awareness of self and intuition?","sk":"'코칭 마인드셋' 역량에 따르면, 코치는 어떤 목적을 위해 자기 인식과 직관을 활용하는가?","o":["To check whether the client's stated goal is the right one to pursue and steer the session elsewhere if the coach's sense of it differs.","To serve the client's own learning and progress, which is the test any intuition has to pass before it is offered.","To arrive at a working diagnosis of what the client needs so that the coach can choose interventions that fit the underlying issue.","To help the coach decide which topic should take priority based on professional experience."],"ok":["고객이 진술한 목표가 추구하기에 옳은 것인지 점검하고 코치의 느낌과 다르면 세션을 다른 곳으로 이끌기 위해.","고객 자신의 학습과 진전에 기여하기 위해(이는 직관을 제시하기 전에 통과해야 할 기준이다).","근본 이슈에 맞는 개입을 선택할 수 있도록 고객에게 필요한 것에 대한 잠정적 진단을 내리기 위해.","코치의 전문적 경험을 바탕으로 어떤 주제를 우선적으로 다룰지 결정하기 위해."],"b":"B","w":"C","be":"직관은 코치의 판단이나 에고를 위한 것이 아니라 오직 고객의 유익(학습과 진전, 역량 2.05)을 위해서만 사용되어야 하기 때문입니다.","we":"Worst(C)는 상담/컨설팅의 '잠정적 진단(working diagnosis)' 및 '개입 선택'이라는 비코칭적 역할을 전제로 합니다. A는 역량 3(합의)의 맥락을 왜곡해 코치의 느낌대로 세션을 조종하려 하는 오답입니다.","c":["2.05"],"m":[],"k":[],"e":[]},{"id":148,"n":"SJT-04","cat":"sjt","ty":"bw","t":"20년 공급망 임원 출신 코치에게 '자체 생산 vs 외주' 정답을 요구하는 고객","se":"A coach spent 20 years as a supply chain executive before training as a coach, and the client knows it. In a third session, the client, newly appointed as an operations director, lays out a make-or-buy decision in detail, names two options, and says, \"You have actually done this before. Just tell me—what would you do? I'll pay for the answer; that is worth more to me than another question.\" The coaching agreement describes coaching and does not include advisory services.","sk":"코치는 과거 20년간 공급망 임원으로 일했고 고객도 이를 안다. 3회기에서 신임 운영 이사가 '자체 생산 vs 외주' 의사결정을 상세히 설명하며 \"코치님은 이걸 해보셨잖아요. 코치님이라면 어떻게 하실지 그냥 알려주세요. 질문 하나 더 받는 것보다 답을 듣는 게 훨씬 가치 있고 비용도 지불할게요\"라고 말한다. 코칭 계약에는 자문 서비스가 포함되어 있지 않다.","o":["Ask what having the answer would give her, and keep coaching her own reasoning about the decision.","Offer the coach's experience once, name it as experience rather than recommendation, and hand the decision back to her.","Give her a recommendation and tell her that is what coaching at a senior level looks like.","Give her the recommendation she asked for since she has done the analysis, and return to coaching for the rest of the session."],"ok":["답을 얻는 것이 그녀에게 무엇을 가져다줄지 묻고, 의사결정에 대한 그녀 자신의 추론을 계속 코칭한다.","코치의 경험을 한 번 공유하되 권고가 아닌 경험임을 명시하고 결정권을 그녀에게 돌려준다.","권고안을 제시하며 이것이 시니어 레벨 코칭의 모습이라고 말한다.","이미 분석을 마쳤으므로 요청한 권고안을 주고 나머지 시간은 코칭으로 돌아간다."],"b":"A","w":"C","be":"계약서에 자문(advisory)이 제외되어 있고 본 문항은 역량 1.06(코칭과 컨설팅/자문의 역할 구분)을 묻고 있으므로, 조언 대신 '그 답을 얻으면 무엇이 달라지는지'를 물으며 코칭의 본질을 지키는 A가 최선입니다.","we":"Worst(C)는 자문을 제공하면서 심지어 '시니어 코칭은 원래 이런 것'이라며 코칭의 정의 자체를 왜곡하는 심각한 윤리적·전문직 정체성 위반입니다. 중간 오답 중 B는 역량 7.11의 경험 공유에 가까우나 계약 외 자문 요청에 응하는 셈이 되어 차선이고, D는 권고안을 주되 나머지 시간은 코칭으로 돌아가므로 C보다는 덜 나쁩니다.","c":["1.06","3.01","3.02"],"m":[],"k":[],"e":[]},{"id":149,"n":"SJT-05","cat":"sjt","ty":"bw","t":"코칭 합의 재검토(Revisiting) vs 단순 방향 전환의 차이","se":"What separates revisiting the coaching agreement from simply changing direction partway through an engagement?","sk":"코칭 과정 도중 '코칭 합의를 재검토(revisiting)하는 것'과 단순히 '방향을 바꾸는 것'을 구분 짓는 기준은 무엇인가?","o":["Revisiting is done with the client and produces a new shared agreement about the work.","Revisiting requires a written amendment to the contract while a change of direction requires the client's consent.","Revisiting happens between sessions at review points while a change of direction happens inside a session.","Revisiting may include clarifying the original agreement even when the overall direction remains unchanged."],"ok":["재검토는 고객과 함께 이루어지며 작업에 대한 새로운 공유된 합의를 도출한다.","재검토는 서면 계약 수정을 필요로 하고 방향 전환은 고객의 동의를 필요로 한다.","재검토는 세션 간 리뷰 시점에 일어나고 방향 전환은 세션 내부에서 일어난다.","전체 방향이 그대로 유지되더라도 기존 합의의 의미를 명확히 하기 위해 재검토할 수 있다."],"b":"A","w":"B","be":"역량 3의 핵심은 '관계의 공동구축'과 '파트너십'이므로, 합의를 재검토한다는 것은 고객과 함께(with the client) 새로운 공유된 합의(new shared agreement)를 도출하는 과정이기 때문입니다.","we":"Worst(B)는 서면 계약 수정이라는 형식적·행정적 요건(Overreach)으로 개념을 왜곡했습니다. C는 시점(세션 간 vs 세션 내)으로 구분하는 임의적 기준입니다.","c":["3.12"],"m":["3.1"],"k":[],"e":[]},{"id":150,"n":"SJT-06","cat":"sjt","ty":"bw","t":"추운 방에서 코트를 입은 채 팔짱을 끼고 대답이 짧아진 고객","se":"Fifth of eight sessions, in person, with a client who leads a regional team. She has been open and animated for most of the hour. When the coach asks about the report she owes her director, she folds her arms, turns her chest slightly away, and her answers get shorter. The room is cold, and she kept her coat on when she arrived. The coach cannot tell whether he is seeing discomfort with the topic, the temperature, or something he is reading into her. She says, \"There is not much to say about it. It will get done.\"","sk":"8회기 중 5회기 대면 코칭. 내내 활기차던 고객이 이사에게 제출할 보고서 질문을 받자 팔짱을 끼고 몸을 약간 돌리며 대답이 짧아진다. 방이 추워서 도착했을 때부터 코트를 입고 있었다. 코치는 이것이 주제에 대한 불편함인지, 추위 때문인지, 자신의 추측인지 확신할 수 없다. 고객은 \"그건 별말 할 게 없어요. 알아서 될 거예요\"라고 말한다.","o":["Name the change as discomfort with the report and ask why it is hard.","Describe just what he noticed about the change and ask her what she makes of it.","Ask her what is happening for her right now without mentioning anything he has noticed, and wait for whatever comes.","Keep the observation to himself, note it for later, and continue with the topic they agreed for the session."],"ok":["그 변화를 보고서에 대한 불편함이라고 명명하고 왜 어려운지 묻는다.","변화에 대해 관찰한 사실만을 그대로 묘사하고, 그녀에게 그것이 어떤 의미인지(어떻게 해석하는지) 묻는다.","관찰한 것은 전혀 언급하지 않은 채 지금 그녀에게 무슨 일이 일어나고 있는지 묻고 기다린다.","관찰을 혼자 간직하고 나중에 쓰기 위해 메모해 둔 뒤 합의된 주제로 계속 진행한다."],"b":"B","w":"A","be":"코치가 추측(불편함 vs 추위)을 단정 짓지 않고 관찰한 신체 변화만 투명하게 공유한 뒤 해석을 고객에게 맡기는(PCC 마커 6.4 & 7.5) 교과서적인 개입이기 때문입니다.","we":"Worst(A)는 코치가 성급하게 '불편함'이라고 분석·단정(interpreting)한 데다 방어를 유발하는 'Why' 질문까지 던집니다. C는 고객의 자기 인식을 신뢰하나 관찰을 공유하지 않아 고객이 자신의 신체 변화를 인지하지 못할 수 있는 차선책이고, D는 관찰을 혼자 간직해 묵살하는 소극적 오답입니다.","c":["5.02","5.06","6.04"],"m":["6.4"],"k":[],"e":[]},{"id":151,"n":"SJT-07","cat":"sjt","ty":"bw","t":"동료의 일을 떠맡는 패턴을 가졌다고 코치가 확신하는 고객","se":"An internal coach is in his seventh session with a client in a shared services team. He has become convinced that she has a pattern of absorbing colleagues' work. Reviewing his notes before the session, he finds two clear examples, and a third he now thinks may belong to a different client he sees on the same day. Today she says, \"Priya's report was due Friday and she has been out, so I said I would pick it up. It made sense; I had the data.\" She says it lightly and moves toward the topic she booked for the session, which is her development plan.","sk":"사내 코치가 7회기 세션 중이다. 코치는 고객이 동료의 일을 떠맡는 패턴이 있다고 확신하며, 세션 전 노트를 보니 2건의 명확한 사례와 다른 고객과 헷갈린 듯한 1건이 있다. 오늘 고객은 \"프리야의 보고서가 금요일 마감인데 부재중이라 제가 맡겠다고 했어요. 제가 데이터가 있으니 합리적이죠\"라고 가볍게 말하고는 본래 예약한 주제인 자신의 개발 계획으로 넘어가려 한다.","o":["Describe the two occasions he can actually point to and ask her whether they connect to what she has just said about the report.","Tell the client that she has a clear pattern of absorbing other people's work and ask her where in her history that began.","Name the pattern as a boundary problem and propose the remaining sessions be used to build her ability to decline requests.","Ask the client what she notices about how requests like Priya's report tend to go for her when they come up at work."],"ok":["실제로 짚을 수 있는 두 가지 사례를 묘사하고 방금 말한 보고서 건과 연결되는지 묻는다.","고객에게 남의 일을 떠맡는 명확한 패턴이 있다고 말하고 과거 역사 중 어디서 시작되었는지 묻는다.","그 패턴을 '경계 설정 문제'로 명명하고 남은 회기를 거절 능력을 키우는 데 쓰자고 제안한다.","직장에서 프리야의 보고서 같은 요청이 들어올 때 일이 어떻게 흘러가는 경향이 있는지 고객 스스로 무엇을 알아차리는지 묻는다."],"b":"D","w":"C","be":"코치가 미리 단정한 패턴을 주입(확인 편향)하지 않고, 고객 스스로 자신의 행동 패턴을 탐색하고 알아차리도록 개방형 질문을 던지는(역량 6.06, 7.08) 최선의 선택이기 때문입니다.","we":"Worst(C)는 코치가 일방적으로 '경계 문제'라고 진단·라벨링하고 고객이 원한 주제(개발 계획)를 무시한 채 코치 아젠다대로 남은 세션을 쓰자고 제안하는 최악의 통제입니다. A는 헷갈린 1건을 제외하고 2건의 사실만 공유해 연결을 묻는 준수한 차선책이며, B는 패턴을 단정하고 치료적 과거 탐색으로 흐르는 오답입니다.","c":["6.06","7.08"],"m":["7.1"],"k":[],"e":[]},{"id":152,"n":"SJT-08","cat":"sjt","ty":"bw","t":"6개월 파일럿 취소 후 '실패했다'는 단어를 세 번 반복하는 고객","se":"A client is in her fifth session, and the pilot she has led for six months was cancelled the previous week when the sponsoring executive changed priorities. She opens with, \"I failed. Six months and nothing to show for it. This is what it comes down to.\" She used the word \"failed\" three more times in the opening minutes.","sk":"5회기 고객이 6개월간 이끈 파일럿 프로젝트가 스폰서 임원의 우선순위 변경으로 지난주 취소되었다. 고객은 \"전 실패했어요. 6개월 동안 보여줄 게 아무것도 없어요\"라며 초반 몇 분 동안 '실패했다(failed)'는 단어를 세 번 더 사용한다.","o":["Ask her what she takes from the six months that she did not have before the pilot began.","Ask her how she is defining failure here, and what other ways there might be to describe what the six months produced.","Offer that the pilot produced information that the organization did not have, and suggest she describe it that way to others when she sends the email.","Tell her that calling it a failure is not serving her, and ask her to describe the same six months in positive terms."],"ok":["파일럿 시작 전에는 없었지만 지난 6개월에서 얻은 것이 무엇인지 묻는다.","여기서 '실패'를 어떻게 정의하고 있는지, 그리고 지난 6개월이 만들어낸 결과를 묘사할 수 있는 다른 방식에는 무엇이 있을지 묻는다.","파일럿이 조직에 없던 정보를 만들어냈다고 말해주며 이메일을 보낼 때 그렇게 묘사하라고 제안한다.","그것을 실패라고 부르는 것은 그녀에게 도움이 되지 않는다고 말하며 같은 6개월을 긍정적인 용어로 묘사해보라고 요청한다."],"b":"B","w":"D","be":"고객이 반복 사용한 핵심 단어('실패')의 의미를 먼저 탐색(역량 6.02, PCC 마커 6.2)한 뒤, 고객 스스로 다른 관점을 탐색하도록 초대(역량 7.04, 7.10)하는 가장 정교한 PCC/MCC 수준 개입이기 때문입니다.","we":"Worst(D)는 고객의 좌절과 애도 과정을 무시하고 코치가 일방적으로 '그 생각은 도움이 안 된다'고 판단하며 '긍정적 사고'를 강요(강제 리프레이밍)합니다. A는 얻은 것을 묻는 좋은 질문이나 '실패' 단어 정의 탐색이 빠진 차선책이고, C는 코치가 해석과 이메일 작성법까지 제안하는 컨설팅 방식입니다.","c":["6.02","7.03","7.04","7.10"],"m":["6.2"],"k":[],"e":[]},{"id":153,"n":"SJT-09","cat":"sjt","ty":"bw","t":"그룹 코칭 세션 종료 시 파트너십 방식","se":"A group coaching session is approaching its agreed end. What does partnering to close the session look like with a group?","sk":"그룹 코칭 세션이 합의된 종료 시간에 다가가고 있다. 그룹과 함께 세션을 종료하기 위해 파트너십을 맺는 모습은 어떠한가?","o":["Ask the group how it wants to complete the session within the time limit.","Ending when the most senior member signals that the group is done, since the group follows their lead.","Running a fixed closing round in which each member states one action before leaving.","Invite members to share one insight each, without prescribing a specific action for the group."],"ok":["제한 시간 내에 세션을 어떻게 마무리하고 싶은지 그룹에 묻는다.","그룹이 리더를 따르므로 가장 선임 구성원이 끝났다는 신호를 보낼 때 종료한다.","나가기 전에 각 구성원이 한 가지 행동을 말하는 고정된 마무리 라운드를 진행한다.","그룹에 특정 행동을 지정하지 않고 각 구성원이 통찰을 하나씩 나누도록 초대한다."],"b":"A","w":"B","be":"역량 8.09(고객과 협력하여 세션을 종료한다) 및 PCC 마커 8.9에 따라 개인뿐 아니라 그룹 코칭에서도 마무리 방식을 그룹 전체에게 묻는 것이 정답입니다.","we":"Worst(B)는 그룹 전체의 파트너십을 무시하고 가장 선임 구성원 한 명의 눈치를 보며 종료하는 위계적 태도입니다. C는 퍼실리테이터/트레이너의 고정 체크아웃 루틴으로 그룹의 자율적 마무리 선택권을 생략한 오답입니다.","c":["8.09"],"m":["8.9"],"k":[],"e":[]},{"id":154,"n":"SJT-10","cat":"sjt","ty":"bw","t":"6개월 신임 교장 그룹 코칭 마지막 세션에서의 유지와 영업 경계","se":"Eight participants are in the final session of a six-month group coaching program for newly appointed principals. In the last half hour, one participant says, what several are nodding at: \"My worry is February, when it's dark and the inspection is coming and none of you are in the room. I will go straight back to doing everything myself.\" Another says, \"Same.\" The program ends today, and there is no continuation offer. Forty minutes remain.","sk":"신임 교장들을 위한 6개월 그룹 코칭 프로그램의 마지막 세션(40분 남음). 한 참여자가 \"제 걱정은 2월이에요. 날도 어둡고 감사가 다가오는데 여러분이 곁에 없으면 예전처럼 모든 걸 혼자 처리하는 방식으로 돌아갈까 봐요\"라고 말하자 여럿이 고개를 끄덕인다. 프로그램은 오늘 종료되며 후속 과정 제안은 없다.","o":["Give the group the practices that earlier cohorts have used to keep going after the program ends, so that they leave with something.","Ask the group what they want to keep doing without the sessions, and what would tell them it's slipping.","Propose a paid monthly continuation group so the members do not lose what they have built.","Ask each participant to name what they most want to be still doing when Friday comes, and write the list up."],"ok":["빈손으로 가지 않도록 이전 기수들이 프로그램 종료 후 지속하기 위해 사용했던 실천법들을 알려준다.","세션 없이도 계속 유지하고 싶은 것이 무엇인지, 그리고 그것이 무너지고 있음을 알려줄 신호는 무엇일지 그룹에 묻는다.","쌓아온 것을 잃지 않도록 유료 월간 후속 그룹을 제안한다.","각 참여자에게 금요일이 왔을 때 여전히 하고 있기를 가장 바라는 것을 말하게 하고 목록으로 적는다."],"b":"B","w":"C","be":"그룹 스스로 코칭 종료 후 유지할 실행과 자가 점검(책무) 기준을 설계하도록 초대(역량 8.02, 8.07, PCC 마커 8.7)하는 최선의 개입이기 때문입니다.","we":"Worst(C)는 세션 도중 코칭의 순수성을 해치고 유료 상품을 영업(Sales)하는 행위로 역할 경계 및 윤리를 훼손합니다. D는 개인별 목표를 묻는 차선책이나 그룹 공동의 유지·점검 전략이 빠졌고, A는 이전 기수의 모범 답안을 주입하는 컨설팅 방식입니다.","c":["1.01","3.02","8.02","8.07"],"m":["8.6"],"k":[],"e":[]},{"id":155,"n":"SJT-11","cat":"sjt","ty":"bw","t":"[역량 1] HR이 의무적(Mandatory)으로 지정한 코칭에 방어적인 강등 팀원","se":"The coach has been asked to work with a team member who was recently demoted. Human Resources has described the coaching as mandatory. During the intake session, the client appears defensive and hesitant to engage in the process.","sk":"최근 강등된 팀원과 일해달라는 요청을 받았고 HR은 코칭이 의무적(mandatory)이라고 설명했다. 인테이크 세션에서 고객은 방어적이고 참여를 주저한다.","o":["Acknowledge the client's hesitation and partner to clarify the purpose of the coaching, exploring what the client wants from the process while reinforcing that participation must be a choice.","Continue with the session as planned while respectfully avoiding the discomfort, and assume the client will eventually open up once they experience the coaching process over time.","Focus on easing the tension by shifting to informal conversation about the client's background and daily life, hoping this will naturally lead into more engagement with the coaching topic.","Reassure the client by explaining that coaching is confidential and supportive, while avoiding the deeper exploration of their defensiveness or resistance to the mandatory nature of the engagement."],"ok":["고객의 주저함을 인정하고 코칭의 목적을 명확히 하기 위해 파트너십을 맺으며, 참여는 반드시 선택이어야 함을 강조하면서 고객이 이 과정에서 무엇을 원하는지 탐색한다.","불편함을 정중히 피하면서 계획대로 세션을 진행하고 시간이 지나면 마음을 열 것이라 가정한다.","긴장을 풀기 위해 일상적인 대화로 주제를 돌려 자연스럽게 참여하길 바란다.","비밀보장과 지지를 설명하며 안심시키되 의무적 성격에 대한 방어심이나 저항의 깊은 탐색은 피한다."],"b":"A","w":"B","be":"고객의 주저함을 즉시 인정하고 코칭 참여의 자발성(choice)과 목적을 투명하게 합의하며 고객이 원하는 바를 탐색하기 때문입니다.","we":"Worst(2)는 불편함을 회피하고 나중에 나아질 것이라 미루며(postponing) 계획대로 밀어붙이는 'Miss, Dismiss, Minimize'의 전형입니다. 4번은 비밀보장을 안내해 안심시킨 점은 좋으나 저항 탐색을 회피했고, 3번은 일상 대화로 화제를 돌려 문제를 축소(minimizing)한 중간 오답입니다.","c":["1.01","1.04","2.01","3.01"],"m":[],"k":[],"e":[]},{"id":156,"n":"SJT-12","cat":"sjt","ty":"bw","t":"[역량 2] 세션 후 자신이 평소보다 지시적이었음을 자각한 코치의 성찰","se":"The coach has been working with the co-founder of a small creative agency who is navigating team restructuring and burnout. After a recent session, the coach realizes they might have been more directive than usual, offering suggestions and filling silence instead of allowing the client space to explore their own thinking. The session felt less collaborative than others, and the coach is left feeling uncertain about their effectiveness.","sk":"최근 세션 후 코치는 자신이 평소보다 지시적이었고 제안을 건네며 침묵을 채웠음을 깨닫고 효과성에 의문을 느낀다.","o":["Assume that the client needed direction, and repeat the same approach in upcoming sessions.","Spend the first part of the next session asking the client for feedback.","Trust their coaching training, believe that they do offer value, and give themselves a pep talk.","Journal what contributed to this shift in style and identify ways to improve."],"ok":["고객에게 지시가 필요했다고 가정하고 다음 세션에서도 같은 방식을 반복한다.","다음 세션 초반부를 고객에게 피드백을 구하는 데 쓴다.","자신의 코칭 훈련을 믿고 가치가 있다고 스스로를 다독인다.","이러한 스타일 변화에 무엇이 기여했는지 저널링(성찰 일지 작성)하고 개선 방법을 찾는다."],"b":"D","w":"A","be":"역량 2.03('코치는 코칭능력을 향상시키기 위해 성찰훈련을 지속한다')을 직접 실천하는 자기 성찰 행동이기 때문입니다.","we":"Worst(1)는 고객의 필요를 코치가 자의적으로 가정(assuming)하고 비코칭적 지시 방식을 반복하는 최악의 비성찰입니다. 2번은 고객 시간을 코치 평가에 쓰는 미흡함(차선)이고, 3번은 성찰 없이 자기 위로로 문제를 덮어버리는 태도입니다.","c":["2.03","2.08"],"m":[],"k":[],"e":[]},{"id":157,"n":"SJT-13","cat":"sjt","ty":"bw","t":"[역량 3] 기업 스폰서의 커리어 코칭 의뢰와 소통 스킬 교육 병행 기회","se":"The sponsor, a senior leader at a multinational corporation, approaches the coach to support their team through career coaching. The sponsor emphasizes a need to improve the team's communication skills. The coach, who also offers communication skills training, sees an opportunity to contribute in both capacities.","sk":"다국적 기업의 고위 리더(스폰서)가 팀의 커리어 코칭을 의뢰하며 팀의 소통 스킬 향상을 강조한다. 소통 스킬 교육(training)도 제공하는 코치는 두 가지 역할을 모두 할 기회를 본다.","o":["Refuse to accept the client, stating that combining training and coaching is not possible within ethical boundaries.","Clarify the distinction between coaching and training and initiate a conversation to define roles and expectations.","Begin offering communication skills training while labeling the engagement as coaching.","Delay checking that the sponsor understands the difference between coaching and training."],"ok":["윤리적 경계상 교육과 코칭을 결합할 수 없다며 고객 수락을 거절한다.","코칭과 교육의 차이를 명확히 설명하고 역할과 기대치를 정의하는 대화를 시작한다.","계약을 코칭이라고 부르면서 소통 스킬 교육을 제공하기 시작한다.","스폰서가 코칭과 교육의 차이를 이해하고 있는지 확인하는 것을 미룬다."],"b":"B","w":"C","be":"역량 1.06 및 3.01에 따라 코칭과 트레이닝의 차이를 명확히 밝히고 역할·기대치를 투명하게 합의하는 대화를 시작하기 때문입니다.","we":"Worst(3)는 실제론 교육을 하면서 '코칭'이라는 이름을 붙이는 명백한 윤리 강령 및 합의 위반입니다. 1번은 역할 분리 후 병행이 가능함에도 무조건 거절하는 과잉 해석(Overreach)이고, 4번은 확인을 미루는(postponing) 부적절한 지연입니다.","c":["1.06","3.01","3.02"],"m":[],"k":[],"e":[]},{"id":158,"n":"SJT-14","cat":"sjt","ty":"bw","t":"[역량 4] 집단주의 문화 출신 글로벌 리더의 서구식 리더십 적응 압박","se":"The client, a senior leader in a global organization, expresses feeling pressured to conform to Western leadership styles. They share that they come from a collectivist culture where collaboration is valued more than individual performance. The client is struggling to reconcile these differences in their role.","sk":"글로벌 조직의 고위 리더인 고객이 서구식 리더십 스타일에 맞춰야 한다는 압박감을 토로하며, 개인 성과보다 협력을 중시하는 집단주의 문화 출신이라 역할 내 차이를 조율하기 힘들다고 말한다.","o":["Explore how the client's cultural background influences their leadership style to seek understanding.","Suggest the client adapt to Western styles to succeed in the organization and accomplish their goals.","Focus only on meeting the company's stakeholder goals aligned to the client's goals before addressing the cultural context.","Ask the client open-ended, solution-focused questions to uncover insights and to encourage steady progress."],"ok":["이해를 구하기 위해 고객의 문화적 배경이 리더십 스타일에 어떤 영향을 미치는지 탐색한다.","조직에서 성공하고 목표를 달성하기 위해 서구식 스타일에 적응하라고 제안한다.","문화적 맥락을 다루기 전에 고객 목표와 정렬된 회사 이해관계자 목표 달성에만 집중한다.","통찰을 발견하고 꾸준한 진전을 격려하기 위해 개방형 해결 중심 질문을 한다."],"b":"A","w":"B","be":"고객의 문화적 정체성·맥락 가방(Culture & Identity Bag)을 존중하고 이해하려는 안전감 조성의 핵심 행동이기 때문입니다.","we":"Worst(2)는 고객의 문화적 정체성을 부정하고 서구 스타일에 순응하라고 지시·제안하는 문화 침해적 태도입니다. 4번은 좋은 해결 중심 질문처럼 보이나 문화적 맥락을 건너뛰는 함정이고, 3번은 문화적 맥락을 뒤로 미루는(postponing) 오답입니다.","c":["1.02","4.01","4.02","6.01"],"m":["4.1"],"k":[],"e":[]},{"id":159,"n":"SJT-15","cat":"sjt","ty":"bw","t":"[역량 5] 팀 갈등을 말하며 긴장된 어조와 닫힌 자세를 보이는 금융사 임원","se":"The client, an executive in a financial services firm, begins the session by describing a recent conflict with their leadership team. Their tone is tense, posture is closed, and notably different from previous sessions. The session objective is to prepare for a board presentation.","sk":"금융사 임원인 고객이 리더십 팀과의 최근 갈등을 묘사하며 세션을 시작한다. 어조는 긴장되어 있고 자세는 닫혀 있으며 이전 세션과 눈에 띄게 다르다. 원래 세션 목표는 이사회 프레젠테이션 준비다.","o":["Offer feedback about the observed change in tone and invite the client to share.","Continue with the planned topic to maintain structure and session consistency.","Ask a few clarifying questions about the team conflict, then return to the original agenda.","Offer a few calming techniques before moving forward with the coaching goal."],"ok":["관찰된 어조의 변화에 대해 피드백(관찰 공유)을 제공하고 고객이 나누도록 초대한다.","구조와 일관성을 유지하기 위해 계획된 주제로 계속 진행한다.","팀 갈등에 대해 몇 가지 명료화 질문을 한 뒤 원래 아젠다로 돌아간다.","코칭 목표로 나아가기 전에 몇 가지 진정 기법을 제안한다."],"b":"A","w":"B","be":"현재 순간에 드러난 비언어적·정서적 변화를 포착하여 관찰을 공유하고 고객이 탐색하도록 초대하기 때문입니다.","we":"Worst(2)는 고객의 현재 상태를 완전히 무시(missing/dismissing)하고 기존 계획만 고수하는 경직된 태도입니다. 3번은 갈등을 잠시 물었으나 코치가 임의로 원래 아젠다로 복귀했고, 4번은 탐색 없이 진정 기법을 제안한 처방적 오답입니다.","c":["5.01","5.03","6.04"],"m":["6.4"],"k":[],"e":[]},{"id":160,"n":"SJT-16","cat":"sjt","ty":"bw","t":"[역량 6] 대규모 제품 출시를 앞두고 흥분과 불안을 동시에 호소하는 PM","se":"The client, a product manager of a growing tech firm, shares a mix of excitement and anxiety about leading a major launch. They mention wanting to prove themselves, but also feeling overwhelmed by expectations.","sk":"테크 기업의 프로덕트 매니저가 대규모 출시를 이끄는 것에 대해 흥분과 불안이 섞인 감정을 나눈다. 스스로를 증명하고 싶으면서도 기대감에 압도된다고 말한다.","o":["Focus on next steps and ignore their anxiety because coaching is not counseling.","Acknowledge the pressure to prove themselves and remind them of their strengths.","Ask how the client plans to handle their feelings of being overwhelmed.","Reflect on both the excitement and overwhelm to ensure full understanding."],"ok":["코칭은 상담이 아니므로 불안을 무시하고 다음 단계에 집중한다.","증명해야 한다는 압박감을 인정하고 고객의 강점을 상기시켜 준다.","압도되는 감정을 어떻게 다룰 계획인지 묻는다.","온전한 이해를 보장하기 위해 흥분과 압도감 둘 다를 반영해 준다."],"b":"D","w":"A","be":"고객이 전달한 양가감정(흥분과 압도감) 전체를 있는 그대로 반영하여 온전한 이해와 자기 탐색을 돕기 때문입니다.","we":"Worst(1)는 '상담이 아니다'라는 핑계로 고객의 불안을 묵살(ignoring)하는 최악의 경청 실패입니다. 3번은 압도감만 다루어 ACC 수준에 머물렀고, 2번은 강점을 상기시켜 주려 했으나 양가감정 전체의 반영을 놓친 차선책입니다.","c":["6.02","6.04","6.05"],"m":["6.3"],"k":[],"e":[]},{"id":161,"n":"SJT-17","cat":"sjt","ty":"bw","t":"[역량 7] 실용적 해결책만 찾으려 하는 대학 학과장에게 가치 탐색 도전하기","se":"The client, a university department head, wants to improve collaboration amongst academic staff. During the session, the client expresses frustration about repeated misunderstandings during faculty meetings. Based on past coaching sessions, the coach knows that the client feels uncomfortable exploring more than practical solutions.","sk":"대학 학과장인 고객이 교수진 간의 협업을 개선하고 싶어 하며 교수 회의 중 반복되는 오해에 좌절감을 표한다. 지난 세션들을 통해 코치는 고객이 실용적 해결책 이상의 깊은 탐색을 불편해한다는 것을 알고 있다.","o":["Offer suggestions based on common communication models used in academic teams.","Ask permission to challenge the client to explore their values and frustrations.","Reassure the client that conflict is normal in leadership and move the session forward.","Reflect the client's desire for better collaboration and ask what success would look like."],"ok":["학술 팀에서 흔히 쓰이는 소통 모델을 기반으로 제안을 건넨다.","고객의 가치와 좌절감을 탐색하도록 도전(challenge)해도 될지 허락을 구한다.","리더십에서 갈등은 정상적인 것이라고 안심시키고 세션을 앞으로 진행시킨다.","더 나은 협업에 대한 열망을 반영하고 성공이 어떤 모습일지 묻는다."],"b":"B","w":"C","be":"표면적 해결책(What)에만 머무르려는 고객의 패턴을 넘어, 허락을 구하고 가치와 내면(Who)을 탐색하도록 도전(역량 7.02)하는 PCC/MCC 수준의 개입이기 때문입니다.","we":"Worst(3)는 고객의 좌절감을 '원래 다 그렇다'며 축소·묵살(minimizing)하고 앞으로 밀어붙이는 최악의 반응입니다. 4번은 무난한 ACC 수준 질문이나 깊은 내면(Who) 탐색 기회를 놓쳤고, 1번은 소통 모델을 제안하는 컨설팅 방식입니다.","c":["7.02","7.03"],"m":["5.1"],"k":[],"e":[]},{"id":162,"n":"SJT-18","cat":"sjt","ty":"bw","t":"[역량 8] 시간이 몇 분 남지 않은 시점에서 활기차 보이는 스타트업 창업자 마무리","se":"The client, a startup founder, has spent the session exploring ways to delegate more effectively. They've just said what they want so they can focus on product development. As time runs out, they seem energized. There are a few minutes left in the session.","sk":"스타트업 창업자인 고객이 효과적인 위임 방법을 탐색했고 제품 개발에 집중하기 위해 원하는 바를 방금 밝혔다. 시간이 다 되어가며 고객은 활기차 보인다. 몇 분 남지 않았다.","o":["Ask the client to close by writing a thank-you letter to themselves.","Reflect that they seem energized and briefly summarize the key topic covered.","Mention that the session is ending soon and encourage them to keep applying what was discussed.","Ask how they would like to close the session and whether anything still needs attention."],"ok":["자신에게 감사 편지를 쓰며 마무리하라고 요청한다.","활기차 보인다고 반영하고 다룬 핵심 주제를 간략히 요약한다.","세션이 곧 끝난다고 언급하며 논의된 내용을 계속 적용하라고 격려한다.","세션을 어떻게 마무리하고 싶은지, 그리고 여전히 주의를 기울여야 할 것이 있는지 묻는다."],"b":"D","w":"A","be":"PCC 마커 8.9('코치는 고객과 협력하여 이 세션을 어떻게 완료하고 싶은지를 설계한다')에 정확히 일치하기 때문입니다.","we":"Worst(1)는 고객의 의사를 묻지 않고 코치가 임의의 마무리 과제를 지시해 종료 파트너십(PCC 마커 8.9)을 정면 위반합니다. 2번과 3번은 정중하고 무난한 마무리 방식이나, 어떻게 끝내고 싶은지 고객에게 선택권을 묻는 4번에 비해 주도성이 떨어집니다.","c":["8.09"],"m":["8.9"],"k":[],"e":[]},{"id":163,"n":"SJT-19","cat":"sjt","ty":"bw","t":"The Breakthrough With Nowhere to Go","se":"Lena is a first-time founder coaching with you on confidence, and she lands on something vivid: \"I've been running my company like I still need someone's permission to lead it—like I'm waiting to be promoted into my own job.\" She's moved, almost relieved naming it. But as the session nears its close, she stays in the feeling, turning it over, admiring it—no movement toward what it changes in how she shows up Monday. You feel a strong pull to hand a few concrete practices so the breakthrough doesn't go to waste.","sk":"초보 창업자 레나가 자신감 주제로 코칭 받던 중 \"저는 제 회사인데도 여전히 누군가의 허락을 받아야 이끌 수 있는 것처럼, 제 자리로 승진되기를 기다리는 것처럼 운영해 왔어요\"라는 생생한 통찰에 도달한다. 세션 종료가 다가오는데도 그 감정에 머물며 음미할 뿐 월요일에 어떻게 달라질지 움직임이 없다. 코치는 이 통찰이 낭비되지 않도록 구체적인 실천법을 건네주고 싶은 강한 충동을 느낀다.","o":["Reflect the realization back and ask what becomes possible now.","Affirm how powerful it is and let her savor it, closing on the high note.","Assign her three \"claim your authority\" practices and ask her to track them.","Tell her this is the breakthrough she's been working toward, and share how other founders turn similar realizations into a routine."],"ok":["그 깨달음을 반영해 주고 이제 무엇이 가능해지는지 묻는다.","얼마나 강력한지 인정해 주고 음미하게 두며 좋은 분위기로 마무리한다.","세 가지 '권한 되찾기' 실천 과제를 부여하고 추적 기록하라고 요청한다.","이것이 그녀가 노력해 온 돌파구라고 말해주며 다른 창업자들이 유사한 깨달음을 루틴으로 만든 방법을 공유한다."],"b":"A","w":"C","be":"통찰을 반영해 준 뒤 '이제 무엇이 가능해지는가?(What becomes possible now?)'라고 물음으로써 행동 설계(PCC 마커 8.4, 8.5)의 화두를 던지되 내용은 전적으로 고객이 채우도록 펜을 넘겨주기 때문입니다.","we":"Worst(C)는 고객이 방금 얻은 깨달음('나는 늘 누군가의 허락과 지시를 기다렸다')을 코치가 권위자가 되어 과제와 체크리스트를 할당함으로써 코칭 장면에서 그 의존성(새장)을 그대로 재현하는 최악의 해악입니다. B는 실행 설계가 누락된 소극적 오답이고, D는 외부 창업자 루틴이라는 템플릿을 은근히 유도해 B보다 못합니다.","c":["8.01","8.02","8.03"],"m":["8.4"],"k":[],"e":[]},{"id":164,"n":"SJT-20","cat":"sjt","ty":"bw","t":"The Client Who Won't Be Pinned Down","se":"Marcus is a senior engineer moving into management, and he's done real thinking about how he dodges hard feedback conversations with his reports. He's clear on the pattern and clear he wants to change it, but every time the talk turns to what he'll do next week, he deflects: \"I work better without a rigid plan. Let's not make this homework.\" Structured accountability has felt like a cage to him before. Except three sessions running, the same intention has evaporated by the next meeting.","sk":"관리자로 승진한 수석 엔지니어 마커스는 어려운 피드백 대화를 회피하는 패턴을 바꾸고 싶어 하지만, 다음 주 실행 계획 이야기가 나올 때마다 \"저는 엄격한 계획 없이 일할 때 더 잘 돼요. 이걸 숙제로 만들지 맙시다\"라며 피한다. 과거 구조화된 책무 방식이 '새장'처럼 느껴져 자율성을 보호하려는 것이지만, 3회기 연속 의지만 다지고 실행되지 않았다.","o":["Acknowledge his preference and let the topic rest.","Explain that intentions without a plan rarely stick, and ask him to commit to one conversation and report back.","Offer him a menu of accountability tools and recommend the one that fits a new manager.","Name what you're noticing—he wants change, but structure once felt confining—and ask what accountability, if any, fits him."],"ok":["그의 선호를 인정하고 그 주제를 덮어둔다.","계획 없는 의지는 거의 지속되지 않는다고 설명하고, 대화 한 번을 약속한 뒤 보고하라고 요청한다.","책무 도구 메뉴를 제공하고 신임 관리자에게 맞는 것을 추천한다.","변화를 원하지만 구조가 한때 구속처럼 느껴졌다는 관찰을 말해주고, 그에게 맞는 책무 방식이 있다면 무엇일지 묻는다."],"b":"D","w":"B","be":"PCC 마커 8.7('고객 자신을 위한 최상의 책무 방법을 설계하도록 파트너십을 맺는다')에 따라 변화의 욕구와 구속 거부감이라는 긴장을 투명하게 짚어준 뒤 그 자신에게 맞는 책무 방식을 스스로 설계하도록 주도권을 넘기기 때문입니다.","we":"Worst(B)는 고객이 '새장'이라고 느낀 통제적 구조를 코치가 강요('약속하고 보고하라')함으로써 주인의식을 복종으로 변질시키는 최악의 해악입니다. A는 책무를 포기하는 수동적 공모이고, C는 코치의 도구를 추천하는 컨설팅 방식이나 선택권은 남겨두었습니다.","c":["8.02","8.03","8.05"],"m":["8.7"],"k":[],"e":[]},{"id":165,"n":"SJT-21","cat":"sjt","ty":"bw","t":"The Session That Ran Out of Road","se":"Naomi spent the hour untangling why she keeps absorbing work that belongs to her team. Midway, she lit up: \"I delegate the tasks, but I keep the worry, so it's never really off my plate.\" Now there are four minutes left, and she says, \"Okay, that's a lot—I think I get it now.\" She's packing up. No step, no sense of how this carries into her week.","sk":"나오미는 팀원들의 업무를 계속 떠안는 이유를 탐색하다 중반에 \"과업은 위임하지만 '걱정'은 여전히 제가 쥐고 있네요\"라는 통찰에 도달했다. 이제 4분이 남았고 그녀는 \"이제 이해가 된 것 같아요\"라며 짐을 챙긴다. 구체적 실행 단계 없이 통찰만으로 세션이 끝나려 한다.","o":["Summarize the insight for her, name the three delegation behaviors she should change, and tell her you'll check each next time.","Acknowledge the insight and let it close right there.","Reflect that she's landed on something important, and ask what—if anything—she wants to do with it.","Reassure her this settles in over time, and suggest she just notice the pattern."],"ok":["그녀를 대신해 통찰을 요약해 주고, 바꾸어야 할 세 가지 위임 행동을 지정해 준 뒤, 다음 시간에 점검하겠다고 말한다.","통찰을 인정해 주고 바로 그 지점에서 세션을 마무리한다.","중요한 지점에 도달했음을 반영해 주고, 그것으로 무엇을(만약 있다면) 하고 싶은지 묻는다.","시간이 지나면 자연스럽게 자리 잡을 것이라고 안심시키며, 그저 그 패턴을 알아차리기만 하라고 제안한다."],"b":"C","w":"A","be":"남은 4분 속에서도 조급해하지 않고 통찰을 반영한 뒤 '무엇을(만약 있다면) 하고 싶은지' 물음으로써 자율적 실행 설계(PCC 마커 8.4, 8.5)와 협력적 세션 종료(PCC 마커 8.9)를 달성했기 때문입니다.","we":"Worst(A)는 코치가 통찰을 대신 요약하고 3가지 과제를 지정하며 다음 회기 점검자를 자처함으로써 고객이 막 벗어나려던 '통제와 책임 떠안기' 역동을 재현하는 최악의 해악입니다. B는 실행 연결이 누락된 소극적 오답이고, D는 '그저 알아차리기만 하라'며 의도적 실행 설계를 은근히 만류해 B보다 아쉽습니다.","c":["8.01","8.03","8.06","8.09"],"m":["8.4"],"k":[],"e":[]},{"id":166,"n":"SJT-22","cat":"sjt","ty":"bw","t":"The Struggling Entrepreneur","se":"Derek has a business idea he believes in, and every time he sits down to start, he freezes. He names the pile in front of him—investors, a team, a strategy—and it's so much that he's started to wonder if he's even cut out for this. This is your second session: last time he left energized and then did none of what he'd hoped to. Now he's looking at you and saying, \"Just tell me where to start.\"","sk":"데릭은 사업 아이디어가 있지만 시작하려 할 때마다 투자자·팀·전략 등 산더미 같은 일 앞에서 얼어붙으며 자신이 자질이 있는지 의심한다. 지난 세션에서 에너지를 얻고도 아무것도 실행하지 못한 채 지금 \"어디서부터 시작해야 할지 그냥 말씀해 주세요\"라고 말한다.","o":["Suggest he begin with market research and share strategies other founders have used.","Partner with him to pick one step he'll own this week and design how he'll hold himself to it.","Reassure him that everyone feels this way and tell him to stay motivated.","Build his launch plan yourself and send it over so he can just follow it."],"ok":["시장 조사부터 시작하라고 제안하고 다른 창업자들이 사용했던 전략들을 공유한다.","이번 주에 그가 주인의식을 갖고 실행할 한 가지 단계를 고르고, 스스로에게 책무를 다할 방식을 설계하도록 파트너십을 맺는다.","누구나 다 그렇게 느낀다고 안심시키며 동기부여를 유지하라고 말한다.","코치가 직접 그의 런칭 계획을 세워 보내주어 그가 그저 따라오기만 할 수 있게 한다."],"b":"B","w":"D","be":"거대한 산더미를 고객 자신이 주인의식을 가질 수 있는 '단 하나의 작은 걸음'으로 좁히며 스스로 실행과 책무 구조를 설계하도록 파트너십을 맺음으로써(PCC 마커 8.5, 8.7) 진정한 자기효능감을 회복시키기 때문입니다.","we":"Worst(D)는 코치가 직접 런칭 계획을 짜주어 고객이 스스로 확인하려던 '창업가로서 자질이 있는가?'에 대해 코치가 대신 창업가 노릇을 해줌으로써 무능감을 확증시키는 최악의 해악입니다. A는 외부 창업 전략 템플릿을 가져오는 컨설팅이고, C는 알맹이 없는 위로로 성장을 멈추게 하는 수동적 오답입니다.","c":["2.01","8.02","8.03"],"m":["8.5"],"k":[],"e":[]},{"id":167,"n":"SJT-23","cat":"sjt","ty":"bw","t":"The Reluctant Delegate","se":"Tom is a department manager, five sessions in, and the contract is to build a team he can hand real work to so he stops being the bottleneck. Today he names the same pattern again: he knows he should delegate, but he redoes it himself because it's faster. Then something surfaces: his grip is tied to a fear that any mistake by his team reflects on him, and his VP just put the department under a quality spotlight. He's right at the edge of that fear, but he keeps retreating to logistics—\"Maybe a better task tracker.\"","sk":"부서 관리자 톰은 팀원의 실수가 곧 자신에 대한 평가로 직결된다는 두려움 때문에 위임하지 못하고 다시 고쳐 하는 패턴을 반복하고 있다. 막 그 두려움의 문턱에 섰지만 자꾸만 '더 나은 업무 추적기(task tracker)' 같은 실무 도구 뒤로 숨으려 한다.","o":["Suggest he lists the tasks he's comfortable handing off and start small.","Ask what makes it hard to trust the team with certain work, and what letting go would make possible.","Reassure him he's just a perfectionist like all strong leaders and tell him to keep at it.","Recommend strict deadlines and firm accountability so he can delegate while keeping quality high."],"ok":["넘겨주기 편한 업무 목록을 적어보고 작은 것부터 시작하라고 제안한다.","특정 업무를 팀에 믿고 맡기기 어렵게 만드는 것이 무엇인지, 그리고 손을 놓는 것이 무엇을 가능하게 할지 묻는다.","그저 모든 유능한 리더들처럼 완벽주의자일 뿐이라고 안심시키며 계속 노력하라고 말한다.","품질을 높게 유지하면서 위임할 수 있도록 엄격한 마감 기한과 단호한 책무 체계를 권고한다."],"b":"B","w":"C","be":"고객이 실무 도구(What) 뒤로 숨을 때 내면의 문턱(Engine/Who)을 함께 열어주며 핵심 신념과 두려움(PCC 마커 7.1), 그리고 내려놓음이 가져올 가능성(PCC 마커 7.2, 7.4)을 탐색하게 돕기 때문입니다.","we":"Worst(C)는 '유능한 리더들처럼 그저 완벽주의자일 뿐이에요'라며 고객이 막 직면하려던 핵심 두려움을 고정된 성격 꼬리표로 덮어 묵살(dismissing)하고 탐색의 문을 닫아버리는 최악의 해악입니다. A는 무난한 실행 제안이나 두려움을 건너뛴 성급한 행동화이고, D는 엄격한 통제 기법을 권고하는 컨설팅 방식입니다.","c":["6.03","7.02","7.03","7.04"],"m":["5.1"],"k":[],"e":[]},{"id":168,"n":"SJT-24","cat":"sjt","ty":"bw","t":"The Career Crossroads","se":"Maya is a mid-career product lead, three sessions in, and the contract she framed was to make a clean decision and stop second-guessing herself. She's torn between two offers: a stable promotion track where she is, and a riskier startup with bigger upside and less security. Listen to how she's deciding: salary bands, titles, brand names, what her partner thinks, what her old mentor would say. She's never once named what either path means for the life she actually wants.","sk":"중견 프로덕트 리드 마야는 현 직장의 안정적 승진과 스타트업 이직 사이에서 고민하며 온통 연봉, 직함, 브랜드, 파트너와 옛 멘토의 시선이라는 '타인의 성공 기준'만 따지고 있다. 정작 자신이 진짜 원하는 삶과 가치에 대해서는 한 번도 언급하지 않았다.","o":["Suggest a structured pros-and-cons comparison and work through it with her.","Tell her to take the startup—the upside usually wins, and she clearly wants permission to leap.","Ask what genuinely pulls her toward each path and how each fits the life and values she's named.","Reassure her there's no wrong choice and tell her to trust her gut."],"ok":["구조화된 장단점(Pros-and-cons) 비교표를 제안하고 함께 작업한다.","스타트업을 선택하라고 말한다—성장 가능성이 보통 이기며, 그녀가 도약할 허락을 원한다는 것이 명백하므로.","각 길에서 무엇이 진정으로 그녀의 마음을 끌어당기는지, 그리고 각각의 선택이 그녀가 언급한 삶과 가치관에 어떻게 부합하는지 묻는다.","틀린 선택은 없다고 안심시키며 직감을 믿으라고 말한다."],"b":"C","w":"B","be":"타인의 시선과 외적 조건이라는 외부 궤도에서 벗어나 고객 자신의 내적 욕구와 핵심 가치관, 원하는 삶의 모습(Who)이라는 자기만의 기준으로 의사결정의 중심축을 옮겨놓았기 때문입니다.","we":"Worst(B)는 '스타트업을 선택하라'며 코치의 위험 감수 성향을 투사해 결정을 대신 내려줌으로써 그녀가 코칭을 통해 달성하려던 핵심 목표('스스로 의심하지 않고 내 판단의 주인이 되는 것')를 파괴합니다. A(장단점 비교표)는 외적 조건만 나열하게 해 가치 성찰을 놓치고, D는 탐색을 회피하는 공허한 위로입니다.","c":["2.01","7.03","7.04","8.03"],"m":["5.1"],"k":[],"e":[]},{"id":169,"n":"SJT-25","cat":"sjt","ty":"bw","t":"The Disconnected Leader","se":"Karen is a senior HR director, six sessions in, leading two formerly separate teams through a post-merger integration. She opens frustrated: everyone's doing their own thing; they've lost any sense of being a team. Then she lands on something herself: \"Maybe I've been too focused on deliverables.\" She's circling her own role without quite naming it, hoping you'll either tell her she's overreacting or hand her a plan.","sk":"합병 후 통합 팀을 이끄는 시니어 HR 디렉터 카렌은 팀 결속력 상실에 좌절하다 스스로 \"어쩌면 제가 그동안 결과물(deliverables)에만 너무 집중했나 봐요\"라는 자기 성찰에 닿는다. 코치가 과잉 반응이라고 말해주거나 계획을 주기를 바라며 눈치를 살핀다.","o":["Suggest recurring team check-ins and offer to help her structure them.","Recommend she call a meeting to restate why teamwork matters and reset expectations.","Ask what's shifted in how she's been leading lately, and what reconnecting would make possible.","Reassure her the team's just busy, tell her to keep driving results, and cohesion will come back on its own."],"ok":["정기적인 팀 체크인 미팅을 제안하고 구조화하는 것을 돕겠다고 한다.","회의를 소집해 팀워크가 왜 중요한지 다시 강조하고 기대치를 재설정하라고 권고한다.","최근 그녀가 이끌어 온 방식에서 무엇이 달라졌는지, 그리고 다시 연결되는 것(reconnecting)이 무엇을 가능하게 할지 묻는다.","팀이 그저 바쁠 뿐이라고 안심시키며 계속 성과를 밀어붙이면 결속력은 저절로 돌아올 것이라고 말한다."],"b":"C","w":"D","be":"고객이 외부 탓(팀원 문제)에서 벗어나 자기 자신의 리더십 방식으로 시선을 돌린 결정적 순간을 포착하여, 리더십 변화(PCC 마커 7.1)와 관계 회복이 열어줄 가능성(PCC 마커 7.2, 7.4)을 탐구하게 했기 때문입니다.","we":"Worst(D)는 '팀이 그저 바쁠 뿐이니 성과를 밀어붙여라'며 고객이 어렵게 도달한 자기 성찰의 싹을 '문제없다'며 짓밟아 무효화(invalidating)하는 최악의 해악입니다. A(체크인 제안)와 B(회의 소집 권고)는 내면 성찰을 건너뛰고 해결책을 제시하는 컨설팅/지시 방식입니다.","c":["4.03","5.03","7.03","7.04"],"m":["4.1"],"k":[],"e":[]},{"id":170,"n":"SJT-26","cat":"sjt","ty":"bw","t":"Caught in the Work-Life Crossfire","se":"Susan's a senior VP of product, three sessions in, and the contract she set was to stop the burnout before it costs her the job or the marriage. She arrives drained—her calendar owns her. She keeps naming three pulls in the same breath: a board pushing an aggressive roadmap, a team she won't let down, and a partner asking pointed questions at home. She frames the whole thing as scheduling. She's never once said what balance would actually mean to her, or which pull matters most.","sk":"번아웃 직전의 프로덕트 수석 부사장 수잔은 이사회, 팀, 배우자라는 세 가지 압박을 모두 '일정 관리(scheduling)' 문제로만 틀 짓고 있으며, 자신에게 '균형'이 무엇인지 혹은 무엇이 가장 중요한지 한 번도 말하지 않았다.","o":["Acknowledge how hard it is and ask what small steps she could take this week.","Recommend she cut her hours now, because that's what's worked for executives you've coached.","Ask what balance would actually look like for her, and which of the pulls matters most.","Offer proven tactics—time-blocking, delegating, a hard stop at six—and let her choose."],"ok":["얼마나 힘든지 인정해 주고 이번 주에 취할 수 있는 작은 단계가 무엇인지 묻는다.","당신이 코칭했던 다른 임원들에게 효과가 있었던 방법이므로 지금 당장 근무 시간을 줄이라고 권고한다.","그녀에게 '균형'이 실제로 어떤 모습일지, 그리고 언급한 세 가지 압박 중 무엇이 가장 중요한지 묻는다.","검증된 전술들(타임 블로킹, 위임, 6시 정시 퇴근)을 제시하고 그녀가 선택하게 한다."],"b":"C","w":"B","be":"일정표(Calendar/What) 이면에 숨겨진 가치와 우선순위(Priorities/Who)를 끌어올리기 위해 고객 자신의 언어로 '균형'을 정의하고 가장 소중한 가치를 성찰하도록 초대하기 때문입니다.","we":"Worst(B)는 '당장 근무 시간을 줄여라, 다른 임원들에게 효과가 있었다'며 코치의 경험을 정답으로 설치하고 외부의 '해야 할 일(should)'을 하나 더 얹어 번아웃을 악화시키는 최악의 해악입니다. A는 목적지('균형'의 의미)도 정하기 전에 성급히 이번 주 실행으로 넘어가는 실수이고, D는 전술을 나열하는 컨설팅 방식입니다.","c":["6.02","6.03","7.03","7.04"],"m":["6.2"],"k":[],"e":[]},{"id":171,"n":"SJT-27","cat":"sjt","ty":"bw","t":"The Pull to Fix","se":"Naomi, a clinic manager, lays out the problem: double-bookings, staff frustration, patients left waiting. You can picture a tiered buffer system that you know would work. You feel an almost physical pull to lay it out and solve it for her. Then, half to herself, she says there's something about how the team even decides what counts as \"urgent\" that she hasn't looked at.","sk":"클리닉 매니저 나오미가 이중 예약 문제를 설명할 때 코치 머릿속에는 완벽한 '단계별 버퍼 시스템' 해결책이 떠오른다. 그때 그녀가 혼잣말처럼 \"팀이 애초에 무엇을 '긴급(urgent)'하다고 판단하는지 그 방식에 대해 아직 들여다보지 못한 무언가가 있어요\"라고 말한다.","o":["Briefly name the buffer system approach you've seen work, then ask whether she'd like to explore that or her own thread about urgency.","Set your solution aside, stay with her, and follow the opening she just named.","Summarize the operational problem cleanly and ask which part she'd like to tackle first.","Walk her through the tiered buffer system step by step, since you can see it'll solve the breakdown."],"ok":["효과가 있었던 버퍼 시스템 접근법을 간략히 언급한 뒤, 그것을 탐색하고 싶은지 아니면 '긴급함'에 대한 그녀 자신의 실마리를 탐색하고 싶은지 묻는다.","당신의 해결책을 내려놓고, 그녀와 함께 머무르며, 그녀가 방금 꺼낸 열린 실마리('긴급함의 기준')를 따라간다.","운영상의 문제를 깔끔하게 요약하고 어느 부분부터 다루고 싶은지 묻는다.","그 시스템이 문제를 해결할 것이 분명해 보이므로 단계별 버퍼 시스템을 차근차근 설명해 준다."],"b":"B","w":"D","be":"프레즌스(역량 5)란 코치의 확신이 아니라 현재 순간 고객에게서 새로이 떠오르는 탐색의 실마리에 응답하는 것이므로, 해결사 본능을 내려놓고 고객이 발견한 근본 레버를 호기심 있게 따라가기 때문입니다.","we":"Worst(D)는 요청받지 않은 솔루션을 단계별로 설명해 무단으로 컨설팅 모드로 전환하고 고객이 막 발견한 핵심 실마리를 압살하는 적극적 해악입니다. A는 코치 아이디어를 끼워 넣었으나 선택권을 주었고, C는 운영 문제를 요약해 고객 재료 안에 머물렀으나 막 열린 깊은 통찰의 실마리를 놓친 차선책입니다.","c":["1.06","5.01","5.02","5.03"],"m":["5.2"],"k":[],"e":[]},{"id":172,"n":"SJT-28","cat":"sjt","ty":"bw","t":"When Their Words Land on You","se":"Daniel's processing a falling-out, and almost off-handedly, he names the thing he can't get past: \"People who disappear when it gets hard.\" Six months ago, your own co-founder did exactly that. You feel it land—heat in your chest, jaw tightening, the pull to say, \"I know exactly what that's like.\" He pauses, looks at you still mid-thought, needing you present.","sk":"다니엘이 관계 결렬을 이야기하며 \"힘들어질 때 말없이 사라져 버리는(disappear) 사람들\"을 도저히 넘어설 수 없다고 말한다. 6개월 전 코치 자신의 공동창업자도 똑같이 떠났기에 가슴에 열이 오르고 잠시 그를 놓쳤다. 그가 당신의 현존을 필요로 하며 바라보고 있다.","o":["Share your own parallel story so he knows you understand.","Hold your reaction privately, nod, and ask the next question you'd already planned.","Take a breath, return your full attention, and reflect his most charged word—\"disappear\"—asking what it lands on for him.","Name that you got distracted and ask him to repeat his last point."],"ok":["당신이 이해하고 있음을 그가 알 수 있도록 당신 자신의 비슷한 경험담을 공유한다.","당신의 반응을 속으로만 간직하고 고개를 끄덕인 뒤, 미리 계획해 두었던 다음 질문을 던진다.","숨을 한 번 고르고 온전한 주의를 되돌린 뒤, 그의 가장 감정이 실린 단어('사라지다/disappear')를 반영해 주며 그 단어가 그에게 어떤 울림을 주는지 묻는다.","주의가 산만해졌다고 말하고 마지막으로 한 말을 다시 반복해 달라고 요청한다."],"b":"C","w":"A","be":"코치 자신의 내적 트리거와 감정을 즉시 알아차려 자기 조절(Self-regulation)을 수행한 뒤, 온전한 주의를 고객에게 되돌려 고객이 사용한 핵심 감정 단어('disappear')를 탐색함으로써 코칭 공간을 지켜냈기 때문입니다.","we":"Worst(A)는 공감을 빙자해 코치 자신의 아픈 경험담을 늘어놓아 대화 공간의 주인공을 고객에서 코치로 전도시키는 적극적 해악입니다. B는 감정은 억제했으나 현재 순간 고객이 던진 결정적 단어를 놓치고 미리 준비한 질문을 던져 반응성을 잃었고, D는 솔직하나 고객의 감정 흐름을 끊고 다시 설명하게 만든 자기 중심적 실수입니다.","c":["2.06","5.01","5.03","5.04","6.02"],"m":["6.2"],"k":[],"e":[]},{"id":173,"n":"SJT-29","cat":"sjt","ty":"bw","t":"An Excited Client","se":"At the top of the hour, Maya named the work clearly: decide on the lateral move—the thing keeping her up at night. Twenty minutes in, she mentions a launch her team just shipped, and her whole demeanor changes. She's talking faster, recounting the late nights, the metrics, the praise from her VP. The question she came for sits untouched, and she shows no sign of going back to it on her own.","sk":"세션 시작 시 '수평 이동 여부 결정'을 목표로 합의했던 마야가 20분 후 팀의 제품 런칭 성공을 언급하며 흥분해서 밤샘 작업과 부사장의 칭찬을 신나게 쏟아낸다. 원래 결정 문제는 방치되어 있고 스스로 돌아갈 기미가 없다.","o":["Reflect what the launch meant to her, then ask whether she'd rather stay with it or return to the decision—her call.","Match her excitement and let the celebration take the rest of the hour.","Acknowledge the launch in a sentence and pull her back to the agenda.","Send the celebration to a future session and refocus now."],"ok":["그 런칭이 그녀에게 어떤 의미였는지 반영해 준 뒤, 이 이야기에 계속 머물고 싶은지 아니면 원래의 의사결정 주제로 돌아가고 싶은지 그녀의 선택을 묻는다.","그녀의 흥분에 장단을 맞추어 남은 한 시간 전체를 축하하는 데 쓰게 둔다.","한 문장으로 런칭을 인정해 주고 원래의 아젠다로 그녀를 다시 끌어온다.","축하 이야기는 다음 세션으로 미루고 지금 다시 초점을 맞춘다."],"b":"A","w":"B","be":"고객의 에너지 변화와 성취감을 먼저 반영·인정하고 본래 목표를 상기시키며, 남은 시간을 어디에 쓸지 실시간 재합의(Recontracting) 선택권을 전적으로 고객에게 돌려주기 때문입니다.","we":"Worst(B)는 고객의 기분 좋은 흥분에 코치가 무비판적으로 동조(Warm collusion)하여 정작 고객이 밤잠을 설치며 해결하려던 핵심 의사결정 목표를 아무런 확인 없이 방기해 버리는 직무 유기입니다. C는 원래 목표를 지키려 했으나 고객에게 묻지 않고 끌어당겨 자율성을 침해했고, D는 거기에 더해 다음 세션 일정까지 코치가 일방 배정한 통제적 오답입니다.","c":["3.09","3.10","5.03","6.04","8.08"],"m":["5.3"],"k":[],"e":[]},{"id":174,"n":"SJT-30","cat":"sjt","ty":"bw","t":"What He Couldn't Say Out Loud","se":"A new manager, three sessions deep in tidy logistics, just let the most vulnerable thing surface: \"I'm a fraud, and some days it makes me sick.\" His voice catches, then he glances up at you fast and back down, checking whether he just made a mistake.","sk":"신임 관리자 토마스가 침묵 끝에 가장 취약한 내면을 고백한다: \"저는 사기꾼(가짜) 같아요. 어떤 날은 너무 구역질이 날 정도예요.\" 목소리가 갈라지고 방금 실수한 건 아닌지 확인하려는 듯 재빨리 당신을 올려다봤다가 시선을 내린다.","o":["Tell him imposter feelings are extremely common, walk through the research, and give him evidence-based techniques to reframe the self-doubt.","Move to concrete wins from his nursing career so he can see proof he's competent.","Reflect that it took something to say that out loud, and ask what it's like to name it here with you.","Ask when he first started feeling this way and what early experiences planted it."],"ok":["가면 증후군(imposter feelings)은 매우 흔한 현상이라고 말해 주고, 관련 연구를 설명한 뒤, 자기 의심을 재구성할 수 있는 증거 기반 기법들을 알려준다.","그가 유능하다는 증거를 직접 볼 수 있도록 간호사 경력에서 거둔 구체적인 성공 사례들로 화제를 옮긴다.","그 말을 소리 내어 꺼내는 데 큰 용기가 필요했음을 반영해 주고, 지금 여기서 코치와 함께 그것을 말로 명명하는 것이 어떤 느낌인지 묻는다.","언제 처음 그렇게 느끼기 시작했는지, 그리고 어떤 초기 경험이 그 감정을 심었는지 묻는다."],"b":"C","w":"A","be":"수치심과 취약성을 무릅쓴 고객이 안전감을 시험하는 결정적 3초 동안, 문제를 고치려 하거나 위로로 덮지 않고 고객의 용기와 표현을 따뜻하게 인정·수용하고 지금 이 순간의 정서적 경험에 머물도록 초대하기 때문입니다.","we":"Worst(A)는 '가면 증후군은 흔한 일이다(정상화/Normalizing)'라는 말과 연구·기법 설명으로 고객이 목숨 걸고 꺼낸 고유한 고통을 '흔해빠진 증상'으로 축소·무시하고 기법 처방(Fixing)으로 덮어버리는 최악의 해악입니다. B는 선의의 격려이나 어두운 감정을 억누르는 회피 반응이고, D는 심리치료의 과거 원인 분석으로 흐르는 오답입니다.","c":["4.03","4.04","4.05","5.05","7.05"],"m":["4.1"],"k":[],"e":[]},{"id":175,"n":"SJT-31","cat":"sjt","ty":"bw","t":"The Sponsor's Number","se":"Before your first session with Devon, his sponsor emails you: the VP funding the work wants Devon ready to run the regional team by Q3—\"Coach him on executive presence and decisiveness.\" Then you meet Devon, and he tells a different story: what he thinks he actually needs is to figure out whether he even wants a bigger team, or whether he's happiest doing the technical work he's good at.","sk":"스폰서(VP)는 데본이 3분기까지 지역 팀을 이끌도록 '임원다운 존재감과 결단력'을 코칭해 달라고 이메일을 보냈으나, 막상 만난 데본은 자신이 승진을 원하기는 하는지 아니면 기술 업무가 가장 행복한지를 알아내고 싶다고 말한다.","o":["Open by working on executive presence and decisiveness, since that's what the sponsor is paying for.","Name that you've heard goals from both the sponsor and Devon, and partner with him on what the agreement should be.","Tell Devon to set the sponsor's brief aside entirely and focus only on what he wants.","Ask him to think it over and bring a decision next session, holding off on contracting today."],"ok":["스폰서가 비용을 지불하고 있으므로 '임원다운 존재감과 결단력'을 다루며 세션을 시작한다.","스폰서와 데본 양쪽으로부터 들은 목표들을 투명하게 밝히고, 코칭 합의가 어떻게 되어야 할지 데본과 파트너십을 맺는다.","데본에게 스폰서의 요청 사항은 완전히 제쳐두고 오직 그가 원하는 것에만 집중하라고 말한다.","오늘 합의 설정을 보류하고, 다음 세션까지 생각해 와서 결정을 가져오라고 요청한다."],"b":"B","w":"A","be":"이해관계자(스폰서)와 고객 간의 목표 불일치를 숨기거나 한쪽 편을 몰래 들지 않고 양쪽의 기대를 투명하게 테이블 위에 올려놓은 뒤, 어떻게 3자 합의를 조율할지 고객과 파트너십을 맺기 때문입니다.","we":"Worst(A)는 '비용 지불자의 주문'이라는 이유로 고객 본인이 의문을 품고 있는 목표를 강제 설치해 자율성과 합의권(PCC 마커 3.1)을 침해하는 적극적 해악입니다. C는 고객 자율성은 존중했으나 스폰서와의 이해관계자 합의를 완전히 무시해 충돌을 야기하고, D는 오늘 세션을 합의 없이 방치한 수동적 오답입니다.","c":["1.01","3.02","3.04","3.06"],"m":["3.1"],"k":[],"e":[]},{"id":176,"n":"SJT-32","cat":"sjt","ty":"bw","t":"When the Ground Shifts","se":"Sophia is a finance VP, and at the start of the session she agreed to work on delegating more so she stops being the bottleneck. You've been exploring that, and her measures of success were getting clearer. Then she goes quiet, looks down at her hands, and says she's been wondering whether she wants the VP role at all—something she hasn't said aloud to anyone.","sk":"위임 주제로 세션을 진행하던 재무 부사장 소피아가 갑자기 조용해지더니 누구에게도 말한 적 없는 비밀, 즉 자신이 부사장(VP) 역할 자체를 원하기는 하는지 고민해 왔다고 털어놓는다. 공간의 에너지가 명백히 이동했다.","o":["Acknowledge what she shared and gently bring her back to the delegation goal you both agreed on.","Follow the role question wherever it leads and let delegation recede.","Decide the role question's too big for today, set it aside, and steer her back so she leaves with a concrete win.","Name that something just shifted, and ask whether she'd like to recontract today's focus or stay with delegation."],"ok":["그녀가 나눈 내용을 인정해 준 뒤, 둘이 함께 합의했던 위임 목표로 부드럽게 다시 데려온다.","역할에 대한 질문이 이끄는 대로 어디든 따라가며 위임 주제는 자연히 뒤로 물러나게 둔다.","역할 문제는 오늘 다루기엔 너무 크다고 판단하여 제쳐두고, 구체적인 성과를 얻고 떠날 수 있도록 원래 방향으로 다시 이끈다.","방금 무언가 전환되었음을 소리 내어 짚어주고, 오늘 초점을 재합의(recontract)하고 싶은지 아니면 위임 주제에 머물고 싶은지 묻는다."],"b":"D","w":"C","be":"고객의 에너지 변화와 비언어적 단서를 포착해 투명하게 반영한 뒤, 실시간 재합의(Recontracting)를 통해 남은 세션의 방향 선택권을 고객에게 돌려주었기 때문입니다.","we":"Worst(C)는 '오늘 다루기엔 너무 크다, 구체적 성과를 얻게 해주겠다'며 코치가 임의로 가치 판단을 내리고 원래 위임 계획으로 몰아가는 적극적 해악입니다. A는 고백을 인정한 뒤 초기 합의를 존중하려 했으나 선택권 없이 방향을 되돌렸고, B는 진심을 따라갔으나 명시적인 재합의 확인 절차를 생략했습니다.","c":["3.06","3.10","5.03","6.04"],"m":["3.1"],"k":[],"e":[]},{"id":177,"n":"SJT-33","cat":"sjt","ty":"bw","t":"The Defensive Client","se":"Angela is a senior engineer, and she arrives skeptical. She tells you her boss thinks she needs to work on her communication, and she doesn't see the problem—she wasn't the one who asked for this. Yet at one point she leans forward just slightly, a flicker of curiosity about what coaching might actually be.","sk":"시니어 엔지니어 안젤라는 상사가 소통 능력을 개선하라며 보냈지만 본인은 무엇이 문제인지 모르겠다며 회의적인 태도로 도착했다. 하지만 어느 순간 코칭이 무엇인지에 대한 작은 호기심을 내비친다.","o":["Reflect her doubt back and ask what, if anything, she'd want out of this.","Reassure her it's a safe space and let the conversation drift until something surfaces.","Ask for specific examples of the feedback and what others misunderstand about her.","Tell her the boss sent her for a reason, and set the goal from his list."],"ok":["그녀의 의구심을 그대로 반영해 주고, 만약 있다면 이 시간에서 무엇을 얻고 싶은지 묻는다.","여기는 안전한 공간이라고 안심시킨 뒤, 무언가 수면 위로 떠오를 때까지 대화가 흘러가게 둔다.","그 피드백의 구체적인 사례들과 다른 사람들이 그녀에 대해 무엇을 오해하고 있는지 묻는다.","상사가 그녀를 보낸 데는 다 이유가 있을 것이라고 말하며, 상사의 목록에서 목표를 설정한다."],"b":"A","w":"D","be":"방어적이고 비자발적으로 온 고객의 솔직한 저항과 의구심을 판단 없이 인정·반영한 뒤, 상사의 지시가 아닌 고객 자신이 주체적으로 탐색하고 싶은 목표가 있는지 함께 정의하기 때문입니다.","we":"Worst(D)는 '상사가 보낸 데는 이유가 있다'며 제3자의 평가에 동조하고 상사의 아젠다를 세션 목표로 강제 설정하여 방어를 굳건한 저항으로 바꾸는 적극적 해악입니다. B는 안전한 공간이라 위로하지만 목표 합의 없이 표류하게 두는 수동적 오답이고, C는 합의 절차 없이 이미 '소통 피드백 문제'를 다룰 주제로 기정사실화했습니다.","c":["2.01","3.06","4.05","6.02"],"m":["3.1"],"k":[],"e":[]},{"id":178,"n":"SJT-34","cat":"sjt","ty":"bw","t":"The Plan You Came In With","se":"Last session, Debbie, a hospital chief of staff, left energized about a 90-day plan to delegate more to her deputies, and you agreed to track progress this week—so you prepared. But she opened somewhere else: \"Forget the delegation thing for a second. My father was admitted to our own ICU on Saturday. I've been on both sides of the bed all week, and I can't find where I stand.\"","sk":"지난주 합의한 90일 위임 계획 점검을 준비해 온 코치 앞에서 병원 진료부장 데비는 \"위임 이야기는 잠깐 잊어주세요. 토요일에 제 아버지가 저희 병원 중환자실에 입원하셔서 중심을 못 잡겠어요\"라고 털어놓는다.","o":["Acknowledge the hard week briefly, then guide her back to the delegation plan so the session stays on track.","Ask her to choose between her father's week and the delegation work, and go with whichever she names.","Set the prepared agenda aside and ask where she most needs her attention today.","Ask whether her father's week bears on the plan, leaving her free to say no."],"ok":["힘든 한 주를 보냈음을 짧게 인정한 뒤, 세션이 궤도를 유지하도록 위임 계획으로 다시 이끈다.","아버지와의 한 주와 위임 작업 중 하나를 선택하라고 요청하고, 그녀가 말하는 쪽을 따른다.","준비해 온 아젠다를 내려놓고, 오늘 그녀의 주의를 가장 필요로 하는 곳이 어디인지 묻는다.","아버지의 입원 일이 위임 계획과 관련이 있는지 묻되, 아니라고 말할 자유를 준다."],"b":"C","w":"A","be":"유연하고 고객 중심적인 코칭 마인드셋과 프레즌스의 본질은 코치가 준비한 계획을 내려놓고 지금 눈앞에 있는 전인적 인간(The Who)의 생생한 현실에 온전히 응답하며 오늘 세션의 초점을 고객이 직접 선택하도록 파트너십을 맺는 것이기 때문입니다.","we":"Worst(A)는 아버지가 중환자실에 입원한 급성 개인 위기 앞에서 코치가 준비한 일정을 지키겠다는 이유로 위임 계획으로 그녀를 되돌리는 적극적 해악입니다. B는 선택권은 주었으나 위기 속 고객에게 투박한 양자택일을 강요했고, D는 아니라고 말할 자유를 주긴 했으나 여전히 코치가 준비한 위임 계획 쪽으로 은근히 연결하려는 미련이 남아 있습니다.","c":["3.06","3.10","5.01","5.03"],"m":["5.1"],"k":[],"e":[]},{"id":179,"n":"SJT-35","cat":"sjt","ty":"bw","t":"Earning Your Keep","se":"You coach Tomas, a first-time founder, pro bono through an accelerator. Three sessions in, he comes in quieter, arms folded, and gets to it honestly: \"I'm not sure these sessions are doing much. My co-founder gets concrete advice from his mentor—I leave ours with more questions than I walked in with.\" You hold two master's degrees and a decade of operating experience, and you feel a sharp pull to prove this seat by showing him what you know.","sk":"초보 창업자 토마스가 3회기째 팔짱을 낀 채 \"공동창업자는 멘토에게 구체적인 조언을 받는데 저는 질문만 더 안고 나간다\"며 코칭의 가치에 의문을 제기한다. 석사 학위 두 개와 10년 경력을 가진 코치는 자신의 전문성을 증명하고 싶은 충동을 느낀다.","o":["Acknowledge the comparison, then ask what he was hoping to get out of today and what \"useful\" would look like for him.","Reassure him that coaching takes time and the value will come if he stays with it.","Suggest you blend approaches—coach part of the time and advise the rest.","Walk him through three frameworks from your own playbook so he leaves with concrete answers like his co-founder does."],"ok":["그 비교를 인정해 준 뒤, 오늘 세션에서 무엇을 얻기를 바랐는지 그리고 그에게 '유용함(useful)'이란 어떤 모습일지 묻는다.","코칭은 시간이 걸리는 과정이며 계속 함께하다 보면 가치가 나타날 것이라고 안심시킨다.","접근법을 혼합하자고 제안한다—시간의 일부는 코칭을 하고 나머지는 조언을 해주는 방식으로.","공동창업자처럼 구체적인 답을 얻고 갈 수 있도록 당신 자신의 실무 플레이북에서 세 가지 프레임워크를 차근차근 설명해 준다."],"b":"A","w":"D","be":"자신의 전문성을 과시해 자격을 증명하고 싶은 코치의 에고와 감정적 자극을 스스로 조절하고, 고객의 솔직한 의구심을 방어 없이 인정한 뒤 호기심을 가지고 오늘 세션에서 고객이 원하는 바와 성공 척도('useful'의 정의)를 함께 수립하기 때문입니다.","we":"Worst(D)는 코치가 자신의 불안을 달래고 유능감을 과시하기 위해 코칭 입장을 버리고 3가지 프레임워크를 강의(컨설팅/트레이닝 모드 전환)해 고객의 주체적 사고 역량을 빼앗는 적극적 해악입니다. B는 공허한 위로로 오늘 세션 니즈를 외면했고, C는 사전 재합의나 역할 구분 없이 코칭과 자문을 뒤섞자고 제안해 원칙을 흐렸습니다.","c":["1.06","2.06","3.06","3.08","4.05","5.02","5.04"],"m":["3.1"],"k":[],"e":[]},{"id":180,"n":"SJT-36","cat":"sjt","ty":"bw","t":"What You Think You Already Know","se":"Aisha runs a fast-growing crypto trading desk and books you to work on leading through volatility. You've read enough to hold private opinions: speculative, ethically gray, built on hype. Then she tells you about pausing a profitable trade last week because it didn't sit right with her—and what that cost her team. She says, \"I keep coming back to how I want to lead, not just what we trade.\"","sk":"암호화폐 트레이딩 데스크를 운영하는 아이샤에게 코치는 '투기적이고 윤리적 회색지대'라는 사적 선입견을 품고 있었으나, 정작 그녀는 마음에 걸리는 수익 거래를 중단했던 일과 자신이 어떤 방식으로 이끌고 싶은지를 고민한다.","o":["Tell her the real issue is the ethics of her industry and steer into whether she can lead with integrity there.","Move to general leadership principles that fit any field and sidestep her specifics.","Ask her to explain how crypto trading works so you understand the context first.","Set aside what you assumed and ask what pausing that trade revealed about the leader she wants to be."],"ok":["진짜 문제는 그녀가 속한 업계의 윤리성이라고 말해주고, 그곳에서 진실성을 가지고 이끌 수 있는지 탐색하는 방향으로 세션을 이끈다.","어떤 분야에나 적용되는 일반적인 리더십 원칙으로 화제를 옮겨 그녀의 구체적인 상황은 비껴간다.","먼저 맥락을 이해할 수 있도록 암호화폐 트레이딩이 어떻게 작동하는지 설명해 달라고 요청한다.","당신이 가정했던 것을 내려놓고, 그 거래를 멈춘 행동이 그녀가 되고 싶은 리더의 모습(Who)에 대해 무엇을 드러내 주었는지 묻는다."],"b":"D","w":"A","be":"코치 자신의 산업·직업적 편향(Bias)을 즉시 자각하고 내려놓음으로써 고객을 고정관념의 틀이 아닌 온전한 존재(Who)로 대하며 그녀가 실제로 탐색하고자 하는 리더십 정체성과 가치를 호기심 있게 탐구하기 때문입니다.","we":"Worst(A)는 코치 개인의 업계에 대한 도덕적 편견을 '진짜 문제'라고 선언하고 세션을 코치의 윤리적 프레임으로 몰아가 신뢰를 즉각 붕괴시키는 적극적 해악입니다. B는 코치 불편함을 피하려고 일반론으로 도망치는 회피이고, C는 고객의 세션 시간을 코치의 업계 공부 시간으로 소모하는 페이싱 실수입니다.","c":["1.02","2.04","4.02","5.02"],"m":["5.2"],"k":[],"e":[]},{"id":181,"n":"SJT-37","cat":"sjt","ty":"bw","t":"The Choice You'd Never Make","se":"Marcus, a senior nurse manager, arrives clear: he's turning down a director role to stay at the bedside, even though everyone tells him he's wasting his potential. He's at peace—but as he talks, a knot tightens in your chest. You climbed every rung you were offered, and turning down advancement reads to you as fear dressed up as values. Then he notices the pause and says, \"You think I'm settling too, don't you?\"","sk":"수석 간호 관리자 마커스는 디렉터 승진 제안을 거절하고 환자 곁(현장)에 남기로 평온하게 결정했다. 그러나 평생 승진 사다리를 올라온 코치는 이를 '가치관으로 포장된 두려움'으로 느끼며 가슴이 조여 온다. 그때 마커스가 \"코치님도 제가 현실에 안주한다고 생각하시죠?\"라고 묻는다.","o":["Acknowledge his clarity, then ask him to walk through the upsides of the director role he hasn't fully considered.","Tell him staying at the bedside is probably a way to avoid the discomfort of growth.","Set your own reaction aside and ask what feeling solid in this decision would give him.","Reflect that this sounds like a clear values-based choice and affirm that he's decided well."],"ok":["그의 명료함을 인정한 뒤, 그가 충분히 고려하지 않았을 디렉터 역할의 장점들을 짚어보라고 요청한다.","현장에 남는 것은 아마도 성장의 불편함을 피하려는 방식일 것이라고 말해 준다.","당신 자신의 반응을 내려놓고, 이 결정에 단단한 확신을 느끼는 것이 그에게 무엇을 가져다줄지 묻는다.","명확한 가치 기반 선택처럼 들린다고 반영해 주며, 그가 잘 결정했다고 확언(칭찬)해 준다."],"b":"C","w":"B","be":"코치 자신의 가치관과 삶의 기준에서 비롯된 강한 정서적 반감을 즉각 알아차리고 내려놓음으로써 코치의 인생이 아닌 고객이 실제로 원하는 세션 목표('이미 내린 결정에 단단함을 느끼는 것')와 고객 자신의 가치·경험으로 온전히 주의를 되돌리기 때문입니다.","we":"Worst(B)는 코치 자신의 해결되지 않은 야망 서사를 고객에게 투사하여 고객의 가치 기반 선택을 병리적 회피로 왜곡·해석함으로써 평온하게 내린 결정을 의심하게 만드는 치명적 해악입니다. A는 질문 형식을 취했지만 결국 코치가 선호하는 디렉터 승진 쪽으로 유도하는 편향적 개입이고, D는 코치가 평가자 위치에서 '잘 결정했다'고 섣불리 결론 내려 탐색을 조기에 닫아버린 대응입니다.","c":["2.01","2.04","2.06","5.04"],"m":["5.1"],"k":[],"e":[]},{"id":182,"n":"SJT-38","cat":"sjt","ty":"bw","t":"Holding the Mindset When You're Sure You Know","se":"Priya comes in frustrated about friction with her director, and you recognize the pattern at once: in your experience, this traces back to a conversation someone is avoiding, and you feel a strong urge to point her there. But that's not her framing—she calls it a workload problem and gets more energized as she maps out a new calendar. She says, \"If I can just get my calendar under control, a lot of this eases.\"","sk":"상사와의 마찰에 좌절한 프리야에 대해 코치는 '회피 중인 대화'가 근본 원인이라고 확신하지만, 프리야는 이를 '업무량 문제'로 보며 새로운 일정표를 짜는 데 에너지를 얻고 있다.","o":["Offer what you noticed with no attachment, and let her decide whether to explore it.","Set your observation aside entirely and help her build the calendar plan.","Ask a string of questions engineered to lead her to your conclusion.","Tell her plainly the calendar is a distraction and steer the session to the conversation you think she's avoiding."],"ok":["집착 없이(with no attachment) 당신이 알아차린 바를 제시하고, 그것을 탐색할지 여부는 그녀가 결정하도록 맡긴다.","당신의 관찰을 완전히 제쳐두고 그녀가 일정 계획을 세우도록 돕는다.","당신의 결론으로 그녀를 이끌기 위해 정교하게 설계된 일련의 질문들을 던진다.","일정표는 본질을 흐리는 것(distraction)이라고 단호하게 말해주고, 당신이 보기에 그녀가 회피하고 있는 대화 주제로 세션을 이끈다."],"b":"A","w":"D","be":"역량 7.11 및 PCC 마커 7.5('집착 없이 관찰, 직감, 의견, 생각 또는 감정을 있는 그대로 공유하고 고객이 더 깊이 탐구할 수 있도록 초대한다')에 따라 직감을 아젠다로 강요하지 않고 가볍게 테이블 위에 올려놓은 뒤 선택권을 고객에게 돌려주기 때문입니다.","we":"Worst(D)는 '일정표는 본질을 흐리는 것이니 회피 중인 대화로 넘어가자'며 고객의 프레임과 에너지를 코치의 확신으로 덮어버리는 적극적 해악입니다. B는 자율성은 존중했으나 유용한 통찰이 될 수 있는 코치의 직관을 아예 숨겨버린 기회 상실이고, C는 질문의 탈을 썼지만 코치의 결론으로 몰아가는 조작적 유도 질문(PCC 마커 7 위배)입니다.","c":["2.05","5.03","7.11"],"m":["4.4"],"k":[],"e":[]},{"id":183,"n":"SJT-39","cat":"sjt","ty":"bw","t":"Client Sharing Sensitive Personal Information","se":"You're two months into leadership work, and out of nowhere, this client goes quiet and discloses a trauma they've never told a soul. Their voice tightens, their eyes fill, and then they just look at you. They don't ask to work on it—they let it sit in the room.","sk":"리더십 코칭 2개월째, 고객이 갑자기 조용해지더니 평생 그 누구에게도 말한 적 없는 깊은 트라우마를 털어놓는다. 치료해 달라고 요청하지 않은 채 공간 안에 고백을 내려놓고 당신을 바라본다.","o":["Honor the trust it took, and ask whether and how they'd like it to connect to what they're working on—leaving the choice with them.","Thank them, name that a therapist is better placed, then let them decide its role.","Start asking detailed questions and steer the session into the emotions.","Thank them, hand over two therapist contacts, and move straight back to the leadership goal."],"ok":["그 고백에 담긴 신뢰를 깊이 존중하고, 이 이야기가 현재 다루고 있는 코칭 작업과 연결되기를 원하는지, 그리고 어떻게 연결하고 싶은지 물으며 선택권을 고객에게 맡긴다.","감사를 표하고 심리치료사가 더 적합한 전문가임을 밝힌 뒤, 코칭에서의 역할을 고객이 결정하게 한다.","트라우마 경험에 대해 상세한 질문을 시작하며 세션을 과거의 감정 탐색으로 이끈다.","감사를 표하고 치료사 연락처 두 곳을 건넨 뒤, 곧바로 원래의 리더십 목표로 돌아간다."],"b":"A","w":"C","be":"역량 1.06에 따라 심리치료 영역으로 월권하지 않으면서도 고객의 용기와 신뢰를 따뜻하게 수용하고 이 경험이 현재의 리더십 코칭(미래·현재 지향)과 어떻게 연결되길 원하는지 선택의 운전대를 고객에게 돌려주기 때문입니다.","we":"Worst(C)는 임상 훈련과 계약이 없는 코치가 트라우마의 세부 내용을 캐묻고 과거의 정서 치유 작업으로 깊숙이 파고들어 코칭과 심리치료의 경계를 무너뜨리는 가장 위험한 적극적 해악입니다. B는 치료사를 언급했으나 고객이 치료를 원한다고 하지도 않았는데 코치가 먼저 선을 그은 이른 개입이고, D는 연락처까지 건네며 너무 성급하게 원래 아젠다로 돌아가 차갑게 화제를 돌리는 듯한 인상을 줍니다.","c":["1.06","1.07","4.03","4.04","5.03","5.05"],"m":[],"k":[],"e":[]},{"id":184,"n":"SJT-40","cat":"sjt","ty":"bw","t":"The Test Question","se":"A serial founder referred by a mutual contact—cordial but guarded for two sessions. Ten minutes into the third, he leans back and asks if he can be straight: the coaches he's tried were a lot of nodding and \"How does that make you feel?\"—\"So what makes you different?\"","sk":"연쇄 창업가 데본이 3회기째 의자 등받이에 기대며 그동안 만난 코치들은 고개만 끄덕이고 기분만 물었다며 \"그래서 코치님은 무엇이 다른가요?\"라고 도발적으로 시험한다.","o":["Lay out your credentials, your client results, your methodology, and let him judge the value.","Tell him that testing the coach is itself an avoidance pattern, and ask what he's protecting himself from.","Acknowledge that skepticism is fair given his history, and ask what a coach would need to do to make the time worthwhile.","Name what's underneath without defensiveness—\"You've been let down before and want to know this is real\"—and ask what would make it worth it."],"ok":["당신의 자격 요건, 고객 성과 사례, 방법론을 쭉 설명하고 그가 가치를 판단하게 한다.","코치를 시험하는 것 자체가 하나의 회피 패턴이라고 말해 주고, 무엇으로부터 자신을 보호하고 있는지 묻는다.","그의 과거 경험을 고려할 때 회의적인 태도는 타당하다고 인정해 주고, 이 시간을 가치 있게 만들기 위해 코치가 무엇을 해야 할지 묻는다.","방어적인 태도 없이 그 이면의 마음을 명명해 준다—\"이전에도 실망하신 적이 있어서 이번에는 진짜인지 확인하고 싶으신 거군요\"—그리고 무엇이 이 시간을 가치 있게 만들지 묻는다."],"b":"D","w":"B","be":"공격적으로 들리는 표면의 도발을 에고 없이 받아내어 그 이면에 숨겨진 진짜 감정과 욕구('실망했던 상처와 진정성에 대한 갈망')를 공감적으로 비추어 주고 함께 만들어갈 코칭의 기준을 파트너십으로 초대하기 때문입니다.","we":"Worst(B)는 '코치를 시험하는 것 자체가 회피 패턴이다'라고 말함으로써 고객의 정당한 문제 제기를 코치가 우월한 위치에서 심리적 결함·병리(avoidance pattern)로 진단·해석하여 신뢰의 뿌리를 독살하는 최악의 해악입니다. A는 경력과 방법론을 나열하는 세일즈/방어적 대응이고, C는 회의감을 인정하고 조건을 묻는 훌륭한 차선책이나 이면의 실망감까지 깊이 공감·반영하는 D보다 한 걸음 덜 깊습니다.","c":["4.03","4.04","4.05","4.06","6.03"],"m":["4.1"],"k":[],"e":[]},{"id":185,"n":"SJT-41","cat":"sjt","ty":"bw","t":"Across the Difference","se":"Amara is a software director who immigrated from Nigeria. Her American leadership peers keep telling her she's \"too direct,\" and she says, \"Where I'm from, that's how you show respect—you say the real thing.\" Now she's told to soften everything, and she finishes with: \"I don't even know who I'm supposed to be in that room anymore.\"","sk":"나이지리아 출신 이민자 소프트웨어 디렉터 아마라는 미국인 동료들로부터 '너무 직설적'이라는 지적을 받으며 자신의 소통 방식을 지워야 한다는 압박감 속에서 \"이제 그 회의실에서 제가 어떤 사람이어야 하는지조차 모르겠어요\"라고 말한다.","o":["Reflect the bind—being asked to mute a style that carries respect in her culture—and ask how she'd navigate it.","Affirm that directness is a strength and reassure her she shouldn't have to change who she is.","Offer practical techniques to adapt her style to American workplace norms.","Ask her to describe how directness works as respect in her culture so you understand her frame."],"ok":["자신의 문화에서 존중을 담고 있는 소통 스타일을 억눌러야 하는 이중 구속(딜레마)을 반영해 주고, 그녀가 이것을 어떻게 헤쳐나가고 싶은지 묻는다.","직설적인 태도는 강점이라고 확언해 주며, 그녀가 자신의 본모습을 바꿀 필요가 없다고 안심시킨다.","미국 직장 규범에 자신의 스타일을 맞추기 위한 실용적인 기법들을 제안한다.","코치가 그녀의 프레임을 이해할 수 있도록, 그녀의 문화에서 직설적인 태도가 어떻게 존중으로 작동하는지 설명해 달라고 요청한다."],"b":"A","w":"C","be":"고객의 문화적 프레임과 소통 스타일을 결함이 아닌 정당한 정체성으로 인정·존중하면서, 동시에 코치가 어느 한쪽 편을 대신 결정해 주지 않고 그 딜레마를 어떻게 조율하고 나아갈지 자율적 선택권을 고객에게 돌려주기 때문입니다.","we":"Worst(C)는 '미국 직장 규범에 맞추는 실용적 기법을 제안한다'며 고객의 문화적 소통 방식을 '고쳐야 할 결함'으로 규정하고 동료들의 편을 들어 동화를 강요하는 최악의 해악입니다. B는 따뜻하나 코치가 일방적으로 '바꿀 필요가 없다'고 결론 내려 탐색을 닫았고, D는 고통받는 고객에게 코치를 교육시키는 '설명 노동'을 부과해 초점을 코치의 이해로 돌렸습니다.","c":["1.02","2.04","4.01","4.02","4.05"],"m":["4.1"],"k":[],"e":[]},{"id":186,"n":"SJT-42","cat":"sjt","ty":"bw","t":"The Tears Arrive","se":"Priscilla's been talking steadily about a board conflict, and mid-sentence she stops. She presses the back of her hand to her mouth, her eyes fill, and the tears spill over. She doesn't speak; she sits with it, one hand half covering her face, the emotion still moving through her. She hasn't asked you for anything.","sk":"이사회 갈등을 이야기하던 프리실라가 문장 중간에 멈추고 입을 가린 채 눈물을 흘린다. 그녀는 아무 말도 요청도 하지 않은 채 감정을 느끼며 앉아 있다.","o":["Acknowledge the emotion and ask whether she'd like a minute or to keep going.","Reassure her it's understandable that many leaders face this, then steer her toward what she can do about the board.","Stay silently present—hold her gaze, reach for nothing, and say nothing.","Stay grounded, let the silence hold, and softly reflect that something just moved through her, then leave the next move to her."],"ok":["감정을 인정하고 잠시 시간을 가질지 아니면 계속 진행할지 묻는다.","많은 리더들이 겪는 일이라 이해할 만하다고 안심시킨 뒤, 이사회에 대해 무엇을 할 수 있을지 실행 방향으로 이끈다.","침묵 속에 현존한다—시선을 맞추고 아무것도 건네지 않으며 아무 말도 하지 않는다.","중심을 잡은 채 머무르며 침묵이 유지되게 두고, 방금 그녀 안에서 무언가 깊이 움직였음을 부드럽게 반영해 준 뒤 다음 움직임을 그녀에게 맡긴다."],"b":"D","w":"B","be":"강한 감정 상태 앞에서 코치가 당황하지 않고 자신감 있게 함께 머무르며 침묵과 멈춤의 공간을 허용하고, 판단이나 해석 없이 지금 일어난 감정의 움직임을 부드럽게 반영해 준 뒤 주체적 선택권을 고객에게 돌려주기 때문입니다.","we":"Worst(B)는 '많은 리더들이 겪는 당연한 일이다(정상화)'라고 달랜 뒤 곧바로 이사회 실행 방향으로 화제를 돌려 고객의 깊은 상처와 감정을 평범한 것으로 축소·묵살하고 감정의 문을 닫아버리는 적극적 해악입니다. A는 감정을 인정하고 속도를 묻는 훌륭한 차선책이나 가장 날것의 찰나에 즉시 인지적 결정을 요구해 침묵의 호흡을 살짝 끊었고, C는 침묵은 지키나 언어적 반영이 빠져 반응성이 다소 부족합니다.","c":["4.05","5.01","5.03","5.05","5.07"],"m":["4.2"],"k":[],"e":[]},{"id":187,"n":"SJT-43","cat":"sjt","ty":"bw","t":"The Missed Signals","se":"Carla's a team leader laying out a big plant floor project—new line, tight timeline, a crew she inherited. Her sentences shorten, she hesitates before she names two of her supervisors, her tone drops every time she circles back to the timeline. So you ask how she feels, and she answers almost before you finish: \"It's fine, I'm excited.\" But her shoulders rise, her pace stays clipped, she glances away.","sk":"공장 라인 프로젝트를 설명하는 팀 리더 칼라는 일정과 두 감독관 이름을 말할 때마다 목소리가 가라앉고 망설이면서도 기분을 묻자 \"괜찮아요, 기대돼요\"라고 대답한다. 하지만 어깨는 올라가고 시선을 회피한다.","o":["Reassure her she's got it under control and move into mapping the next steps.","Keep asking about logistics and ownership, and leave the tonal cues alone.","Name what you saw—the shift around the timeline and the supervisors—and follow what opens.","Suggest she jot down any concerns for next time."],"ok":["그녀가 상황을 잘 통제하고 있다고 안심시킨 뒤 다음 실행 단계를 짜는 것으로 넘어간다.","실무 일정(logistics)과 책임 배분에 대해 계속 묻고, 목소리 톤의 단서들은 건드리지 않고 둔다.","일정과 감독관들을 언급할 때 나타난 변화 등 당신이 관찰한 비언어적 신호들을 그대로 명명해 주고, 그로 인해 열리는 이야기를 따라간다.","걱정되는 점이 있다면 다음 세션을 위해 메모해 두라고 제안한다."],"b":"C","w":"A","be":"적극적 경청의 핵심인 '말한 것과 말하지 않은 것의 통합적 파악'과 '비언어적 신호 탐색(PCC 마커 6.4)'을 실천하여 코치의 해석을 덧붙이지 않고 구체적 관찰 사실만 비추어 준 뒤 고객 스스로 의미를 탐색하게 했기 때문입니다.","we":"Worst(A)는 '잘 통제하고 있다'며 코치가 일방적으로 안심시키고 다음 실행 계획으로 넘어가 고객의 명백한 비언어적 불안 신호를 코치의 말로 덮어 무효화하고 회피와 공모하는 적극적 해악입니다. B는 비언어적 단서를 놓치는 수동적 부주의이고, D는 탐색을 다음 세션 숙제로 미루는(postponing) 아쉬운 대응입니다.","c":["6.03","6.04","6.05","7.11"],"m":["6.3"],"k":[],"e":[]},{"id":188,"n":"SJT-44","cat":"sjt","ty":"bw","t":"The Word She Keeps Using","se":"Renata is a nonprofit director here to talk about her board. Three times in the first few minutes, she uses the same word: she wants to be \"more visible\"—visible to her funders, her staff, the sector conferences she keeps skipping. And each time she says it, there's a slight grimace, as if the word has weight on it.","sk":"비영리단체 디렉터 레나타는 초반 몇 분 동안 \"더 드러나고 싶다(more visible)\"는 단어를 세 번이나 사용하면서 그때마다 무거운 짐이 실린 듯 얼굴을 살짝 찡그린다.","o":["Agree that visibility matters and start building a profile-raising plan—conferences, funder touchpoints, a communications cadence.","Reflect the word back and ask what it means to her.","Note that she said it a lot, then pivot to which board relationship feels most strained.","Tell her visibility is really about confidence, and steer toward executive presence."],"ok":["가시성(visibility)이 중요하다는 데 동의하고 컨퍼런스 참석, 후원자 접점, 소통 주기 등 인지도 제고 계획을 세우기 시작한다.","그 단어를 그대로 반영해 주고, 그녀에게 그것이 어떤 의미인지 묻는다.","그녀가 그 단어를 많이 사용했다고 언급한 뒤, 어떤 이사회 관계가 가장 긴장되어 있는지 다른 화제로 전환한다.","가시성이란 사실 '자신감'에 관한 것이라고 말해주고 '임원다운 존재감(executive presence)' 쪽으로 세션을 이끈다."],"b":"B","w":"D","be":"PCC 마커 6.2('코치는 고객이 사용하는 단어에 대해 문의하거나 탐색한다')의 교과서적 구현으로, 코치 머릿속의 사전적 정의나 행동 계획을 내려놓고 고객이 반복하며 무게를 싣는 핵심 키워드('visible')의 고유한 내적 의미를 정의하게 했기 때문입니다.","we":"Worst(D)는 '가시성은 사실 자신감의 문제다'라고 코치가 고객의 단어를 임의로 재정의(Overwriting)하고 세션을 코치의 이론('임원다운 존재감')으로 끌고 가는 적극적 해악입니다. A는 단어 의미 확인 없이 표면적 해석으로 성급히 계획을 짜는 실수이고, C는 반복을 알아차렸으나 탐색하지 않고 엉뚱한 주제로 화제를 돌렸습니다.","c":["4.02","5.02","6.02","6.04"],"m":["6.2"],"k":[],"e":[]},{"id":189,"n":"SJT-45","cat":"sjt","ty":"bw","t":"The Room Goes Quiet","se":"Daniel's a hospital department head. For ten minutes he's animated—fast, gesturing, leaning in, describing a restructure he's leading. Then, almost in passing, he mentions the change means letting go of a longtime colleague—and everything shifts. His pace slows, he sits back, the lift goes out of his voice. He looks past you toward the window, then says quietly, \"Anyway, it's the right call for the department.\"","sk":"활기차게 조직 개편을 설명하던 병원 부서장 다니엘이 오랜 동료를 내보내야 한다고 언급하는 순간 말 속도가 느려지고 창밖을 바라보며 목소리의 생기가 빠진다. 그러고는 \"어쨌든 부서를 위해서는 옳은 결정입니다\"라며 넘어가려 한다.","o":["Match his return to the plan and ask what the next phase asks of him as a leader.","Tell him letting people go is always hard and he'll feel better once it's done, then guide him back.","Name the shift you saw and stay with what he explores.","Make a single observation, and when he says \"I'm fine,\" accept it and resume the restructure questions."],"ok":["계획으로 돌아가려는 그의 속도에 맞추어 리더로서 다음 단계가 그에게 무엇을 요구하는지 묻는다.","사람을 내보내는 일은 언제나 힘든 것이며 일단 끝나고 나면 기분이 나아질 것이라고 말해준 뒤 원래 계획으로 다시 이끈다.","당신이 본 에너지의 변화를 그대로 명명해 주고, 그가 탐색하는 것을 함께 따라간다.","관찰한 바를 한 번 언급한 뒤, 그가 \"괜찮아요\"라고 말하면 그것을 수용하고 조직 개편 질문을 재개한다."],"b":"C","w":"B","be":"대화 도중 발생한 급격한 에너지 저하와 비언어적 변화(말 속도, 자세, 시선, 어조)를 포착해 있는 그대로 반영하고, 표면적 합리화('옳은 결정이다') 이면의 깊은 감정과 내면을 고객 스스로 탐색하도록 공간을 열어주었기 때문입니다.","we":"Worst(B)는 '원래 힘든 일이고 끝나면 나아질 것이다'라며 ① 감정을 코치가 규정하고, ② 고통을 축소·위로하며, ③ 감정의 문을 닫고 원래 계획으로 몰아가는 세 가지 해악을 동시에 저지릅니다. A는 비언어적 신호를 놓친 수동적 부주의이고, D는 관찰 공유 후 고객이 '괜찮다'며 경계를 그었을 때 그 경계를 존중해 물러난 준수한 차선책입니다.","c":["6.03","6.04","6.05","7.11"],"m":["6.3"],"k":[],"e":[]},{"id":190,"n":"SJT-46","cat":"sjt","ty":"bw","t":"Who Decides What She Sees","se":"Amara's a first-time founder walking you through a tense investor meeting. She recounts it in real detail, then winds down and says, \"I don't even know how I come across to them anymore.\" Meanwhile, from the story you formed a clear impression—\"capable, but over-explaining\"—and you can feel the urge to hand it to her as the answer she's looking for.","sk":"긴장감 넘쳤던 투자자 미팅을 설명하던 초보 창업자 아마라가 \"이제 제가 그들에게 어떤 모습으로 비치는지조차 모르겠어요\"라며 자기 인식의 불확실성을 꺼내 놓는다. 코치 머릿속에는 '유능하지만 과잉 설명하는 경향'이라는 명확한 인상이 떠올랐다.","o":["Summarize the meeting back to her in a tidy narrative of strong and weak moments so she has something to react to.","Invite her to explore her own perception first before you share any impression.","Acknowledge the uncertainty and ask which moment she'd most like to look at together.","Tell her how she comes across—\"capable, but over-explaining\"—and frame it as the insight she's been missing."],"ok":["그녀가 반응할 수 있도록 강했던 순간과 약했던 순간을 깔끔한 서사로 요약해 준다.","코치가 어떤 인상을 공유하기 전에, 먼저 그녀 자신의 인식을 탐색하도록 초대한다.","그 불확실성을 인정하고 함께 들여다보고 싶은 순간이 어느 지점인지 묻는다.","그녀가 어떻게 비치는지(\"유능하지만 과잉 설명한다\") 말해 주고, 그것이 그녀가 놓치고 있던 핵심 통찰이라고 포장한다."],"b":"B","w":"D","be":"PCC 마커 6.5('코치는 고객이 현재 자신이나 자신의 세계를 어떻게 인식하고 있는지 묻거나 탐구한다')에 따라 코치 머릿속의 인상을 성급히 내놓지 않고 고객 스스로 자신의 자기 인식을 먼저 탐색하고 언어화하도록 주도권을 돌려주기 때문입니다.","we":"Worst(D)는 고객에게 스스로를 어떻게 인식하는지 묻지도 않은 채 코치의 인상을 '네가 놓친 통찰'이라고 권위적으로 주입하여 자생적 알아차림을 빼앗는 적극적 해악입니다. A는 코치 기준('강한 순간 vs 약한 순간')으로 이야기를 재구성해 건네는 오답이고, C는 불확실성을 인정하고 장면을 고르게 하는 훌륭한 파트너십이나 '자기 인식' 질문에 직접 응답하는 B보다 한 걸음 덜 정교합니다.","c":["2.01","6.03","7.03","7.11"],"m":["6.5"],"k":[],"e":[]},{"id":191,"n":"SJT-47","cat":"sjt","ty":"bw","t":"The Assistant in the Room","se":"Three weeks ago, you added an AI meeting assistant: it records your video sessions and saves a transcript and summary to the vendor's servers. Your updated agreement covers new clients, but Ravi signed his months earlier and you haven't raised it. It has joined your last two sessions. Today, Ravi wants to talk about a health condition he hasn't disclosed at work, then spots the assistant: \"Wait. What is that? Is this being recorded?\"","sk":"몇 달 전 계약한 기존 고객 라비에게 사전 고지·동의 없이 AI 회의 녹음·요약 어시스턴트가 지난 두 번의 세션에 참여했다. 오늘 라비가 직장에 숨긴 건강 문제를 털어놓으려다 AI 툴을 발견하고 \"지금 녹화되고 있는 건가요?\"라고 묻는다.","o":["Confirm it records this session and ask if he's comfortable carrying on.","Call it a tool for accurate notes and move to the health topic.","Switch it off, tell him what it recorded and where the files are, and say keeping them is his call.","Apologize, end the session early, and send him an updated agreement to sign first."],"ok":["이 세션을 녹화하는 툴이라고 확인해 주고, 계속 진행해도 괜찮은지 묻는다.","정확한 필기를 위한 도구라고 설명하고 건강 주제로 넘어간다.","즉시 기능을 끄고, 그동안 무엇이 녹화되었으며 파일이 어디에 저장되어 있는지 전부 알려준 뒤, 파일을 보관할지 삭제할지는 전적으로 그의 결정이라고 말한다.","사과하고 세션을 일찍 종료한 뒤, 먼저 서명할 수 있도록 업데이트된 계약서를 보내준다."],"b":"C","w":"B","be":"2025 개정 역량 2.02(기술·AI 사용 인식), 1.01(진실성), 1.05(비밀 유지 및 데이터 보호), 윤리강령(기술 활용 시 투명성 및 기록 통제권 보장)에 따라 즉각 녹화를 중단하고 과거 기록과 외부 서버 저장 사실까지 숨김없이 공개한 뒤 데이터 처리 권한을 고객에게 돌려주기 때문입니다.","we":"Worst(B)는 '정확한 필기를 위한 도구'라며 녹음·외부 서버 저장 사실을 은폐하는 반쪽짜리 진실로 고객을 기만하여 민감한 의료 정보를 유출 위험에 빠뜨리는 최악의 비윤리적 행위입니다. A는 현재 녹화 사실만 인정하고 지난 2회기 기록 및 외부 서버 저장 사실을 누락한 불완전한 동의이고, D는 코치 실수 때문에 고객이 절실히 가져온 오늘 세션을 일방 종료하는 과잉 대응입니다.","c":["1.01","1.04","1.05","2.02","3.03"],"m":[],"k":[],"e":[]},{"id":192,"n":"SJT-48","cat":"sjt","ty":"bw","t":"The Comment That Stayed With Him","se":"Kofi is a regional sales manager. Late last session, you said, \"It sounds like being liked matters more to you than her results.\" Today he stops: \"That comment stayed with me all week. She's two months back from parental leave and I've been pacing the feedback on purpose. It felt like you'd turned a judgment call into a character flaw.\" He admits he nearly didn't bring it up.","sk":"지난 세션 막바지 코치가 \"그녀의 성과보다 호감을 얻는 것이 당신에게 더 중요하게 들리네요\"라고 말한 것에 대해, 오늘 코피는 육아휴직 복귀 직원을 배려해 피드백 속도를 조절한 것인데 코치가 자신의 신중한 판단을 '성격적 결함'처럼 만들었다며 불편함을 고백한다.","o":["Ask what part of the comment felt unfair, to test together whether the label fits.","Tell him you stated it as a verdict when you could have offered it for him to weigh, and ask what you missed about his pacing.","Walk him back through the pattern you saw to show what you meant.","Apologize and promise to keep observations like that to yourself."],"ok":["그 라벨이 맞는지 함께 검증하기 위해 코멘트의 어느 부분이 부당하게 느껴졌는지 묻는다.","고객이 스스로 저울질해 볼 수 있도록 건넸어야 했는데 단정적인 판결처럼 말했음을 솔직히 인정하고, 그의 속도 조절(pacing)에 대해 코치가 무엇을 놓쳤는지 묻는다.","코치가 무슨 뜻으로 말했는지 보여주기 위해 코치가 보았던 패턴을 다시 차근차근 짚어준다.","사과하고 앞으로는 그런 관찰을 혼자만 간직하겠다고 약속한다."],"b":"B","w":"C","be":"코치 자신의 성급한 단정을 방어 없이 솔직하게 인정함으로써 취약성을 드러내고 투명성으로 신뢰를 구축(역량 4.06)하고, 고객의 반론을 수용(PCC 마커 4.4)하며 고객의 맥락과 의도에 대해 겸손한 호기심으로 질문하기 때문입니다.","we":"Worst(C)는 고객이 용기 내어 이의를 제기했는데도 코치가 자신의 관찰 패턴을 다시 들이밀며 정당화하여 반론을 억압하는 적극적 해악입니다. A는 방어적이진 않으나 코치 실수를 인정하지 않은 채 여전히 코치의 라벨이 맞는지 검증하는 데 초점을 두었고, D는 사과했으나 고객에게 묻지도 않고 '앞으로 관찰 공유를 일절 안 하겠다'고 일방 선언한 과잉 반응입니다.","c":["4.02","4.03","4.05","4.06","6.01"],"m":["4.1"],"k":[],"e":[]},{"id":193,"n":"SJT-49","cat":"sjt","ty":"bw","t":"The Exercise That Stopped Fitting","se":"Joelle, a law firm partner, agreed to a values-ranking exercise. Six of eight value cards are placed. Then her hand hovers over the last two and pulls back: \"I can keep putting these in order, but it feels like I'm filling it in for someone else. I don't know what's underneath it.\" She waits. You feel a tightness: without the grid, you have no idea where the next 25 minutes will go.","sk":"가치 카드 8장 중 6장을 배치하던 로펌 파트너 조엘이 손을 멈추며 \"계속 순서를 매길 수는 있지만 왠지 다른 누군가를 대신해 빈칸을 채우고 있는 기분이 들어요\"라고 말한다. 이 도표가 없으면 남은 25분을 어떻게 이끌지 막막해진다.","o":["Let her choose between finishing the grid and a future-self visualization.","Urge her to place the last two, since hesitation near the end can mean the exercise is reaching something real.","Pause, and ask what she wants to do with her sense of \"filling it in for someone else.\"","Set the grid aside and ask what she now makes of her earlier pros and cons."],"ok":["도표를 마저 완성하는 것과 미래 자아 시각화 기법 중 하나를 선택하게 한다.","마지막에 망설이는 것은 실습이 진짜 핵심에 닿고 있다는 신호일 수 있으므로 마지막 두 장을 마저 배치해 보라고 권유한다.","잠시 멈추고, '다른 누군가를 대신해 채우고 있다'는 그 감각으로 무엇을 하고 싶은지 묻는다.","도표를 치우고 아까 이야기했던 장단점에 대해 지금 어떤 생각이 드는지 묻는다."],"b":"C","w":"B","be":"코치가 구조 없는 25분에 대한 불안을 스스로 조절하고 '알지 못함의 영역(Not Knowing, 역량 5.06)'에 편안히 임하며, 도구를 내려놓고 도표 뒤에 있는 살아있는 인간(Who)이 방금 발견한 핵심 내면 신호를 어떻게 다룰지 고객에게 선택권을 돌려주기 때문입니다.","we":"Worst(B)는 고객이 명백히 '내 것이 아닌 것 같다'며 멈추었는데도 코치가 자기 해석을 들이밀며 실습을 강행해 고객의 진정한 내면 통찰을 억압하는 적극적 해악입니다. A는 선택권을 주는 형식을 취했으나 선택지 두 개 모두 코치의 도구로 제한했고, D는 도구를 내려놓았지만 고객에게 묻지 않고 코치가 임의로 이전 대화(장단점)로 방향을 정한 차선책입니다.","c":["5.03","5.04","5.06","5.07","7.07"],"m":["5.1"],"k":[],"e":[]},{"id":194,"n":"SJT-50","cat":"sjt","ty":"bw","t":"The Read She Turned Down","se":"Nora is a regional operations director testing whether she's ready to accept a division role abroad. Three times her teenager's school year came up, and each time her sentences shortened. With her permission, you shared that you feel a heaviness rather than the excitement her words carry. She sits back: \"No, I don't feel heavy at all. I'm ready for this, and I'm a little thrown that you'd read it that way.\"","sk":"해외 사업부 부임 준비도를 점검하던 노라에게 허락을 구한 뒤 '무거움(heaviness)'이 느껴진다고 공유하자, 그녀는 \"아니요, 전혀 무겁지 않아요. 전 준비됐고 코치님이 그렇게 해석하신 게 조금 당혹스럽네요\"라고 거절한다.","o":["Apologize for the misread and move on to the relocation timeline.","Share the three moments behind your read to show her the heaviness she may not be noticing yet.","Ask what she'd think about hearing what you noticed each time her children's school year came up.","Accept her disagreement and ask what tells her she's ready to say yes."],"ok":["잘못 읽은 것에 대해 사과하고 이주 일정(relocation timeline)으로 넘어간다.","그녀가 아직 알아차리지 못하고 있을 '무거움'을 보여주기 위해 코치의 직감 뒤에 있던 세 가지 순간들을 제시한다.","자녀의 학년 이야기가 나올 때마다 코치가 알아차린 바를 들어보는 것에 대해 어떻게 생각하는지 묻는다.","그녀의 반론(동의하지 않음)을 온전히 수용하고, 자신이 준비되었다고 말해주는 근거가 무엇인지 묻는다."],"b":"D","w":"B","be":"역량 7.11(집착 없는 공유), 용어집 'Without Attachment', 그리고 PCC 마커 4.4('고객의 응답을 받아들인다')에 따라 고객이 거절한 코치의 직감을 미련 없이 즉각 거두어들이고 고객이 직접 사용한 단어('ready')와 현재 사고로부터 탐색을 이어가기 때문입니다.","we":"Worst(B)는 고객이 명백히 부정했는데도 코치가 '세 가지 증거'를 들이밀며 자신이 옳았음을 입증하려 드는 코치 에고로서 고객을 방어적으로 만드는 적극적 해악입니다. A는 반론을 수용했으나 집착 없는 관찰 공유를 '실수'로 사과하며 위축되었고 원래 목표인 '준비도 점검'을 놓쳤으며, C는 허락을 구하는 형식을 취했으나 거절당한 직감을 우회해서 다시 들이미는 집착이 남아 있습니다.","c":["2.01","4.02","4.05","7.11"],"m":["4.4"],"k":[],"e":[]},{"id":195,"n":"SJT-51","cat":"sjt","ty":"bw","t":"The Win She Waves Away","se":"Elith is a finance director who designed an experiment last session: hand the quarterly forecast to her deputy, Matteo, and leave it alone. Matteo built it, she didn't change a line, and the CFO called it the cleanest one yet. Then she waves it off: \"Probably a fluke—an easy quarter.\" It's the third time she has credited a success to luck.","sk":"재무 디렉터 엘리스는 지난주 설계한 실험대로 부하 마테오에게 분기 예측 보고서를 온전히 맡겨 CFO의 극찬을 받았음에도 \"아마 운이 좋았을 거예요—쉬운 분기였으니까요\"라며 성공을 운 탓으로 돌린다.","o":["Move to the board presentation, planning to return to the forecast if time remains.","Suggest she hold off on counting the forecast as progress until Matteo repeats it in a harder quarter.","Ask what it would take for her to accept that she deserves more credit than she gives herself.","Name the specific choice she made, and ask what it shows her about the goal she set."],"ok":["이사회 발표 주제로 넘어가고, 시간이 남으면 예측 보고서 건으로 돌아오기로 계획한다.","마테오가 더 어려운 분기에도 이를 반복할 때까지는 예측 보고서 건을 진전으로 치지 말고 보류하라고 제안한다.","자신이 주는 것보다 더 많은 공로를 인정받을 자격이 있다는 걸 받아들이려면 무엇이 필요할
