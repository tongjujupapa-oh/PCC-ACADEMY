<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCC Coach Academy v30</title>
<style>
:root{
  --bg:#f4f6fb;--fg:#181d2d;--mu:#647087;--card:#ffffff;--bd:#e2e6f0;
  --ac:#1c3768;--acb:#e6ecf8;--ok:#157a47;--okb:#e3f6ec;
  --no:#c23627;--nob:#fdeceb;--wr:#a85800;--wrb:#fff2de;
  --red:#d92d20;--redb:#fef3f2;--redbd:#fecdca;
  --star:#e59400;--sh:0 2px 10px rgba(24,29,45,.05);
  --sub-bg-1:#fff8f0;
  --sub-bg-2:#ffefe0;
  --sub-bd:#f7dec4;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f121b;--fg:#eaecf5;--mu:#949db5;--card:#191e2c;--bd:#2a3145;
    --ac:#8b9bff;--acb:#242b4d;--ok:#5cd699;--okb:#153629;
    --no:#ff897d;--nob:#3b1e1c;--wr:#ffb554;--wrb:#3a2c12;
    --red:#ff7a70;--redb:#3b1816;--redbd:#6b2622;
    --star:#ffbe3d;--sh:0 2px 12px rgba(0,0,0,.3);
    --sub-bg-1:#2a2018;
    --sub-bg-2:#34271d;
    --sub-bd:#4a3626;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);
}
header{
  position:sticky;top:0;z-index:10;
  background:var(--card);border-bottom:1px solid var(--bd);
  padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.h-left{display:flex;align-items:center;gap:8px;min-width:0}
.back-btn{
  width:32px;height:32px;border-radius:10px;border:1px solid var(--bd);
  background:var(--bg);color:var(--fg);font-size:16px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.back-btn:disabled{opacity:.32;cursor:default}
header h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--ac);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header p{margin:2px 0 0;color:var(--ac);background:transparent;opacity:1;font-size:12px;font-weight:500;line-height:1.3;white-space:normal}
.h-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.h-badge{background:var(--acb);color:var(--ac);font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px}
.exit-btn{
  border:1px solid var(--bd);background:var(--nob);color:var(--no);
  font:inherit;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;cursor:pointer;
}

#main{padding:10px 12px 96px;max-width:720px;margin:0 auto}

nav{
  position:fixed;left:0;right:0;bottom:0;display:flex;
  background:var(--card);border-top:1px solid var(--bd);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:15;
  box-shadow:0 -2px 10px rgba(0,0,0,.04);
}
nav button{
  flex:1;border:0;background:none;color:var(--mu);
  padding:8px 0 7px;font:inherit;font-size:10.5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  min-width:0;letter-spacing:-.3px;
}
nav button b{font-size:16px;line-height:1.1;font-weight:600}
nav button.on{color:var(--ac);font-weight:700}

.card{
  background:var(--card);border:1px solid var(--bd);
  border-radius:16px;padding:15px;margin:10px 0;box-shadow:var(--sh);
}
.sec-title{font-size:16px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mu{color:var(--mu);font-size:12.5px}
.tag{background:var(--acb);color:var(--ac);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.tag.exam{background:var(--wrb);color:var(--wr)}

.stem-ko{font-size:16px;font-weight:700;color:var(--fg);margin:8px 0 4px;line-height:1.52;word-break:keep-all}
.stem-en{font-size:12.5px;font-weight:400;color:var(--mu);margin:0 0 12px;line-height:1.45}

.hl-red{
  color:var(--red);font-weight:800;
  background:var(--redb);
  padding:0 3px;border-radius:4px;
  text-decoration:underline;text-decoration-color:var(--redbd);text-underline-offset:2px;
}
.chip.red-chip{
  background:var(--redb);color:var(--red);
  border:1px solid var(--redbd);font-weight:700;
}

.opt{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  margin:8px 0;padding:12px;border-radius:13px;
  border:1.5px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;cursor:pointer;
  transition:border-color .15s, background-color .15s;
}
.opt>b{min-width:20px;font-size:15px;color:var(--ac);padding-top:1px}
.opt-body{flex:1;min-width:0}
.opt-ko{display:block;font-size:14.5px;font-weight:500;color:var(--fg);line-height:1.48;word-break:keep-all}
.opt-en{display:block;font-size:12px;font-weight:400;color:var(--mu);margin-top:4px;line-height:1.4}
.opt i{font-style:normal;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--okb);color:var(--ok);align-self:center;white-space:nowrap}
.opt i.w{background:var(--wrb);color:var(--wr)}
.opt.pb{border-color:var(--ok);background:color-mix(in srgb, var(--okb) 45%, var(--card))}
.opt.pw{border-color:var(--wr);background:color-mix(in srgb, var(--wrb) 45%, var(--card))}
.opt.okb{border-color:var(--ok);background:var(--okb)}
.opt.wrb{border-color:var(--wr);background:var(--wrb)}
.opt.bad{border-color:var(--no);background:var(--nob)}

.tools{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px;align-items:center}
.q-mode-group{display:flex;flex-direction:column;gap:6px;padding:9px 10px;border:1px solid var(--bd);border-radius:13px;background:var(--card);min-width:0}
.q-mode-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:800;letter-spacing:.2px;color:var(--mu)}
.q-mode-actions{display:flex;gap:6px;flex-wrap:wrap}
.q-mode-actions .chip{flex:1;white-space:nowrap;text-align:center;padding:7px 10px}
.q-mode-actions .chip:disabled{opacity:.38;cursor:not-allowed}
.chip{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:99px;padding:5px 11px;font-size:12.5px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.chip.sub-chip{background:var(--acb);color:var(--ac);border:0;font-weight:600}
.chip.reset-chip{background:var(--nob);color:var(--no);border:1px solid color-mix(in srgb, var(--no) 30%, transparent);font-weight:700}

.qh{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.qh .mu{margin-left:auto}
.icon-btn{
  width:32px;height:32px;border-radius:50%;border:1.5px solid var(--bd);
  background:var(--card);color:var(--mu);font-size:16px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-btn.star.on{color:var(--star);border-color:var(--star);background:var(--wrb)}
.icon-btn.qm{border-color:var(--ac);background:var(--acb);color:var(--ac)}

.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}

.pri{width:100%;padding:13px;border-radius:12px;border:0;background:var(--ac);color:#fff;font:inherit;font-size:15px;font-weight:700;margin-top:8px;cursor:pointer}
.pri:disabled{opacity:.38;cursor:not-allowed}
.row{display:flex;gap:8px;margin-top:10px}
.row button,.ghost{flex:1;padding:11px;border-radius:11px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}

.res{padding:11px 12px;border-radius:11px;margin:12px 0 8px;font-weight:700;font-size:14px}
.res.ok{background:var(--okb);color:var(--ok)}
.res.no{background:var(--nob);color:var(--no)}
.ex{border-left:3px solid var(--ac);padding:3px 0 3px 11px;margin:10px 0;font-size:13.8px;line-height:1.58;word-break:keep-all}
.ex.w-ex{border-left-color:var(--wr)}
.ex h5{margin:0 0 4px;font-size:12px;color:var(--mu)}

.ref-sec{margin-top:14px;padding-top:10px;border-top:1px dashed var(--bd)}
.ref-sec h5{margin:0 0 6px;font-size:12.5px;font-weight:800;color:var(--mu)}
.ref-item{
  padding:10px 12px;border-radius:11px;margin:6px 0;
  border:1px solid var(--sub-bd);background:var(--sub-bg-1);
  cursor:pointer;word-break:keep-all;
}
.ref-item:nth-child(even){background:var(--sub-bg-2)}
.ref-item:active{opacity:.78}
.ref-item .ref-hd{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;color:#c45100;margin-bottom:3px}
@media (prefers-color-scheme:dark){
  .ref-item .ref-hd{color:#ffaa64}
}

details{background:var(--card);border:1px solid var(--bd);border-radius:13px;margin:8px 0;box-shadow:var(--sh)}
summary{padding:13px 14px;font-weight:700;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
details>div{padding:4px 12px 12px}
.sub{
  padding:11px 12px;border-radius:11px;margin:7px 0;
  border:1px solid var(--sub-bd);
  font-size:14px;word-break:keep-all;
}
.sub:nth-child(odd){background:var(--sub-bg-1)}
.sub:nth-child(even){background:var(--sub-bg-2)}
.sub .n{color:#c45100;font-weight:800;margin-right:5px}
@media (prefers-color-scheme:dark){
  .sub .n{color:#ffaa64}
}
.txt-ko{font-size:14px;color:var(--fg);line-height:1.5}
.txt-en{font-size:12px;color:var(--mu);margin-top:3px;line-height:1.42}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat-box{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.stat-box b{display:block;font-size:20px;color:var(--ac);margin-bottom:2px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 11px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .3s}
.bar i.low{background:var(--no)}
.bar i.mid{background:var(--wr)}
.bar i.high{background:var(--ok)}

.sh{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:30;display:flex;align-items:flex-end;animation:fadeIn .15s}
.sh.center{align-items:center;justify-content:center;padding:16px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sh>div{
  background:var(--card);width:100%;max-height:84vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));
  max-width:720px;margin:0 auto;box-shadow:0 -4px 20px rgba(0,0,0,.15);
}
.sh.center>div{
  border-radius:20px;max-width:380px;padding:22px 18px;text-align:center;
}
.sh-handle{width:38px;height:4px;background:var(--bd);border-radius:99px;margin:0 auto 12px}
.sh h3{margin:0 0 6px;font-size:16.5px}
.sh h4{margin:15px 0 6px;font-size:12.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.3px}
.it{padding:10px 12px;border:1px solid var(--bd);border-radius:11px;margin:6px 0;font-size:13.5px;cursor:pointer;background:var(--bg);text-align:left}
.it:active{opacity:.75}
.it b{color:var(--ac)}


.num-open{border:1px solid var(--bd);background:var(--acb);color:var(--ac);font-size:12px;font-weight:800;padding:5px 9px;border-radius:9px;cursor:pointer}
.num-picker .num-form{display:flex;gap:8px;margin:12px 0}
.num-picker .num-form input{min-width:0;flex:1;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--fg);font:inherit}
.num-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:8px 0 14px}
.num-cell{position:relative;min-height:43px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:700 13px inherit;font-family:inherit;cursor:pointer}
.num-cell small{display:block;font-size:9px;font-weight:500;color:var(--mu);line-height:1.1}
.num-cell.correct{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.num-cell.wrong{background:var(--nob);border-color:var(--no);color:var(--no)}
.num-cell.answered{background:var(--wrb);border-color:var(--wr);color:var(--wr)}
.num-cell.current{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac);font-weight:900}
.num-cell .bm-star{position:absolute;right:3px;top:1px;color:var(--star);font-size:10px}
.num-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin:4px 0 8px}
.num-legend span{display:inline-flex;align-items:center;gap:4px}
.num-dot{width:9px;height:9px;border-radius:3px;background:var(--bd);display:inline-block}
.num-dot.ok{background:var(--ok)}.num-dot.no{background:var(--no)}.num-dot.now{background:var(--ac)}.num-dot.bm{background:var(--star)}
.toast{
  position:fixed;left:50%;bottom:82px;transform:translateX(-50%);
  background:rgba(24,29,45,.92);color:#fff;font-size:13px;font-weight:600;
  padding:9px 16px;border-radius:99px;z-index:40;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.22);pointer-events:none;
}
.stc>summary{font-weight:800;font-size:15px;padding:13px 12px;cursor:pointer}
.stsec h4{margin:12px 0 4px;font-size:13px;color:var(--ac)}.stsec ul{margin:0;padding-left:18px}.stsec li{margin:6px 0;font-size:14px;line-height:1.55}
.stsec li.chiprow{list-style:none;margin-left:-18px;display:flex;flex-wrap:wrap;gap:6px}
.vl{color:var(--ac);font-weight:700;text-decoration:underline;word-break:break-word}.vrow{padding:7px 0;border-top:1px solid var(--bd);font-size:13.5px}

nav{background:#12294a!important;border-top:0!important}
nav button{color:#aab4c6!important;padding:9px 0 9px!important;min-height:52px}
nav button.on{color:#d9b86c!important;font-weight:700}
nav button b{display:flex;line-height:1}
.pri{background:#d9b86c!important;color:#12294a!important;font-weight:800!important}
.hero{margin:-10px -12px 14px;background:linear-gradient(180deg,#27385a 0%,#14294b 38%,#12294a 100%);padding:22px 18px 24px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:14px;color:#fff}
.hero .hr{display:flex;align-items:center;gap:13px}
.hero .emb{width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,#ecd8a6,#c9a55d);display:flex;align-items:center;justify-content:center;color:#12294a;flex:none}
.hero h2{margin:0;font-size:22px;font-weight:800;line-height:1.15;color:#fff}
.hero .sub{font-size:13.5px;font-weight:500;line-height:1.35;color:#ffffff;background:transparent;margin-top:4px;text-shadow:none}
.hero .ln{height:1px;background:#3a4c70}
.hero .sl{font-size:26px;font-weight:800;line-height:1.28;color:#fff}.hero .sl span{color:#e3c88c}
.hero .tg{font-size:13px;color:#d6dcea}
.hero .xb{flex:none;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid #5a6d92;background:transparent;color:#e8edf7;font:600 12.5px inherit;font-family:inherit;cursor:pointer}
.pillars{display:flex;gap:10px;margin:12px 0}
.pillar{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 8px 11px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:inherit;color:var(--fg);cursor:pointer}
.pillar .pi{width:40px;height:40px;border-radius:12px;background:var(--acb);color:var(--ac);display:flex;align-items:center;justify-content:center}
.pillar b{font-size:14px;font-weight:800}.pillar span{font-size:11.5px;line-height:1.4;color:var(--mu)}
.qlinks{display:flex;gap:10px;margin:0 0 4px}
.qlinks button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:700 13.5px inherit;font-family:inherit;cursor:pointer}

.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px;margin:18px 4px 8px}
.sttile{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;font:inherit;color:var(--fg);cursor:pointer;min-height:44px}
.sttile .ico{width:68px;height:68px;border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(18,41,74,.22),inset 0 1px 0 rgba(255,255,255,.35)}
.sttile:active .ico{transform:scale(.94)}
.sttile b{font-size:12.5px;font-weight:700;line-height:1.3;text-align:center;word-break:keep-all}
.sttile small{font-size:10.5px;color:var(--mu);margin-top:-4px}
.sthead{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.sthead .ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.sthead h3{margin:0;font-size:16px;font-weight:800;line-height:1.3}

.secgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
.sectile{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:8px;min-height:108px;padding:12px 10px 10px;border:0;border-radius:18px;text-align:left;font:inherit;cursor:pointer;box-shadow:0 6px 14px rgba(18,41,74,.2)}
.sectile:active{transform:scale(.97)}
.sectile .sn{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.sectile b{font-size:14px;font-weight:800;line-height:1.3;word-break:keep-all}
.sectile small{font-size:10.5px;opacity:.92}
.stpop-h{border-radius:14px;padding:14px}.stpop-k{font-size:11.5px;opacity:.92;display:block;margin-bottom:4px}.stpop-h h3{margin:0;font-size:19px;font-weight:800;line-height:1.3}
</style>
</head>
<body>
<header>
  <div class="h-left">
    <button type="button" class="back-btn" id="hdrBack" data-a="goBack" aria-label="이전 화면으로 이동" title="이전 화면">‹</button>
    <div style="min-width:0">
      <h1>PCC Coach Academy</h1>
      <p>ICF PCC 시험 합격 전문 학습 플랫폼</p>
    </div>
  </div>
  <div class="h-right">
    <span class="h-badge" id="hdrStat">진도 0%</span>
    <button type="button" class="exit-btn" data-a="askExit" aria-label="앱 종료">종료</button>
  </div>
</header>

<div id="main"></div>
<div id="sheet"></div>
<div id="toast"></div>

<nav id="nav">
  <button type="button" data-a="tab" data-k="home"><b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg></b>홈</button>
  <button type="button" data-a="tab" data-k="q"><b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg></b>문제</button>

<script>
const D = {"q":[{"id":1,"n":"Q01","cat":"bank","ty":"bw","t":"신규 카페 창업을 준비 중인 잠재 고객과 사전 미팅을 진행하며 빠르게...","se":"During an introductory meeting with a prospective client preparing to open a new café, rapport develops quickly. Near the end, the prospect mentions the café's name, and the coach realizes they are an investor in an existing competing café two blocks away. What is the most appropriate and least appropriate action for the coach?","sk":"신규 카페 창업을 준비 중인 잠재 고객과 사전 미팅을 진행하며 빠르게 라포가 형성되었습니다. 대화가 마무리될 무렵 잠재 고객이 카페 이름을 언급했고, 코치는 자신이 두 블록 떨어진 곳에 위치한 기존 경쟁 카페의 투자자라는 사실을 깨달았습니다. 이때 코치가 취해야 할 가장 적절한 행동(Best)과 가장 부적절한 행동(Worst)은 무엇입니까?","o":["Disclose the investment in the competing cafe before any agreement is signed and let the client decide whether to proceed; recuse if needed.","Accept the engagement and mention the conflict only if the topic of competitors comes up.","Decline the coaching engagement while hiding the real reason behind a false excuse about scheduling conflicts.","Disclose the investment in the competing café but suggest proceeding with the contract on the condition that competitive strategy is avoided during sessions."],"ok":["어떤 합의서에도 서명하기 전에 경쟁 카페에 대한 투자 사실을 투명하게 공개하고 고객이 진행 여부를 결정하게 하며, 필요 시 코치가 사퇴한다.","계약을 먼저 수락한 뒤, 향후 세션에서 경쟁사 관련 주제가 나올 때만 이해상충 사실을 언급한다.","개인 일정이 맞지 않는다는 핑계로 진짜 이유를 숨긴 채 코칭 의뢰를 거절한다.","경쟁 카페에 투자한 사실을 밝히되, 세션에서 경쟁 전략만 피하면 문제가 없으니 계약을 진행하자고 제안한다."],"b":"A","w":"B","be":"잠재적 이해상충(Conflict of Interest)을 인지한 즉시 계약 체결 전에 투명하게 사실을 공개(역량 1.01, 4.06, 윤리강령 Standard 3.1)하고, 고객에게 자율적 선택권을 부여하며 필요 시 코치가 물러나는(Standard 3.3) 정직하고 윤리적인 모범 행동이기 때문입니다.","we":"Worst (B): 명백한 금전적·사업적 이해상충을 알고도 고의로 숨긴 채 계약을 먼저 체결하고, 나중에 문제가 불거질 때만 언급하겠다는 의도적 지연 은폐는 진실성과 사전 고지 의무를 정면 배신하는 최악의 윤리 위반입니다.\n중간 오답 C와 D 비교: C는 이중 관계는 피했으나 거짓 일정 핑계를 대어 진실성과 정직성(역량 1.01)을 훼손했고, D는 투자 사실을 공개한 점은 좋으나 경쟁 전략이라는 핵심 사업 주제를 코치가 임의로 제한하려 해 코칭의 온전성을 저해했습니다.","c":["1.01","1.04","4.06"],"m":[],"k":[],"e":["3.1","3.3"]},{"id":2,"n":"Q02","cat":"bank","ty":"bw","t":"세션 도중 고객이 최근 수면과 일상 업무를 심각하게 방해하는 잦은 공...","se":"During a session, a client discloses frequent panic attacks that are seriously disrupting sleep and daily work, and asks the coach to treat the anxiety. The coach is not a licensed mental health clinician. What are the most appropriate and least appropriate actions?","sk":"세션 도중 고객이 최근 수면과 일상 업무를 심각하게 방해하는 잦은 공황발작을 겪고 있다고 털어놓으며, 코치에게 '이 불안을 극복할 수 있도록 치료해 주세요'라고 요청합니다. 코치는 정신건강 임상 면허가 없는 일반 코치입니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Continue to coach around career goals and ignore the anxiety since the client did not raise it as the session topic.","Acknowledge what the client shared, name the limits of coaching versus clinical care, and partner with the client on whether to seek mental health support alongside or instead of coaching.","Begin teaching the client cognitive behavioral therapy (CBT) techniques for managing panic attacks during the session.","Refer the client to a therapist immediately and end the coaching engagement."],"ok":["일상적인 직무 불안이라고 안심시킨 뒤, 고객이 제기한 불안을 넘기고 기존 커리어 목표 중심으로 세션을 계속 진행한다.","고객이 나눈 고통을 공감적으로 인정하고, 코칭과 임상 심리치료의 역할 한계를 명확히 밝힌 뒤, 코칭과 병행하거나 대신하여 정신건강 전문가의 지원을 받을지 고객과 파트너십으로 협의한다.","고객을 돕기 위해 세션 중에 공황발작 관리를 위한 인지행동치료(CBT) 기법을 직접 가르치기 시작한다.","즉시 코칭 계약을 일방적으로 파기하고 치료사에게 연계하며 세션을 종료한다."],"b":"B","w":"C","be":"고객의 정서적 고통을 따뜻하게 인정·지지하면서도(역량 4.04, 4.05) 코칭과 임상 심리치료의 전문 영역 경계를 명확히 구분하고(역량 1.06, PCC 마커 1), 타 지원 전문가 연계 및 코칭 병행 여부를 고객의 자율적 선택에 따라 파트너십으로 협의하기 때문입니다(역량 1.07).","we":"Worst (C): 임상 면허가 없는 코치가 공황발작이라는 급성 임상 증상에 대해 인지행동치료(CBT) 기법을 직접 시술·교육함으로써 역량 1.06(심리치료와의 차별성 유지) 및 윤리강령 Standard 3.7, 5.1을 정면 위반하고 고객에게 직접적 위해를 끼칠 수 있는 최악의 월권입니다.\n중간 오답 A와 D 비교: A는 심각한 위기 신호를 '일상적 불안'으로 축소·묵살(Dismiss)하는 방치이며, D는 전문가 연계는 타당하나 고객과 상의 없이 코치가 일방적으로 계약까지 파기하여 파트너십과 종료 존중(역량 3.11)을 놓친 과잉 대응입니다.","c":["1.06","1.07","4.04","4.05"],"m":[],"k":[],"e":["3.7","5.1"]},{"id":3,"n":"Q03","cat":"bank","ty":"bw","t":"기업 후원 코칭 시작 2주 후, 코칭 비용을 지불하는 HR 스폰서가...","se":"Two weeks after an employer-sponsored coaching engagement begins, the HR sponsor who pays for the coaching calls and asks the coach to summarize how the coachee is doing and what is being discussed. The initial three-way agreement states that only attendance and high-level topics with the client's explicit consent may be reported. What are the best and worst responses?","sk":"기업 후원 코칭 시작 2주 후, 코칭 비용을 지불하는 HR 스폰서가 코치에게 전화를 걸어 피코치가 어떻게 지내고 있으며 세션에서 무엇을 다루고 있는지 구두로 요약해 달라고 요청합니다. 초기 3자 코칭 합의서에는 '출석 여부와 고객의 명시적 동의가 있는 상위 주제만 보고한다'고 명시되어 있습니다. 최선의 행동과 최악의 행동은 무엇입니까?","o":["Provide a brief verbal summary because the sponsor is paying and clearly has a legitimate interest.","Decline to share specifics, remind the sponsor of the confidentiality terms in the original agreement, and offer to facilitate a three-way conversation with the client present if richer reporting is needed.","Call the client to warn them that the HR sponsor asked probing questions about their session content and tell them to be careful.","Keep individual session content confidential but send the sponsor general reference materials on leadership competencies instead."],"ok":["스폰서가 비용을 지불하는 정당한 이해관계자이므로 피코치의 적응도와 주요 논의 내용을 간략히 구두로 요약해 준다.","구체적인 세션 내용 공유를 정중히 거절하고 초기 합의서의 비밀보장 조항을 상기시킨 뒤, 더 상세한 보고가 필요하다면 고객이 동석하는 3자 대화를 주선하겠다고 제안한다.","고객에게 전화를 걸어 'HR 스폰서가 당신의 세션 내용을 캐물었다'고 경고하며 조심하라고 일러준다.","개별 세션 내용은 비밀로 유지하되, 일반 리더십 역량 관련 참고 자료만 스폰서에게 대신 발송한다."],"b":"B","w":"A","be":"사전 체결된 3자 합의서의 비밀보장 조항을 엄격히 준수하여 고객의 서면·명시적 동의 없는 정보 유출을 차단하면서도(역량 1.05, 3.03, 윤리강령 Standard 2.1, 2.2), 스폰서의 니즈를 투명하게 조율할 수 있는 공식 경로(고객 동석 3자 미팅)를 제시했기 때문입니다.","we":"Worst (A): 비용 지불 주체가 조직 스폰서라 하더라도 비밀보장의 주인은 고객 본인임에도, 고객의 동의 없이 세션 내용과 적응도를 구두 요약해 제공하는 명백한 비밀보장 계약 위반(Standard 2.1 정면 위반)입니다.\n중간 오답 C와 D 비교: C는 비밀은 지켰으나 고객과 스폰서 간의 불신과 불안을 조장하는 비전문적 대응이고, D는 비밀보장 원칙은 지켰으나 스폰서에게 합의서 조항 안내나 3자 대화라는 건설적 대안을 제시하지 못한 미흡한 대처입니다.","c":["1.01","1.05","3.03"],"m":[],"k":[],"e":["2.1","2.2"]},{"id":4,"n":"Q04","cat":"bank","ty":"bw","t":"6개월간 커리어 목표로 코칭을 받아온 고객이 세션 시작과 함께 '오늘...","se":"A client who has been receiving career coaching for six months begins a session by saying, “Today I want to decide whether to end my marriage.” What is the coach's most appropriate and least appropriate response?","sk":"6개월간 커리어 목표로 코칭을 받아온 고객이 세션 시작과 함께 '오늘 코칭에서는 제가 현재의 결혼 생활을 끝낼지 말지(이혼 여부)를 결정하고 싶어요'라고 말합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Firmly refuse, stating that personal family matters cannot be addressed because the coaching contract is specifically for career coaching.","Partner with the client on what they want from today's session, name what coaching can and cannot offer for this topic, and explore whether a referral to a couples counselor or therapist may be useful alongside coaching.","Begin asking probing questions about the marriage to surface what the client really wants.","Create a pros-and-cons table together for getting divorced versus staying married to help the client decide."],"ok":["본 계약은 커리어 코칭으로 체결되었으므로 개인 가정사 주제는 다룰 수 없다고 단호히 거절한다.","오늘 세션에서 고객이 원하는 바를 함께 확인하고, 이 주제에 대해 코칭이 제공할 수 있는 것과 한계를 명확히 밝힌 뒤, 코칭과 병행하여 부부 상담사나 심리치료사에게 연계하는 것이 유용할지 파트너십으로 탐색한다.","고객이 진짜 원하는 것을 끌어내기 위해 결혼 생활의 갈등 이력과 부부 관계의 문제점을 깊이 파고드는 심층 탐색 질문을 시작한다.","이혼했을 때와 유지했을 때의 장단점 분석표를 함께 작성하며 결정을 돕는다."],"b":"B","w":"C","be":"의사결정 자체에 대한 사고 파트너십은 코칭의 영역이지만 부부 관계의 정서적 갈등 치유는 임상 상담의 영역일 수 있으므로, 오늘 세션 목표를 재확인하면서(역량 3.06) 코칭의 범위와 한계를 명확히 정의하고(역량 1.06, 3.01) 전문 상담 연계 필요성을 고객과 함께 탐색하기 때문입니다(역량 1.07).","we":"Worst (C): 세션 재합의와 역할 경계 안내 없이 결혼 생활의 갈등 이력을 깊이 파고드는 심층 질문을 시작함으로써 코치가 부부 상담사/심리치료사 역할로 월권(역량 1.06 및 PCC 마커 1 '치료 모드 이탈 금지' 위반)하는 최악의 위험 행위입니다.\n중간 오답 A와 D 비교: A는 고객의 중대한 의사결정 고민을 탐색이나 대안 안내 없이 일방 거절하는 경직된 대응이며, D는 코칭의 역할 경계 및 부부 상담 연계 가능성에 대한 사전 합의 없이 곧바로 분석 도구부터 들이미는 성급한 개입입니다.","c":["1.06","1.07","3.01","3.06"],"m":[],"k":[],"e":["3.7"]},{"id":5,"n":"Q05","cat":"bank","ty":"bw","t":"세션 도중 고객이 '제 심리치료사가 요즘 저에게 자기주장성(asser...","se":"During a session, a client says, “My psychotherapist has recently encouraged me to develop assertiveness, and I would like to work on that in coaching today.” The coach has never spoken with the psychotherapist. What are the best and worst actions?","sk":"세션 도중 고객이 '제 심리치료사가 요즘 저에게 자기주장성(assertiveness)을 길러보라고 권유했어요. 오늘 코칭에서 그걸 다루고 싶습니다'라고 말합니다. 코치는 그 심리치료사와 한 번도 대화한 적이 없습니다. 최선의 행동과 최악의 행동은 무엇입니까?","o":["Proceed with the topic since the client clearly stated what they want.","Ask the client what assertiveness means to them in their own context and what success would look like, and clarify whether any communication between the coach and the therapist is wanted by the client.","Provide a behavioral checklist to improve assertiveness and ask the client to practice it this week.","Contact the therapist directly to align the coaching plan with the clinical plan."],"ok":["고객이 원하는 바를 명확히 밝혔으므로 치료사의 권유대로 즉시 자기주장성 훈련을 시작한다.","고객 자신의 맥락에서 '자기주장성'이 무엇을 의미하고 오늘 세션의 성공 척도가 어떤 모습일지 함께 탐색한 뒤, 코치와 치료사 간의 소통을 고객이 원하는지 여부를 명확히 확인한다.","자기주장성 향상을 위한 행동 체크리스트를 제공하여 이번 주에 연습하게 한다.","임상 치료 계획과 코칭 계획을 일치시키기 위해 코치가 직접 심리치료사에게 전화를 걸어 상의한다."],"b":"B","w":"D","be":"치료사의 말이 아닌 고객 자신의 언어와 삶 맥락으로 '자기주장성'의 의미를 정의하고(역량 6.02, PCC 마커 6.2) 세션 성공 척도를 합의하며(역량 3.06, 3.08), 타 전문가와의 소통 여부는 철저히 고객의 의사와 서면 동의에 맡기기 때문입니다(역량 1.05).","we":"Worst (D): 고객의 사전 서면 동의 없이 외부 제3자(심리치료사)에게 코치가 직접 연락하여 고객이 코칭을 받고 있다는 사실과 세션 내용을 노출하는 명백한 비밀보장 위반(역량 1.05, 윤리강령 Standard 2.1, 2.2 위반)입니다.\n중간 오답 A와 C 비교: A는 주제를 수용했으나 추상어('자기주장성')에 대한 고객 고유의 정의와 세션 성공 척도 합의(PCC 마커 3.1, 3.2)를 생략한 채 훈련으로 들어갔으며, C는 탐색 없이 체크리스트를 제공하는 트레이닝/컨설팅 방식입니다.","c":["1.05","3.06","3.08","6.02"],"m":["3.1","3.2","6.2"],"k":[],"e":["2.1"]},{"id":6,"n":"Q06","cat":"bank","ty":"bw","t":"회사가 코칭 비용을 전액 지원하는 기업 후원 코칭에서, 고객이 상사에...","se":"In an employer-sponsored engagement fully paid for by the company, a client reveals that they are using coaching sessions to plan a resignation that they have not yet disclosed to their manager. What are the coach's most appropriate and least appropriate actions?","sk":"회사가 코칭 비용을 전액 지원하는 기업 후원 코칭에서, 고객이 상사에게 아직 알리지 않은 자신의 퇴사 계획을 세우는 데 코칭 세션을 활용하고 있다고 털어놓았습니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Inform the sponsor that the engagement may not be aligned with company goals.","Honor the confidentiality agreed at the start of the engagement, continue coaching the client toward what they want, and revisit the three-way agreement only if needed.","Discourage the client from resigning and persuade them to stay in order to protect the company's interests.","Immediately terminate the coaching agreement to avoid an ethical conflict."],"ok":["회사가 비용을 지불하고 있고 코칭 계약이 회사 목표와 배치될 수 있으므로 스폰서(회사)에게 퇴사 계획을 통보한다.","계약 시작 시 합의한 비밀보장 원칙을 철저히 준수하고, 고객이 지향하는 목표를 향해 코칭을 지속하며, 필요한 경우에만 고객과 상의하여 3자 합의를 재검토한다.","회사의 이익을 보호하기 위해 고객에게 퇴사를 만류하며 남도록 설득한다.","윤리적 갈등을 피하기 위해 즉시 코칭 계약을 종료한다."],"b":"B","w":"A","be":"비용 지불 주체(스폰서)와 무관하게 불법 행위나 위해 위협이 아닌 한 세션 내 모든 정보는 고객의 비밀보장 권리에 속하므로(역량 1.05, 윤리강령 Standard 2.1), 비밀을 수호하면서 고객이 지향하는 결과를 향해 코칭을 지속하기 때문입니다(역량 3.10, 3.12).","we":"Worst (A): 고객의 명시적 동의 없이 스폰서에게 퇴사 준비 사실을 밀고·통보함으로써 고객의 경력과 고용 상태에 치명적 피해를 입히고 비밀보장 원칙을 정면으로 배신한 최악의 윤리 위반입니다.\n중간 오답 C와 D 비교: C는 코치가 회사 대변인이 되어 고객의 자율적 선택 책임(역량 2.01)을 침해하며 설득하려 한 오류이며, D는 비밀보장 원칙 안에서 충분히 코칭을 지속할 수 있음에도 코치의 불편함 때문에 계약을 일방 파기하는 과잉 회피입니다.","c":["1.05","2.01","3.10","3.12"],"m":[],"k":[],"e":["2.1"]},{"id":7,"n":"Q07","cat":"bank","ty":"bw","t":"세션 진행 중 코치는 고객이 내리고 있는 결정에 대해 자신이 강한 부...","se":"During a session, the coach notices strong negative feelings about a decision the client is making and an urge to argue against it. What are the most appropriate and least appropriate actions?","sk":"세션 진행 중 코치는 고객이 내리고 있는 결정에 대해 자신이 강한 부정적 감정을 느끼고 있으며, 그 결정에 반대하며 논쟁하고 싶어 한다는 것을 알아차렸습니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Voice the concern directly so the client benefits from the coach's perspective.","Notice the emotional reaction internally, let it go, briefly self-regulate, and return to full presence and partnership.","Try not to show a reaction and sit silently with a rigid expression.","Quickly change the subject so that the coach's emotions do not show."],"ok":["고객이 코치의 객관적 관점에서 유익을 얻을 수 있도록 코치의 반대 우려와 논거를 직접 밝힌다.","내면의 감정 반응을 즉시 자각하고 이를 내려놓은 뒤 짧게 자기조절(self-regulate)하여, 온전한 프레즌스와 파트너십으로 복귀한다.","내색하지 않으려 애쓰며 아무 말 없이 표정을 굳힌 채 침묵한다.","코치의 감정이 드러나지 않도록 화제를 급히 다른 방향으로 돌린다."],"b":"B","w":"A","be":"코치 자신의 가치 판단에서 올라온 부정적 감정과 반박 충동을 즉각 알아차리고 자기조절(Self-regulation, 2025 용어집)을 통해 내려놓음으로써(역량 2.06, 5.04), 비판단적이고 고객 중심적인 프레즌스(역량 5.01)를 실시간으로 회복하기 때문입니다.","we":"Worst (A): 유익을 준다는 명분으로 코치의 반대 의견과 논쟁을 직접 쏟아냄으로써 고객의 선택 자율성(역량 2.01)을 침해하고 수평적 파트너십을 파괴한 최악의 에고 중심 개입입니다.\n중간 오답 C와 D 비교: C는 말은 참았으나 굳은 표정이라는 비언어적 판단(역량 2.10)으로 심리적 안전감을 위협하며, D는 코치의 감정을 피하기 위해 고객의 중요한 탐색 흐름을 인위적으로 끊어버리는 회피 반응입니다.","c":["2.01","2.06","2.10","5.01","5.04"],"m":[],"k":[],"e":[]},{"id":8,"n":"Q08","cat":"bank","ty":"bw","t":"세션 시작 5분 후 코치가 질문을 던지자, 고객이 거의 1분 동안 아...","se":"Five minutes into a session, after the coach asks a question, the client becomes deeply silent for almost a minute. What are the coach's most appropriate and least appropriate responses?","sk":"세션 시작 5분 후 코치가 질문을 던지자, 고객이 거의 1분 동안 아무 말 없이 깊은 침묵에 빠졌습니다. 이때 가장 적절한 코치의 반응과 가장 부적절한 반응은 무엇입니까?","o":["Restate the question in different words to help the client engage.","Stay quietly present, allowing the silence to continue until the client speaks.","Impatiently ask what the client is thinking as the silence continues.","Apologize for asking a confusing question and offer a different one."],"ok":["고객의 참여를 돕기 위해 방금 한 질문을 다른 표현으로 바꾸어 다시 질문한다.","조용히 프레즌스를 유지하며, 고객이 스스로 입을 열 때까지 침묵이 계속되도록 공간을 온전히 허용한다.","침묵이 길어지자 지금 무슨 생각을 하고 있는지 재촉하듯 묻는다.","질문이 어려웠다고 판단하고 다음 질문으로 자연스럽게 넘어간다."],"b":"B","w":"A","be":"침묵은 고객의 깊은 내적 성찰과 새로운 통찰이 잉태되는 공간이므로, 코치의 조급함을 내려놓고 침묵·멈춤·성찰의 공간을 허용하며 온전히 현존하는 것(역량 5.06, 5.07, PCC 마커 5.5)이 PCC/MCC 핵심 행동이기 때문입니다.","we":"Worst (A): 고객이 이미 질문을 받아들이고 깊이 사유하는 중임에도 코치가 침묵의 어색함을 견디지 못해 질문을 다른 말로 재진술함으로써 고객의 내적 사고 프로세스를 가로채고 방해하는(PCC 마커 5 위반 '침묵을 채우며 방해함') 최악의 실수입니다.\n중간 오답 C와 D 비교: C는 재촉함으로써 성찰 속도를 방해하는 개입이며, D는 기존 성찰의 문을 코치가 임의로 닫아버리는 아젠다 이탈(PCC 마커 5 위반)입니다.","c":["5.01","5.06","5.07"],"m":["5.5"],"k":[],"e":[]},{"id":9,"n":"Q09","cat":"bank","ty":"bw","t":"신규 고객이 첫 번째 세션에서 코치에게 '코치님이 이 분야 전문가시잖...","se":"In a first session, a new client says, “You are an expert in this field. Just tell me exactly what I should do about this conflict with my manager.” What are the coach's most appropriate and least appropriate responses?","sk":"신규 고객이 첫 번째 세션에서 코치에게 '코치님이 이 분야 전문가시잖아요. 상사와의 이 갈등 상황에서 제가 구체적으로 무엇을 해야 할지 정답을 알려주세요'라고 요청합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Share advice based on the coach's experience with similar conflicts, then check whether it resonates.","Acknowledge the client's request, name that coaching is a partnership in which the client is the expert on their own situation, and ask what the client most wants to explore.","Refuse, saying that advice is prohibited by coaching rules and therefore the topic cannot be addressed.","Provide a few frameworks for managing conflict and ask the client to pick one."],"ok":["유사한 갈등을 해결했던 코치의 풍부한 경험에 기반한 조언을 먼저 공유한 뒤 고객에게 공감되는지 확인한다.","고객의 요청과 마음을 따뜻하게 인정하고, 코칭은 고객 자신이 자기 삶의 전문가인 파트너십임을 명확히 밝힌 뒤, 이 갈등에서 고객이 가장 탐색하고 싶은 것이 무엇인지 묻는다.","코칭 규칙상 조언은 금지되어 있으므로 이 주제는 다룰 수 없다고 거절한다.","갈등 해결을 위한 표준 분석표를 제시하고 칸을 채워보자고 제안한다."],"b":"B","w":"A","be":"첫 세션에서 고객의 조언 욕구를 비판단적으로 인정하면서도(역량 4.05) 코칭의 본질과 프로세스를 명확히 정의하고(역량 1.06, 3.01, PCC 마커 1), 고객이 자신의 선택에 책임이 있는 주체임을 세워(역량 2.01) 탐색 주도권을 고객에게 돌려주기 때문입니다.","we":"Worst (A): 첫 세션부터 코치가 전문가 자리에 앉아 자신의 경험에 기반한 조언을 처방함으로써 코칭을 컨설팅/멘토링으로 변질시키고(역량 1.06, PCC 마커 1 위반) 수평적 파트너십의 토대를 무너뜨린 최악의 오답입니다.\n중간 오답 C와 D 비교: C는 코칭에 매우 적합한 갈등 주제를 딱딱하게 거절하는 과잉 해석(Overreach)이며, D는 고객의 고유한 사고 방식을 탐색하기 전에 외부 분석표를 들이미는 트레이너식 접근입니다.","c":["1.06","2.01","3.01","4.05"],"m":["3.1"],"k":[],"e":[]},{"id":10,"n":"Q10","cat":"bank","ty":"bw","t":"전체 코칭 과정의 절반쯤 지났을 때, 고객이 '지금까지 다뤄온 목표를...","se":"Halfway through a coaching engagement, a client says, “I want to change the goal we have been working on. The original goal no longer feels important to me.” What are the coach's most appropriate and least appropriate actions?","sk":"전체 코칭 과정의 절반쯤 지났을 때, 고객이 '지금까지 다뤄온 목표를 바꾸고 싶어요. 원래 세웠던 목표는 지금 저에게 더 이상 중요하게 느껴지지 않아요'라고 말합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Hold the client to the original contract since the engagement was purchased on those terms.","Partner with the client to revisit and update the overall coaching agreement, including outcomes and measures of success.","Skip the agreement process and immediately proceed with the new topic raised by the client.","Persuade the client to complete the original goal first and address the new topic in a remaining session."],"ok":["본래 해당 목표를 달성하기로 계약된 조건이므로 원래 목표를 끝까지 지키도록 강하게 독려한다.","기대 성과와 성공 척도를 포함하여 전체 코칭 합의를 고객과 함께 재검토하고 새롭게 갱신한다.","합의 절차를 생략하고 즉시 고객이 말한 새로운 주제로 세션을 진행한다.","기존 목표를 먼저 완수한 뒤에 남은 회기에서 새 주제를 다루자고 설득한다."],"b":"B","w":"A","be":"코칭 합의는 고정된 계약서가 아니라 살아있는 나침반이므로, 고객의 니즈가 변화했을 때 역량 3.12(필요 시 코칭 합의 재검토), 3.04(전체 목표 설정), 3.08(성공 척도 정의), 3.10(고객 지향 결과로 방향 조정)에 따라 전체 합의를 투명하게 갱신하기 때문입니다.","we":"Worst (A): 고객의 성장과 변화된 욕구를 무시한 채 초기 계약 문구에 고객을 묶어두어 자율성(역량 2.01)과 고객 중심성(역량 3.10)을 정면으로 억압하는 최악의 경직된 통제입니다.\n중간 오답 C와 D 비교: C는 고객 의사는 따랐으나 새로운 전체 목표와 성공 척도를 재확인·합의하는 과정(역량 3.08, 3.12)을 생략했고, D는 고객이 더 이상 원치 않는 기존 목표를 먼저 끝내라고 설득하는 코치 중심적 절충안입니다.","c":["3.04","3.08","3.10","3.12"],"m":["3.1","3.2"],"k":[],"e":[]},{"id":11,"n":"Q11","cat":"bank","ty":"bw","t":"고객이 오늘 세션의 목표로 막연하게 '더 큰 자신감을 갖고 싶어요'라...","se":"A client vaguely states that today's session goal is to “have more confidence.” Which coach behavior best helps the client define a meaningful session outcome, and which is least appropriate?","sk":"고객이 오늘 세션의 목표로 막연하게 '더 큰 자신감을 갖고 싶어요'라고 말합니다. 이때 고객이 의미 있는 세션 성과를 정의하도록 가장 잘 돕는 코치의 행동(Best)과 가장 부적절한 행동(Worst)은 무엇입니까?","o":["Explore what \"more confident\" would specifically look like for the client and how the client will know by the end of the session that progress has been made.","Suggest a confidence framework the coach has used with similar clients.","Begin coaching toward generic confidence-building exercises.","Ask the client to rate their current confidence on a 1 to 10 scale."],"ok":["고객에게 '더 자신감 있는 모습'이 구체적으로 어떤 모습인지, 그리고 오늘 세션이 끝날 때 진전이 이루어졌음을 어떻게 알 수 있을지(성공 척도) 함께 탐색한다.","유사한 고객들에게 효과가 있었던 코치의 검증된 자신감 향상 프레임워크를 제안한다.","자신감을 키우기 위한 일반적인 리더십 행동 훈련 연습을 시작한다.","현재 고객의 자신감 수준을 1점에서 10점 척도로 매겨보라고 묻는다."],"b":"A","w":"B","be":"모호한 추상어('자신감')를 고객 자신의 언어로 구체화하고(역량 6.02, PCC 마커 6.2) 오늘 세션 종료 시점의 명확한 성공 척도를 함께 정의함으로써(역량 3.06, 3.08, PCC 마커 3.1, 3.2) 세션 합의의 핵심 마커를 완벽히 충족하기 때문입니다.","we":"Worst (B): 고객 고유의 정의와 세션 성과 합의 없이 코치가 외부의 '검증된 프레임워크'를 먼저 제안함으로써 코칭을 컨설팅/교육(역량 1.06, PCC 마커 1 위반)으로 변질시키고 고객의 자기 정의권을 박탈한 최악의 선택입니다.\n중간 오답 C와 D 비교: C는 프레임워크 대신 일반 훈련을 진행하는 트레이닝 이탈이며, D는 현재 상태를 점검하는 척도 질문은 코칭적이나 '자신감'의 구체적 정의와 오늘 세션의 성공 척도 합의(PCC 마커 3.2)가 빠진 불완전한 개입입니다.","c":["3.06","3.08","6.02"],"m":["3.1","3.2","6.2"],"k":[],"e":[]},{"id":12,"n":"Q12","cat":"bank","ty":"bw","t":"'3분기 성과 리뷰 준비'에 초점을 맞추기로 합의한 세션 시작 20분...","se":"Twenty minutes into a session agreed to focus on preparing for a third-quarter performance review, the client has spent twenty minutes describing a conflict with a colleague that does not appear connected to the review. What are the coach's most appropriate and least appropriate actions?","sk":"'3분기 성과 리뷰 준비'에 초점을 맞추기로 합의한 세션 시작 20분 후, 고객이 리뷰와 연결되어 보이지 않는 동료와의 갈등을 20분째 상세히 이야기하고 있습니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Redirect the client back to the agreed session topic.","Allow the conversation to continue indefinitely since the client is engaged.","Notice the shift, name what you observe, and check with the client whether to stay with the original goal or revise it.","Take notes and bring up the conflict at the next session instead."],"ok":["사전에 합의된 세션 주제로 고객을 즉시 강제로 되돌린다.","고객이 몰입해 있으므로 아무런 개입 없이 원하는 만큼 계속 이야기하게 둔다.","주제가 전환되었음을 관찰한 대로 투명하게 명시하고, 원래 목표를 유지할지 아니면 오늘 초점을 수정할지 고객에게 확인한다.","동료 갈등 내용은 메모해 두었다가 다음 세션에서 다루자고 미룬다."],"b":"C","w":"A","be":"PCC 마커 3 위반('세션 중 대화가 합의된 주제에서 벗어났을 때 이를 알아차리지 못하거나 남은 시간 방향을 탐색하지 않음')과 PCC 마커 5.3('고객이 세션에서 일어나는 일을 선택하도록 지원')에 따라, 관찰된 전환을 투명하게 비추고 실시간 재합의 선택권을 고객에게 돌려주기 때문입니다.","we":"Worst (A): 고객에게 지금 더 시급하고 중요한 이슈가 무엇인지 묻지도 않고 코치가 일방적으로 원래 주제로 끌어당겨 고객의 세션 선택권과 자율성을 침해한(PCC 마커 3 & 5 위반) 최악의 독단적 통제입니다.\n중간 오답 B와 D 비교: B는 몰입은 존중했으나 초점 유지와 실시간 재합의(역량 3.09, 3.12)를 방기한 수동적 태도이고, D는 지금 여기의 생생한 이슈를 다음 세션으로 미루는(Postponing) 비반응적 대처입니다.","c":["3.06","3.09","3.10","3.12","5.03"],"m":["5.3"],"k":[],"e":[]},{"id":13,"n":"Q13","cat":"bank","ty":"bw","t":"고객이 그날 일찍 겪은 힘든 대화 때문에 눈물을 글썽이며 세션에 들어...","se":"A client arrives with tears in their eyes after a difficult conversation earlier that day. What are the coach's most appropriate and least appropriate responses?","sk":"고객이 그날 일찍 겪은 힘든 대화 때문에 눈물을 글썽이며 세션에 들어왔습니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Acknowledge the client's distress, hold space for their emotions, and ask what they want from today's session given how they are arriving now.","Move quickly to the prepared agenda to give the client a sense of normalcy.","Suggest the client reschedule the session for when they feel more composed.","Make a light joke to lift the mood and help the client feel better."],"ok":["고객이 경험하는 고통을 인정하고, 감정을 위한 공간을 지켜주며(hold space), 지금 도착한 이 상태를 고려할 때 오늘 세션에서 무엇을 원하는지 묻는다.","고객에게 일상적 안정감을 주기 위해 미리 준비된 아젠다로 빠르게 이동한다.","마음이 진정된 다음에 코칭을 받도록 세션 일정 재조정을 제안한다.","분위기를 환기하기 위해 가벼운 농담을 건네며 기분을 전환시킨다."],"b":"A","w":"B","be":"고객의 강한 감정 상태 앞에서도 당황하지 않고 자신감 있게 함께 머무르며(역량 5.05), 감정을 인정·지원하고(역량 4.04, 4.05) 현재 상태를 반영한 오늘 세션의 목표를 고객과 함께 재설정하기 때문입니다(역량 3.06, PCC 마커 5.1, 5.3).","we":"Worst (B): 안정감을 준다는 핑계로 고객의 눈물과 정서적 고통을 100% 묵살(Dismiss)하고 준비된 아젠다로 도망침으로써 PCC 마커 5 & 6 위반('고객의 감정을 묵살하고 'What'에만 집중함')을 범한 최악의 비인간적 태도입니다.\n중간 오답 C와 D 비교: C는 강한 감정을 다루기 불편해 세션을 미루려는 회피이며, D는 가벼운 농담으로 고객의 진지한 슬픔을 축소(Minimizing)하고 덮어버리는 부적절한 반응입니다.","c":["3.06","4.04","4.05","5.01","5.05"],"m":["4.2","4.3","5.1","5.3"],"k":[],"e":[]},{"id":14,"n":"Q14","cat":"bank","ty":"bw","t":"집단주의 문화권 출신인 고객이 자신의 가족은 모든 중요한 결정을 집단...","se":"A client from a collectivist cultural background explains that their family makes all important decisions collectively, but the coach has repeatedly asked individualistic questions such as, “What do you personally want?” What are the coach's most appropriate and least appropriate actions?","sk":"집단주의 문화권 출신인 고객이 자신의 가족은 모든 중요한 결정을 집단적으로 내린다고 말하는데, 코치는 계속해서 '당신 개인은 무엇을 원하나요?'라는 개인주의적 질문만 던져왔습니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Continue with the same questions because the client is the focus of coaching.","Acknowledge the client's cultural context and partner with the client on how to explore the question—for example, what they want as a member of their family or community—adapting language as appropriate.","Switch to asking what the client's family wants, since that is what matters in the client's culture.","Educate the client on the importance of individual autonomy in coaching."],"ok":["코칭의 초점은 고객 개인이므로 기존의 개인 중심 질문을 그대로 고수한다.","고객의 문화적 맥락을 인정하고, 가족이나 공동체의 일원으로서 무엇을 원하는지 등 질문을 어떻게 탐색할지 고객과 파트너십을 맺어 코칭 언어를 유연하게 조정한다.","고객의 문화에서는 가족이 중요하므로 고객 자신의 의견 대신 가족들이 무엇을 원하는지만 질문한다.","코칭에서 개인의 자율성과 독립적 의사결정이 왜 중요한지 고객을 교육하고 설득한다."],"b":"B","w":"D","be":"역량 1.02(고객의 정체성·문화·가치 민감성), 2.04(문화·맥락 영향 인지), 4.01(맥락 안의 고객 이해), 4.02(고객의 정체성과 언어에 맞추어 코칭 조정) 및 윤리강령 핵심가치 Equity(형평성)에 따라 고객의 문화적 프레임을 존중하여 코칭 언어를 맞춤형으로 조정하기 때문입니다.","we":"Worst (D): 고객의 고유한 문화적 가치관을 존중하기는커녕 서구 개인주의적 관점을 우월한 기준으로 삼아 고객을 '교육하고 설득'하려 드는 오만하고 문화 침해적인 최악의 태도입니다.\n중간 오답 A와 C 비교: A는 문화적 맥락 단서를 듣고도 기존 방식을 고집하는 경직성(PCC 마커 5 위반)이고, C는 문화를 존중하려 했으나 고객 자신의 주체성까지 지워버리고 가족의 뜻만 묻는 과잉 편향입니다.","c":["1.02","2.04","4.01","4.02"],"m":["4.1","6.1"],"k":[],"e":[]},{"id":15,"n":"Q15","cat":"bank","ty":"bw","t":"이전 세션들에서 고객의 아버지와의 관계가 현재 목표와 관련이 있을 수...","se":"In previous sessions, the client hinted that their relationship with their father might relate to the current goal. Today, however, the client clearly says, “I don't want to talk about my relationship with my father.” What are the coach's most appropriate and least appropriate actions?","sk":"이전 세션들에서 고객의 아버지와의 관계가 현재 목표와 관련이 있을 수 있다는 암시가 있었으나, 오늘 세션 중 고객이 '아버지와의 관계에 대해서는 이야기하고 싶지 않아요'라고 명확히 거부 의사를 밝혔습니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Honor the client's request, acknowledge the boundary, and continue working on what the client does want to explore.","Insist and persuade the client to confront the issue gently because it is the key to achieving the current goal.","Ask several different questions designed to surface the topic indirectly.","End the session early because the client is not open to coaching today."],"ok":["고객의 요청을 존중하고 그 심리적 경계를 인정한 뒤, 고객이 실제로 탐색하기를 원하는 주제로 작업을 계속한다.","현재 목표 달성의 핵심 열쇠이므로 부드럽게 직면하도록 설득하고 고집한다.","아버지 주제가 간접적으로 드러나도록 고안된 교묘한 우회 질문들을 여러 개 던져 끌어낸다.","핵심 주제를 회피하며 코칭에 열려 있지 않으므로 세션을 조기 종료한다."],"b":"A","w":"C","be":"고객이 설정한 심리적 안전 경계(Boundary)를 즉각 존중하고 수용함으로써(역량 4.02, 4.05, 5.03, PCC 마커 5.3) 깊은 신뢰와 안전감을 지키며 고객이 스스로 선택한 주제를 지원하기 때문입니다.","we":"Worst (C): 고객이 명시적으로 거부한 주제를 우회적이고 조작적인 질문들로 뒤에서 캐내려 하는 기만적 개입으로, 신뢰와 안전감(역량 4), 진실성(역량 1.01), 윤리강령 Standard 3.4(경계 존중)를 근본적으로 파괴하는 최악의 해악입니다.\n중간 오답 B와 D 비교: B는 아무리 부드러워도 고객의 거부를 무릅쓰고 코치의 의제를 강요하는 경계 침범이며, D는 특정 주제 거부를 코칭 전체 거부로 확대 해석하여 세션을 일방 종료하는 극단적 회피입니다.","c":["1.01","2.01","4.02","4.05","5.03"],"m":["5.3"],"k":[],"e":["3.4"]},{"id":16,"n":"Q16","cat":"bank","ty":"bw","t":"세션 진행 중 고객이 지나가는 말로 '코치님이 제 비판적이던 어머니를...","se":"During a session, a client casually remarks, “You remind me of my critical mother,” and appears uncomfortable. What are the coach's most appropriate and least appropriate responses?","sk":"세션 진행 중 고객이 지나가는 말로 '코치님이 제 비판적이던 어머니를 떠올리게 하네요'라고 말하며 불편한 기색을 내비칩니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Reassure the client that the coach is nothing like their mother.","Acknowledge what the client shared, ask how that shows up in their experience of the coaching, and partner on what would support the client's experience of safety in the work.","Move quickly past the comment to avoid making the moment awkward.","Suggest that the client work with a different coach who reminds them less of their mother."],"ok":["코치는 어머니와 전혀 다른 사람이니 걱정하지 말라며 고객을 안심시킨다.","고객이 용기 내어 나눈 인식을 인정하고, 그것이 지금 코칭 경험에 어떻게 나타나고 있는지 물으며, 이 작업에서 고객의 안전감을 뒷받침하기 위해 무엇이 도움이 될지 파트너십을 맺는다.","순간이 어색해지는 것을 피하기 위해 그 코멘트를 못 들은 척 빠르게 지나간다.","불편함을 겪지 않도록 어머니를 덜 떠올리게 하는 다른 코치에게 이관하겠다고 제안한다."],"b":"B","w":"C","be":"관계 안에서 발생한 민감한 정서적 반응과 전이(Transference) 불편함을 방어하거나 회피하지 않고 투명하고 개방적으로 테이블 위에 올려(역량 4.05, 4.06, 5.03, PCC 마커 4.3, 4.4) 상호 신뢰와 심리적 안전감을 공동 구축하기 때문입니다.","we":"Worst (C): 고객이 불편함을 무릅쓰고 용기 내어 꺼낸 관계적 신호를 묵살(Dismiss)하고 투명인간 취급하며 지나침으로써 PCC 마커 4 & 6 위반('고객의 감정과 표현을 묵살함')을 범한 최악의 회피입니다.\n중간 오답 A와 D 비교: A는 안심시키려는 선의이지만 방어적으로 해명하며 고객의 주관적 느낌을 부정하는 꼴이 되고, D는 관계를 탐색하고 조율할 기회를 건너뛴 채 성급히 관계를 종결·이관하려는 과잉 반응입니다.","c":["4.04","4.05","4.06","5.03"],"m":["4.3","4.4"],"k":[],"e":[]},{"id":17,"n":"Q17","cat":"bank","ty":"bw","t":"고객이 '저는 원래 완벽주의자예요. 늘 그래왔어요'라고 자신을 고정된...","se":"A client defines themselves with a fixed identity label: “I'm just a perfectionist. I've always been this way.” Which action is most likely to evoke awareness, and which is least appropriate?","sk":"고객이 '저는 원래 완벽주의자예요. 늘 그래왔어요'라고 자신을 고정된 정체성 레이블로 규정합니다. 이때 알아차림을 가장 잘 불러일으키는 행동(Best)과 가장 부적절한 행동(Worst)은 무엇입니까?","o":["Suggest the client read a book on perfectionism and discuss it next week.","Reflect the client's identity statement back—\"always been this way\"—and invite the client to explore what that label means for them and where it serves or limits them now.","Reframe perfectionism as a strength to encourage the client.","Ask the client to commit to one imperfect action this week."],"ok":["완벽주의 극복에 관한 책을 추천하고 다음 주에 독후감을 논의하자고 제안한다.","고객의 정체성 진술('늘 그래왔어요')을 거울처럼 반영해 주고, 그 꼬리표(레이블)가 고객에게 무엇을 의미하며 지금 삶의 어디서 도움이 되고 어디서 한계로 작용하는지 탐색하도록 초대한다.","고객을 격려하기 위해 완벽주의는 사실 높은 기준을 가진 훌륭한 강점이라고 일방적으로 긍정 리프레이밍해 준다.","이번 주에 일부러 불완전한 행동을 한 가지 실천하는 과제를 부여한다."],"b":"B","w":"C","be":"고객이 스스로에게 붙인 고정된 정체성('완벽주의자')을 비추어 주고(역량 6.02), 그 신념의 고유한 의미와 양면성(유익과 한계)을 스스로 성찰하도록 초대하여(역량 7.03, 7.04, PCC 마커 7.1, 7.2) 자기 인식을 확장하기 때문입니다.","we":"Worst (C): 격려하려는 따뜻한 의도처럼 보이지만, 고객 자신의 탐색과 동의 없이 코치가 일방적으로 '완벽주의는 강점이다'라고 해석·덮어씌움으로써(PCC 마커 4 & 6 위반 '코치의 해석을 강요함') 고객이 직면하려던 한계와 고통을 묵살한 최악의 독성 긍정주의입니다.\n중간 오답 A와 D 비교: A는 내면 신념 탐색 없이 외부 독서를 처방하는 교육/조언 방식이며, D는 깊은 알아차림(역량 7)이 일어나기 전에 코치가 일방적으로 행동 과제를 부여(PCC 마커 8 위반)한 성급한 개입입니다.","c":["6.02","7.03","7.04","7.10"],"m":["6.2","7.1","7.2"],"k":[],"e":[]},{"id":18,"n":"Q18","cat":"bank","ty":"bw","t":"세션 중반, 고객이 헛웃음을 지으며 '저는 늘 이래요. 중요한 도약의...","se":"Midway through a session, the client gives a nervous laugh and says, “I always do this. Just before an important opportunity to take a big leap, I sabotage myself.” What are the coach's most appropriate and least appropriate responses?","sk":"세션 중반, 고객이 헛웃음을 지으며 '저는 늘 이래요. 중요한 도약의 기회가 오기 직전에 꼭 스스로를 망쳐버려요(self-sabotage)'라고 말합니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Reflect the pattern back and ask what the client notices about it now.","Tell the client about a similar self-sabotage pattern from another client.","Provide a model for understanding self-sabotage and ask which element resonates.","Move to action: ask the client what they will do differently next time."],"ok":["그 패턴을 그대로 비춰주고 지금 그것에 대해 고객 스스로 무엇을 알아차리는지 질문한다.","다른 고객이 겪었던 유사한 자기방해 패턴과 극복 사례를 들려주며 용기를 준다.","자기방해의 심리적 메커니즘 모델을 설명하고 어떤 요소가 와닿는지 묻는다.","즉시 실행으로 넘어가 다음번에는 무엇을 다르게 행동할지 묻는다."],"b":"A","w":"B","be":"고객이 스스로 포착한 행동 패턴(역량 6.06)과 어색한 웃음(역량 6.04)을 비추어 주고, 지금 이 순간 그 패턴의 이면과 영향을 더 깊이 자각하도록 초대하기 때문입니다(역량 7.05, 7.08, PCC 마커 7.1, 7.2).","we":"Worst (B): 어떠한 경우에도 다른 고객의 사연이나 사례를 세션에 끌어들이는 것은 비밀보장 원칙(역량 1.05, 윤리강령 Standard 2.1)을 훼손할 위험이 있고 대화의 주인공을 타인으로 빼앗아 가는 최악의 금기 행동입니다.\n중간 오답 C와 D 비교: C는 심리 모델 강의(Training/Consulting)로 흘러 고객의 고유 언어 탐색을 제한하며, D는 패턴의 뿌리(Who)와 영향을 탐색하기도 전에 성급하게 행동 수정(What)으로 건너뛴 차선책입니다.","c":["1.05","6.04","6.06","7.05","7.08"],"m":["7.1","7.2"],"k":[],"e":[]},{"id":19,"n":"Q19","cat":"bank","ty":"bw","t":"고객이 '앞이 꽉 막힌(stuck) 느낌이에요. 저에게는 지금 명확한...","se":"A client says, “I feel stuck. All I need is a clear action plan,” while the coach senses that another emotion may lie beneath the statement. What are the coach's most appropriate and least appropriate actions?","sk":"고객이 '앞이 꽉 막힌(stuck) 느낌이에요. 저에게는 지금 명확한 계획표만 있으면 돼요'라고 말하지만, 코치는 그 말 이면에 다른 감정이 있음을 감지합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Begin co-creating a plan since that is what the client said they need.","Reflect the client's words and gently ask what feeling stuck is like for them before moving into planning.","Tell the client they don't need a plan—they need to look at their feelings.","Suggest the client try journaling to surface the underlying issue before planning."],"ok":["고객이 필요하다고 말한 것이 계획이므로 즉시 구체적인 계획표를 함께 세운다.","고객이 한 말을 반영해 주고, 계획 수립으로 넘어가기 전에 고객에게 '막혀 있다(stuck)'는 느낌이 어떤 것인지 부드럽게 질문한다.","계획이 필요한 게 아니라 감정을 들여다봐야 한다고 단호히 가르쳐 준다.","다음 세션 전에 근본 문제를 드러내기 위해 저널링을 해보라고 제안한다."],"b":"B","w":"C","be":"역량 6.03('고객이 소통하는 것 이면에 무언가 더 있다고 생각될 때 이것을 인식하고 질문한다')과 6.02('막혀 있음' 단어 탐색)를 실천하여, 표면의 행동 계획(Doing) 요구 이면에 숨은 내면 상태(Being)를 먼저 탐색하도록 초대하기 때문입니다.","we":"Worst (C): 코치가 권위적 전문가처럼 '당신은 계획이 필요한 게 아니라 감정을 봐야 한다'고 고객의 말을 정면 부정하고 가르치려 듦으로써(PCC 마커 1 & 4 위반 '코치의 관점을 강요하고 존중을 해침') 저항과 방어만 불러일으키는 최악의 반응입니다.\n중간 오답 A와 D 비교: A는 표면적 요구만 따르고 이면의 정서적 단서를 놓친 피상적 개입이며, D는 지금 여기에서 탐색할 기회를 다음 세션 외부 과제로 미루는(Postponing) 소극적 대응입니다.","c":["6.02","6.03","7.05"],"m":["6.2","6.3"],"k":[],"e":[]},{"id":20,"n":"Q20","cat":"bank","ty":"bw","t":"고객이 자신의 의사결정을 설명하면서 '~해야 한다(should)'라는...","se":"A client repeatedly uses the word “should” when explaining a decision. What are the coach's most appropriate and least appropriate actions?","sk":"고객이 자신의 의사결정을 설명하면서 '~해야 한다(should)'라는 당위적 단어를 반복해서 사용합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Ignore the language and focus on the decision content.","Notice the repeated use of the word and invite the client to explore what 'should' represents to them and whose voice it carries.","Tell the client to stop \"shoulding\" on themselves.","Suggest the client replace \"should\" with \"choose to\" going forward."],"ok":["언어 습관은 무시하고 의사결정의 논리적 내용에만 집중한다.","단어의 반복을 알아차리고 '~해야 한다(should)'가 고객에게 무엇을 상징하며 누구의 목소리를 담고 있는지 탐색하도록 초대한다.","스스로에게 그만 좀 '~해야 한다'며 압박하지 말라고 단호히 지적한다.","앞으로 '~해야 한다' 대신 '~하기로 선택한다'로 바꾸어 말하라고 조언한다."],"b":"B","w":"C","be":"고객이 반복 사용하는 핵심 단어('should')와 언어 패턴을 포착하여(역량 6.02, 6.06, PCC 마커 6.2), 그 당위적 언어 이면의 내면화된 신념과 외부 기대('누구의 목소리인가', 역량 7.03, 7.08)를 스스로 통찰하게 돕기 때문입니다.","we":"Worst (C): 고객의 언어 표현을 상급자처럼 비난·지적하며 '그만두라'고 훈계하여 존중하는 언어(역량 1.03)와 심리적 안전감(역량 4)을 파괴하고 수치심을 유발하는 최악의 대응입니다.\n중간 오답 A와 D 비교: A는 중요한 언어적 패턴 단서를 놓치는 소극적 경청이고, D는 신념의 뿌리를 탐색하기 전에 표면적 언어 교정 기법을 처방하는 트레이너식 조언입니다.","c":["1.03","6.02","6.06","7.03","7.08"],"m":["6.2","7.1"],"k":[],"e":[]},{"id":21,"n":"Q21","cat":"bank","ty":"bw","t":"세션 종료가 가까워질 무렵 고객이 '여전히 무엇을 해야 할지 잘 모르...","se":"As the session is nearing its end, the client remains undecided and says, “I still don't know what to do.” What are the coach's most appropriate and least appropriate responses?","sk":"세션 종료가 가까워질 무렵 고객이 '여전히 무엇을 해야 할지 잘 모르겠어요'라며 미결정 상태를 보입니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Offer a recommendation based on the conversation to give the client direction.","Acknowledge the not-knowing, invite the client to reflect on what has shifted in this session, and partner on what, if any, action or further exploration the client wants to take from here.","Schedule another session immediately to continue working on the decision.","Reassure the client they will figure it out and end the session."],"ok":["고객에게 명확한 방향성을 주기 위해 오늘 대화를 바탕으로 코치의 해결책을 추천한다.","알지 못함의 상태를 있는 그대로 인정하고, 이번 세션에서 내면적으로 무엇이 변화했는지 성찰하도록 초대한 뒤, 여기서 어떤 실행이나 추가 탐색을 원할지(원한다면) 파트너십으로 정리한다.","결론이 날 때까지 다루기 위해 다음 세션을 강제로 즉시 예약한다.","시간이 지나면 곧 알아낼 것이라며 피상적으로 안심시키고 세션을 마친다."],"b":"B","w":"A","be":"세션 끝에 반드시 행동 계획이 나와야 한다는 코치의 결과 집착을 버리고 '알지 못함의 영역(역량 5.06)'을 편안히 수용하며, 세션 내 학습·변화 요약(역량 8.06)과 자율적 실행/탐색 설계(역량 8.03) 및 협력적 세션 종료(역량 8.09, PCC 마커 8.9)를 완수하기 때문입니다.","we":"Worst (A): 세션 종료 직전 코치의 조급함 때문에 고객 대신 해결책을 추천·지정함으로써 고객의 선택 책임(역량 2.01)과 자율성(역량 8.03, PCC 마커 8 위반)을 빼앗는 최악의 컨설팅 이탈입니다.\n중간 오답 C와 D 비교: C는 고객 동의 없이 추가 세션을 강제하려는 통제적 태도이며, D는 세션 내 알아차림 요약과 협력적 종료 절차(PCC 마커 8.1, 8.9)를 생략한 성의 없는 마무리입니다.","c":["5.06","8.01","8.03","8.06","8.09"],"m":["8.1","8.3","8.9"],"k":[],"e":[]},{"id":22,"n":"Q22","cat":"bank","ty":"bw","t":"지난 세션에서 실행하겠다고 약속했던 과제를 다음 세션에 온 고객이 이...","se":"At the next session, a client reports that they did not complete an action they had committed to in the previous session. What are the coach's most appropriate and least appropriate responses?","sk":"지난 세션에서 실행하겠다고 약속했던 과제를 다음 세션에 온 고객이 이행하지 못했다고 보고합니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Express disappointment and renew the commitment.","Without judgment, invite the client to explore what got in the way, what they learned, and what they want from here.","Replace the action with a smaller one the client is more likely to do.","Avoid mentioning that the client did not follow through and simply move on so they do not feel embarrassed."],"ok":["실망감을 표현하고 이번에는 반드시 지키도록 약속 갱신을 강하게 요구한다.","판단 없이 무엇이 실행을 가로막았는지, 그 과정에서 무엇을 배웠는지, 그리고 지금 여기서 무엇을 원하는지 탐색하도록 초대한다.","고객이 실천하기 쉽도록 코치가 직접 더 작은 과제로 축소·변경해 준다.","고객이 민망해하지 않도록 미이행 사실에 대한 언급을 피하고 넘어간다."],"b":"B","w":"A","be":"미이행을 실패가 아닌 소중한 학습 데이터로 대하며 비판단적 태도로 잠재적 장애물(역량 8.05)과 실행 단계로부터의 배움(역량 8.04)을 탐색하게 돕고, 향후 방향에 대한 자율성(역량 8.03)을 지지하기 때문입니다.","we":"Worst (A): 코치가 심판관이나 상급자처럼 '실망감'을 표출하고 약속 갱신을 다그침으로써 수평적 파트너십과 심리적 안전감(역량 4)을 파괴하고 수치심을 유발하는 최악의 해악입니다.\n중간 오답 C와 D 비교: C는 고객 스스로 조율하게 돕지 않고 코치가 대신 과제를 축소해 주는 처방적 개입(PCC 마커 8 위반)이며, D는 배려라는 핑계로 중요한 학습 통합 기회를 회피(Dismiss)하는 소극적 직무유기입니다.","c":["2.01","4.04","8.03","8.04","8.05"],"m":["8.3","8.6"],"k":[],"e":[]},{"id":23,"n":"Q23","cat":"bank","ty":"bw","t":"달리기 초보자인 고객이 3개월 안에 마라톤 풀코스를 완주하는 목표를...","se":"A beginner runner says they want to set a goal of completing a full marathon within three months. The coach, who knows about marathon training, believes this timeline is unrealistic. What are the coach's most appropriate and least appropriate responses?","sk":"달리기 초보자인 고객이 3개월 안에 마라톤 풀코스를 완주하는 목표를 세우고 싶다고 말합니다. 마라톤 지식이 있는 코치가 보기에 이 일정은 매우 비현실적입니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Tell the client three months is too short and suggest six months instead.","Coach the client toward whatever goal they choose regardless of feasibility.","Invite the client to explore what they know about preparing for this goal, what would need to be true to succeed, and how they will know if the plan is working—supporting the client to design a goal they own.","Provide a recommended training plan and adjust the timeline."],"ok":["부상 위험을 지적하며 3개월은 너무 짧으니 6개월로 일정을 늘리라고 요구한다.","실현 가능성 점검 없이 무조건 고객의 목표를 향해 코칭한다.","이 목표를 준비하는 것에 대해 고객이 이미 알고 있는 바, 성공하기 위해 충족되어야 할 조건, 그리고 계획이 잘 작동하는지 스스로 확인할 방법을 탐색하도록 초대하여 고객이 주인의식을 가진 목표를 설계하도록 지원한다.","코치가 전문가로서 추천 훈련 계획표를 제공하고 일정을 6개월로 직접 조정해 준다."],"b":"C","w":"D","be":"코치의 도메인 지식으로 일정을 교정하거나 지시하지 않으면서도, 질문을 통해 고객 스스로 현실 조건·성공 척도·책무 방법을 점검하여 주인의식을 가진 목표를 설계하도록 지원하기 때문입니다(역량 2.01, 7.03, 8.02, 8.03, PCC 마커 8.5, 8.7).","we":"Worst (D): 코치가 스포츠 트레이너·컨설턴트처럼 추천 훈련 계획표를 짜주고 일정까지 직접 수정함으로써 역량 1.06(역할 구분) 및 PCC 마커 8 위반('코치가 처방한 행동을 지시함')을 범한 최악의 역할 이탈입니다.\n중간 오답 A와 B 비교: A는 프로그램까진 아니나 코치의 판단으로 일정을 수정하라고 요구하는 지시적 개입이고, B는 현실 점검 질문 없이 맹목적으로 따라가는 파트너십 부족입니다.","c":["1.06","2.01","7.03","8.02","8.03"],"m":["8.5","8.7"],"k":[],"e":["PRO"]},{"id":24,"n":"Q24","cat":"bank","ty":"bw","t":"고객이 지난 세션 이후 일어난 모든 일에 대해 매우 빠르게 이야기하고...","se":"A client is speaking very rapidly about everything that has happened since the previous session, while the coach frantically takes notes to capture every detail. What are the coach's most appropriate and least appropriate actions?","sk":"고객이 지난 세션 이후 일어난 모든 일에 대해 매우 빠르게 이야기하고 있고, 코치는 모든 세부 사항을 놓치지 않으려 정신없이 필기하며 따라가고 있습니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Continue taking notes to capture every detail for the file.","Set the notes aside, slow down, and listen with full attention to what is most important to the client right now.","Ask the client to speak more slowly so there is time to take notes.","Turn on a recording device and continue taking notes so as not to lose the flow of the conversation."],"ok":["고객 파일 기록 보관을 위해 모든 세부 사항을 빠짐없이 받아 적도록 계속 필기한다.","필기를 즉시 내려놓고 속도를 늦춘 뒤, 지금 고객에게 가장 중요한 것에 온전한 주의를 기울여 경청한다.","필기할 시간을 벌기 위해 더 천천히 말해달라고 요청한다.","대화 흐름을 놓치지 않기 위해 녹음기를 작동시키고 필기를 계속한다."],"b":"B","w":"A","be":"물리적 기록(Doing)에 뺏긴 주의를 즉시 거두고 속도를 늦추어 눈앞의 고객(Being)에게 온전히 깨어서 현존하고(역량 5.01, 5 정의), 말 너머의 핵심과 비언어적 신호를 경청하기 때문입니다(역량 6 정의, 6.01).","we":"Worst (A): 파일 기록 유지라는 행정적 과업 때문에 눈맞춤, 비언어적 단서 포착, 그리고 현재 순간의 프레즌스(역량 5.01)를 완전히 포기하고 속기사처럼 받아 적는 최악의 비현존 상태입니다.\n중간 오답 C와 D 비교: C는 코치 자신의 필기 편의를 위해 고객의 자연스러운 에너지와 말 속도를 통제하려 한 코치 중심적 요청이며, D는 여전히 녹음과 필기라는 기록 행위에 집착하는 부차적 대응입니다.","c":["5.01","6.01"],"m":["5.1","6.6"],"k":[],"e":[]},{"id":25,"n":"Q25","cat":"bank","ty":"mc4","t":"고객이 긴 이야기를 설명한 후 코치가 '매니저에게 존재감을 인정받지...","se":"After a client has shared a lengthy story, the coach says, “It sounds as though you felt unseen by your manager, and that led to a great deal of frustration. Is that what you mean?” What is this best described as?","sk":"고객이 긴 이야기를 설명한 후 코치가 '매니저에게 존재감을 인정받지 못한다고 느끼셨고, 그로 인해 큰 좌절감이 유발된 것처럼 들리는데, 그런 의미인가요?'라고 말합니다. 이는 무엇으로 가장 잘 설명되는가?","o":["A reflection offered as a check-in to support the client's awareness.","A leading question that puts words in the client's mouth.","An interpretation that risks projecting the coach's own viewpoint.","Advice about how the client should feel."],"ok":["확인(check)의 형태로 제시되어 고객의 알아차림을 돕는 반영(reflection back).","고객의 입에 말을 넣어주는 유도 질문.","코치의 견해를 투사할 위험이 있는 해석.","고객이 어떻게 느껴야 하는지에 대한 조언."],"b":"A","w":null,"be":"'It sounds like ~ is that what you mean?(~처럼 들리는데, 그런 의미인가요?)'은 코치가 들은 핵심 감정과 의미를 간결하게 반영(역량 6.02, PCC 마커 6.7)한 뒤, 자신의 이해가 맞는지 집착 없이 고객에게 확인을 구하는(PCC 마커 4.4) 모범적 기술이기 때문입니다.","we":"Worst (D): 지시나 처방이 전혀 없는 질문형 반영 문장을 '조언(Advice)'이라고 부르는 것은 용어 정의상 가장 동떨어진 최악의 오답입니다.\n중간 오답 C와 B 비교: C(투사 위험이 있는 해석)와 B(유도 질문)는 만약 코치가 '당신은 매니저에게 무시당해서 좌절한 것이 틀림없습니다'라고 단정 지었을 때 해당하는 개념으로, 겸손한 확인('is that what you mean?')이 붙은 반영(A)과는 결정적인 차이가 있습니다.","c":["4.05","6.02"],"m":["4.4","6.7"],"k":[],"e":[]},{"id":26,"n":"Q26","cat":"bank","ty":"mc4","t":"역량 7(알아차림을 불러일으키다 / Evokes Awareness)...","se":"Which of the following is the most powerful question aligned with Competency 7, Evokes Awareness?","sk":"역량 7(알아차림을 불러일으키다 / Evokes Awareness) 기준에 가장 부합하는 강력한 질문(Powerful Question)은 어느 것입니까?","o":["\"How about trying what I advise?\"","\"Is it possible that you are overreacting here?\"","\"Why did you behave that way at the time?\"","\"A month from now, what would you most want to be true about this situation?\""],"ok":["'제 조언대로 한 번 해보시는 건 어때요?'","'여기서 본인이 너무 과민 반응하고 있을 가능성은 없을까요?'","'왜 그때 그렇게 행동하셨나요?'","'지금부터 한 달 뒤, 이 상황에 대해 가장 진실되기를 바라는 모습은 무엇인가요?'"],"b":"D","w":null,"be":"판단이나 특정 답에 대한 유도 없이 현재의 생각을 넘어 미래 시점의 원하는 결과와 본질적 가치를 스스로 그려보게 만드는 명확하고 간결한 단일 개방형 질문(역량 7.03, 7.04, PCC 마커 7.4, 7.6, 7.7)이기 때문입니다.","we":"Worst (B): '과민 반응하고 있을 가능성은 없을까요?'라는 표현으로 고객의 정서적 경험을 비하하고 판단하며 '예/아니오' 동의를 압박하는 비판적 유도 질문(PCC 마커 4 & 7 위반)입니다.\n중간 오답 C와 A 비교: A는 코치의 조언을 주입하는 닫힌 유도 질문이고, C('왜 그렇게 행동하셨나요?')는 과거의 변명이나 자기방어를 유발하기 쉬운 'Why' 질문으로 미래 지향적 확장을 가로막습니다.","c":["7.03","7.04"],"m":["7.4","7.6","7.7"],"k":[],"e":[]},{"id":27,"n":"Q27","cat":"bank","ty":"mc4","t":"코칭(Coaching)과 멘토링(Mentoring)을 가장 정확하게...","se":"Which definition most accurately distinguishes coaching from mentoring?","sk":"코칭(Coaching)과 멘토링(Mentoring)을 가장 정확하게 구별한 개념 정의는 무엇입니까?","o":["Coaching is a short-term process, whereas mentoring is a long-term process.","In coaching, the client is partnered with to find their own answers; in mentoring, a more experienced person shares the mentor's experience and advice.","Coaching is paid, whereas mentoring is free.","Coaching addresses personal life, whereas mentoring addresses work-related matters."],"ok":["코칭은 단기적 과정인 반면, 멘토링은 장기적 과정이다.","코칭은 고객이 스스로의 답을 찾도록 파트너십을 맺는 반면, 멘토링은 해당 분야의 더 선배 위치에서 멘토의 경험과 조언을 공유한다.","코칭은 유료이고 멘토링은 무료이다.","코칭은 개인 삶을 다루고, 멘토링은 직무 영역을 다룬다."],"b":"B","w":null,"be":"ICF가 정의하는 코칭의 본질('고객 내면의 해답을 길어 올리는 수평적 파트너십')과 멘토링의 본질('동일 분야 선배 위치에서의 경험·지혜 전수')이라는 역할 역학의 차이를 가장 정확히 규명했기 때문입니다(역량 1.06, 3.01).","we":"Worst (A) 및 오답 비교 소거: 기간의 장·단기(A), 유·무료 여부(C), 개인 삶 vs 직무 영역 구분(D) 모두 실제 현장에서 혼재될 수 있는 부수적 운영 조건일 뿐 두 전문 영역의 본질적 정의 기준이 아닙니다(특히 D는 코칭이 개인적·직업적 잠재력을 모두 다룬다는 ICF 정의를 정면 왜곡함).","c":["1.06","3.01"],"m":[],"k":[],"e":["PRO"]},{"id":28,"n":"Q28","cat":"bank","ty":"bw","t":"코치가 고객의 마케팅 서비스를 제공받는 대가로 코칭을 제공하는 물물교...","se":"A coach is offered a barter arrangement in which they provide coaching in exchange for receiving the client's marketing services. What are the best and worst actions under the ICF Code of Ethics and Core Competencies?","sk":"코치가 고객의 마케팅 서비스를 제공받는 대가로 코칭을 제공하는 물물교환(Barter) 계약을 제안받았습니다. ICF 윤리강령 및 핵심역량에 따른 최선의 행동과 최악의 행동은 무엇입니까?","o":["Refuse outright because the ICF Code of Ethics completely prohibits bartering.","Accept only if the value is documented and the arrangement does not impair the coaching relationship, disclose any potential conflict, set clear expectations, and revisit if the dynamic changes.","Accept and avoid discussing it again to keep things simple.","Accept on the condition that the client provides services first."],"ok":["ICF 윤리강령이 물물교환을 전면 금지하고 있으므로 무조건 거절한다.","교환 가치가 명확히 문서화되고 코칭 관계를 손상시키지 않는 조건에서 잠재적 이해상충을 투명하게 공개하며 수락하고, 역학이 변할 경우 재검토한다.","복잡한 문제를 피하기 위해 수락한 뒤 다시는 그 교환 조건 이야기를 꺼내지 않는다.","고객이 먼저 마케팅 서비스를 완료한다는 조건으로 수락한다."],"b":"B","w":"C","be":"ICF 윤리강령은 물물교환 자체를 금지하지 않으며, 공정한 재정적·교환 가치의 문서화(역량 3.03, 윤리강령 Standard 1.1), 이중 관계로 인한 이해상충의 투명한 사전 공개와 관리(Standard 3.1, 3.2)를 충족할 때 허용하기 때문입니다.","we":"Worst (C): 이중 관계(고객이자 서비스 공급자)에서 발생할 수 있는 이해상충과 기대치 불일치를 의도적으로 회피('다시는 이야기를 꺼내지 않음')하여 투명성과 합의 원칙을 심각하게 위반한 최악의 선택입니다.\n중간 오답 A와 D 비교: A는 윤리강령에 없는 금지 규정을 적용한 '과잉 해석(Overreach)'이고, D는 윤리적 조건과 이해상충 관리 없이 거래 이행 순서만 따지는 불완전한 대응입니다.","c":["1.01","1.04","3.02","3.03","3.12"],"m":[],"k":[],"e":["1.1","3.1","3.2"]},{"id":29,"n":"Q29","cat":"bank","ty":"bw","t":"고객이 '요즘 삶을 끝내고 싶다'며 모호하지만 지속적인 자살 생각(S...","se":"A client describes vague but persistent suicidal thoughts, saying, “Lately, I feel like ending my life.” What are the coach's most appropriate and least appropriate actions?","sk":"고객이 '요즘 삶을 끝내고 싶다'며 모호하지만 지속적인 자살 생각(Suicidal ideation)을 묘사합니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Try to handle the situation alone without informing anyone outside, in order to maintain confidentiality.","Pause the coaching agenda, acknowledge what the client shared with care, take reasonable steps to ensure safety and partner on connecting the client to mental health support; comply with applicable safety obligations.","Secretly contact the client's family without telling the client.","Reframe the thoughts as just stress and refocus on goals."],"ok":["비밀보장 원칙을 지키기 위해 외부에 알리지 않고 코치 혼자 해결하려 노력한다.","코칭 아젠다를 즉시 중단하고, 고객이 나눈 내용을 깊은 주의와 배려로 인정하며, 안전 확보를 위한 합리적 조치를 취하고 정신건강 전문 지원에 연결하도록 파트너십을 맺으며 법적·안전 의무를 준수한다.","고객에게 알리지 않고 가족에게 몰래 연락한다.","그 생각들을 단순한 업무 스트레스 반응일 뿐이라고 리프레이밍해 주고 본래의 코칭 목표에 다시 집중한다."],"b":"B","w":"D","be":"자해·타해의 임박하거나 개연성 있는 위해 위험 앞에서는 일반 코칭 아젠다를 즉시 멈추고, 고객의 생명 안전 확보와 전문 정신건강 기관 연계를 최우선으로 실행하며(역량 1.05, 1.07, 4.04, 윤리강령 Standard 2.3) 안전 보호 의무를 다해야 하기 때문입니다.","we":"Worst (D): 지속적인 자살 사고라는 생명의 위기를 '단순한 스트레스일 뿐'이라고 축소·왜곡(Minimizing)하고 목표 달성으로 밀어붙여 고객의 생명을 직접적 위험에 빠뜨린 가장 치명적인 과실입니다.\n중간 오답 A와 C 비교: A는 임상 위기를 무자격 코치가 혼자 감당하려는 위험한 월권이고, C는 고객의 안전 확보를 위한 협력 과정 없이 몰래 가족에게 연락하여 신뢰를 깨뜨리는 미숙한 대응입니다.","c":["1.04","1.05","1.07","4.04"],"m":[],"k":[],"e":["2.3"]},{"id":30,"n":"Q30","cat":"bank","ty":"bw","t":"코칭 진행 도중 새롭게 떠오른 특수 기업 이슈(적대적 행동주의 투자자...","se":"During a coaching engagement, a specialized business issue arises, such as responding to a hostile activist investor, and the coach realizes they lack the necessary competence. What are the coach's most appropriate and least appropriate actions?","sk":"코칭 진행 도중 새롭게 떠오른 특수 기업 이슈(적대적 행동주의 투자자 대응 등)에 대해 코치가 자신의 역량이 부족함을 느낍니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Pretend to have the necessary expertise and continue asking general leadership questions without revealing the lack of competence.","Be transparent with the client about the limits of the coach's competence on this specific topic and partner with the client on options—including referral, consultation with a more experienced coach, or focusing on aspects where the coach can serve effectively.","Unilaterally terminate the coaching agreement immediately.","Read books on activist investors between sessions and continue without disclosing."],"ok":["역량 부족을 내색하지 않고 아는 척하며 일반적인 리더십 질문을 지속한다.","이 특정 주제에 대한 코치 역량의 한계를 고객에게 솔직하고 투명하게 밝히고, 더 경험 많은 코치와의 자문·타 전문가 연계·또는 코치가 효과적으로 기여할 수 있는 영역에 집중하는 대안들을 고객과 파트너십으로 결정한다.","즉각 코칭 계약을 일방적으로 파기하고 종료한다.","역량 부족을 알리지 않은 채 세션 사이에 관련 서적만 읽고 계속 진행한다."],"b":"B","w":"D","be":"자신의 개인적·전문적 역량 한계를 정직하고 투명하게 인정하되(역량 1.01, 4.06, 윤리강령 Standard 4.2, 5.1), 코칭의 본질을 살려 외부 자원 활용(역량 2.08)이나 초점 조정을 고객과 함께 파트너십으로 결정하기 때문입니다.","we":"Worst (D): 자신의 역량 한계를 의도적으로 숨긴 채(비투명성) 세션 사이 벼락치기 독서만으로 고객의 중대한 위기 상황을 감당하려 함으로써 정직성과 역량 경계 준수(Standard 5.1)를 정면으로 위배한 최악의 기만입니다.\n중간 오답 A와 C 비교: A는 한계 공개 없이 일반적인 질문만 반복하는 소극적 회피이고, C는 리더십 측면에서 여전히 기여할 수 있음에도 고객과 상의 없이 계약을 파기하는 과잉 대응입니다.","c":["1.01","2.08","3.12","4.06"],"m":[],"k":[],"e":["4.2","5.1"]},{"id":31,"n":"Q31","cat":"bank","ty":"bw","t":"4개월간 코칭을 진행해 온 고객이 지나가는 말로 코치의 사촌에게 부부...","se":"After coaching a client for four months, the coach hears in passing that the client is receiving couples counseling from the coach's cousin. The coach and the cousin are close and speak every week. What are the coach's most appropriate and least appropriate actions?","sk":"4개월간 코칭을 진행해 온 고객이 지나가는 말로 코치의 사촌에게 부부 상담을 받고 있다고 언급했습니다. 코치와 사촌은 매주 통화하며 가깝게 지내는 사이입니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Continue without disclosure since the cousin is the therapist, not the coach.","Disclose the family relationship, acknowledge the potential conflict, and partner with the client on how to proceed, including the option of changing coaches.","Tell the cousin to stop discussing the client's case.","Simply reiterate the confidentiality principle to the client and move on."],"ok":["사촌은 치료사이고 본인은 코치이므로 굳이 공개하지 않고 세션을 계속한다.","사촌 관계를 고객에게 솔직히 공개하고 잠재적 이해상충과 비밀보장 우려를 인정한 뒤, 코치 교체 옵션을 포함하여 향후 진행 방식을 고객과 파트너십으로 협의한다.","사촌에게 연락해 그 고객 사례는 절대 언급하지 말라고 당부하고 고객에게는 말하지 않는다.","고객에게 비밀보장 원칙만 다시 한번 강조하고 넘어간다."],"b":"B","w":"A","be":"친족 관계로 인한 잠재적 이해상충과 비밀보장 우려를 인지한 즉시 고객에게 투명하게 공개하고(역량 1.01, 4.06, 윤리강령 Standard 3.1), 고객이 심리적 안전감을 바탕으로 코칭 지속 또는 코치 변경을 자율적으로 선택하게 돕기 때문입니다(Standard 3.3).","we":"Worst (A): 매주 연락하는 가까운 친족 관계를 고의로 은폐하여 고객의 알 권리와 선택 자율성을 침해한 명백한 이해상충 은폐 행위(Standard 3.1 정면 위반)입니다.\n중간 오답 C와 D 비교: C(사촌에게만 당부)와 D(비밀보장 원칙만 강조) 모두 고객에게 핵심 사실을 투명하게 알리지 않아 심리적 안전감과 진실성을 훼손한 불완전한 대응입니다.","c":["1.01","1.04","1.05","4.06"],"m":[],"k":[],"e":["3.1","3.3"]},{"id":32,"n":"Q32","cat":"bank","ty":"bw","t":"기업 스폰서가 코칭 계약서에 '피코치는 4분기까지 부서 간 협업 점수...","se":"An organizational sponsor asks the coach to include a specific KPI in the coaching agreement: “The coachee will improve cross-functional collaboration scores by 20% by the fourth quarter.” What are the coach's most appropriate and least appropriate responses?","sk":"기업 스폰서가 코칭 계약서에 '피코치는 4분기까지 부서 간 협업 점수를 20% 향상시킨다'라는 구체적 KPI 수치를 박아 넣기를 요구합니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Sign the contract because the sponsor is paying.","Propose a tripartite agreement that distinguishes organizational outcomes from coaching agreements, clarifies confidentiality, and ensures the coachee participates in defining their own coaching goals.","Sign the contract and tell the coachee privately that the goal is just for show.","Refuse the engagement because sponsor-set goals are unethical."],"ok":["스폰서가 비용을 지불하므로 요구대로 계약서에 서명한다.","조직의 기대 성과와 개인의 코칭 합의를 구별하고 비밀보장을 명확히 하며, 피코치(고객)가 자신의 코칭 목표 정의에 직접 참여하는 3자 합의를 제안한다.","스폰서 계약서에는 서명하되, 피코치에게는 개인적으로 '그 목표는 대외용이니 신경 쓰지 말라'고 따로 말한다.","스폰서가 목표를 제시하는 것은 비윤리적이므로 계약을 거절하고 철수한다."],"b":"B","w":"C","be":"조직 스폰서의 비즈니스 기대치를 존중하면서도 실제 코칭 목표는 고객 본인이 주체적으로 설정하고(역량 3.02, 3.04) 비밀보장 경계를 명확히 하는 투명한 3자 합의(윤리강령 Standard 1.1)를 구축하기 때문입니다.","we":"Worst (C): 스폰서에게는 목표 달성을 약속하며 서명해 주고 고객에게는 '대외용이니 무시하라'고 이중플레이를 하는 행위는 코치의 진실성과 정직성(역량 1.01, Standard 5.2)을 정면 배신하는 최악의 기만입니다.\n중간 오답 A와 D 비교: A는 고객의 자율적 목표 설정권을 배제한 채 스폰서 요구만 수용한 것이고, D는 3자 합의로 충분히 조율 가능한 기업 코칭 상황을 무조건 거절하는 과잉 해석(Overreach)입니다.","c":["1.01","3.02","3.04"],"m":[],"k":[],"e":["1.1","5.2"]},{"id":33,"n":"Q33","cat":"bank","ty":"mc4","t":"새로운 코칭 계약의 첫 세션에서 코치가 코칭 작동 방식, 수수료(비용...","se":"In the first session of a new coaching engagement, the coach explains and agrees on how coaching works, fees, scheduling, confidentiality, and the policy for late cancellations. Which competency does this best demonstrate?","sk":"새로운 코칭 계약의 첫 세션에서 코치가 코칭 작동 방식, 수수료(비용), 일정, 비밀보장, 그리고 늦은 취소 시 규정을 설명하고 합의합니다. 이는 어떤 역량을 가장 잘 보여주는가?","o":["Competency 5: Maintains Presence.","Competency 1: Demonstrates Ethical Practice.","Competency 3: Establishes and Maintains Agreements.","Competency 4: Cultivates Trust and Safety."],"ok":["역량 5: 프레즌스를 유지한다 (Maintains Presence).","역량 1: 윤리적 실천을 보여준다.","역량 3: 합의를 수립하고 유지한다 (Establishes and Maintains Agreements).","역량 4: 신뢰와 안전감을 조성한다."],"b":"C","w":null,"be":"코칭 철학 및 프로세스 설명(역량 3.01)과 실무적 운영사항(logistics), 비용, 일정, 취소 규정, 비밀보장 등 코칭 관계의 구체적 파라미터 합의(역량 3.03)는 역량 3번의 핵심 하위 역량 그 자체이기 때문입니다.","we":"Worst (A) 및 오답 비교 소거: A는 세션 중 코치의 깨어 있음과 유연한 현존 태도에 관한 역량 5번으로 행정적·구조적 계약 파라미터 설정과 가장 거리가 멉니다. 비밀보장 준수는 역량 1(B)과 역량 4(D)의 토대가 되지만, 수수료·일정·취소 규정 등 전체 계약 파라미터를 설정하는 직접적 역량은 역량 3(C)입니다.","c":["3.01","3.03"],"m":[],"k":[],"e":[]},{"id":34,"n":"Q34","cat":"bank","ty":"bw","t":"중대한 이직 기로에 선 고객이 코치에게 '제가 이 직장으로 옮겨야 할...","se":"A client facing a major career decision asks the coach, “Please decide for me whether I should move to this new job.” What are the coach's most appropriate and least appropriate responses?","sk":"중대한 이직 기로에 선 고객이 코치에게 '제가 이 직장으로 옮겨야 할지 말지 그냥 코치님이 대신 결정해 주세요'라고 요청합니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Share what the coach would do in the client's shoes.","Acknowledge the request, name what coaching offers and does not, and partner with the client on what would help them make this decision themselves—including what they already know and what they still need.","Prepare a pros-and-cons analysis on the client's behalf to help them make the decision.","Suggest postponing the decision until next week because things feel confusing now."],"ok":["코치가 고객의 입장이라면 어떻게 할지 자신의 솔직한 의견을 들려준다.","고객의 막막한 심정을 인정한 뒤, 코칭이 제공하는 것과 제공하지 않는 역할 한계를 밝히고, 고객 스스로 이 결정을 내릴 수 있도록 돕는 기준과 자원을 파트너십으로 탐색한다.","결정을 돕기 위해 코치가 장단점 분석표를 대신 작성해 준다.","지금은 혼란스러우니 결정을 다음 주로 미루자고 제안한다."],"b":"B","w":"A","be":"의사결정의 부담을 느끼는 고객을 공감적으로 수용하되(역량 4.05) 코칭과 컨설팅의 역할 경계를 명확히 하고(역량 1.06, 3.01), 선택 책임이 고객에게 있음을 세워(역량 2.01) 스스로 결정 역량을 발휘하도록 파트너십을 맺기 때문입니다.","we":"Worst (A): 고객의 중대한 인생·진로 결정을 코치가 대신 내려주어 자율성과 선택 책임을 완전히 빼앗는(역량 1.06, 2.01, 윤리강령 Standard 3.7 위반) 최악의 컨설팅 이탈입니다.\n중간 오답 C와 D 비교: C는 코치가 대신 분석표를 작성해 주어 주체성을 뺏는 태도이고, D는 지금 여기에서 탐색할 의사결정 기준을 다음 주로 미루는(Postponing) 회피입니다.","c":["1.06","2.01","3.01","4.05","8.03"],"m":[],"k":[],"e":["3.7"]},{"id":35,"n":"Q35","cat":"bank","ty":"bw","t":"세션 시작 30분 경과 시점에 코치는 자신의 가슴이 답답해지고 주의력...","se":"Thirty minutes into a session, the coach notices tightness in their chest and that their attention is wandering. What are the coach's most appropriate and least appropriate actions?","sk":"세션 시작 30분 경과 시점에 코치는 자신의 가슴이 답답해지고 주의력이 산만해지고 있음을 알아차렸습니다. 이때 코치의 가장 적절한 행동과 가장 부적절한 행동은 무엇입니까?","o":["Endure the discomfort and force yourself to continue to the end.","Use breathing and grounding to briefly self-regulate and regain presence, transparently checking in about the moment if needed.","End the session immediately because you cannot concentrate.","Let the client carry the conversation while the coach recovers."],"ok":["불편함을 참고 끝까지 억지로 진행한다.","호흡과 그라운딩(grounding)을 통해 짧게 자기조절하여 프레즌스를 회복하고, 필요하다면 순간을 투명하게 점검한다.","집중할 수 없으므로 즉시 세션을 종료한다.","코치가 회복하는 동안 고객 혼자 계속해서 이야기하도록 방치한다."],"b":"B","w":"D","be":"자신의 신체적·정서적 상태 변화를 즉시 알아차리고(역량 5.03) 의도적인 자기조절(호흡·그라운딩, 2025 용어집 Self-Regulation, Grounded)을 통해 프레즌스와 웰빙을 회복하기 때문입니다(역량 2.06, 2.07, 5.04).","we":"Worst (D): 코치가 프레즌스와 경청을 완전히 포기한 채 고객 혼자 떠들도록 방치함으로써 역량 5.01(집중·관찰·반응)과 역량 6(적극적 경청)을 정면 위반한 최악의 직무유기입니다.\n중간 오답 A와 C 비교: A는 내면 상태를 조절하지 않고 억지로 버텨 경청의 질을 떨어뜨리는 미흡한 자기 관리이고, C는 현장에서 호흡으로 충분히 회복 가능한 일시적 산만함을 이유로 세션을 끊어버리는 과잉 반응입니다.","c":["2.06","2.07","5.01","5.03","5.04"],"m":[],"k":[],"e":[]},{"id":36,"n":"Q36","cat":"bank","ty":"mc4","t":"2025 개정 ICF 핵심역량 2번('코칭 마인드셋을 구현한다 / E...","se":"Which statement most accurately describes the official definition of 2025 ICF Core Competency 2, Embodies a Coaching Mindset?","sk":"2025 개정 ICF 핵심역량 2번('코칭 마인드셋을 구현한다 / Embodies a Coaching Mindset')을 가장 정확하게 설명한 공식 정의는 무엇입니까?","o":["Developing and maintaining an open, curious, flexible, and client-centered mindset through ongoing personal and professional learning and reflective practice.","Leading sessions directly and decisively based on loosely held strong convictions and professional judgment.","Using systematic and logical analysis to diagnose and solve clients' problems quickly.","Evaluating clients solely through objective performance measures while excluding human emotions."],"ok":["지속적인 개인적·전문적 학습과 성찰훈련을 바탕으로 개방적이고 호기심이 많으며, 유연하고 고객 중심적인 사고방식(마인드셋)을 개발하고 유지하는 것.","느슨하게 유지되는 강한 확신과 전문적 판단을 바탕으로 직접적이고 결단력 있게 세션을 이끄는 태도.","고객의 문제를 신속하게 진단하고 해결하기 위한 체계적·논리적 분석 능력.","인간적 감정을 배제하고 오직 객관적 성과 지표만으로 고객을 평가하는 태도."],"b":"A","w":null,"be":"2025 ICF 핵심역량 2번 공식 정의('코치로서 지속적인 개인적·전문적 학습과 개발에 참여한다. 필요 시 코칭 슈퍼바이저나 멘토코치와 협력한다. 개방적이고 호기심이 많으며, 유연하고 고객 중심적인 사고방식을 개발하고 유지한다') 및 2.02~2.09의 핵심 요소를 완벽히 담고 있기 때문입니다.","we":"Worst (B): '직접적이고 결단력 있으며 강한 확신으로 세션을 이끄는 태도'는 에고리스(Egoless)하고 개방적이며 고객 중심적인 코칭 마인드셋과 정반대되는 컨설턴트·경영자형 태도입니다.\n중간 오답 C와 D 비교: C는 문제 해결과 분석에 치우친 컨설팅·질병 모델 관점이며, D는 감정과 공감(역량 4·5·6)을 배제한 기계적 평가 태도로 코칭 철학에 어긋납니다.","c":["2.02","2.03","2.09"],"m":[],"k":[],"e":[]},{"id":37,"n":"Q37","cat":"bank","ty":"bw","t":"고객이 어깨를 잔뜩 움츠리고 시선을 내리깔며 단조로운 목소리로 '저...","se":"A client sits with hunched shoulders, looks down, and speaks in a monotone while saying, “I'm fine, really. It's just been a long week.” When verbal and nonverbal signals clearly conflict, what are the coach's most appropriate and least appropriate responses?","sk":"고객이 어깨를 잔뜩 움츠리고 시선을 내리깔며 단조로운 목소리로 '저 괜찮아요, 정말이에요. 그냥 긴 한 주였을 뿐이에요'라고 말합니다. 언어적 표현과 비언어적 신호가 명백히 불일치할 때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Take the client at their word and move on.","Reflect what you observe in body and tone, hold space without interpreting, and invite the client to share more if they wish.","Tell the client they don't seem fine and ask what is really going on.","Offer warm encouragement to cheer the client up and help change their mood."],"ok":["고객이 입으로 말한 대로 괜찮다고 믿고 다음 주제로 넘어간다.","신체 언어와 목소리 톤에서 관찰된 바를 코치의 자의적 해석 없이 있는 그대로 비춰주고, 원한다면 더 나눌 수 있도록 공간을 열어둔다.","전혀 괜찮아 보이지 않는다고 지적하며 도대체 무슨 일이 있었는지 캐묻는다.","힘내라고 따뜻하게 격려하며 기분 전환을 돕는다."],"b":"B","w":"C","be":"언어(7%)와 음성·신체 언어(93%)의 불일치를 통합적으로 포착하되(역량 6.04, 6.05), 코치의 추측이나 판단 없이 관찰된 사실만 거울처럼 비추어(역량 7.11, PCC 마커 6.4, 7.5) 고객 스스로 탐색할지 선택하게 했기 때문입니다.","we":"Worst (C): '전혀 괜찮아 보이지 않는다'며 고객의 말을 부정·면박 주고 취조하듯 캐물음으로써(PCC 마커 4 위반 '비지지적이고 판단적임' 및 PCC 마커 6 위반 '가정과 해석을 강요함') 심리적 안전감을 즉각 파괴하는 최악의 개입입니다.\n중간 오답 A와 D 비교: A는 명백한 비언어적 정서 신호를 놓치고 표면 텍스트만 듣고 넘어가는 소극적 경청(PCC 마커 6 위반)이며, D는 탐색 없이 위로와 격려로 감정을 덮어버리는 반응입니다.","c":["6.04","6.05","7.11"],"m":["6.4","7.5"],"k":[],"e":[]},{"id":38,"n":"Q38","cat":"bank","ty":"bw","t":"세션 중반, 한부모로서 겪는 고충을 나누던 고객이 코치에게 '코치님은...","se":"Midway through a session about the challenges of being a single parent, a client says, “You've never been a single parent, so you'll never understand how I feel.” What are the coach's most appropriate and least appropriate responses?","sk":"세션 중반, 한부모로서 겪는 고충을 나누던 고객이 코치에게 '코치님은 한부모가 되어보신 적이 없으니 제 마음을 결코 이해하지 못하실 거예요'라고 말합니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Immediately refer the client to another colleague coach who has experience as a single parent so the client may feel more comfortable.","Acknowledge the client's experience, name that the client is the expert on their life, and invite them to share what would help the coach understand what's most important.","Defend the coach's training and ability to coach across many life situations.","Express deep sympathy and offer comforting words about how difficult it must be."],"ok":["고객이 더 편안하도록 한부모 경험이 있는 다른 동료 코치를 즉시 소개해 준다.","고객의 고유한 삶의 경험을 인정하고, 고객 자신이 자기 삶의 전문가임을 밝힌 뒤, 코치가 가장 중요한 것을 이해하는 데 무엇이 도움이 될지 나누도록 초대한다.","다양한 배경과 삶의 환경을 코칭할 수 있도록 전문 훈련과 자격을 갖추었다며 코치의 역량을 변호한다.","얼마나 힘드실지 깊이 동정심을 표하며 위로의 말을 건넨다."],"b":"B","w":"C","be":"고객의 고유한 삶의 맥락과 정체성을 겸손하게 인정하고(역량 4.01, 4.02), 방어하거나 변명하지 않은 채 고객이 자기 삶의 전문가임을 세우며(역량 2.01) 순수한 호기심으로 고객의 세계를 배우려 초대했기 때문입니다(역량 5.02, PCC 마커 5.4).","we":"Worst (C): 고객이 표현한 거리감과 고립감을 공감하기는커녕 코치 자신의 자격증과 전문 훈련을 내세워 방어적으로 변호(Defend)함으로써 수평적 파트너십과 취약성 개방을 통한 신뢰 구축(역량 4.06)을 정면으로 해친 최악의 에고 반응입니다.\n중간 오답 A와 D 비교: A는 관계를 탐색하고 조율할 기회도 갖기 전에 성급히 관계를 종결·이관하려는 회피이며, D는 동정(Sympathy)으로 상대를 약자 위치에 놓는 비파트너십적 위로입니다.","c":["2.01","4.01","4.02","4.05","5.02"],"m":["5.4"],"k":[],"e":[]},{"id":39,"n":"Q39","cat":"bank","ty":"bw","t":"고객이 코치에게 회복탄력성(Resilience)을 키우는 데 도움이...","se":"A client asks the coach to recommend a good book that might help build resilience. What are the coach's most appropriate and least appropriate responses?","sk":"고객이 코치에게 회복탄력성(Resilience)을 키우는 데 도움이 될 만한 좋은 책을 추천해 달라고 요청합니다. 이때 코치의 가장 적절한 반응과 가장 부적절한 반응은 무엇입니까?","o":["Recommend the coach's favorite book on resilience.","Refuse, saying that coaches cannot recommend books, and tell the client to search online independently.","Acknowledge the request, ask what the client most wants to take away, and partner on whether a recommendation, the client's own search, or further coaching exploration would best serve them.","Summarize and explain the key contents of the book to the client."],"ok":["회복탄력성에 관해 코치가 가장 좋아하는 책 한 권을 즉시 추천해 준다.","코칭에서는 책을 추천할 수 없으니 인터넷에서 스스로 검색해 보라고 거절한다.","고객의 요청을 인정한 뒤 그 책을 통해 가장 얻고자 하는 바가 무엇인지 묻고, 코치의 정보 공유·고객의 자체 탐색·추가 코칭 대화 중 무엇이 가장 유익할지 파트너십으로 결정한다.","코치가 그 책의 핵심 내용을 요약해서 설명해 준다."],"b":"C","w":"A","be":"자원 요청 이면에 있는 고객의 진짜 욕구와 목적을 먼저 탐색하고(역량 7.01, 7.03), 집착 없는 지식 공유(역량 7.11)와 고객의 자기 주도적 자원 탐색(역량 8.05) 중 최적의 방식을 파
