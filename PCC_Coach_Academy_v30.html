 have been apparent, the coach has not engaged in any supervision or reflective practice during that year. What is the appropriate assessment?","sk":"코치는 최근 1년 동안 수많은 고객들을 코칭해 오며 매 세션마다 매우 긍정적인 피드백을 받아왔고 겉으로 드러난 문제는 전혀 없었습니다. 그러나 지난 1년 동안 어떠한 슈퍼비전이나 성찰 실천을 거치지 않았음을 깨달았습니다. 올바른 평가는?","o":["Since clients are generally satisfied and no obvious problems have occurred, there is no need to spend additional time or money on supervision or reflection.","Positive client feedback and successful outcomes alone are insufficient to prove that the coach's unconscious blind spots or habitual patterns are not affecting the coaching; regular supervision and reflective practice should be reinstated.","Ask the most trusted VIP client for in-depth feedback to confirm that the coach is doing well.","Keeping a personal journal every day for the next month is sufficient for self-review."],"ok":["고객들이 전반적으로 만족하고 있고 명백한 문제가 발생하지 않았으므로 굳이 추가적인 슈퍼비전이나 성찰에 시간과 비용을 쓸 필요가 없다.","고객의 긍정적 피드백과 성공적인 결과만으로는 코치 자신의 무의식적 맹점이나 타성적 습관이 코칭에 영향을 미치지 않고 있음을 증명하기에 불충분하므로, 정기적인 슈퍼비전과 성찰적 실천을 회복해야 한다.","자신이 잘하고 있는지 확인하기 위해 가장 신뢰하는 VIP 고객에게 심층 피드백을 요청한다.","다음 한 달 동안 매일 혼자 일기를 쓰며 자가 점검하는 것으로 충분하다."],"b":"B","w":null,"be":"2025 핵심역량 2 정의('필요 시 코칭 슈퍼바이저나 멘토코치와 협력한다')와 2.03(성찰훈련 지속), 그리고 2026 윤리강령 Part 2 Professionalism(평생 전문 학습)에 따라 고객 만족도와 무관하게 정기적인 슈퍼비전과 성찰적 실천으로 맹점을 점검해야 하기 때문입니다.","we":"Worst 및 오답 비교 소거: A는 '문제가 없으니 배울 필요도 없다'는 오만함으로 지속적 학습과 성찰 의무를 전면 부정한 최악의 비전문적 태도입니다. D는 혼자만의 일기만으로 자기 맹점(Blind area)을 발견하는 데 한계가 있으며, C는 코칭 고객을 역량 평가자로 활용하는 부적절한 역할 전도입니다.","c":["2.02","2.03","2.08"],"m":[],"k":[],"e":[]},{"id":141,"n":"U27","cat":"lcu","ty":"bw","t":"현 직책에 남을지 이직할지 고민하던 고객이 갑자기 손으로 가슴을 짚으...","se":"A client who is deciding whether to remain in their current role or change jobs suddenly puts a hand on their chest and reports intense physical discomfort: “My chest tightens every time I think about this.” What would be the coach's worst action?","sk":"현 직책에 남을지 이직할지 고민하던 고객이 갑자기 손으로 가슴을 짚으며 '이 생각을 할 때마다 가슴이 찢어질 듯 조여와요(My chest tightens).'라고 강렬한 신체적 고통을 호소합니다. 코치가 취할 수 있는 가장 최악의 행동(Worst)은 무엇입니까?","o":["Without mentioning the client's physical reaction, take out paper and suggest creating a pros-and-cons list to help with the decision.","Pause the conversation, reflect the physical sensation of chest tightness, and invite the client to explore what that bodily response may be communicating.","Encourage the client to listen to their body and urge them to resign immediately because their body is signaling rejection.","Explain that chest tightness is merely a normal stress response to making a decision and reassure the client."],"ok":["고객의 신체 반응에 대해서는 일절 아무런 언급도 하지 않은 채, 결정을 돕기 위해 종이를 꺼내 장단점 분석 목록을 작성해 보자고 제안한다.","대화를 즉시 멈추고 가슴이 조여온다는 신체 감각을 있는 그대로 비춰주며, 그 신체 반응이 무엇을 말하고 있는지 함께 탐색하자고 초대한다.","몸의 소리에 귀를 기울이라고 격려하면서 신체가 거부 반응을 보내고 있으니 그 직책에서 즉시 사직해야 한다고 부추긴다.","가슴이 조여오는 것은 결정에 따른 통상적인 스트레스 반응일 뿐이라고 설명하고 안심시킨다."],"b":"B","w":"A","be":"B는 강렬한 신체 감각(Somatic signal)을 즉각 수용하고 거울처럼 비추어 내면의 메시지를 탐색하게 돕는(역량 5.03, 6.04, 7.05) 최선의 행동인 반면, A는 눈앞의 고통스러운 신체 신호를 100% 투명인간 취급하고 기계적인 장단점 표로 회피하는 최악의 현존 상실입니다.","we":"Worst (A): C(사직하라고 조언함) 역시 심각한 지시적 월권이지만, 고객이 손으로 가슴을 짚으며 호소한 결정적 고통 신호를 일절 언급조차 하지 않고 100% 묵살(Complete dismissal)한 채 인지적 도표로 도망치는 A가 PCC 마커 5 & 6 위반에서 가장 잔인한 Worst입니다.\n중간 오답 C와 D 비교: C는 신체 신호는 포착했으나 코치가 사직 결정을 대신 내려주는 월권이고, D는 '통상적인 스트레스 반응일 뿐'이라며 고객의 고유한 신체 경고를 일반화해 축소(Minimizing)한 반응입니다.","c":["5.01","5.03","6.04","7.05"],"m":["5.1","6.4"],"k":[],"e":[]},{"id":142,"n":"U28","cat":"lcu","ty":"bw","t":"고객이 최근 겪고 있는 깊은 심리적 고통과 과거의 트라우마성 사건을...","se":"A client begins to disclose deep psychological distress and traumatic events from the past. As the coach listens, similar personal experiences come to mind and the coach feels emotionally overwhelmed. What should the coach do?","sk":"고객이 최근 겪고 있는 깊은 심리적 고통과 과거의 트라우마성 사건을 털어놓기 시작합니다. 그 이야기를 듣는 동안 코치는 과거 유사한 개인적 경험을 떠올리며 감정적으로 크게 압도당합니다. 코치는 무엇을 해야 합니까?","o":["Honestly disclose that you are having a strong personal reaction and ask whether the client wants to continue exploring.","To avoid your own anxiety and agitation, begin lecturing the client by citing recent clinical psychology research on overcoming trauma.","Notice your internal reaction, set it aside, and remain fully present and attentive to what the client is experiencing now.","Decide that you are too emotionally disturbed to continue and immediately end the session early without a specific explanation."],"ok":["코치 자신에게 개인적 반응이 격하게 일어나고 있음을 솔직히 밝히고 계속 탐색하기를 원하는지 묻는다.","코치 자신의 불안과 동요를 모면하기 위해 트라우마 극복과 관련된 최신 임상 심리학 연구 결과를 인용하며 고객에게 강의하듯 설명(Lecturing)하기 시작한다.","코치 내면에서 일어나는 반응을 자각하고 이를 한쪽으로 제쳐둔 뒤, 고객이 지금 경험하고 있는 것에 온전히 현존을 유지하며 경청한다.","감정적으로 너무 동요되어 더 이상 진행할 수 없다고 판단하고 구체적인 설명 없이 즉시 세션을 조기 종료한다."],"b":"C","w":"B","be":"코치 자신의 내면적 동요와 역전이 반응을 즉각 자각해 내려놓고(역량 2.06, 5.04), 강한 감정 상태의 고객 앞에서도 안정된 중심을 유지하며 온전한 프레즌스와 경청으로 함께 머물러 주기 때문입니다(역량 5.05).","we":"Worst (B): 코치 자신의 불안을 모면하기 위해 무자격 심리치료사처럼 '임상 심리학 연구 결과'를 강의하듯 설명(Lecturing)함으로써 역량 1.06(코칭과 심리치료·교육의 차별성 유지), 2.06(감정 조절), 윤리강령 Standard 3.7을 동시에 위반한 최악의 해악입니다.\n중간 오답 A와 D 비교: A는 코치의 감정적 압도를 고백하여 고객이 오히려 코치를 걱정하게 만드는 주객전도이며, D는 아무런 설명이나 안전한 마무리 없이 세션을 끊어버리는 무책임한 회피입니다.","c":["1.06","2.06","5.04","5.05"],"m":[],"k":[],"e":["3.7"]},{"id":143,"n":"U29","cat":"lcu","ty":"bw","t":"생물의학 연구원 고객이 코칭 세션에 도착하여, 아무런 말도 꺼내지 않...","se":"A biomedical researcher arrives for a coaching session and silently slides a journal they wrote for the previous week's assignment toward the coach. The client's expression appears tense and uncomfortable. What should the coach do?","sk":"생물의학 연구원 고객이 코칭 세션에 도착하여, 아무런 말도 꺼내지 않은 채 지난주 과제로 작성해 온 저널(일기) 노트를 코치 앞으로 쓱 내밀었습니다. 고객의 표정은 어딘가 굳어 있고 불편한 기색이 역력합니다. 코치는 무엇을 해야 합니까?","o":["Notice the client's nonverbal hesitation and awkwardness and first check whether they are willing to talk about the journal entry now.","Praise the client for completing the assignment diligently and take the notes to read them closely.","Immediately ask reflective questions about what new awareness the client gained and what they learned while journaling.","Assume the client is not ready to talk because they have not brought it up, and put the notes aside."],"ok":["고객이 보여주는 비언어적 주저함과 어색함을 알아차리고, 그 저널 내용에 대해 지금 대화할 준비가 되었는지 고객의 의향을 먼저 확인한다.","과제를 성실히 수행해 온 점을 칭찬하고 코치가 노트를 가져가 내용을 정독하기 시작한다.","저널을 작성하면서 고객에게 어떤 새로운 자각이 일어났고 무엇을 배웠는지 곧바로 성찰 질문을 던진다.","직접 말을 꺼내지 않는 것을 보아 대화할 준비가 안 되었다고 판단하고 노트를 옆으로 치워둔다."],"b":"A","w":"B","be":"굳어 있는 표정과 침묵이라는 비언어적 신호를 포착하고(역량 6.04), 노트의 텍스트보다 고객의 심리적 안전감과 선택권을 최우선으로 존중하여(역량 4.02, 5.03, PCC 마커 5.3) 대화 준비 여부를 먼저 확인하기 때문입니다.","we":"Worst (B): 고객의 불편한 비언어적 신호를 완전히 무시한 채 교사처럼 성실함을 평가·칭찬하고 세션 도중 코치 혼자 노트를 가져가 정독함으로써 프레즌스와 파트너십을 파괴한 최악의 반응입니다.\n중간 오답 C와 D 비교: C는 성찰 질문 자체는 코칭적이나 고객의 현재 정서적 불편함과 대화 준비 여부를 확인하는 안전 단계를 건너뛰었고, D는 고객에게 묻지도 않고 코치가 일방적으로 '준비 안 됐다'고 단정해 노트를 치워버리는 가정(Assumption) 오류입니다.","c":["4.02","4.05","5.03","6.04"],"m":["5.3","6.4"],"k":[],"e":[]},{"id":144,"n":"U30","cat":"lcu","ty":"bw","t":"중요한 커리어 전환을 준비하는 고객을 코칭하던 중, 면접 질문을 던지...","se":"While coaching a client preparing for an important career transition, the coach asks an interview question. The client stops responding, their expression freezes, and they avert their eyes. What should the coach do?","sk":"중요한 커리어 전환을 준비하는 고객을 코칭하던 중, 면접 질문을 던지자 고객이 답변을 멈추고 표정이 굳어지며 시선을 피한 채 얼어붙습니다(Freezes). 코치는 무엇을 해야 합니까?","o":["Gently reflect the changes in the client's body, facial expression, and breathing when faced with the question, and ask what they are experiencing in the silence.","Assume the client did not understand the question, rephrase it in simpler words, and press them again for an answer.","Tell the client that they must never freeze in front of an interviewer and train them to answer confidently.","Make a light joke to break the awkwardness and move on to a completely different everyday topic."],"ok":["질문에 직면했을 때 고객의 신체와 표정, 호흡에서 일어난 변화를 부드럽게 비춰주고, 그 침묵 속에서 지금 무엇이 경험되고 있는지 묻는다.","고객이 질문을 이해하지 못했다고 단정하고 더 쉬운 단어로 질문을 바꾸어 다시 추궁하듯 캐묻는다.","면접관 앞에서는 결코 얼어붙어서는 안 된다고 지적하며 당당하게 답변하는 연습을 시킨다.","어색한 분위기를 깨기 위해 가벼운 농담을 던지고 전혀 다른 일상 화제로 넘어간다."],"b":"A","w":"B","be":"고객이 얼어붙은 순간을 문제나 실수로 보지 않고 침묵과 멈춤의 공간을 허용하며(역량 5.07), 신체·표정·호흡에서 관찰된 변화를 비판단적으로 반영하고(역량 6.04) 지금 이 순간 내면에서 일어나는 경험을 탐색하도록 초대하기 때문입니다(역량 7.05).","we":"Worst (B): 고객이 내면의 두려움과 마주해 얼어붙은 것을 '질문을 이해하지 못했다'고 코치가 멋대로 단정(Assumption)한 데다, 쉬운 말로 바꾸어 추궁하듯 캐물음으로써 심리적 안전감을 짓밟은 최악의 취조적 태도입니다.\n중간 오답 C와 D 비교: C는 내면의 저항을 탐색하지 않고 코치가 면접관처럼 지적하며 훈련(Training) 모드로 넘어가는 개입이고, D는 중요한 내면 탐색의 문턱을 농담과 일상 화제로 회피(Dismiss)해 버리는 반응입니다.","c":["5.07","6.04","7.05"],"m":["5.5","6.4"],"k":[],"e":[]}],"c":[{"n":"1","g":"A","ge":"Foundation","gk":"기초세우기","en":"Demonstrates Ethical Practice","ko":"윤리적 실천을 보여준다","de":"Understands and consistently applies coaching ethics and standards of coaching","dk":"코칭윤리와 코칭표준을 이해하고 지속적으로 적용한다.","s":[{"n":"1.01","en":"Demonstrates personal integrity and honesty in interactions with clients, sponsors and relevant stakeholders","ko":"고객, 스폰서 및 이해 관계자와의 상호작용에서 코치의 진실성과 정직성을 보여준다."},{"n":"1.02","en":"Is sensitive to clients’ identity, environment, experiences, values and beliefs","ko":"고객의 정체성, 환경, 경험, 가치 및 신념에 민감성을 가지고 대한다."},{"n":"1.03","en":"Uses language appropriate and respectful to clients, sponsors and relevant stakeholders","ko":"고객, 스폰서 및 이해 관계자에게 적절하고, 존중하는 언어를 사용한다."},{"n":"1.04","en":"Abides by the ICF Code of Ethics and upholds the ICF Core Values","ko":"ICF 윤리 강령을 준수하고 ICF 핵심 가치를 지지한다."},{"n":"1.05","en":"Maintains confidentiality with client information per stakeholder agreements and pertinent laws","ko":"이해 관계자 합의 및 관련 법률에 따라 고객 정보에 대해 비밀을 유지한다."},{"n":"1.06","en":"Maintains the distinctions between coaching, consulting, psychotherapy and other support professions","ko":"코칭, 컨설팅, 심리치료 및 다른 지원 전문직과의 차별성을 유지한다."},{"n":"1.07","en":"Refers clients to other support professionals, as appropriate","ko":"적절하다고 판단되는 경우, 고객을 다른 지원 전문가에게 연계한다."}]},{"n":"2","g":"A","ge":"Foundation","gk":"기초세우기","en":"Embodies a Coaching Mindset","ko":"코칭 마인드셋을 구현한다","de":"Engages in ongoing personal and professional learning and development as a coach. Works with coaching supervisors or mentor coaches as needed. Develops and maintains a mindset that is open, curious, flexible and client-centered.","dk":"코치로서 지속적인 개인적·전문적 학습과 개발에 참여한다. 필요 시 코칭 슈퍼바이저나 멘토코치와 협력한다. 개방적이고 호기심이 많으며, 유연하고 고객 중심적인 사고방식(마인드셋)을 개발하고 유지한다.","s":[{"n":"2.01","en":"Acknowledges that clients are responsible for their own choices","ko":"코치는 선택에 대한 책임이 고객 자신에게 있음을 인정한다."},{"n":"2.02","en":"Engages in ongoing learning and development as a coach, including remaining aware of current coaching best practices and use of technology","ko":"코치로서 지속적인 학습 및 개발에 참여하며, 최신 코칭 우수 사례와 기술 사용에 대한 인식을 유지한다."},{"n":"2.03","en":"Develops an ongoing reflective practice to enhance one’s coaching","ko":"코치는 코칭능력을 향상시키기 위해 성찰훈련을 지속한다."},{"n":"2.04","en":"Remains aware of and open to the influence of biases, context and culture on self and others","ko":"코치는 자기 자신과 다른 사람들이 편향, 상황, 문화에 의해 영향 받을 수 있음을 인지하고 개방적 태도를 취한다."},{"n":"2.05","en":"Uses awareness of self and one’s intuition to benefit clients","ko":"고객의 유익을 위해 자신의 인식과 직관을 활용한다."},{"n":"2.06","en":"Develops and maintains the ability to manage one’s emotions","ko":"감정 관리 능력을 개발하고 유지한다."},{"n":"2.07","en":"Maintains emotional, physical, and mental well-being in preparation for, throughout, and following each session.","ko":"각 세션의 준비·진행·종료 후 전 과정에서 정서적·신체적·정신적 웰빙을 유지한다."},{"n":"2.08","en":"Seeks help from outside sources when necessary","ko":"필요하면 외부자원으로부터 도움을 구한다."},{"n":"2.09","en":"Nurtures openness and curiosity in oneself, the client, and the coaching process.","ko":"자신과 고객, 그리고 코칭 과정에서 개방성과 호기심을 함양한다."},{"n":"2.10","en":"Remains aware of the influence of one’s thoughts and behaviors on the client and others","ko":"자신의 생각과 행동이 고객 및 타인에게 미치는 영향을 인식한다."}]},{"n":"3","g":"B","ge":"Co-Creating the Relationship","gk":"관계의 공동구축","en":"Establishes and Maintains Agreements","ko":"합의를 수립하고 유지한다","de":"Partners with the client and relevant stakeholders to create clear agreements about the coaching relationship, process, plans and goals. Establishes agreements for the overall coaching engagement as well as those for each coaching session.","dk":"고객 및 이해 관계자와 협력하여 코칭관계, 프로세스, 계획 및 목표에 대한 명확한 합의를 한다. 개별 코칭세션은 물론 전체 코칭 전체 과정(coaching engagement)에 대한 합의를 수립한다.","s":[{"n":"3.01","en":"Describes one’s coaching philosophy and clearly defines what coaching is and is not for potential clients and stakeholders","ko":"자신의 코칭 철학을 설명하고, 잠재 고객 및 이해관계자에게 코칭인 것과 코칭이 아닌 것에 대해 명확히 정의한다."},{"n":"3.02","en":"Reaches agreement about what is and is not appropriate in the relationship, what is and is not being offered, and the responsibilities of the client and relevant stakeholders, including commitment to working toward coaching goals","ko":"관계에서 무엇이 적절하고 적절하지 않은지, 무엇이 제공되고 제공되지 않는지, 고객 및 이해관계자의 책임, 그리고 코칭 목표를 향한 헌신에 합의한다."},{"n":"3.03","en":"Reaches agreement about the guidelines and specific parameters of the coaching relationship such as logistics, fees, scheduling, duration, termination, confidentiality and inclusion of others","ko":"실무적 운영사항(logistics), 비용, 일정, 기간, 종결, 비밀 보장, 다른 사람의 포함 등과 같은 코칭관계의 지침 및 특이사항에 대해 합의한다."},{"n":"3.04","en":"Partners with the client and relevant stakeholders to establish an overall coaching plan and goals","ko":"고객 및 이해 관계자와 함께 전체 코칭 계획 및 목표를 설정한다."},{"n":"3.05","en":"Partners with the client to determine client-coach compatibility.","ko":"고객과 협력하여 고객-코치 간의 적합성을 함께 판단한다."},{"n":"3.06","en":"Partners with the client to identify or reconfirm what they want to accomplish in the session","ko":"고객과 함께 코칭세션에서 달성하고자 하는 것을 찾거나 재확인한다."},{"n":"3.07","en":"Partners with the client to define what the client believes they need to address or resolve to achieve what they want to accomplish in the session","ko":"세션에서 달성하고자 하는 것을 얻기 위해 고객 스스로가 다뤄야 하거나 해결해야 한다고 생각하는 것을 고객과 협력하여 정의한다."},{"n":"3.08","en":"Partners with the client to define or reconfirm measures of success for what the client wants to accomplish in the coaching engagement or individual session","ko":"코칭 전체 과정(coaching engagement) 또는 개별 세션에서 고객이 달성하려는 바를 위해, 고객과 협력하여 성공 척도를 정의하거나 재확인한다."},{"n":"3.09","en":"Partners with the client to manage the time and focus of the session","ko":"고객과 함께 세션의 시간을 관리하고 초점을 유지한다."},{"n":"3.10","en":"Continues coaching in the direction of the client’s desired outcome unless the client indicates otherwise","ko":"고객이 달리 의사를 밝히지 않는 한, 고객이 지향하는 결과를 향해 코칭을 지속한다."},{"n":"3.11","en":"Partners with the client to close the coaching relationship in a way that respects the client and the coaching experience","ko":"고객과 협력하여 고객과 코칭 경험을 존중하는 방식으로 코칭 관계를 종료한다."},{"n":"3.12","en":"Revisits the coaching agreement when necessary to ensure the coaching approach is meeting the client’s needs","ko":"필요 시 코칭 합의를 재검토하여 코칭 접근이 고객의 니즈에 부합하는지 확인한다."}]},{"n":"4","g":"B","ge":"Co-Creating the Relationship","gk":"관계의 공동구축","en":"Cultivates Trust and Safety","ko":"신뢰와 안정감을 조성한다","de":"Partners with the client to create a safe, supportive environment that allows the client to share freely. Maintains a relationship of mutual respect and trust.","dk":"고객과 함께, 고객이 자유롭게 나눌 수 있는 안전하고 지지적인 환경을 만든다. 상호존중과 신뢰 관계를 유지한다.","s":[{"n":"4.01","en":"Seeks to understand the client within their context which may include their identity, environment, experiences, values and beliefs","ko":"고객의 정체성, 환경, 경험, 가치 및 신념 등의 맥락 안에서 고객을 이해하려고 노력한다."},{"n":"4.02","en":"Demonstrates respect for the client’s identity, perceptions, style and language and adapts one’s coaching to the client","ko":"고객의 정체성, 인식, 스타일 및 언어를 존중하고 고객에 맞추어 코칭한다."},{"n":"4.03","en":"Acknowledges and respects the client’s unique talents, insights and work in the coaching process","ko":"코칭과정에서 고객의 고유한 재능, 통찰 및 노력을 인정하고 존중한다."},{"n":"4.04","en":"Shows support, empathy and concern for the client","ko":"고객에 대한 지지, 공감 및 관심을 보여준다."},{"n":"4.05","en":"Acknowledges and supports the client’s expression of feelings, perceptions, concerns, beliefs and suggestions","ko":"고객이 자신의 감정, 인식, 관심, 신념, 및 제안하는 바를 그대로 표현하도록 인정하고 지원한다."},{"n":"4.06","en":"Demonstrates openness and transparency as a way to display vulnerability and build trust with the client","ko":"고객과의 신뢰를 구축하기 위해 인간으로서의 취약성을 드러내고 개방성과 투명성을 보여준다."}]},{"n":"5","g":"B","ge":"Co-Creating the Relationship","gk":"관계의 공동구축","en":"Maintains Presence","ko":"프레즌스를 유지한다","de":"Is fully conscious and present with the client, employing a style that is open, flexible, grounded and confident","dk":"개방적이고 유연하며 중심이 잡힌 자신감 있는 태도로 완전히 깨어서 고객과 함께 한다.","s":[{"n":"5.01","en":"Remains focused, observant, empathetic and responsive to the client","ko":"고객에게 집중하고 관찰하며 공감하고 적절하게 반응하는 것을 유지한다."},{"n":"5.02","en":"Demonstrates curiosity during the coaching process","ko":"코칭과정 내내 호기심을 보여준다."},{"n":"5.03","en":"Remains aware of what is emerging for self and client in the present moment","ko":"현재 순간에 자신과 고객에게 새로이 일어나고 있는 것을 지속적으로 알아차린다."},{"n":"5.04","en":"Manages one’s emotions to stay present with the client","ko":"고객과 프레즌스(현존)를 유지하기 위해 감정을 관리한다."},{"n":"5.05","en":"Demonstrates confidence in working with strong client emotions during the coaching process","ko":"코칭과정에서 고객의 강한 감정 상태에 대해 자신감 있는 태도로 함께 한다."},{"n":"5.06","en":"Is comfortable working in a space of not knowing","ko":"코치가 알지 못함의 영역을 코칭할 때도 편안하게 임한다."},{"n":"5.07","en":"Creates or allows space for silence, pause or reflection","ko":"침묵, 멈춤, 성찰을 위한 공간을 만들거나 허용한다."}]},{"n":"6","g":"C","ge":"Communicating Effectively","gk":"효과적으로 의사소통하기","en":"Listens Actively","ko":"적극적으로 경청한다","de":"Focuses on what the client is and is not saying to fully understand what is being communicated in the context of the client systems and to support client self-expression","dk":"고객의 시스템 맥락에서 전달하는 것을 충분히 이해하고, 고객의 자기표현(self-expression)을 돕기 위하여 고객이 말 한 것과 말 하지 않은 것에 초점을 맞춘다.","s":[{"n":"6.01","en":"Considers the client’s context, identity, environment, experiences, values and beliefs to enhance understanding of what the client is communicating","ko":"고객이 전달하는 것에 대한 이해를 높이기 위해 고객의 상황, 정체성, 환경, 경험, 가치 및 신념을 고려한다."},{"n":"6.02","en":"Reflects or summarizes what the client is communicating to ensure clarity and understanding","ko":"고객이 전달하고자 하는 내용에 대해 더 명확히 하고 이해하기 위해 반영하거나 요약한다."},{"n":"6.03","en":"Recognizes and inquires when there is more to what the client is communicating","ko":"고객이 소통하는 것 이면에 무언가 더 있다고 생각될 때 이것을 인식하고 질문한다."},{"n":"6.04","en":"Notices, acknowledges and explores the client’s emotions, energy shifts, non-verbal cues or other behaviors","ko":"고객의 감정, 에너지 변화, 비언어적 신호 또는 기타 행동에 대해 알아차리고, 인정하며 탐색한다."},{"n":"6.05","en":"Integrates the client’s words, tone of voice and body language to determine the full meaning of what the client is communicating","ko":"고객의 말, 음성 및 신체 언어를 통합하여 고객이 전달하는 내용의 전체 의미를 파악한다."},{"n":"6.06","en":"Notices trends in the client’s behaviors and emotions across sessions to discern themes and patterns","ko":"여러 세션에 걸친 고객의 행동과 감정의 흐름(trends)을 알아차려, 고객의 주제(theme)와 패턴(pattern)을 식별한다."}]},{"n":"7","g":"C","ge":"Communicating Effectively","gk":"효과적으로 의사소통하기","en":"Evokes Awareness","ko":"알아차림을 불러일으키다","de":"Facilitates client insight and learning by using tools and techniques such as powerful questioning, silence, metaphor or analogy","dk":"강력한 질문, 침묵, 은유(metaphor) 또는 비유(analogy)와 같은 도구와 기술을 사용하여 고객의 통찰과 학습을 촉진한다.","s":[{"n":"7.01","en":"Considers client experience when deciding what might be most useful","ko":"가장 유용한 것이 무엇인지 결정할 때 고객의 경험을 고려한다."},{"n":"7.02","en":"Challenges the client as a way to evoke awareness or insight","ko":"알아차림이나 통찰을 불러일으키기 위한 방법으로 고객에게 도전한다."},{"n":"7.03","en":"Asks questions about the client, such as their way of thinking, values, needs, wants and beliefs","ko":"고객의 사고방식, 가치, 욕구 및 원함 그리고 신념 등 고객에 대하여 질문한다."},{"n":"7.04","en":"Asks questions that help the client explore beyond current thinking","ko":"고객이 현재의 생각을 뛰어 넘어 탐색하는 데 도움이 되는 질문을 한다."},{"n":"7.05","en":"Invites the client to share more about their experience in the moment","ko":"고객이 이 순간에 경험하고 있는 것을 더 많이 공유하도록 초대한다."},{"n":"7.06","en":"Notices what is working to enhance client progress","ko":"고객의 발전(client’s progress)을 위해 무엇이 잘되고 있는지에 주목한다."},{"n":"7.07","en":"Adjusts the coaching approach in response to the client’s needs","ko":"고객의 욕구에 맞추어 코칭 접근법을 조정한다."},{"n":"7.08","en":"Helps the client identify factors that influence current and future patterns of behavior, thinking or emotion","ko":"고객이 현재와 미래의 행동, 사고 또는 감정 패턴에 영향을 미치는 요인을 식별하도록 도와준다."},{"n":"7.09","en":"Invites the client to generate ideas about how they can move forward and what they are willing or able to do","ko":"고객이 어떻게 앞으로 나아갈 수 있는지, 무엇을 하려고 하고 할 수 있는지 생각해 내도록 초대한다."},{"n":"7.10","en":"Supports the client in reframing perspectives","ko":"관점을 재구성(reframing) 할 수 있도록 고객을 지원한다."},{"n":"7.11","en":"Shares observations, knowledge, and feelings, without attachment, that have the potential to create new insights for the client","ko":"고객에게 새로운 통찰을 일으킬 가능성이 있는 관찰, 지식 및 느낌을 집착 없이 공유한다."}]},{"n":"8","g":"D","ge":"Cultivating Learning and Growth","gk":"학습과 성장 북돋우기","en":"Facilitates Client Growth","ko":"고객의 성장을 촉진한다","de":"Partners with the client to transform learning and insight into action. Promotes client autonomy in the coaching process.","dk":"고객이 학습과 통찰을 행동으로 전환할 수 있도록 협력한다. 코칭과정에서 고객의 자율성을 촉진한다.","s":[{"n":"8.01","en":"Works with the client to integrate new awareness, insight or learning into their worldview and behaviors","ko":"새로운 알아차림, 통찰, 학습을 세계관 및 행동에 통합하기 위해 고객과 협력한다."},{"n":"8.02","en":"Partners with the client to design goals, actions and accountability measures that integrate and expand new learning","ko":"새로운 학습을 통합하고 확장하기 위해 고객과 함께 고객의 목표와 행동, 그리고 책임 측정 방안(accountability measures)을 설계한다."},{"n":"8.03","en":"Acknowledges and supports client autonomy in the design of goals, actions and methods of accountability","ko":"목표, 행동 및 책임 방법을 설계하는데 있어서 고객의 자율성을 인정하고 지지한다."},{"n":"8.04","en":"Supports the client in identifying potential results or learning from identified action steps","ko":"고객이 잠재적 결과를 확인해보거나 이미 수립한 실행단계로부터 배운 것을 지지한다."},{"n":"8.05","en":"Invites the client to consider how to move forward, including resources, support and potential barriers","ko":"고객이 지닌 자원(resource), 지원(support) 및 잠재적 장애물(potential barriers)을 포함하여 어떻게 자신이 앞으로 나아 갈지에 대해 고려하도록 초대한다."},{"n":"8.06","en":"Partners with the client to summarize learning and insight within or between sessions","ko":"고객과 함께 세션에서 또는 세션과 세션 사이에서 학습하고 통찰한 것을 요약한다."},{"n":"8.07","en":"Partners with the client to integrate learning and sustain progress throughout the coaching engagement","ko":"코칭 전체 과정(coaching engagement) 전반에 걸쳐 학습을 통합하고 발전을 지속하도록 고객과 협력한다."},{"n":"8.08","en":"Acknowledges the client’s progress and successes","ko":"고객의 진전과 성공을 인정한다."},{"n":"8.09","en":"Partners with the client to close the session","ko":"고객과 협력하여 세션을 종료한다."}]}],"m":{"3":[{"n":"3.1","en":"Coach partners with the client to identify or reconfirm what the client wants to accomplish in this session","ko":"코치는 고객과 협력하여 이번 세션에서 고객이 달성하고자 하는 것을 확인하거나 재확인한다."},{"n":"3.2","en":"Coach partners with the client to define or reconfirm measure(s) of success for what the client wants to accomplish in this session","ko":"코치는 고객과 협력하여 이번 세션에서 달성하고자 하는 것의 성공 척도를 정의하거나 재확인한다."},{"n":"3.3","en":"Coach inquires about or explores what is important or meaningful to the client about what they want to accomplish in this session","ko":"코치는 고객이 이번 세션에서 달성하고자 하는 것에 대해 무엇이 중요하고 의미 있는지 묻거나 탐색한다."},{"n":"3.4","en":"Coach partners with the client to define what the client believes they need to address to achieve what they want to accomplish in this session","ko":"코치는 고객과 협력하여, 원하는 것을 이루기 위해 고객이 다뤄야 한다고 믿는 것을 정의한다."}],"4":[{"n":"4.1","en":"Coach acknowledges and respects the client’s unique talents, insights, and work in the coaching process","ko":"코치는 고객의 고유한 재능, 통찰, 코칭 과정에서의 노력을 인정하고 존중한다."},{"n":"4.2","en":"Coach shows support, empathy, or concern for the client","ko":"코치는 고객에 대한 지지, 공감 또는 염려를 보인다."},{"n":"4.3","en":"Coach acknowledges and supports the client’s expression of feelings, perceptions, concerns, beliefs, or suggestions","ko":"코치는 고객의 감정, 인식, 우려, 신념 또는 제안의 표현을 인정하고 지지한다."},{"n":"4.4","en":"Coach partners with the client by inviting the client to respond in any way to the coach’s contributions and accepts the client’s response","ko":"코치는 코치의 기여에 고객이 어떤 식으로든 반응하도록 초대하고 그 반응을 받아들이며 파트너십을 맺는다."}],"5":[{"n":"5.1","en":"Coach acts in response to the whole person of the client (the who)","ko":"코치는 고객이라는 전인적 존재(Who)에 반응하여 행동한다."},{"n":"5.2","en":"Coach acts in response to what the client wants to accomplish throughout this session (the what)","ko":"코치는 이번 세션 내내 고객이 달성하고자 하는 것(What)에 반응하여 행동한다."},{"n":"5.3","en":"Coach partners with the client by supporting the client to choose what happens in this session","ko":"코치는 이번 세션에서 일어날 일을 고객이 선택하도록 지원하며 파트너십을 맺는다."},{"n":"5.4","en":"Coach demonstrates curiosity to learn more about the client","ko":"코치는 고객에 대해 더 알고자 하는 호기심을 보인다."},{"n":"5.5","en":"Coach allows for silence, pause, or reflection","ko":"코치는 침묵, 멈춤 또는 성찰을 허용한다."}],"6":[{"n":"6.1","en":"Coach’s questions and observations are customized by using what the coach has learned about who the client is or the client’s situation","ko":"코치의 질문과 관찰은 고객이 누구인지, 고객의 상황에 대해 배운 것을 활용해 맞춤화된다."},{"n":"6.2","en":"Coach inquires about or explores the words the client uses","ko":"코치는 고객이 사용하는 단어를 묻거나 탐색한다."},{"n":"6.3","en":"Coach inquires about or explores the client’s emotions","ko":"코치는 고객의 감정을 묻거나 탐색한다."},{"n":"6.4","en":"Coach explores the client’s energy shifts, nonverbal cues, or other behaviors","ko":"코치는 고객의 에너지 변화, 비언어적 단서 또는 기타 행동을 탐색한다."},{"n":"6.5","en":"Coach inquires about or explores how the client currently perceives themself or their world","ko":"코치는 고객이 현재 자신과 자신의 세계를 어떻게 인식하는지 묻거나 탐색한다."},{"n":"6.6","en":"Coach allows the client to complete speaking without interrupting unless there is a stated coaching purpose to do so","ko":"코치는 명시된 코칭 목적이 없는 한, 고객이 말을 끝낼 때까지 끊지 않는다."},{"n":"6.7","en":"Coach succinctly reflects or summarizes what the client communicated to ensure the client’s clarity and understanding","ko":"코치는 고객의 명확성과 이해를 위해 고객이 전달한 것을 간결하게 반영하거나 요약한다."}],"7":[{"n":"7.1","en":"Coach asks questions about the client, such as their current way of thinking, feeling, values, needs, wants, beliefs, or behavior","ko":"코치는 현재의 사고방식, 감정, 가치, 욕구, 바람, 신념, 행동 등 고객에 대해 질문한다."},{"n":"7.2","en":"Coach asks questions to help the client explore beyond the client’s current thinking or feeling to new or expanded ways of thinking or feeling about themself (the who)","ko":"코치는 고객이 현재의 사고·감정을 넘어 자신(Who)에 대한 새롭고 확장된 방식으로 탐색하도록 질문한다."},{"n":"7.3","en":"Coach asks questions to help the client explore beyond the client’s current thinking or feeling to new or expanded ways of thinking or feeling about their situation (the what)","ko":"코치는 고객이 현재의 사고·감정을 넘어 자신의 상황(What)에 대한 새롭고 확장된 방식으로 탐색하도록 질문한다."},{"n":"7.4","en":"Coach asks questions to help the client explore beyond current thinking, feeling, or behaving toward the outcome the client desires","ko":"코치는 고객이 원하는 결과를 향해 현재의 사고·감정·행동을 넘어 탐색하도록 질문한다."},{"n":"7.5","en":"Coach shares — with no attachment — observations, intuitions, comments, thoughts, or feelings, and invites the client’s exploration through verbal or tonal invitation","ko":"코치는 집착 없이 관찰, 직관, 의견, 생각, 느낌을 나누고 언어나 어조로 고객의 탐색을 초대한다."},{"n":"7.6","en":"Coach asks clear, direct, primarily open-ended questions, one at a time, at a pace that allows for thinking, feeling, or reflection by the client","ko":"코치는 명확하고 직접적이며 주로 개방형인 질문을 한 번에 하나씩, 고객이 생각·느낌·성찰할 수 있는 속도로 한다."},{"n":"7.7","en":"Coach uses language that is generally clear and concise","ko":"코치는 대체로 명확하고 간결한 언어를 사용한다."},{"n":"7.8","en":"Coach allows the client to do most of the talking","ko":"코치는 고객이 대부분의 이야기를 하도록 허용한다."}],"8":[{"n":"8.1","en":"Coach invites or allows the client to explore progress toward what the client wanted to accomplish in this session","ko":"코치는 이번 세션에서 고객이 원했던 것을 향한 진전을 탐색하도록 초대하거나 허용한다."},{"n":"8.2","en":"Coach invites the client to state or explore the client’s learning in this session about themself (the who)","ko":"코치는 고객이 이번 세션에서 자신(Who)에 대해 배운 것을 말하거나 탐색하도록 초대한다."},{"n":"8.3","en":"Coach invites the client to state or explore the client’s learning in this session about their situation (the what)","ko":"코치는 고객이 이번 세션에서 자신의 상황(What)에 대해 배운 것을 말하거나 탐색하도록 초대한다."},{"n":"8.4","en":"Coach invites the client to consider how they will use new learning from this coaching session","ko":"코치는 고객이 이번 코칭에서 얻은 새로운 학습을 어떻게 활용할지 생각하도록 초대한다."},{"n":"8.5","en":"Coach partners with the client to design post-session thinking, reflection, or action","ko":"코치는 고객과 협력하여 세션 이후의 사고, 성찰 또는 행동을 설계한다."},{"n":"8.6","en":"Coach partners with the client to consider how to move forward, including resources, support, or potential barriers","ko":"코치는 자원, 지원, 잠재적 장애물을 포함해 앞으로 나아갈 방법을 고객과 함께 고려한다."},{"n":"8.7","en":"Coach partners with the client to design the best methods of accountability for themself","ko":"코치는 고객이 자신에게 맞는 최선의 책무(accountability) 방법을 설계하도록 협력한다."},{"n":"8.8","en":"Coach celebrates the client’s progress and learning","ko":"코치는 고객의 진전과 학습을 축하한다."},{"n":"8.9","en":"Coach partners with the client on how they want to complete this session","ko":"코치는 고객이 이번 세션을 어떻게 마무리하고 싶은지 함께 정한다."}]},"e":[{"n":"CV","en":"ICF Core Values (Part 3)","ko":"ICF 핵심 가치 (제3부)","s":[{"n":"PRO","en":"Professionalism: We commit to a coaching mindset and professional quality that encompasses responsibility, respect, integrity, competence and excellence.","ko":"전문직업의식: 우리는 책임감, 존중, 정직성, 역량 및 우수성을 포괄하는 코칭 마인드셋과 전문적인 품질을 약속한다."},{"n":"COL","en":"Collaboration: We commit to develop social connection and community building.","ko":"협동: 우리는 사회적 연결과 공동체 구축을 발전시키는 데 헌신한다."},{"n":"HUM","en":"Humanity: We commit to being humane, kind, compassionate and respectful toward others.","ko":"인간성: 우리는 타인에 대해 인도적이고 친절하며, 공감하며 존중하는 태도를 약속한다."},{"n":"EQU","en":"Equity: We commit to use a coaching mindset to explore and understand the needs of others so we can practice equitable processes at all times that create equality for all.","ko":"형평: 우리는 코칭 마인드셋을 활용하여 타인의 요구를 탐색하고 이해함으로써 항상 모두의 형평성을 위한 공정한 프로세스를 실천하기 위해 최선을 다한다."}]},{"n":"S1","en":"Section 1: Agreements for Client and/or Sponsor Engagement","ko":"제1절: 고객·스폰서 참여를 위한 합의","s":[{"n":"1.1","en":"Communicate (before coaching begins) with coaching client(s), sponsor(s), and/or other involved parties to explain the nature of coaching and to co-create a coaching agreement regarding roles, responsibilities, confidentiality, financial arrangements, and other aspects.","ko":"코칭 시작 전에 고객·스폰서·직접 관계된 이해당사자와 소통하여 코칭의 본질을 설명하고, 역할·책임·비밀보장·재정 조건 등 코칭 합의를 공동으로 수립한다."},{"n":"1.2","en":"Respect all parties’ right to terminate the coaching relationship at any point for any reason during the coaching engagement, subject to the provisions of the agreement.","ko":"코칭 기간 중 합의 조항의 범위 안에서, 모든 당사자가 어떤 이유로든 언제든 코칭 관계를 종료할 수 있는 권리를 존중한다."}]},{"n":"S2","en":"Section 2: Confidentiality and Legal Compliance","ko":"제2절: 비밀보장 및 법규 준수","s":[{"n":"2.1","en":"Maintain the strictest level of confidentiality with all parties involved, regardless of the role I am fulfilling.","ko":"내가 수행하는 역할과 관계없이 모든 관련자에 대해 최고 수준의 비밀보장을 유지한다."},{"n":"2.2","en":"Have a clear agreement about what information is exchanged and how it is exchanged among all parties involved during all coaching engagements.","ko":"모든 코칭 과정에서 관련자 간에 어떤 정보를 어떻게 교환할지 명확히 합의한다."},{"n":"2.3","en":"Have a clear agreement with client(s), sponsor(s), and other involved parties about what confidential information may need to be disclosed to the appropriate authorities (illegal activity, valid court order/subpoena, or imminent risk of harm).","ko":"불법 행위, 유효한 법원 명령·소환장, 자신 또는 타인에 대한 임박한 위험 등 당국에 공개해야 할 수 있는 비밀 정보의 범위를 고객·스폰서·관련자와 명확히 합의한다."},{"n":"2.4","en":"Maintain, store, and dispose of any records, including electronic files and communications, in a manner that promotes confidentiality, security, and privacy, and complies with applicable laws.","ko":"전자 파일과 통신을 포함한 모든 기록을 비밀·보안·사생활을 지키고 관련 법과 합의에 맞게 보관·관리·폐기한다."},{"n":"2.5","en":"Fulfill my ethical and legal obligations to my coaching client(s), sponsor(s), colleagues, and to the public at large directly and through any technology systems I may utilize (i.e. technology-assisted coaching tools, databases, platforms, software, and artificial intelligence).","ko":"코칭 고객·스폰서·동료 및 일반 대중에 대한 윤리적·법적 의무를 직접 이행하고, 코칭 지원 도구·데이터베이스·플랫폼·소프트웨어·인공지능 등 사용하는 모든 기술 시스템을 통해서도 이행한다."},{"n":"2.6","en":"Am responsible for my support personnel’s adherence to the relevant standards of the Code of Ethics.","ko":"나의 지원 인력이 윤리강령의 관련 기준을 준수하도록 할 책임을 진다."},{"n":"2.7","en":"Maintain the privacy of ICF professionals and use of their contact information (email addresses, telephone numbers, and so on) only as authorized by ICF or the ICF professional.","ko":"ICF 전문가의 개인정보를 보호하고, 이메일 주소·전화번호 등 연락처 정보는 ICF 또는 해당 ICF 전문가가 승인한 경우에만 사용한다."},{"n":"2.8","en":"Comply with copyright laws and recognize and honor the contributions and intellectual property of others, only claiming ownership of my own material.","ko":"저작권법을 준수하고 타인의 기여와 지식재산권을 인정·존중하며, 자신이 직접 만든 자료에 대해서만 소유권을 주장한다."}]},{"n":"S3","en":"Section 3: Professional Conduct and Conflicts of Interest","ko":"제3절: 전문가 행동과 이해상충","s":[{"n":"3.1","en":"Am aware of and discuss with all involved parties the implications of having multiple agreements and relationships, and the potential for conflicts of interest.","ko":"복수의 합의·관계가 갖는 함의와 이해상충 가능성을 인식하고 모든 관련자와 논의한다."},{"n":"3.2","en":"Manage conflicts of interest and potential conflicts of interest with coaching client(s) and sponsor(s) through self-reflection, coaching agreement(s), and ongoing dialogue.","ko":"이해상충 및 잠재적 이해상충을 자기성찰, 코칭 합의, 지속적 대화로 관리한다."},{"n":"3.3","en":"Resolve any conflict of interest or potential conflict of interest by working through the issue with relevant parties, seeking professional assistance, or suspending or ending the professional relationship.","ko":"이해상충을 관련자와 함께 해결하거나, 전문적 도움을 구하거나, 전문적 관계를 중단·종료하여 해소한다."},{"n":"3.4","en":"Hold responsibility for being aware of and setting clear, appropriate, and culturally sensitive boundaries that govern professional interactions, physical or otherwise.","ko":"신체적이든 그 외든 전문적 상호작용을 규율하는 명확하고 적절하며 문화적으로 민감한 경계를 인식하고 설정할 책임을 진다."},{"n":"3.5","en":"Maintain fairness by being aware of my biases and addressing them so that I do not discriminate toward others based on race, color, gender identity, sexual orientation, socio-economic status, age, spiritual practice, ability, and other groups, classes, and categories of human differences.","ko":"자신의 편향을 인식하고 이를 다룸으로써 인종·피부색·성별 정체성·성적 지향·사회경제적 지위·연령·영적 실천·능력 및 그 밖의 인간 차이에 따른 집단·계층·범주를 이유로 타인을 차별하지 않도록 공정성을 유지한다."},{"n":"3.6","en":"Am mindful of the level of intimacy in the coaching relationship. I do not participate in any sexual or romantic relationship with client(s) or sponsor(s). If I detect a shift in the relationship, I take appropriate action to address the issue or cancel the coaching engagement.","ko":"코칭 관계에서 친밀감의 수준을 유념한다. 고객 또는 스폰서와 성적·낭만적 관계를 맺지 않는다. 관계의 변화가 감지되면 해당 문제를 다루기 위한 적절한 조치를 취하거나 코칭 관계를 종료한다."},{"n":"3.7","en":"Understand that ICF professionals often serve in multiple professional roles (mentor, therapist, HR specialist, assessor), and it is my responsibility to disclose to the client when I am acting in a capacity other than an ICF professional.","ko":"ICF 전문가는 멘토, 치료사, 인사 전문가, 평가자 등 여러 역할을 수행할 수 있으므로, ICF 전문가가 아닌 자격으로 행동할 때는 고객에게 공개할 책임이 있다."},{"n":"3.8","en":"Disclose to Client(s) the information of compensation and benefits that have been paid/received or will be paid/received for referrals.","ko":"의뢰·소개에 대해 이미 지급·수령했거나 앞으로 지급·수령할 보수와 혜택 정보를 고객에게 공개한다."}]},{"n":"S4","en":"Section 4: Commitment to Delivering Consistent Value","ko":"제4절: 일관된 가치 제공에 대한 헌신","s":[{"n":"4.1","en":"Am aware of and, in partnership with my client, actively manage any power or status differential between us that may be caused by cultural, relational, psychological, or contextual issues.","ko":"문화적·관계적·심리적·맥락적 요인으로 생길 수 있는 나와 고객 사이의 권력·지위 차이를 인식하고, 고객과 협력하여 적극적으로 관리한다."},{"n":"4.2","en":"Recognize my personal limitations or circumstances that may impair my coaching performance or professional commitments. I will seek support if necessary, including relevant professional guidance.","ko":"코칭 수행이나 전문적 약속을 저해할 수 있는 개인적 한계나 상황을 인식하고, 필요하면 전문적 지도 등 지원을 구한다."},{"n":"4.3","en":"Remain alert to indications that there might be a shift in the value received from the coaching relationship and discuss this with the client. If appropriate, explore changes or referral.","ko":"코칭 관계에서 고객이 받는 가치가 달라졌다는 징후에 주의를 기울이고 고객과 논의한다. 적절하면 관계 변경이나 다른 전문가 연계를 탐색한다."}]},{"n":"S5","en":"Section 5: Professional Integrity and Accountability","ko":"제5절: 전문적 진실성과 책임","s":[{"n":"5.1","en":"Accurately identify my coaching qualifications and work within the boundaries of my level of coaching competency, expertise, experience, training, certifications, and my ICF credential.","ko":"코칭 자격을 정확히 밝히고, 코칭 역량·전문성·경험·교육·자격증·ICF 자격 수준의 범위 안에서 일한다."},{"n":"5.2","en":"Make verbal and written statements that are true and accurate about what I offer as an ICF professional, what is offered by ICF, the coaching profession, and the potential value of coaching.","ko":"ICF 전문가로서 내가 제공하는 것, ICF가 제공하는 것, 코칭 직업, 코칭의 잠재적 가치에 대해 구두·서면으로 사실에 맞고 정확하게 진술한다."},{"n":"5.3","en":"Adhere to the philosophy of “doing good” versus “avoiding bad,” recognizing the impact of my professional conduct on my clients, stakeholders, the coaching profession, and society.","ko":"“나쁨을 피하는 것”보다 “좋음을 행하는 것”의 철학을 따르며, 내 전문적 행동이 고객·이해관계자·코칭 직업·사회에 미치는 영향을 인식한다."}]}],"g":[{"k":"Accountability / 책임","ko":"코칭 과정에서 합의된 약속과 행동을 이행할 책임.","en":"The responsibility to follow through on commitments and actions agreed upon during the coaching process."},{"k":"Agreement / 합의","ko":"ICF 전문가와 고객(들)/스폰서(들) 간에 체결되는 공식 문서로, 코칭 관계의 조건, 기대, 규정을 명시함.","en":"A formal document established between an ICF professional and the client(s)/sponsor(s) that outlines the terms, expectations, and conditions of their coaching relationship."},{"k":"Analogy / 비유","ko":"두 사물을 비교하여 유사성을 드러내는 방식으로 개념, 과정, 상황을 설명하거나 명확히 하기 위해 사용됨.","en":"A comparison between two things that highlights similarities between them, often to explain or clarify a concept, process, or situation."},{"k":"Autonomy / 자율성","ko":"고객이 자신의 가치와 신념에 따라 독립적으로 결정하고 행동할 수 있는 능력.","en":"The client's ability to make independent decisions and take actions based on their own values and beliefs."},{"k":"Beliefs / 신념","ko":"고객이 자신, 타인, 세상을 바라보는 방식을 형성하는 개인적 확신, 가정, 해석.","en":"Personal convictions, assumptions, and interpretations that shape how a client sees themselves, others, and the world."},{"k":"Bias / 편향","ko":"내면화된 신념, 가치, 선호, 문화적 가정에 의해 형성된 지각·해석·판단의 차이로 특정 대상에 대한 치우침을 낳을 수 있음.","en":"A difference in the perception, interpretation, or judgment-shaped by internalized beliefs, values, preferences, and cultural assumptions that can result in an inclination for or against an idea, object, group, or individual."},{"k":"Body Language / 신체 언어","ko":"몸짓, 표정, 자세를 통한 비언어적 의사소통으로, 고객의 감정과 태도에 대한 직관을 제공할 수 있음.","en":"Non-verbal communication through gestures, facial expressions, and posture, which can provide insights into a client's feelings and attitudes."},{"k":"Challenges / 도전","ko":"고객의 습관적 패턴, 가정, 서사를 전환시키기 위해 코치가 제공하는 사고 촉발적 개입.","en":"Thought-provoking interventions offered by the coach to disrupt the client's habitual patterns, assumptions, or narratives."},{"k":"Client / 고객","ko":"코칭을 받는 개인·팀·그룹 구성원, 코칭·멘토링·슈퍼비전을 받는 코치, 혹은 훈련 중인 코치.","en":"The individual, team, or group member being coached, the coach being coached, mentored, or supervised, or the coach in training."},{"k":"Client Systems / 고객 시스템","ko":"고객의 삶과 의사결정에 영향을 주는 관계와 환경의 네트워크.","en":"The network of relationships and environments that influence the client's life and decisions."},{"k":"Coach Supervisor / 코치 슈퍼바이저","ko":"개인적, 직업적, 윤리적 발전 및 학습을 위해 코치(또는 코치 그룹)와 성찰적 대화 및 협력 과정에 참여하는 숙련된 코치.","en":"An experienced coach who engages in reflective dialogue and a collaborative process with a coach (or group of coaches) for personal, professional, and ethical development and learning."},{"k":"Coaching Approach / 코칭 접근(법)","ko":"고객의 성장과 발전을 촉진하기 위해 코치가 사용하는 구체적 방법과 기법.","en":"The specific methods and techniques used by a coach to facilitate client growth and development."},{"k":"Coaching Engagement / 코칭 전체 과정","ko":"ICF 전문가와 고객(들)/스폰서(들) 간의 구조화된 상호작용으로, 초기 진단, 목표 설정, 정기 세션, 진척 점검, 성과 평가를 포함한 전체 코칭 과정.","en":"The structured interaction between an ICF professional and the client(s)/sponsor(s) encompassing the entire coaching process."},{"k":"Coaching Philosophy / 코칭 철학","ko":"코치의 코칭과 고객과의 상호작용을 이끄는 기본 이론, 신념, 원칙들.","en":"The underlying theory, beliefs and principles, that guide a coach's practice and interactions with clients."},{"k":"Coaching Relationship / 코칭 관계","ko":"ICF 전문가와 고객(들)/스폰서(들) 간의 합의나 계약에 의해 수립된 관계로, 각자의 책임과 기대를 정의함.","en":"A relationship that is established by the ICF Professional and the Client(s)/Sponsor(s) under an agreement or a contract that defines the responsibilities and expectations of each party."},{"k":"Confidentiality / 비밀보장","ko":"법적 이유나 의무, 위해 위협, 고객의 서면 동의가 있는 경우를 제외하고, 코칭 관계에서 취득한 정보를 보호하는 것.","en":"The protection of any information obtained in or around the coaching relationship unless there is a legal reason or requirement, a threat of harm, or written consent to release is given by the client."},{"k":"Context / 맥락","ko":"개인이 자신, 타인, 세상을 이해하는 방식을 형성하는 상황, 경험, 문화, 정체성, 환경, 세계관의 고유한 조합.","en":"The unique combination of circumstances, experiences, culture, identity, environment, and worldview that shape how a person understands themselves, others, and the world."},{"k":"Culture / 문화","ko":"집단의 공유된 가치, 신념, 언어, 의사소통, 규범 및 관습으로, 하나의 공동체로서 집단을 규정하며 행동과 의사결정에 영향을 미치는 요소.","en":"The shared values, beliefs, language, communication, norms, and practices of a group that help define them as a collective and which influence behavior and decision-making."},{"k":"Empathy / 공감","ko":"타인의 감정을 이해하고 함께 느끼는 능력.","en":"The ability to understand and share the feelings of another person."},{"k":"Energy Shifts / 에너지 변화","ko":"고객의 감정적·신체적 에너지 수준의 변화로, 코칭 참여와 진전에 영향을 줄 수 있음.","en":"Changes in a client's emotional or physical energy levels, which can impact their engagement and progress in coaching."},{"k":"Environment / 환경","ko":"고객의 경험과 의사결정에 영향을 주는 물리적·사회적 환경.","en":"The physical and social surroundings that affect a client's experiences and decisions."},{"k":"Experiences / 경험","ko":"고객의 인식, 신념, 행동을 형성하는 사건들과 상호작용들.","en":"The events and interactions that shape a client's perceptions, beliefs and behaviors."},{"k":"Grounded / 중심이 잡힌","ko":"안정적이고 중심이 잡혀 있는 상태를 의미하며, 종종 코치가 세션 동안 침착함과 집중력을 유지하는 능력을 설명할 때 사용됨.","en":"Being stable and centered, often referring to a coach's ability to remain calm and focused during sessions."},{"k":"Helping/Support Professions / 지원·조력 전문직","ko":"상담, 심리치료, 사회복지 등 개인에게 도움과 지원을 제공하는 분야로, 때때로 코칭과 일부 영역이 겹칠 수 있음.","en":"Fields such as counseling, therapy, and social work that provide assistance and support to individuals, sometimes overlapping with coaching practices."},{"k":"Identity / 정체성","ko":"고객의 자기 인식(가치, 신념, 문화적 배경, 역할, 살아온 경험, 성격 포함) 및 세상 속에서 자신을 인지하고 규정하는 방식.","en":"The client's sense of self, including their values, beliefs, cultural background, roles, lived experiences, personality, and the ways they see and define themselves in the world."},{"k":"Insights / 통찰","ko":"코칭 과정에서 발생하는 새로운 이해 또는 깨달음으로, 개인적 성장을 이끌어내는 것.","en":"New understandings or realizations that emerge during the coaching process, leading to personal growth."},{"k":"Knowledge / 지식","ko":"학습, 관찰, 수행, 직접 경험을 통해 습득한 정보 및 기술.","en":"Information or skills, gained through study, observation, practice, or direct experience."},{"k":"Manage One's Emotions / 자신의 감정 관리","ko":"자신의 감정적 반응을 인식하고 이해하며, 건강하고 의도적인 방식으로 다루는 능력.","en":"The ability to recognize, understand, and navigate one's emotional responses in a healthy and intentional way."},{"k":"Measure of Success / 성공 척도","ko":"코칭 과정의 효과성과 성과를 평가하는 기준.","en":"Criteria used to evaluate the effectiveness and outcomes of the coaching process."},{"k":"Mentor Coach / 멘토 코치","ko":"관찰 또는 녹음된 코칭 세션을 기반으로 피드백을 제공함으로써, 다른 코치가 ICF 핵심역량에 부합하는 고유한 코칭 스타일과 기술을 발전시키도록 돕는 협력적 학습 과정을 제공하는 숙련된 코치.","en":"An experienced coach who provides a collaborative learning process through which feedback is provided to another coach based on observed or recorded coaching sessions, to further develop their unique coaching style and skills in alignment with the ICF Core Competencies."},{"k":"Metaphor / 은유","ko":"한 사물을 다른 사물에 빗대어 표현함으로써 암시적인 비교를 만들어내는 수사법. 코칭에서는 고객이 자신의 경험, 감정, 상황을 보다 친숙하거나 생생한 개념에 연결시켜 이해하도록 돕기 위해 사용됨.","en":"A figure of speech in which one thing is described as another, creating an implicit comparison."},{"k":"Observations / 관찰","ko":"고객의 행위와 상호작용 속에서 드러나는 행동 및 패턴을 인지하고 해석하는 행위.","en":"The act of noticing and interpreting behaviors and patterns in a client's actions and interactions."},{"k":"Partners (with)/Partnering / 파트너·파트너링","ko":"코칭 과정에서 고객의 자율성을 지지하고, 격려하며, 존중하면서 공동의 고객 중심 목표를 향해 협력적으로 함께 일하는 코치와 고객.","en":"Coach and client working collaboratively toward a common, client-centered goal which supports, encourages, and honors the client's autonomy in the coaching process."},{"k":"Perceptions / 인식","ko":"고객이 자신의 경험과 환경을 해석하고 이해하는 방식.","en":"The way clients interpret and understand their experiences and surroundings."},{"k":"Powerful Questioning / 강력한 질문","ko":"고객의 깊은 사고와 성찰을 자극하기 위해, 사고 촉진 질문을 활용하는 것.","en":"The use of thought-provoking questions to stimulate deeper thinking and reflection in clients."},{"k":"Presence / 프레즌스","ko":"세션 동안 고객에게 온전히 주의를 기울이고 몰입하는 코치의 능력.","en":"The coach's ability to be fully attentive and engaged with the client during sessions."},{"k":"Progress / 발전·진전","ko":"코칭 과정을 통해 고객의 목표 달성 및 성장에서 이루어지는 발전 또는 향상.","en":"The advancement or improvement in a client's goals and development through the coaching process."},{"k":"Reflective Practice / 성찰적 실천","ko":"코칭 기술과 효과성을 개선하기 위해 자신의 경험으로부터 스스로를 살피고 배우는 과정.","en":"The process of self-examination and learning from one's experiences to improve coaching skills and effectiveness."},{"k":"Reframing Perspective / 관점 재구성","ko":"고객이 상황, 신념, 경험을 새로운 방식으로 바라보도록 지원하여, 새로운 의미, 통찰 또는 가능성을 발견할 수 있도록 돕는 것.","en":"Supporting the client to see a situation, belief, or experience in a new way, so they can discover new meaning, insight, or possibilities."},{"k":"Session / 세션","ko":"코치와 고객이 코칭 대화를 나누는 시간.","en":"A period of time when a coach and client have a coaching conversation."},{"k":"Sponsor / 스폰서","ko":"제공될 코칭 서비스의 비용을 지불하고/하거나, 해당 서비스를 준비하거나 그 내용을 규정하는 기관(그 대표자 포함) 또는 개인. 미성년자에 대한 법적 보호자도 이에 해당함.","en":"The entity (including its representatives) or individual paying for and/or arranging or defining the coaching services to be provided."},{"k":"Stakeholder / 이해관계자","ko":"고객의 코칭 진전에 이해관계를 가진 조직 내 개인.","en":"An individual, usually within an organization, who has an interest in a client's progress through coaching."},{"k":"Strong Client Emotion / 강한 고객 감정","ko":"코칭 세션 중 고객이 표현하는 강렬한 정서적 반응이나 경험.","en":"Intense emotional responses or experiences expressed by the client during a coaching session."},{"k":"Style / 스타일","ko":"코치가 고객과 상호작용하고 세션을 진행하는 독특한 방식.","en":"The unique manner in which a coach interacts with clients and conducts sessions."},{"k":"Success / 성공","ko":"코칭 과정을 통해 목표와 긍정적 결과들을 성취하는 것.","en":"The achievement of goals and positive outcomes through the coaching process."},{"k":"Technology / 기술","ko":"코치들이 코칭 프로세스를 향상시키기 위해 사용하는 도구, 플랫폼, 시스템. 디지털 코칭 플랫폼, 셀프코칭 앱, 화상회의 도구, AI 시스템 등을 포함함.","en":"Tools, platforms, and systems used by coaches to enhance the coaching process."},{"k":"Value or Values / 가치","ko":"개인의 행동과 의사결정에 지침이 되는 원칙과 기준.","en":"The principles and standards that guide a person's behavior and decision-making."},{"k":"Well-Being / 웰빙","ko":"회복력, 긍정적 감정, 삶의 도전에 효과적으로 대처하는 능력을 포괄하는, 개인의 정서적·심리적 건강 및 행복 상태.","en":"A person's emotional and psychological state of overall health and happiness, encompassing resilience, positive emotions, and effective coping with life's challenges."},{"k":"Without Attachment / 집착하지 않기","ko":"특정 결과에 과도하게 몰두하지 않으면서, 유연성과 개방성을 허용하는 자세.","en":"The practice of engaging in the coaching process without being overly invested in specific outcomes, allowing for flexibility and openness."},{"k":"Worldview / 세계관","ko":"개인이 세상을 바라보고 해석하는 전반적인 관점으로, 신념, 가치 및 행동에 영향을 미침.","en":"The overall perspective from which a person sees and interprets the world, influencing their beliefs, values, and actions."}],"gk":{"A":"기초세우기","B":"관계의 공동구축","C":"효과적으로 의사소통하기","D":"학습과 성장 북돋우기"},"e20":[{"n":"20-I","en":"Section I – Responsibility to Clients","ko":"제I절 – 고객에 대한 책임","s":[{"n":"20-1","en":"Explain and ensure that, prior to or at the initial meeting, my coaching Client(s) and Sponsor(s) understand the nature and potential value of coaching, the nature and limits of confidentiality, financial arrangements, and any other terms of the coaching agreement.","ko":"초기 미팅 전 또는 미팅 시 고객과 스폰서가 코칭의 본질과 잠재적 가치, 비밀보장의 성격과 한계, 재정 조건 및 그 밖의 코칭 합의 조건을 이해하도록 설명하고 확인한다."},{"n":"20-2","en":"Create an agreement / contract regarding the roles, responsibilities and rights of all parties involved with my Client(s) and Sponsor(s) prior to the commencement of services.","ko":"서비스를 시작하기 전에 고객 및 스폰서와 관련된 모든 당사자의 역할·책임·권리에 관한 합의서 또는 계약서를 작성한다."},{"n":"20-3","en":"Maintain the strictest levels of confidentiality with all parties as agreed upon. I am aware of and agree to comply with all applicable laws that pertain to personal data and communications.","ko":"합의한 바에 따라 모든 당사자에 대해 최고 수준의 비밀보장을 유지한다. 개인정보와 통신에 적용되는 모든 관련 법률을 인지하고 준수한다."},{"n":"20-4","en":"Have a clear understanding about how information is exchanged among all parties involved during all coaching interactions.","ko":"모든 코칭 상호작용에서 관련 당사자 간 정보가 어떻게 교환되는지 명확히 이해한다."},{"n":"20-5","en":"Have a clear understanding with both Clients and Sponsors or interested parties about the conditions under which information will not be kept confidential (e.g., illegal activity, if required by law, pursuant to valid court order or subpoena; imminent or likely risk of danger to self or others; etc.). Where I reasonably believe one of the above circumstances is applicable, I may need to inform appropriate authorities.","ko":"고객·스폰서 또는 이해관계자와 정보가 비밀로 유지되지 않을 수 있는 조건(불법 행위, 법률상 요구, 유효한 법원 명령·소환장, 자신 또는 타인에게 임박했거나 발생 가능성이 높은 위험 등)을 명확히 이해한다. 그러한 상황에 해당한다고 합리적으로 판단하면 적절한 당국에 알릴 필요가 있을 수 있다."},{"n":"20-6","en":"When working as an Internal Coach, manage conflicts of interest or potential conflicts of interest with my coaching Client(s) and Sponsor(s) through coaching agreement(s) and ongoing dialogue. This should include addressing organizational roles, responsibilities, relationships, records, confidentiality and other reporting requirements.","ko":"조직 내부 코치로 일할 때 코칭 합의와 지속적인 대화를 통해 고객 및 스폰서와의 이해상충 또는 잠재적 이해상충을 관리한다. 여기에는 조직 내 역할·책임·관계·기록·비밀보장 및 기타 보고 요건을 다루는 것이 포함된다."},{"n":"20-7","en":"Maintain, store and dispose of any records, including electronic files and communications, created during my professional interactions in a manner that promotes confidentiality, security and privacy, and complies with any applicable laws and agreements. Furthermore, I see to make proper use of emerging and growing technological developments that are being used in coaching services (technology-assisted coaching services) and to be aware of how various ethical standards apply to them.","ko":"전문적 상호작용 중 생성된 전자 파일과 통신을 포함한 모든 기록을 비밀보장·보안·개인정보 보호를 증진하고 관련 법률과 합의를 준수하는 방식으로 관리·보관·폐기한다. 또한 코칭 서비스에 활용되는 새로운 기술 발전을 적절히 사용하고 관련 윤리 기준의 적용을 인식한다."},{"n":"20-8","en":"Remain alert to indications that there might be a shift in the value received from the coaching relationship. If so, make a change in the relationship or encourage the Client(s) / Sponsor(s) to seek another coach, seek another professional or use a different resource.","ko":"코칭 관계에서 얻는 가치가 달라질 수 있다는 징후에 주의를 기울인다. 변화가 감지되면 관계를 조정하거나 고객·스폰서가 다른 코치, 다른 전문가 또는 다른 자원을 찾도록 권한다."},{"n":"20-9","en":"Respect all parties’ right to terminate the coaching relationship at any point for any reason during the coaching process subject to the provisions of the agreement.","ko":"합의서 조항에 따르는 범위에서 코칭 과정 중 모든 당사자가 어떤 이유로든 언제든 코칭 관계를 종료할 권리를 존중한다."},{"n":"20-10","en":"Am sensitive to the implications of having multiple contracts and relationships with the same Client(s) and Sponsor(s) at the same time in order to avoid conflict of interest situations.","ko":"이해상충 상황을 피하기 위해 동일한 고객 및 스폰서와 동시에 여러 계약과 관계를 맺는 것의 함의를 민감하게 인식한다."},{"n":"20-11","en":"Am aware of and actively manage any power or status difference between the Client and me that may be caused by cultural, relational, psychological or contextual issues.","ko":"문화적·관계적·심리적·맥락적 요인으로 발생할 수 있는 고객과 나 사이의 권력 또는 지위 차이를 인식하고 적극적으로 관리한다."},{"n":"20-12","en":"Disclose to my Clients the potential receipt of compensation and other benefits I may receive for referring my Clients to third parties.","ko":"고객을 제3자에게 소개함으로써 내가 받을 수 있는 보수 및 기타 혜택을 고객에게 공개한다."},{"n":"20-13","en":"Assure consistent quality of coaching regardless of the amount or form of agreed compensation in any relationship.","ko":"어떤 관계에서도 합의된 보수의 금액이나 형태와 관계없이 일관된 코칭 품질을 보장한다."}]},{"n":"20-II","en":"Section II – Responsibility to Practice and Performance","ko":"제II절 – 실천과 수행에 대한 책임","s":[{"n":"20-14","en":"Adhere to the ICF Code of Ethics in all my interactions. When I become aware of a possible breach of the Code by myself or I recognize unethical behavior in another ICF Professional, I respectfully raise the matter with those involved. If this does not resolve the matter, I refer to a formal authority (e.g., ICF Staff) for resolution.","ko":"모든 상호작용에서 ICF 윤리강령을 준수한다. 자신이 강령을 위반했을 가능성을 알게 되거나 다른 ICF 전문가의 비윤리적 행동을 인지하면 관련자에게 정중히 문제를 제기한다. 해결되지 않으면 ICF 직원 등 공식 기관에 회부한다."},{"n":"20-15","en":"Require adherence to the ICF Code of Ethics by all Support Personnel.","ko":"모든 지원 인력이 ICF 윤리강령을 준수하도록 요구한다."},{"n":"20-16","en":"Commit to excellence through continued personal, professional and ethical development.","ko":"지속적인 개인적·전문적·윤리적 발전을 통해 탁월성을 추구한다."},{"n":"20-17","en":"Recognize my personal limitations or circumstances that may impair, conflict with or interfere with my coaching performance or my professional coaching relationships. I will reach out for support to determine the action to be taken and, if necessary, promptly seek relevant professional guidance. This may include suspending or terminating my coaching relationship(s).","ko":"코칭 수행 또는 전문적 코칭 관계를 저해하거나 충돌·간섭할 수 있는 개인적 한계나 상황을 인식한다. 취해야 할 조치를 결정하기 위해 지원을 요청하고 필요하면 관련 전문적 지도를 신속히 구한다. 여기에는 코칭 관계의 일시 중단 또는 종료가 포함될 수 있다."},{"n":"20-18","en":"Resolve any conflict of interest or potential conflict of interest by working through the issue with relevant parties, seeking professional assistance, or suspending temporarily or ending the professional relationship.","ko":"관련 당사자와 문제를 해결하고 전문적 도움을 구하거나 전문적 관계를 일시 중단 또는 종료함으로써 이해상충 또는 잠재적 이해상충을 해소한다."},{"n":"20-19","en":"Maintain the privacy of ICF Members and use the ICF Member contact information (email addresses, telephone numbers, and so on) only as authorized by ICF or the ICF Member.","ko":"ICF 회원의 개인정보를 보호하고 이메일 주소·전화번호 등 회원 연락처는 ICF 또는 해당 회원이 승인한 경우에만 사용한다."}]},{"n":"20-III","en":"Section III – Responsibility to Professionalism","ko":"제III절 – 전문직업의식에 대한 책임","s":[{"n":"20-20","en":"Identify accurately my coaching qualifications, my level of coaching competency, expertise, experience, training, certifications and ICF Credentials.","ko":"자신의 코칭 자격, 코칭 역량 수준, 전문성, 경험, 교육, 인증 및 ICF 자격을 정확히 밝힌다."},{"n":"20-21","en":"Make verbal and written statements that are true and accurate about what I offer as an ICF Professional, what is offered by ICF, the coaching profession and the potential value of coaching.","ko":"ICF 전문가로서 자신이 제공하는 것, ICF가 제공하는 것, 코칭 직업 및 코칭의 잠재적 가치에 대해 구두와 서면으로 진실하고 정확하게 진술한다."},{"n":"20-22","en":"Communicate and create awareness with those who need to be informed of the ethical responsibilities established by this Code.","ko":"이 강령이 정한 윤리적 책임을 알아야 하는 사람들과 소통하고 그들의 인식을 높인다."},{"n":"20-23","en":"Hold responsibility for being aware of and setting clear, appropriate and culturally sensitive boundaries that govern interactions, physical or otherwise.","ko":"신체적 접촉 여부와 관계없이 상호작용을 규율하는 명확하고 적절하며 문화적으로 민감한 경계를 인식하고 설정할 책임을 진다."},{"n":"20-24","en":"Do not participate in any sexual or romantic engagement with Client(s) or Sponsor(s). I will be ever mindful of the level of intimacy appropriate for the relationship. I take the appropriate action to address the issue or cancel the engagement.","ko":"고객 또는 스폰서와 성적·낭만적 관계를 맺지 않는다. 관계에 적절한 친밀감의 수준을 항상 유념하며, 문제가 발생하면 이를 다루기 위한 적절한 조치를 취하거나 계약을 종료한다."}]},{"n":"20-IV","en":"Section IV – Responsibility to Society","ko":"제IV절 – 사회에 대한 책임","s":[{"n":"20-25","en":"Avoid discrimination by maintaining fairness and equality in all activities and operations, while respecting local rules and cultural practices. This includes, but is not limited to, discrimination on the basis of age, race, gender expression, ethnicity, sexual orientation, religion, national origin, disability or military status.","ko":"지역의 규정과 문화적 관행을 존중하면서 모든 활동과 운영에서 공정성과 평등을 유지하여 차별을 피한다. 여기에는 연령·인종·성별 표현·민족·성적 지향·종교·국적·장애 또는 군 복무 상태에 따른 차별 등이 포함되며 이에 한정되지 않는다."},{"n":"20-26","en":"Recognize and honor the contributions and intellectual property of others, only claiming ownership of my own material. I understand that a breach of this standard may subject me to legal remedy by a third party.","ko":"타인의 기여와 지식재산권을 인정하고 존중하며 자신이 만든 자료에 대해서만 소유권을 주장한다. 이 기준을 위반하면 제3자가 법적 구제를 청구할 수 있음을 이해한다."},{"n":"20-27","en":"Am honest and work within recognized scientific standards, applicable subject guidelines and boundaries of my competence when conducting and reporting research.","ko":"연구를 수행하고 보고할 때 정직성을 지키며 인정된 과학적 기준, 해당 분야 지침 및 자신의 역량 범위 안에서 일한다."},{"n":"20-28","en":"Am aware of my and my clients’ impact on society. I adhere to the philosophy of “doing good” versus “avoiding bad.”","ko":"자신과 고객이 사회에 미치는 영향을 인식한다. “나쁜 일을 피하는 것”을 넘어 “좋은 일을 행하는 것”의 철학을 따른다."}]}]};

const memStore = {};
function store(k, v) {
  if (v === undefined) {
    try {
      const raw = window.localStorage.getItem(k);
      if (raw !== null) return JSON.parse(raw);
    } catch (e) {}
    return memStore[k] !== undefined ? JSON.parse(JSON.stringify(memStore[k])) : null;
  } else {
    memStore[k] = JSON.parse(JSON.stringify(v));
    try {
      window.localStorage.setItem(k, JSON.stringify(v));
    } catch (e) {}
    return true;
  }
}

function purgeAllStorage() {
  Object.keys(memStore).forEach(k => { delete memStore[k]; });
  try {
    LEGACY_KEYS.forEach(key => window.localStorage.removeItem(key));
  } catch (e) {}
}

function loadInitialProg() {
  const cur = store(PROG_KEY);
  if (cur !== null) return cur;
  return store('icf_pcc_prog_v8') || store('icf_pcc_prog_v7') || store('icf_pcc_prog_v5') || {};
}

function loadInitialBookmarks() {
  const cur = store(BM_KEY);
  if (cur !== null) return cur;
  return store('icf_pcc_bm_v8') || store('icf_pcc_bm_v7') || store('icf_pcc_bm_v5') || {};
}

function highlightText(text, keywords) {
  const raw = String(text == null ? '' : text);
  if (!keywords || !keywords.length) return esc(raw);

  const sorted = [...keywords]
    .filter(k => k && raw.toLowerCase().includes(k.toLowerCase()))
    .sort((a, b) => b.length - a.length);

  if (!sorted.length) return esc(raw);

  const escapedPatterns = sorted.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const regex = new RegExp(`(${escapedPatterns.join('|')})`, 'gi');
  const parts = raw.split(regex);

  return parts.map(part => {
    const isMatch = sorted.some(k => k.toLowerCase() === part.toLowerCase());
    return isMatch ? `<span class="hl-red">${esc(part)}</span>` : esc(part);
  }).join('');
}

  const snap = getSnapshot();

    navStack.push(snap);

  }
  try {
    window.history.pushState({ pccGuard: true, depth: navStack.length }, '', window.location.href);

}

function handleBackNavigation() {
  if (S.numOpen) { S.numOpen = false; S.numInput = ''; render(); return; }
  if (S.exitModal) { S.exitModal = false; render(); return; }
  if (S.resetModal) { S.resetModal = false; render(); return; }
  if (S.itemResetModal !== null) { S.itemResetModal = null; render(); return; }
  if (S.stratSec >= 0) { S.stratSec = -1; render(); return; }
  if (S.sh) { S.sh = false; render(); return; }

  if (navStack.length > 0) {
    const prev = navStack.pop();
    restoreSnapshot(prev);
    window.scrollTo(0, 0);
    render();
    return;
  }

  if (S.t === 'q' && (S.fc || S.fe || S.type !== 'bw')) {
    S.fc = ''; S.fe = ''; S.type = 'bw'; S.i = 0;
    render();
    return;
  }

  if (S.t !== 'home') {
    S.t = 'home';
    window.scrollTo(0, 0);
    render();
    return;
  }

  showToast('첫 화면입니다. 앱을 끝내려면 상단 [종료] 버튼을 누르세요.');
}

      const cls = w.rate < 60 ? 'low' : w.rate < 80 ? 'mid' : 'high';
      h += `<div style="margin:8px 0;cursor:pointer" data-a="fc" data-k="${w.n}">
        <div style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:700">
          <span>역량 ${w.n}. ${esc(w.ko)}</span><span style="color:var(--ac)">${w.rate}% (${w.k}/${w.t})</span>
        </div>
        <div class="bar"><i class="${cls}" style="width:${w.rate}%"></i></div>
      </div>`;
    });
  }
  h += `</div>`;

  h += `<div class="card">
    <div class="sec-title"><span>역량별 집중 훈련</span><span class="mu">8대 핵심역량</span></div>
    <div class="tools">
      ${C.map(cp => `<button type="button" class="chip sub-chip" data-a="fc" data-k="${cp.n}">${cp.n}. ${esc(cp.ko)}</button>`).join('')}
    </div>
  </div>`;

  h += `<div class="row" style="margin-top:12px">
    <button type="button" class="ghost" style="color:var(--no)" data-a="askReset">전체 초기화</button>
    <button type="button" class="ghost" style="color:var(--no)" data-a="askExit">학습 마치고 앱 종료</button>
  </div>`;

  return h;
}

// 2. 문제 풀이 화면

function formatQuestionNumber(q) {
  return Q.filter(item => item.ty === q.ty).findIndex(item => item.id === q.id) + 1;
}
function formatQuestionTotal(q) {
  return Q.filter(item => item.ty === q.ty).length;
}
function numberPickerView() {
  const L = getList();
  if (!L.length) return '';
  const exam = S.type === 'exam';
  const groups = exam ? [{ type: 'exam', title: `${S.examTy === 'bw' ? 'Best/Worst' : '4지선다'} 모의시험 문항`, items: L }] :
    ['bw', 'mc4'].map(type => ({
      type,
      title: type === 'bw' ? `Best/Worst (${Q.filter(q => q.ty === 'bw').length})` : `4지선다 (${Q.filter(q => q.ty === 'mc4').length})`,
      items: L.filter(q => q.ty === type)
    })).filter(group => group.items.length);
  const active = L[S.i];
  const groupHtml = groups.map(group => {
    const cells = group.items.map(q => {
      const a = ans[q.id] || {};
      const p = prog[q.id];
      const answered = q.ty === 'bw' ? !!(a.b && a.w) : !!a.p;
      const graded = exam ? S.examDone : !!a.d;
      let cls = 'num-cell';
      if (q.id === active.id) cls += ' current';
      else if (graded && p) cls += p.last ? ' correct' : ' wrong';
      else if (answered) cls += ' answered';
      const num = group.type === 'exam' ? group.items.indexOf(q) + 1 : formatQuestionNumber(q);
      return `<button type="button" class="${cls}" data-a="jumpNumber" data-k="${q.id}">${num}<small>${esc(q.n)}</small>${bookmarks[q.id] ? '<span class="bm-star">★</span>' : ''}</button>`;
    }).join('');
    return `<h4>${group.title}</h4><div class="num-grid">${cells}</div>`;
  }).join('');
  return `<div class="sh num-picker"><div><div class="sh-handle"></div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h3>문항 번호 선택</h3><button type="button" class="ghost" style="flex:0;padding:7px 12px" data-a="numberClose">닫기</button></div>
    <div class="num-form"><input id="numJumpInput" type="text" inputmode="numeric" autocomplete="off" placeholder="${exam ? '모의시험 번호 입력' : '번호 입력 (예: 5 또는 MC4-3)'}" value="${esc(S.numInput || '')}"><button type="button" class="pri" style="width:auto;margin:0;padding:9px 14px" data-a="jumpNumberInput">이동</button></div>
    <div class="num-legend"><span><i class="num-dot"></i> 미풀이</span><span><i class="num-dot ok"></i> 정답</span><span><i class="num-dot no"></i> 오답</span><span><i class="num-dot now"></i> 현재</span><span>★ 북마크</span></div>
    ${groupHtml}
  </div></div>`;
}

function qView() {
  const L = getList();
  if (S.i >= L.length) S.i = 0;

  const bwCount = Q.filter(q => q.ty === 'bw').length;
  const mcCount = Q.filter(q => q.ty === 'mc4').length;

  const modeButton = (type, action, label, active) =>
    `<button type="button" class="chip ${active ? 'on' : ''}" data-a="${action}" data-k="${type}">${label}</button>`;

  let h = '<div class="tools">' +
    `<div class="q-mode-group"><div class="q-mode-label"><span>BEST / WORST</span><span>${bwCount}문항 · 학습 방식 선택</span></div><div class="q-mode-actions">` +
    modeButton('bw', 'type', '문제풀이', S.type !== 'exam' && S.type === 'bw') +
    modeButton('bw', 'startExam', '실전 모의시험', S.type === 'exam' && S.examTy === 'bw') +
    `</div></div>` +
    `<div class="q-mode-group"><div class="q-mode-label"><span>4지선다</span><span>${mcCount}문항 · 학습 방식 선택</span></div><div class="q-mode-actions">` +
    modeButton('mc4', 'type', '문제풀이', S.type !== 'exam' && S.type === 'mc4') +
    modeButton('mc4', 'startExam', '실전 모의시험', S.type === 'exam' && S.examTy === 'mc4') +
    `</div></div>` +
    `<button type="button" class="chip ${S.en ? 'on' : ''}" data-a="en">영·한 병기</button>`;
  if (S.fc) h += `<button type="button" class="chip on" data-a="clr">역량 ${S.fc} ✕</button>`;
  if (S.fe) h += `<button type="button" class="chip on" data-a="clr">윤리 ${S.fe} ✕</button>`;
  h += '</div>';

  if (!L.length) {
    return h + '<div class="card"><p class="mu">선택한 조건에 해당하는 문제가 없습니다.</p><button type="button" class="ghost" data-a="clr">전체 문제 보기</button></div>';
  }

  if (S.type === 'exam' && !S.examDone) {
    const doneCntBanner = L.filter(item => {
      const st = ans[item.id];
      return item.ty === 'bw' ? (st && st.b && st.w) : (st && st.p);
    }).length;
    h += `<div class="card" style="padding:10px 14px;background:var(--wrb);border-color:color-mix(in srgb, var(--wr) 35%, transparent)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <span style="font-size:13px;font-weight:800;color:var(--wr)">실전 모의시험 모드 (${S.examTy === 'bw' ? 'Best/Worst' : '4지선다'} 10문항 · ${doneCntBanner}/${L.length} 응답)</span>
        <button type="button" class="chip" style="font-size:11.5px;padding:4px 10px" data-a="type" data-k="${S.examTy}">일반 문제풀이로 돌아가기</button>
      </div>
    </div>`;
  }

  if (S.type === 'exam' && S.examDone) {
    const score = L.filter(item => ans[item.id] && ans[item.id].ok).length;
    h += `<div class="card">
      <div class="sec-title"><span>실전 모의시험 결과</span><span class="tag exam">${score} / ${L.length} 정답</span></div>
      <p class="mu">문항 번호를 누르면 각 문제의 해설과 ? 핵심 정리를 확인할 수 있습니다.</p>
      <div class="tools">
        ${L.map((item, idx) => {
          const ok = ans[item.id] && ans[item.id].ok;
          return `<button type="button" class="chip ${ok ? 'sub-chip' : ''}" style="${ok ? '' : 'border-color:var(--no);color:var(--no)'}" data-a="jumpExam" data-k="${idx}">${item.n} ${ok ? '○' : '✕'}</button>`;
        }).join('')}
      </div>
      <button type="button" class="pri" data-a="startExam" data-k="${S.examTy}">${S.examTy === 'bw' ? 'Best/Worst' : '4지선다'} 새 모의시험 시작하기</button>
    </div>`;
  }

  const q = L[S.i];
  const a = ans[q.id] || (ans[q.id] = {});
  const bw = q.ty === 'bw';
  const isBm = !!bookmarks[q.id];
  const showResult = S.type === 'exam' ? S.examDone : !!a.d;
  const hasState = Boolean(prog[q.id] || a.d || a.b || a.w || a.p);

  h += `<div class="card">
    <div class="qh">
      <span class="tag ${S.type === 'exam' ? 'exam' : ''}">${q.n} · ${bw ? 'Best/Worst' : '4지선다'}</span>
      <button type="button" class="num-open" data-a="numberOpen">${S.type === 'exam' ? `시험 ${S.i + 1} / ${L.length}` : `${formatQuestionNumber(q)} / ${formatQuestionTotal(q)}`}</button>
      <button type="button" class="chip reset-chip" style="font-size:11px;padding:3px 9px;opacity:${hasState ? '1' : '.65'}" data-a="askItemReset" data-k="${q.id}">문항 초기화</button>
      <button type="button" class="icon-btn star ${isBm ? 'on' : ''}" data-a="bm" data-k="${q.id}" title="북마크">${isBm ? '★' : '☆'}</button>
      <button type="button" class="icon-btn qm" data-a="sheet" aria-label="핵심 키워드와 연결 항목 보기">?</button>
    </div>`;

  const useHighlight = showResult || S.sh;
  h += `<p class="stem-ko">${useHighlight ? highlightText(q.sk, q.k) : esc(q.sk)}</p>`;
  if (S.en && q.se) {
    h += `<p class="stem-en">${useHighlight ? highlightText(q.se, q.k) : esc(q.se)}</p>`;
  }

  if (bw && !showResult) {
    h += `<div class="seg">
      <button type="button" class="${S.step === 'best' ? 'on' : ''}" data-a="step" data-k="best">최선(Best)${a.b ? ' · ' + a.b : ''}</button>
      <button type="button" class="${S.step === 'worst' ? 'on' : ''}" data-a="step" data-k="worst">최악(Worst)${a.w ? ' · ' + a.w : ''}</button>
    </div>`;
  }

  h += q.o.map((enText, j) => {
    const x = 'ABCD'[j];
    const koText = q.ok[j] || enText;
    let cl = 'opt', bd = '';

    if (showResult) {
      if (x === q.b) cl += ' okb';
      else if (bw && x === q.w) cl += ' wrb';

      if (bw) {
        if ((a.b === x && x !== q.b) || (a.w === x && x !== q.w)) cl += ' bad';
      } else if (a.p === x && x !== q.b) {
        cl += ' bad';
      }
      bd = (x === q.b ? '<i>Best</i>' : '') + (bw && x === q.w ? '<i class="w">Worst</i>' : '');
    } else {
      if (bw) {
        if (a.b === x) { cl += ' pb'; bd = '<i>Best</i>'; }
        if (a.w === x) { cl += ' pw'; bd += '<i class="w">Worst</i>'; }
      } else if (a.p === x) {
        cl += ' pb';
      }
    }

    return `<button type="button" class="${cl}" data-a="opt" data-k="${x}">
      <b>${x}</b>
      <div class="opt-body">
        <span class="opt-ko">${esc(koText)}</span>
        ${(S.en && enText && enText !== koText) ? `<span class="opt-en">${esc(enText)}</span>` : ''}
      </div>
      ${bd}
    </button>`;
  }).join('');

  if (!showResult) {
    if (S.type === 'exam') {
      const doneCnt = L.filter(item => {
        const st = ans[item.id];
        return item.ty === 'bw' ? (st && st.b && st.w) : (st && st.p);
      }).length;
      h += `<button type="button" class="pri" data-a="submitExam" ${doneCnt === L.length ? '' : 'disabled'}>모의시험 전체 채점 (${doneCnt}/${L.length} 완료)</button>`;
    } else {
      const ready = bw ? (a.b && a.w) : !!a.p;
      h += `<button type="button" class="pri" data-a="check" ${ready ? '' : 'disabled'}>정답 확인 및 해설 보기</button>`;
    }
  } else {
    const userPicked = bw ? `내 선택: Best ${a.b || '-'} / Worst ${a.w || '-'}` : `내 선택: ${a.p || '-'}`;
    h += `<div class="res ${a.ok ? 'ok' : 'no'}">
      ${a.ok ? '정답입니다!' : '다시 확인해 보세요.'} · 정답: ${bw ? 'Best ' + q.b + ' / Worst ' + q.w : q.b} <span style="font-weight:400;font-size:12.5px">(${userPicked})</span>
    </div>
    <div class="ex"><h5>${bw ? '최선(Best) 핵심 근거' : '정답 핵심 근거'}</h5>${esc(q.be)}</div>
    ${q.we ? `<div class="ex ${bw ? 'w-ex' : ''}"><h5>${bw ? '최악(Worst) 및 오답 소거 해설' : '오답 선택지 소거 해설'}</h5>${esc(q.we)}</div>` : ''}`;

    if (q.c && q.c.length) {
      h += `<div class="ref-sec">
        <h5>연결 핵심역량 세부 조항 (탭하면 원문으로 이동)</h5>
        ${q.c.map(n => {
          const s = cmap[n];
          const parent = C.find(cp => cp.n === n.split('.')[0]);
          return `<div class="ref-item" data-a="gc" data-k="${n}">
            <div class="ref-hd">
              <span>역량 ${n} · ${parent ? esc(parent.ko) : ''}</span>
              <span style="font-size:11px">원문 보기 ›</span>
            </div>
            <div class="txt-ko">${s ? esc(s.ko) : ''}</div>
            ${S.en && s ? `<div class="txt-en">${esc(s.en)}</div>` : ''}
          </div>`;
        }).join('')}
      </div>`;
    }

    if (q.e && q.e.length) {
      h += `<div class="ref-sec">
        <h5>연결 ICF 윤리강령 세부 조항 (탭하면 원문으로 이동)</h5>
        ${q.e.map(n => {
          const s = emap[n];
          if (!s) return '';
          const isNum = /^\d/.test(n);
          return `<div class="ref-item" data-a="ge" data-k="${n}">
            <div class="ref-hd">
              <span>${n.startsWith('20-') ? '2020 윤리강령 · ' + n.replace('20-','Section ') : (isNum ? '윤리강령 제' + n + '조' : 'ICF 핵심 가치 · ' + n)}</span>
              <span style="font-size:11px">원문 보기 ›</span>
            </div>
            <div class="txt-ko">${esc(s.ko)}</div>
            ${S.en ? `<div class="txt-en">${esc(s.en)}</div>` : ''}
          </div>`;
        }).join('')}
      </div>`;
    }
  }

  h += `<div class="row">
    <button type="button" data-a="prev">‹ 이전 문제</button>
    <button type="button" data-a="next">다음 문제 ›</button>
  </div></div>`;

  return h;
}

function sheetView() {
  const L = getList();
  const q = L[S.i];
  if (!q) return '';

  const cs = q.c.map(n => {
    const s = cmap[n];
    return `<div class="it" data-a="gc" data-k="${n}">
      <b>역량 ${n}</b>
      <div class="txt-ko" style="margin-top:2px">${s ? esc(s.ko) : ''}</div>
      <div class="txt-en">${s ? esc(s.en) : ''}</div>
    </div>`;
  }).join('') || '<p class="mu">연결된 하위 역량이 없습니다.</p>';

  const ms = q.m.map(n => {
    const m = mmap[n];
    return `<div class="it" data-a="gc" data-k="${n.split('.')[0]}.01">
      <b>PCC 마커 ${n}</b>
      <div class="txt-ko" style="margin-top:2px">${m ? esc(m.ko) : ''}</div>
      <div class="txt-en">${m ? esc(m.en) : ''}</div>
    </div>`;
  }).join('') || '<p class="mu">해당 문항은 개념형 문항으로 직접 매칭된 세션 마커가 없습니다.</p>';

  const es = q.e.map(n => {
    const s = emap[n];
    if (!s) return '';
    return `<div class="it" data-a="ge" data-k="${n}">
      <b>${n.startsWith('20-') ? '2020 윤리강령 · ' + n.replace('20-','Section ') : (/^\d/.test(n) ? '윤리강령 ' + n : 'ICF 핵심 가치 · ' + n)}</b>
      <div class="txt-ko" style="margin-top:2px">${esc(s.ko)}</div>
      <div class="txt-en">${esc(s.en)}</div>
    </div>`;
  }).join('') || '<p class="mu">연결된 윤리강령 세부 항목이 없습니다.</p>';

  return `<div class="sh" data-a="close">
    <div class="sh-in">
      <div class="sh-handle"></div>
      <h3>${q.n} 문제 단서 및 연결 기준</h3>
      <p class="mu" style="margin:2px 0 8px">${esc(q.t)}</p>

      <h4 style="color:var(--red)">문제 지문 속 핵심 키워드 · 핵심 문구</h4>
      <div class="tools">${(q.k && q.k.length ? q.k : [q.t]).map(k => `<span class="chip red-chip">${esc(k)}</span>`).join('')}</div>

      <h4>연결 2025 ICF 핵심역량 (탭하면 원문 이동)</h4>
      ${cs}

      <h4>연결 PCC 마커 (2026 개정)</h4>
      ${ms}

      <h4>연결 ICF 윤리강령 세부 지침 (탭하면 원문 이동)</h4>
      ${es}

      <button type="button" class="pri" data-a="close">닫기</button>
    </div>
  </div>`;
}

function ceView() {
  let h = `<div class="tools" style="justify-content:space-between">
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      <button type="button" class="chip ${S.ceTab === 'c' ? 'on' : ''}" data-a="ceTab" data-k="c">2025 핵심역량</button>

      <button type="button" class="chip ${S.ceTab === 'g' ? 'on' : ''}" data-a="ceTab" data-k="g">2025 용어집 (${G.length})</button>

    <div style="display:flex;gap:4px">
      ${[['both','영·한'],['ko','한글'],['en','영어']].map(([k, l]) =>

  if (S.ceTab === 'c') {

        <summary>

        <div>

          </div>
          ${msr ? `<div class="sub" style="background:var(--acb);border-color:color-mix(in srgb, var(--ac) 25%, transparent)">
            <div style="font-weight:800;color:var(--ac);margin-bottom:4px">2026 MSR · 전 레벨 핵심 스킬 (Key Skills)</div>
            <ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.5">
              ${msr.ks.map(item => `<li>${esc(item)}</li>`).join('')}
            </ul>
          </div>` : ''}
          ${c.s.map(s => {
            const cnt = Q.filter(q => q.c.includes(s.n)).length;
            return `<div class="sub" id="s${s.n.replace('.', '_')}">
              <span class="n">${s.n}</span>
              ${txBlock(s.ko, s.en)}
              ${cnt ? `<button type="button" class="chip sub-chip" style="margin-top:6px" data-a="fc" data-k="${s.n}">연결 문제 ${cnt}개 풀기 ›</button>` : ''}
            </div>`;
          }).join('')}
          ${M[c.n] ? `<div class="sub">
            <div style="font-weight:800;color:var(--wr);margin-bottom:4px">PCC 마커 및 실전 추천 발문 (rev. 1.26.2026)</div>
            ${M[c.n].map(m => {

            <ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.5;color:var(--fg)">

  } else if (S.ceTab === 'e') {

    h += `<p class="mu" style="margin:4px 2px 8px">${S.ethVer === '2020' ? '2020 ICF Code of Ethics · Ethical Standards 4개 책임 영역' : '2025 ICF Code of Ethics · Ethical Standards 5개 주제' } (영·한 병기)</p>`;
    E = S.ethVer === '2020' ? E20 : E25;
    E.forEach(g => {
      h += `<details id="eg${g.n}" ${S.open === g.n ? 'open' : ''}>
        <summary>
          <div style="font-size:15px">${esc(g.ko)}</div>
          <div class="txt-en">${esc(g.en)}</div>
        </summary>
        <div>
          ${Q.filter(q => q.e.includes(g.n)).length ? `<button type="button" class="chip sub-chip" style="margin:8px 0" data-a="fe" data-k="${g.n}">이 책임 영역과 연결된 문제 ${Q.filter(q => q.e.includes(g.n)).length}개 풀기 ›</button>` : ''}
          ${g.s.map(s => {
            const cnt = Q.filter(q => q.e.includes(s.n)).length;
            return `<div class="sub" id="e${s.n}">
              <span class="n">${s.n}</span>

              ${cnt ? `<button type="button" class="chip sub-chip" style="margin-top:6px" data-a="fe" data-k="${s.n}">연결 문제 ${cnt}개 풀기 ›</button>` : ''}

          }).join('')}
        </div>
